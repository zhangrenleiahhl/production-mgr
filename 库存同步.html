<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铸运通发货协作系统 · 库存同步</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --line:#e3e8ef; --line2:#eef2f7;
    --txt:#1f2733; --muted:#7a8699; --soft:#eef4ff;
    --brand:#2563eb; --brand-d:#1e4fb0;
    --ok:#16a34a; --err:#dc2626; --warn:#ca8a04; --idle:#94a3b8;
    --navy:#0b1220; --navy2:#16243b; --cyan:#38bdf8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.55;overflow:hidden;
    display:flex;flex-direction:column;
  }
  /* ===== 顶部条：与全站同一套深蓝科技感 ===== */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:9px 16px;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
    border-bottom:1px solid rgba(56,189,248,.28);
    box-shadow:0 4px 18px rgba(11,18,32,.18);position:relative;z-index:10;
  }
  .topbar h1{
    margin:0;font-size:17px;font-weight:800;color:#e0f2fe;letter-spacing:.5px;
    display:flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto;
    text-shadow:0 0 10px rgba(56,189,248,.35);
  }
  .topbar h1 .ic{
    width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;font-size:14px;
    box-shadow:0 0 12px rgba(56,189,248,.5);
  }
  .topbar .sub{font-size:12px;color:#7f93b0;white-space:nowrap;}
  .topbar .spacer{flex:1;}
  .topbar .stat{
    display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;
    background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.30);
    color:#7dd3fc;font-size:12px;font-weight:600;white-space:nowrap;
    font-family:"SF Mono","Consolas","Microsoft YaHei",monospace;
  }
  .topbar .stat .dot{width:7px;height:7px;border-radius:50%;background:var(--idle);box-shadow:0 0 8px currentColor;}
  .topbar .stat.on .dot{background:var(--ok);}
  .topbar .stat.off .dot{background:var(--err);}
  .btn{
    border:1px solid rgba(56,189,248,.32);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;
    cursor:pointer;background:rgba(56,189,248,.10);color:#bae6fd;transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:rgba(56,189,248,.20);border-color:rgba(56,189,248,.55);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.primary{
    background:linear-gradient(135deg,#38bdf8,#2563eb);border-color:transparent;color:#fff;
    box-shadow:0 4px 14px rgba(37,99,235,.42);
  }
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:#7f93b0;border-color:rgba(127,147,176,.32);}
  .btn.ghost:hover{color:#bae6fd;border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.08);}

  /* ===== 主体 ===== */
  .main{flex:1 1 auto;overflow:auto;padding:14px 16px 26px;}
  .wrap{max-width:1560px;margin:0 auto;}

  /* 板块卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px;}
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:13px 14px 12px;box-shadow:0 4px 14px rgba(15,23,42,.045);
    position:relative;overflow:hidden;transition:.18s;
  }
  .panel::before{
    content:"";position:absolute;left:0;top:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--brand),var(--cyan));opacity:.85;
  }
  .panel:hover{box-shadow:0 8px 22px rgba(15,23,42,.09);transform:translateY(-1px);}
  .panel .ph{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px;}
  .panel .pico{
    width:34px;height:34px;border-radius:9px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    background:linear-gradient(135deg,#e0f2fe,#dbeafe);color:var(--brand);
    border:1px solid #c7dcfb;
  }
  .panel .pt{flex:1 1 auto;min-width:0;}
  .panel .pt h3{margin:0;font-size:14.5px;font-weight:800;color:#0f172a;line-height:1.25;}
  .panel .pt .code{font-size:11px;color:var(--muted);font-family:"SF Mono","Consolas",monospace;margin-top:2px;}
  .badge{
    flex:0 0 auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;
    border:1px solid transparent;
  }
  .badge.idle{background:#f1f5f9;color:#64748b;border-color:#e2e8f0;}
  .badge.run{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe;}
  .badge.ok{background:#dcfce7;color:#15803d;border-color:#bbf7d0;}
  .badge.err{background:#fee2e2;color:#b91c1c;border-color:#fecaca;}
  .badge.warn{background:#fef3c7;color:#b45309;border-color:#fde68a;}
  .badge.pending{background:#eef2f7;color:#64748b;border-color:#dbe2ea;border-style:dashed;}

  .panel .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:9px;}
  .panel .meta b{color:#334155;font-weight:700;font-variant-numeric:tabular-nums;}
  .panel .acts{display:flex;gap:6px;flex-wrap:wrap;}
  .panel .acts .mini{
    border:1px solid var(--line);background:#fff;color:#475569;border-radius:7px;
    padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .panel .acts .mini:hover{background:var(--soft);border-color:#bfdbfe;color:var(--brand);}
  .panel .acts .mini.go{background:var(--brand);color:#fff;border-color:var(--brand);}
  .panel .acts .mini.go:hover{background:var(--brand-d);}
  .panel .acts .mini:disabled{opacity:.45;cursor:not-allowed;}
  .panel .errline{
    margin-top:8px;font-size:11.5px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;
    border-radius:7px;padding:5px 8px;word-break:break-all;display:none;
  }
  .panel .errline.show{display:block;}

  /* 工具条 */
  .toolbar{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 13px;margin-bottom:12px;box-shadow:0 3px 12px rgba(15,23,42,.04);
  }
  .toolbar .lbl{font-size:12.5px;color:var(--muted);font-weight:600;}
  .toolbar .spacer{flex:1;}
  .switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#334155;font-weight:600;cursor:pointer;user-select:none;}
  .switch input{display:none;}
  .switch .track{
    width:38px;height:21px;border-radius:999px;background:#cbd5e1;position:relative;transition:.2s;flex:0 0 auto;
  }
  .switch .track::after{
    content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:.2s;
  }
  .switch input:checked + .track{background:linear-gradient(135deg,#38bdf8,#2563eb);}
  .switch input:checked + .track::after{left:19px;}
  .tinput{
    border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12.5px;color:#334155;
    font-family:"SF Mono","Consolas",monospace;background:#fff;
  }
  .tinput:focus{outline:none;border-color:var(--brand);}

  /* 明细区 */
  .detail{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 4px 14px rgba(15,23,42,.045);overflow:hidden;}
  .dhead{
    display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap;
  }
  .dhead h2{margin:0;font-size:15px;font-weight:800;color:#0f172a;display:flex;align-items:center;gap:8px;}
  .dhead .spacer{flex:1;}
  .dhead .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .dsearch{
    border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12.5px;width:190px;
  }
  .dsearch:focus{outline:none;border-color:var(--brand);}
  .tblwrap{overflow:auto;max-height:calc(100vh - 420px);min-height:190px;}
  .dpager{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .dpager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--brand);}
  .dpager button:disabled{opacity:.4;cursor:default;}
  .dpager .pnum{font-variant-numeric:tabular-nums;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{
    position:sticky;top:0;background:#f8fafc;color:#475569;font-weight:700;text-align:left;
    padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;z-index:2;
  }
  tbody td{padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;}
  tbody tr:hover{background:#f8fbff;}
  tbody td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"SF Mono","Consolas",monospace;}
  tbody td.mat{font-family:"SF Mono","Consolas",monospace;font-weight:600;color:#1e40af;}
  .empty{padding:34px 14px;text-align:center;color:#94a3b8;font-size:13px;}
  .empty .big{font-size:30px;display:block;margin-bottom:8px;opacity:.5;}

  /* 日志 */
  .logbox{
    background:var(--navy);color:#cbd5e1;border-radius:11px;padding:11px 13px;
    font-family:"SF Mono","Consolas","Microsoft YaHei",monospace;font-size:12px;
    line-height:1.7;max-height:190px;overflow:auto;border:1px solid rgba(56,189,248,.22);
    box-shadow:inset 0 0 14px rgba(56,189,248,.06);
  }
  .logbox .t{color:#64748b;}
  .logbox .ok{color:#4ade80;}
  .logbox .er{color:#f87171;}
  .logbox .wn{color:#fbbf24;}
  .logbox .in{color:#7dd3fc;}
  .lgtitle{
    font-size:12.5px;font-weight:700;color:#334155;margin:14px 0 7px;
    display:flex;align-items:center;gap:7px;
  }
  .lgtitle .spacer{flex:1;}

  /* Toast */
  .toast{
    position:fixed;left:50%;top:16px;transform:translateX(-50%);
    background:#0f172a;color:#e2e8f0;padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;}
  @media (max-width:900px){
    .topbar .sub,.topbar .stat{display:none;}
    .tblwrap{max-height:none;}
  }
</style>
  <script src="festival-skin.js?v=20261106a&h=c1c6acc0" defer></script>
</head>
<body>
  <div class="topbar">
    <h1><span class="ic">📦</span>库存同步</h1>
    <span class="sub">五个库统一拉数 · 自动抓取 · 一键导出</span>
    <div class="spacer"></div>
    <span class="stat" id="chanStat" title="线上 https 页面不能直连本机，改由本机助手经云端中转执行"><span class="dot"></span><span id="chanTxt">通道检测中…</span></span>
    <span class="stat" id="agentStat"><span class="dot"></span><span id="agentStatTxt">代理未连接</span></span>
    <button class="btn primary" id="syncAllBtn">🔄 全部同步</button>
    <button class="btn" id="expBtn">⬇ 导出 Excel</button>
  </div>

  <div class="main">
    <div class="wrap">

      <div class="toolbar">
        <span class="lbl">自动同步</span>
        <label class="switch">
          <input type="checkbox" id="autoChk"><span class="track"></span>
          <span id="autoTxt">每天 08:00 自动拉数</span>
        </label>
        <input class="tinput" id="autoTime" type="time" value="08:00">
        <button class="btn ghost" id="saveAutoBtn">保存</button>
        <span class="spacer"></span>
        <span class="lbl">最后刷新</span>
        <span class="lbl" id="lastRefresh" style="font-family:'SF Mono',Consolas,monospace;color:#475569;">—</span>
        <button class="btn ghost" id="refreshBtn">⟳ 刷新本页</button>
      </div>

      <div class="grid" id="grid"></div>

      <div class="lgtitle">
        <span>📄 库存明细</span>
        <span class="cnt" id="detailCnt"></span>
        <span class="spacer"></span>
        <input class="dsearch" id="detailSearch" placeholder="搜物料号 / 描述…">
      </div>
      <div class="detail">
        <div class="dhead">
          <h2 id="detailTitle">全部库汇总</h2>
          <span class="cnt" id="detailSub"></span>
          <span class="spacer"></span>
          <span class="cnt">共 <b id="detailRows">0</b> 条</span>
          <span class="cnt" id="detailStore" title="明细存放位置">明细存本地大仓库</span>
        </div>
        <div class="tblwrap">
          <table>
            <thead><tr>
              <th style="width:118px;">物料号</th>
              <th>物料描述</th>
              <th style="width:104px;">库位</th>
              <th style="width:112px;">库存数量</th>
              <th style="width:70px;">单位</th>
              <th style="width:120px;">来源库</th>
              <th style="width:140px;">同步时间</th>
            </tr></thead>
            <tbody id="detailBody"></tbody>
          </table>
        </div>
        <div class="dpager" id="detailPager">
          <button type="button" id="dpPrev">上一页</button>
          <span class="pnum" id="dpInfo">第 1 / 1 页</span>
          <button type="button" id="dpNext">下一页</button>
          <span class="spacer"></span>
          <span>每页 200 条</span>
        </div>
      </div>

      <div class="lgtitle">
        <span>📋 运行日志</span>
        <span class="spacer"></span>
        <button class="btn ghost" id="clearLogBtn">清空</button>
      </div>
      <div class="logbox" id="logBox"></div>

    </div>
  </div>
  <div class="toast" id="toast"></div>

<script src="cloud-config.js?v=20240916a"></script>
<script src="supabase.min.js?v=20240916a"></script>
<script src="cloud-sync.js?v=20240916a"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     五个库存板块定义
     - key：存储与云端用的标识
     - name：页面显示名
     - src：数据来源说明（点开让人知道去哪儿抓）
     - mode：抓取通道
         "sap"  → 复用本机 sap_stock_export.py（MB52 导出 XLSX）
         "win"  → 由本机代理用 windows-mcp 驱动 Windows 业务软件抓
     ============================================================ */
  const PANELS = [
    { key:"sap",   name:"SAP库存同步",     icon:"🧮", code:"SAP · MB52",
      src:"SAP 系统 /nMB52 · 工厂 H207~H208 · 仓库库存",
      mode:"sap", loc:"H207 / H208" },
    { key:"dali",  name:"大立库库存同步",   icon:"🏭", code:"DALI-WMS",
      src:"大立库 WMS · 库存查询界面",
      mode:"win", loc:"大立库" },
    { key:"hou",   name:"后处理库存同步",   icon:"⚙️", code:"POST-PROC",
      src:"后处理工序库存 · 现场系统",
      mode:"win", loc:"后处理" },
    { key:"nqql",  name:"南区汽零库存同步", icon:"🚗", code:"NANQU-QL",
      src:"南区汽零 · 备货库系统",
      mode:"win", loc:"南区汽零" },
    { key:"nqzz",  name:"南区铸造库存同步", icon:"⚙",  code:"NANQU-ZZ",
      src:"南区铸造 · 成品库系统",
      mode:"win", loc:"南区铸造" }
  ];

  const LS_KEY = "inventory_sync_v1";
  const AGENT_PORT = 8787;
  const AGENT = "http://127.0.0.1:" + AGENT_PORT;
  /* 云端中转（app_data 任务队列）：线上 https 页面不能直连本机 loopback，走这里 */
  const JOB_KEY = "inventory_job_v1";
  const JOB_RES_KEY = "inventory_job_result_v1";

  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const pad = n => String(n).padStart(2,"0");
  const nowStr = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); };

  /* ---------- 状态 ---------- */
  const state = {
    panels:{},          // key -> {status, at, rows, err, src, pending}
    rows: [],           // 明细行（全部库汇总）
    auto: false,
    autoTime: "08:00",
    agent: false,
    cloudOK: false,     // 云端中转是否可用
    srcInfo:{},         // key -> {ready, todo, src, mode}
    jobSeq: 0,          // 云端任务序号
    jobId: "",          // 本次任务的唯一标识（防止命中旧结果）
    jobAt: "",          // 本次任务下发时刻（老代理无 jobId 时用它兜底）
    lastResSeq: 0,      // 已处理的结果序号
    channel: "直连代理", // 当前通道：直连代理 / 云端中转
    idbOK: false,       // 本地大仓库是否可用
    detailPage: 1,      // 明细当前页
    detailTotal: 0,     // 过滤后的总条数
  };

  PANELS.forEach(p => { state.panels[p.key] = { status:"idle", at:"", rows:0, err:"", src:"", pending:false }; });

  /* ---------- 日志 ---------- */
  function log(msg, cls){
    const box = $("logBox");
    if(!box) return;
    const d = new Date();
    const t = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
    const line = document.createElement("div");
    line.innerHTML = '<span class="t">['+t+']</span> <span class="'+(cls||"")+'">'+esc(msg)+"</span>";
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
    while(box.childNodes.length > 400) box.removeChild(box.firstChild);
  }
  function toast(msg){
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
  }

  /* ---------- 存取 ---------- */
  // ★ 无损瘦身（2026-11-24）：本地用列式紧凑格式存（省 ~75%），读取时展开成对象。
  //   云端 push 仍是完整对象数组（协议不变），多端完全兼容。
  const INV_COLS = ["mat","desc","loc","qty","unit","plant","batch","src","at"];
  function packInvRows(rows){
    // 收集实际用到的字段（按固定顺序），只存有值的键
    const cols = [];
    INV_COLS.concat(Object.keys(rows[0]||{})).forEach(k=>{ if(cols.indexOf(k)<0 && rows.some(r=>r && r[k]!==undefined)) cols.push(k); });
    const arr = rows.map(r=>cols.map(k=>{
      const v = r ? r[k] : undefined;
      return v === undefined ? null : v;
    }));
    return { __cols: cols, rows: arr };
  }
  function unpackInvRows(o, rows){
    if(!Array.isArray(rows)) return rows;
    if(!o || !Array.isArray(o.__cols)) return rows;   // 老格式：原样
    const cols = o.__cols;
    return rows.map(a=>{
      const r = {};
      for(let i=0;i<cols.length;i++){ const v = Array.isArray(a)?a[i]:null; if(v!==null && v!==undefined) r[cols[i]] = v; }
      return r;
    });
  }
  /* ---------- 本地大仓库（IndexedDB）：明细不再占浏览器 5MB 配额 ----------
     设计：localStorage 只留「摘要」（各库条数/时间/自动同步设置，几 KB）；
           几万条明细存 IndexedDB（容量通常几百 MB ~ 几 GB）；
           云端 push 仍是完整对象数组（协议不变，多端兼容）。
     兼容：老数据仍在 localStorage 里 → 首次读取时自动搬进大仓库并精简摘要。 */
  const IDB_NAME = "inventory_detail_v1";
  const IDB_STORE = "rows";
  const IDB_KEY = "all";
  let _idb = null;
  function idbOpen(){
    return new Promise((resolve, reject)=>{
      if(_idb) return resolve(_idb);
      if(!window.indexedDB) return reject(new Error("浏览器不支持 IndexedDB"));
      let req;
      try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ return reject(e); }
      req.onupgradeneeded = function(){
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = function(){ _idb = req.result; state.idbOK = true; resolve(_idb); };
      req.onerror = function(){ reject(req.error || new Error("大仓库打开失败")); };
      req.onblocked = function(){ reject(new Error("大仓库被其它标签页占用，请关掉本系统的其它窗口")); };
    });
  }
  function idbGetRows(){
    return idbOpen().then(db=>new Promise((resolve,reject)=>{
      try{
        const tx = db.transaction(IDB_STORE, "readonly");
        const r = tx.objectStore(IDB_STORE).get(IDB_KEY);
        r.onsuccess = function(){ resolve(Array.isArray(r.result) ? r.result : null); };
        r.onerror = function(){ reject(r.error || new Error("大仓库读取失败")); };
      }catch(e){ reject(e); }
    }));
  }
  function idbSetRows(rows){
    return idbOpen().then(db=>new Promise((resolve,reject)=>{
      try{
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(rows, IDB_KEY);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error || new Error("大仓库写入失败")); };
        tx.onabort = function(){ reject(tx.error || new Error("大仓库写入被中断")); };
      }catch(e){ reject(e); }
    }));
  }
  function summaryObj(){
    return { panels:state.panels, auto:state.auto, autoTime:state.autoTime,
             savedAt:new Date().toISOString(), rowCount:state.rows.length, v:2 };
  }
  function load(){
    let o = null;
    try{ o = JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){}
    if(o && typeof o==="object"){
      PANELS.forEach(p=>{ if(o.panels && o.panels[p.key]) Object.assign(state.panels[p.key], o.panels[p.key]); });
      if(typeof o.auto==="boolean") state.auto = o.auto;
      if(o.autoTime) state.autoTime = o.autoTime;
    }
    /* 明细异步读：大仓库 -> 老格式 localStorage（自动迁移一次） */
    return idbGetRows().then(rows=>{
      if(rows && rows.length){ state.rows = rows; return "idb"; }
      let legacy = null;
      if(o && Array.isArray(o.rows)) legacy = unpackInvRows(o, o.rows);
      if(legacy && legacy.length){
        state.rows = legacy;
        return idbSetRows(legacy).then(()=>{
          /* 迁移成功：把摘要里的明细字段删掉，本机占用立刻从 MB 降到几 KB */
          try{
            const sm = summaryObj();
            localStorage.setItem(LS_KEY, JSON.stringify(sm));
          }catch(e){}
          log("已把 "+legacy.length+" 条历史明细搬进本地大仓库，本机占用大幅下降", "ok");
          return "migrated";
        }).catch(()=> "legacy");
      }
      return "empty";
    }).catch(e=>{
      /* 大仓库不可用（旧浏览器 / file:// 受限）：退回老格式，功能不丢 */
      state.idbOK = false;
      if(o && Array.isArray(o.rows)) state.rows = unpackInvRows(o, o.rows);
      log("本地大仓库不可用（"+e.message+"），明细暂存本机普通存储", "wn");
      return "fallback";
    });
  }
  function save(){
    const full = { panels:state.panels, rows:state.rows, auto:state.auto, autoTime:state.autoTime, savedAt:new Date().toISOString() };
    /* ① 本机只写摘要（几 KB），彻底避开 5MB 配额 */
    try{ localStorage.setItem(LS_KEY, JSON.stringify(summaryObj())); }
    catch(e){ log("本机摘要写入失败："+e.message, "er"); }
    /* ② 明细写大仓库；失败则保留老格式明细，绝不静默丢数据 */
    idbSetRows(state.rows).then(()=>{ state.idbOK = true; }).catch(e=>{
      state.idbOK = false;
      try{
        const compact = Object.assign({}, full);
        if(state.rows.length){
          const pk = packInvRows(state.rows);
          compact.__cols = pk.__cols; compact.rows = pk.rows;
        }
        localStorage.setItem(LS_KEY, JSON.stringify(compact));
        log("大仓库写入失败，明细已暂存本机普通存储："+e.message, "wn");
      }catch(e2){ log("明细保存失败："+e2.message, "er"); }
    });
    /* ③ 云端仍推完整格式（协议不变） */
    if(window.CloudSync && CloudSync.push) CloudSync.push(LS_KEY, full);
  }

  /* ---------- 渲染 ---------- */

    if(state.detailPage > pages) state.detailPage = pages;

    $("detailCnt").textContent = window.__detailPanel ? ("当前库：" + window.__detailPanel) : "（全部库）";
    $("detailTitle").textContent = window.__detailPanel ? window.__detailPanel+" 明细" : "全部库汇总";
    if($("dpInfo")){

  /* ---------- 本机代理（HTTP → windows-mcp） ---------- */
  async function pingAgent(){
    try{
      const ctl = new AbortController();
      const t = setTimeout(()=>ctl.abort(), 2500);
      const r = await fetch(AGENT+"/ping", {signal:ctl.signal});
      clearTimeout(t);

  /* ---------- 云端中转通道 ---------- */
  async function cloudJob(key){
    /* 写一条抓取任务到云端队列。
       带一个唯一 jobId：代理回传结果时原样带回，页面只认自己的那个任务，
       避免命中上一次的旧结果（seq 单调递增也不够 —— 页面 seq 从 1 起，
       云端里还留着别处写入的更大 seq，会被误判成"本次已完成"）。 */
    if(!(window.CloudSync && CloudSync.push)) return false;
    if(CloudSync.ready && !CloudSync.ready()){
      log("云端未就绪，无法下发任务", "er");
      return false;
    }
    state.jobSeq += 1;
    const jobId = "web-" + Date.now() + "-" + Math.floor(Math.random()*100000);
    state.jobId = jobId;
    state.jobAt = nowStr();               // 下发时刻，用于识别"旧代理没带 jobId"的结果
    const job = { seq: state.jobSeq, jobId: jobId, key: key, ts: nowStr(), by: "web" };
    const ok = await CloudSync.push(JOB_KEY, job);
    if(!ok) log("云端任务下发失败：" + key, "er");
    return ok;
  }

  async function cloudPollResult(key, timeoutMs){
    /* 轮询云端结果键，直到拿到「本任务」的结果。
       判定顺序：① jobId 完全一致 → 一定是我的；
                 ② 老代理没带 jobId → 用「结果时间 ≥ 下发时刻」兜底，
                    防止把上一轮的旧结果当成本次（seq 不可靠：云端里可能残留更大的 seq）。 */
    if(!(window.CloudSync && CloudSync.pullResult)) return null;
    const t0 = Date.now();
    const myJob = state.jobId;
    const myAt = state.jobAt;
    while(Date.now() - t0 < timeoutMs){
      const r = await CloudSync.pullResult(JOB_RES_KEY);
      if(r.ok && r.value && typeof r.value === "object"){
        const v = r.value;
        let mine = false;
        if(v.jobId){
          mine = (v.jobId === myJob);
        }else if(v.at && myAt){
          mine = (String(v.at) >= String(myAt));
        }
        if(mine && v.key === key){
          state.lastResSeq = v.seq;
          return v;
        }
      }
      await new Promise(r=>setTimeout(r, 2500));
    }
    return null;
  }

  /* 拉取各板块接入状态：已配置=ready，未配置=pending */
  async function loadSources(){
    let panels = null;
    /* ① 先问本机代理 */
    try{
      const ctl = new AbortController();
      const t = setTimeout(()=>ctl.abort(), 3000);
      const r = await fetch(AGENT+"/sources", {signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j = await r.json();
      if(j.panels) panels = j.panels;
    }catch(e){ /* 线上页面读不到本机，走云端 */ }
    /* ② 读不到就从云端取（代理把配置状态同步到了 app_data） */
    if(!panels){
      try{
        if(window.CloudSync && CloudSync.pullResult){
          const r = await CloudSync.pullResult("inventory_sources_v1");
          if(r.ok && r.value){
            /* 兼容两种结构：{panels:{...}} 与平铺 {key:{...}} */
            const v = r.value;
            panels = (v.panels && typeof v.panels === "object") ? v.panels : v;
          }
        }
      }catch(e){ log("云端读取取数配置失败：" + e.message, "wn"); }
    }
    if(!panels){
      log("取数配置暂时读不到（本机助手未在线），各库暂按未接入处理", "wn");
      return;
    }
    Object.assign(state.srcInfo, panels);
    PANELS.forEach(p=>{
      const info = panels[p.key] || {};
      const s = state.panels[p.key];
      s.pending = (info.ready === false);
      if(info.ready === false){
        s.status = "pending";
        s.err = info.todo || "尚未配置自动拉数方式";
      }
    });
    renderPanels();
    const ready = PANELS.filter(p=>!state.panels[p.key].pending).map(p=>p.name).join("、");
    const pend  = PANELS.filter(p=>state.panels[p.key].pending).map(p=>p.name).join("、");
    log("取数配置：已就绪 " + (ready||"无") + (pend ? ("；待接入 " + pend) : ""), "t");
  }

  /* 触发抓取
     - sap 模式：走本机已装好的 SAP 取数脚本（走的是同一个 agent /run）
     - win 模式：agent 用 windows-mcp 驱动对应业务软件
     agent 不可用时降级为「仅本地记录」，页面给出明确提示而不是假装成功。 */
  async function syncPanel(key){
    const p = PANELS.find(x=>x.key===key); if(!p) return;
    const s = state.panels[key];
    if(s.pending){
      const info = state.srcInfo[key] || {};
      toast(p.name + " 尚未接入自动拉数");
      log("⏸ " + p.name + " 尚未接入自动拉数：" + (info.todo || "待配置取数方式"), "wn");
      return;
    }
    s.status = "run"; s.err = ""; updatePanelUI(key);
    log("▶ 开始同步：" + p.name + "（" + p.code + "）", "in");

    const t0 = Date.now();
    let j = null;
    try{
      /* ① 先试直连本机代理（本机打开页面时最快，秒回） */
      try{
        const ctl = new AbortController();
        const timer = setTimeout(()=>ctl.abort(), 6000);   // 本机代理只给 6 秒握手
        const r = await fetch(AGENT+"/run", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ key:key, mode:p.mode, src:p.src }),
          signal:ctl.signal
        });
        clearTimeout(timer);
        if(!r.ok) throw new Error("代理返回 HTTP "+r.status);
        j = await r.json();
        state.channel = "直连代理";
        $("agentStat").className = "stat on";
        $("agentStatTxt").textContent = "代理在线 · 直连";
      }catch(e1){
        /* ② 直连不通（线上 https 页面被浏览器策略拦住）→ 走云端中转 */
        state.channel = "云端中转";
        log("本机代理直连不可用（" + (e1 && e1.message ? e1.message : e1) + "），改走云端中转", "wn");
        if(!state.cloudOK){
          throw new Error("本机代理连不上，且云端中转未启用");
        }
        log("⏳ 已下发云端任务，等待本机助手执行…", "in");
        if(!await cloudJob(key)) throw new Error("云端任务下发失败");
        const v = await cloudPollResult(key, 300000);
        if(!v) throw new Error("云端中转等待超时（本机助手未回结果）");
        j = { ok: v.ok, rows: v.rows, at: v.at, error: v.error };
      }
      if(j.ok === false) throw new Error(j.error || "抓取失败");

      const rows = Array.isArray(j.rows) ? j.rows : [];
      // 替换该库旧明细
      state.rows = state.rows.filter(x=>x.src!==p.name);
      rows.forEach(x=>{
        state.rows.push({
          mat: x.mat!=null?x.mat:(x.material||""),
          desc: x.desc!=null?x.desc:(x.text||x.name||""),
          loc:  x.loc!=null?x.loc:(x.stock||x.place||""),
          qty:  x.qty!=null?x.qty:(x.qtyl||x.amount||""),
          unit: x.unit||"",
          src:  p.name,
          at:   j.at || nowStr()
        });
      });
      state.detailPage = 1;
      s.rows = rows.length;
      s.at = j.at || nowStr();
      s.status = (rows.length ? "ok" : "warn");
      if(!rows.length) s.err = "抓取完成但没有数据返回（请检查来源系统或代理配置）";
      log((rows.length?("✔ "+p.name+" 成功，取到 "+rows.length+" 条"):("⚠ "+p.name+" 没有数据"))
          + "（"+((Date.now()-t0)/1000).toFixed(1)+" 秒 · "+state.channel+"）", rows.length?"ok":"wn");
    }catch(e){
      s.status = "err";
      s.err = (e && e.name==="AbortError") ? "超时（180 秒无响应）" : String(e.message||e);
      s.at = nowStr();
      log("✘ " + p.name + " 失败：" + s.err, "er");
    }
    updatePanelUI(key);
    renderDetail();
    save();
  }

  /* ---------- 导出 Excel ---------- */
  function exportExcel(){
    const rows = state.rows;
    if(!rows.length){ toast("还没有数据，先同步一次"); return; }
    // CSV（带 BOM，Excel 直接双击能正常显示中文）
    const head = ["物料号","物料描述","库位","库存数量","单位","来源库","同步时间"];
    const esc2 = v => {
      const s = String(v==null?"":v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    };
    const lines = [head.map(esc2).join(",")];
    rows.forEach(r=>lines.push([r.mat,r.desc,r.loc,r.qty,r.unit,r.src,r.at].map(esc2).join(",")));
    const csv = "﻿" + lines.join("\r\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = "库存同步_" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    toast("已导出 " + rows.length + " 条库存（CSV，Excel 可直接打开）");
    log("已导出库存明细 " + rows.length + " 条", "ok");
  }

  /* 到点自动跑：页面开着时生效（每分钟检查一次） */
  let lastAutoRun = "";
  function tickAuto(){
    if(!state.auto) return;
    const d = new Date();
    const nowHM = pad(d.getHours())+":"+pad(d.getMinutes());
    if(nowHM !== state.autoTime) return;
    const dayKey = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+nowHM;
    if(lastAutoRun === dayKey) return;
    lastAutoRun = dayKey;
    log("⏰ 到达定时时间 " + state.autoTime + "，开始自动拉数", "in");
    syncAll();
  }

  /* ---------- 事件 ---------- */
  $("grid").addEventListener("click", e=>{
    const btn = e.target.closest("[data-act]"); if(!btn) return;
    const panel = btn.closest(".panel"); if(!panel) return;
    const key = panel.getAttribute("data-key");
    const p = PANELS.find(x=>x.key===key); if(!p) return;
    const act = btn.getAttribute("data-act");
    if(act==="sync") syncPanel(key);
    else if(act==="view"){
      window.__detailPanel = p.name;
      renderDetail();
      document.querySelector(".detail").scrollIntoView({behavior:"smooth", block:"center"});
    }
    else if(act==="srcinfo"){
      toast(p.name + "： " + p.src);
      log("来源 · " + p.name + " → " + p.src, "in");
    }
  });

  $("syncAllBtn").onclick = async ()=>{
    if(state.running){ toast("正在同步中，请稍候"); return; }
    const todo = PANELS.filter(p=>!state.panels[p.key].pending);
    if(!todo.length){ toast("五个库都还没接入自动拉数"); return; }
    state.running = true;
    $("syncAllBtn").disabled = true;
    for(const p of todo){
      await syncPanel(p.key);
    }
    state.running = false;
    $("syncAllBtn").disabled = false;
    toast(todo.length===PANELS.length ? "五个库同步完成" : ("已同步 "+todo.length+" 个库（其余待接入）"));
  };
  $("expBtn").onclick = exportExcel;
  $("refreshBtn").onclick = ()=>{ renderPanels(); renderDetail(); toast("已刷新"); };
  $("clearLogBtn").onclick = ()=>{ $("logBox").innerHTML=""; log("日志已清空","t"); };
  $("detailSearch").oninput = function(){ state.detailPage = 1; renderDetail(); };
  if($("dpPrev")) $("dpPrev").onclick = function(){ if(state.detailPage > 1){ state.detailPage--; renderDetail(); } };
  if($("dpNext")) $("dpNext").onclick = function(){ state.detailPage++; renderDetail(); };
  $("saveAutoBtn").onclick = saveAuto;
  $("autoChk").onchange = saveAuto;
  $("autoTime").onchange = saveAuto;

  /* ---------- 启动 ---------- */
  function boot(){
    loadAuto();
    /* ★ CloudSync 必须显式 init()，否则 ready=false，所有云端接口都是空转 */
    try{ if(window.CloudSync && CloudSync.init) CloudSync.init(); }catch(e){ log("云端初始化失败：" + e.message, "wn"); }
    renderPanels();
    /* 明细读完后再渲染（大仓库是异步的）；失败也不挡启动 */
    load().then(()=>{
      renderDetail();
      const meta = (function(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } })();
      if(meta && meta.savedAt){
        $("lastRefresh").textContent = new Date(meta.savedAt).toLocaleString();
        log("载入本机已有数据 " + (state.rows.length||0) + " 条" + (state.idbOK ? "（本地大仓库）" : ""), "t");
      }else{
        log("尚无历史库存数据，点各板块「立即同步」开始拉取", "t");
      }
    }).catch(()=>{ renderDetail(); });
    const meta0 = (function(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } })();
    if(meta0 && meta0.savedAt) $("lastRefresh").textContent = new Date(meta0.savedAt).toLocaleString();
    /* 通道探测：直连代理 + 云端中转，至少一个能用 */
    (async function(){
      let direct = false;
      try{ direct = await pingAgent(); }catch(e){}
      let cloud = false;
      try{
        if(window.CloudSync && CloudSync.ready && CloudSync.ready() && CloudSync.pullResult){
          const r = await CloudSync.pullResult(LS_KEY);
          cloud = !!(r && r.ok);      // ok=true 表示云端连得上（value 为 null 也算通）
          if(!cloud && r && r.reason) log("云端不可用：" + r.reason, "wn");
        }else{
          log("云端未就绪（CloudSync 未初始化或未配置）", "wn");
        }
      }catch(e){ log("云端探测失败：" + e.message, "wn"); }
      state.cloudOK = cloud;
      const cs = $("chanStat"), ct = $("chanTxt");
      if(direct){
        cs.className = "stat on"; ct.textContent = "通道：直连本机";
        log("通道：直连本机代理（最快）", "ok");
        loadSources();
      }else if(cloud){
        cs.className = "stat on"; ct.textContent = "通道：云端中转";
        log("本机不在本浏览器侧，改由本机助手经云端中转执行（需本机助手在线）", "in");
        loadSources();
      }else{
        cs.className = "stat off"; ct.textContent = "通道不可用";
        log("⚠ 抓取通道都不可用：本机代理连不上，云端也连不上。"+
            "请在本机启动库存同步助手。页面与手动导出不受影响。", "wn");
      }
    })();
    setInterval(tickAuto, 60000);
    // 云端拉一次（别的机器同步过的数据也能看到）
    if(window.CloudSync && CloudSync.pullResult){
      CloudSync.pullResult(LS_KEY).then(r=>{
        if(r.ok && r.value && typeof r.value==="object"){
          let changed = false;
          PANELS.forEach(p=>{ const v=r.value.panels&&r.value.panels[p.key]; if(v && v.at && v.at > (state.panels[p.key].at||"")){ Object.assign(state.panels[p.key], v); changed=true; } });
          if(Array.isArray(r.value.rows) && r.value.rows.length > state.rows.length){
            state.rows = unpackInvRows(r.value, r.value.rows);
            state.detailPage = 1;
            idbSetRows(state.rows).then(()=>{ state.idbOK = true; if($("detailStore")) $("detailStore").textContent = "明细存本地大仓库"; }).catch(()=>{});
            changed=true;
          }
          if(changed){ renderPanels(); renderDetail(); log("已从云端同步库存数据", "ok"); }
        }
      }).catch(()=>{});
    }
  }
  boot();
})();
</script>

<script>if(window.Auth)Auth.guard();</script>
