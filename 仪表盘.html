<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="v8bsMNv6o7F4lGkBVaWy6r">
<head data-page-node-id="xGSlQCGqaLM1GtI5t87zIp">
<meta charset="UTF-8" data-page-node-id="91z9gAGZvP7jV1FVM8QZzV">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="zbStjCJk2C1h33VnPDKuPT">
<title>智能指挥中心 · 生产管理客户端</title>
<style>
  :root{
    --bg:#04070f;
    --card:rgba(255,255,255,.042);
    --line:rgba(120,180,255,.15); --line-hi:rgba(130,210,255,.45);
    --txt:#e8f0ff; --muted:#7890b0; --dim:#55688a;
    --cyan:#22d3ee; --blue:#3b82f6; --violet:#a855f7; --pink:#f472b6;
    --green:#34d399; --orange:#fb923c; --red:#f87171;
    --glow:0 0 24px rgba(34,211,238,.32);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    color:var(--txt); font-variant-numeric:tabular-nums;
    background:
      radial-gradient(1200px 640px at 10% -10%, rgba(37,99,235,.26), transparent 62%),
      radial-gradient(1000px 600px at 95% 0%, rgba(168,85,247,.20), transparent 64%),
      radial-gradient(900px 520px at 50% 112%, rgba(34,211,238,.15), transparent 62%),
      linear-gradient(180deg,#04070f 0%,#070d1c 46%,#04070f 100%);
    background-attachment:fixed;
  }
  /* 细网格 + 顶部扫描光 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(120,190,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,190,255,.05) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 20%, #000 0%, transparent 80%);
    -webkit-mask-image:radial-gradient(circle at 50% 20%, #000 0%, transparent 80%);
  }
  body::after{
    content:"";position:fixed;left:0;right:0;top:0;height:200px;pointer-events:none;z-index:0;
    background:linear-gradient(180deg,rgba(34,211,238,.11),transparent);
    animation:scan 8s ease-in-out infinite;
  }
  @keyframes scan{0%,100%{opacity:.22;transform:translateY(-34px)}50%{opacity:.6;transform:translateY(34px)}}

  .wrap{position:relative;z-index:1;padding:20px 26px 46px;max-width:1500px;margin:0 auto;}

  /* ============ 顶部 HUD 指挥栏 ============ */
  .hud{
    position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:16px 22px;margin-bottom:18px;border-radius:18px;overflow:hidden;
    background:linear-gradient(100deg,rgba(34,211,238,.10),rgba(168,85,247,.08) 45%,rgba(255,255,255,.02));
    border:1px solid rgba(34,211,238,.24);
    box-shadow:0 12px 40px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(16px);
  }
  .hud::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.85),rgba(168,85,247,.7),transparent);}
  .hud::after{content:"";position:absolute;top:-60%;left:-10%;width:34%;height:220%;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.10),transparent);
    transform:rotate(18deg);animation:sweep 7s linear infinite;pointer-events:none;}
  @keyframes sweep{0%{left:-20%}100%{left:120%}}
  .logo{
    width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:linear-gradient(140deg,#22d3ee,#a855f7);color:#04101c;
    box-shadow:0 0 26px rgba(34,211,238,.5), inset 0 1px 0 rgba(255,255,255,.4);
    animation:spinGlow 5s ease-in-out infinite;
  }
  @keyframes spinGlow{0%,100%{box-shadow:0 0 22px rgba(34,211,238,.45), inset 0 1px 0 rgba(255,255,255,.4)}
                      50%{box-shadow:0 0 34px rgba(168,85,247,.6), inset 0 1px 0 rgba(255,255,255,.4)}}
  .hud .tt{flex:1;min-width:200px;}
  .hud .tt .t{font-size:20px;font-weight:800;letter-spacing:1.2px;
    background:linear-gradient(92deg,#ffffff,#9fe6ff 42%,#c9b6ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(120,200,255,.32));}
  .hud .tt .s{font-size:10px;letter-spacing:3.4px;color:#5f8fb5;font-weight:700;margin-top:3px;text-transform:uppercase;}
  .hud .clock{
    text-align:right;font-variant-numeric:tabular-nums;
    padding-left:18px;border-left:1px solid rgba(255,255,255,.10);
  }
  .hud .clock b{display:block;font-size:25px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(180deg,#ffffff,#7fd9ff);-webkit-background-clip:text;background-clip:text;
    color:transparent;filter:drop-shadow(0 0 12px rgba(34,211,238,.4));}
  .hud .clock span{font-size:10.5px;color:var(--dim);letter-spacing:1.4px;}
  .ctrl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  select,button{
    border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;
    background:rgba(255,255,255,.05);color:var(--txt);cursor:pointer;transition:.18s;font-family:inherit;
    backdrop-filter:blur(8px);
  }
  select:hover,button:hover{border-color:var(--line-hi);background:rgba(255,255,255,.10);box-shadow:var(--glow);}
  select option{background:#0a1428;color:#e8f0ff;}
  button.primary{background:linear-gradient(135deg,rgba(34,211,238,.24),rgba(168,85,247,.24));
    border-color:rgba(34,211,238,.48);color:#e2fbff;}
  button.primary:hover{background:linear-gradient(135deg,rgba(34,211,238,.36),rgba(168,85,247,.36));}
  .live{display:flex;align-items:center;gap:7px;font-size:11px;color:#7de6f7;font-weight:700;letter-spacing:.8px;}
  .live b{width:7px;height:7px;border-radius:50%;background:var(--green);
          box-shadow:0 0 10px var(--green);animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ============ 卡片（玻璃 + 四角科技角标） ============ */
  .card{
    position:relative;background:linear-gradient(165deg,rgba(255,255,255,.062),rgba(255,255,255,.014));
    border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    box-shadow:0 10px 34px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(16px);transition:.24s cubic-bezier(.2,.8,.3,1);overflow:hidden;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--line-hi);
    box-shadow:0 16px 44px rgba(0,0,0,.5),0 0 30px rgba(34,211,238,.13);}
  .card::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent);}
  .cnr{position:absolute;inset:-1px;pointer-events:none;border-radius:17px;}
  .cnr::before{content:"";position:absolute;top:0;right:0;width:19px;height:19px;
    border-top:2px solid rgba(34,211,238,.8);border-right:2px solid rgba(34,211,238,.8);
    border-top-right-radius:16px;filter:drop-shadow(0 0 5px rgba(34,211,238,.55));}
  .cnr::after{content:"";position:absolute;bottom:0;left:0;width:19px;height:19px;
    border-bottom:2px solid rgba(168,85,247,.8);border-left:2px solid rgba(168,85,247,.8);
    border-bottom-left-radius:16px;filter:drop-shadow(0 0 5px rgba(168,85,247,.55));}
  .card h2{font-size:13px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:9px;
           color:#cfe3ff;letter-spacing:.7px;}
  .card h2 i{width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--cyan),var(--violet));
             box-shadow:0 0 10px rgba(34,211,238,.7);display:inline-block;}
  .card h2 .tag{font-size:10px;font-weight:600;color:var(--dim);margin-left:auto;
                background:rgba(255,255,255,.05);border:1px solid var(--line);
                padding:2px 8px;border-radius:999px;letter-spacing:0;}

  /* ============ KPI ============ */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:13px;margin-bottom:16px;}
  .kpi{
    position:relative;border-radius:16px;padding:14px 16px 12px;overflow:hidden;
    background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
    border:1px solid var(--line);backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.07);
    transition:.24s cubic-bezier(.2,.8,.3,1);
  }
  .kpi:hover{transform:translateY(-4px);border-color:var(--line-hi);
    box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 26px rgba(34,211,238,.16);}
  .kpi .glow{position:absolute;right:-36px;top:-38px;width:118px;height:118px;border-radius:50%;
             filter:blur(34px);opacity:.42;pointer-events:none;transition:.3s;}
  .kpi:hover .glow{opacity:.68;}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac,var(--cyan));
              box-shadow:0 0 14px var(--ac,var(--cyan));}
  .kpi .label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.9px;margin-bottom:7px;
              display:flex;align-items:center;gap:6px;}
  .kpi .label em{font-style:normal;width:5px;height:5px;border-radius:50%;background:var(--ac,var(--cyan));
                 box-shadow:0 0 8px var(--ac,var(--cyan));}
  .kpi .value{font-size:30px;font-weight:800;line-height:1.02;letter-spacing:-.6px;
    background:linear-gradient(180deg,#ffffff,#a9dcff);-webkit-background-clip:text;background-clip:text;
    color:transparent;filter:drop-shadow(0 0 16px rgba(120,200,255,.34));}
  .kpi .unit{font-size:11.5px;font-weight:700;color:var(--dim);margin-left:4px;
    -webkit-text-fill-color:var(--dim);}
  .kpi .spark{margin-top:8px;height:34px;}
  .kpi .spark svg{display:block;width:100%;height:34px;overflow:visible;}

  /* ============ 布局 ============ */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .grid3{display:grid;grid-template-columns:330px 1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:1180px){ .grid3{grid-template-columns:1fr;} .grid2{grid-template-columns:1fr;} }
  .reveal{opacity:0;transform:translateY(18px);}
  .reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.3,1);}

  /* ============ 条形图 ============ */
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .bar-name{flex:0 0 104px;font-size:12.5px;font-weight:600;color:#cfe3ff;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:22px;background:rgba(255,255,255,.045);border-radius:6px;overflow:hidden;
             border:1px solid rgba(255,255,255,.05);position:relative;}
  .bar-fill{height:100%;border-radius:6px;min-width:3px;position:relative;
            background:linear-gradient(90deg,#22d3ee,#a855f7);
            box-shadow:0 0 16px rgba(34,211,238,.5);animation:slide .9s cubic-bezier(.2,.8,.3,1) both;}
  .bar-fill::after{content:"";position:absolute;inset:0;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);
            transform:translateX(-100%);animation:shine 2.6s ease-in-out infinite;}
  @keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}
  @keyframes slide{from{width:0 !important;opacity:.3}}
  .bar-val{flex:0 0 76px;text-align:right;font-size:13px;font-weight:800;color:#dff5ff;
    text-shadow:0 0 8px rgba(34,211,238,.45);font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:visible;letter-spacing:.2px;}

  /* ============ 柱状图 ============ */
  .cols{display:flex;align-items:flex-end;gap:8px;height:184px;padding-top:10px;position:relative;}
  .cols::before{content:"";position:absolute;left:0;right:0;bottom:22px;height:1px;
    background:linear-gradient(90deg,rgba(34,211,238,.3),transparent);}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
  .col .v{font-size:10.5px;font-weight:800;color:#9fe0ff;margin-bottom:5px;white-space:nowrap;}
  .col .bar{width:100%;max-width:38px;border-radius:5px 5px 0 0;min-height:3px;position:relative;
            background:linear-gradient(180deg,#22d3ee,#2563eb);
            box-shadow:0 0 16px rgba(34,211,238,.45);animation:up .9s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes up{from{height:0 !important;opacity:.3}}
  .col.today .bar{background:linear-gradient(180deg,#fbbf24,#ea580c);box-shadow:0 0 16px rgba(251,146,60,.5);}
  .col.past  .bar{background:linear-gradient(180deg,#fb7185,#dc2626);box-shadow:0 0 16px rgba(248,113,113,.5);}
  .col .d{font-size:10.5px;color:var(--dim);margin-top:7px;white-space:nowrap;}
  .col.today .d{color:var(--orange);font-weight:800;text-shadow:0 0 10px rgba(251,146,60,.6);}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:12px;flex-wrap:wrap;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}

  /* ============ 环形图 ============ */
  .ring-wrap{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;}
  .ring{position:relative;width:180px;height:180px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .halo{position:absolute;inset:8px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(34,211,238,.22),rgba(168,85,247,.22),rgba(34,211,238,.22));
    filter:blur(16px);animation:rot 9s linear infinite;}
  @keyframes rot{to{transform:rotate(360deg)}}
  .ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .mid b{font-size:28px;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(180deg,#ffffff,#9adcff);-webkit-background-clip:text;background-clip:text;
    color:transparent;filter:drop-shadow(0 0 16px rgba(120,200,255,.4));}
  .ring .mid span{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:2px;}
  .ring-legend{display:flex;flex-direction:column;gap:11px;font-size:12px;min-width:132px;}
  .ring-legend div{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:9px;
    background:rgba(255,255,255,.035);border:1px solid var(--line);}
  .ring-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .ring-legend b{margin-left:auto;font-weight:800;color:#dceeff;}
  .ring-legend em{font-style:normal;color:var(--dim);font-size:10.5px;}

  /* ============ 表格 ============ */
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{text-align:left;font-size:10px;color:var(--dim);font-weight:800;padding:8px 10px;letter-spacing:1px;
     border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;}
  td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle;color:#dbe8ff;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:.15s;}
  tbody tr:hover td{background:rgba(34,211,238,.08);}
  tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--cyan);}
  .num{text-align:right;font-weight:700;}
  .rank{color:var(--cyan);font-weight:800;text-shadow:0 0 8px rgba(34,211,238,.5);}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .badge.red{background:rgba(248,113,113,.16);color:#fca5a5;border:1px solid rgba(248,113,113,.34);}
  .badge.blue{background:rgba(59,130,246,.16);color:#93c5fd;border:1px solid rgba(59,130,246,.34);}
  .badge.orange{background:rgba(251,146,60,.16);color:#fdba74;border:1px solid rgba(251,146,60,.34);}
  .badge.gray{background:rgba(255,255,255,.07);color:var(--dim);border:1px solid var(--line);}
  .empty{text-align:center;color:var(--dim);padding:30px 0;font-size:13px;letter-spacing:.5px;}

  /* ============ AI 洞察 ============ */
  .insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px;margin-bottom:16px;}
  .insight{position:relative;display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:14px;overflow:hidden;
           background:linear-gradient(135deg,rgba(255,255,255,.062),rgba(255,255,255,.014));
           border:1px solid var(--line);backdrop-filter:blur(12px);transition:.22s;}
  .insight:hover{transform:translateY(-2px);border-color:var(--line-hi);box-shadow:0 12px 30px rgba(0,0,0,.4);}
  .insight .ic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:flex;align-items:center;
               justify-content:center;background:rgba(255,255,255,.07);
               border:1px solid var(--line);overflow:hidden;}
  .insight .ic svg.ic3d{width:26px;height:26px;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));}
  .insight .t{font-size:12.6px;line-height:1.62;color:#cfe1fa;}
  .insight .t b{color:#fff;font-weight:800;}
  .insight.warn{border-color:rgba(248,113,113,.34);
                background:linear-gradient(135deg,rgba(248,113,113,.14),rgba(255,255,255,.014));}
  .insight.warn .ic{background:rgba(248,113,113,.2);border-color:rgba(248,113,113,.38);}
  .insight.ok{border-color:rgba(52,211,153,.32);
              background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(255,255,255,.014));}
  .insight.ok .ic{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.36);}

  /* ============ AI 机器人 ============ */
  .ai-fab{
    position:fixed;right:26px;bottom:26px;width:62px;height:62px;border-radius:50%;z-index:60;
    background:linear-gradient(135deg,#22d3ee,#a855f7);cursor:pointer;border:none;
    display:flex;align-items:center;justify-content:center;font-size:27px;color:#04121f;
    box-shadow:0 12px 34px rgba(34,211,238,.45);animation:pulse 2.8s infinite;transition:.2s;
  }
  .ai-fab:hover{transform:scale(1.09) rotate(-8deg);}
  @keyframes pulse{0%{box-shadow:0 12px 34px rgba(34,211,238,.45),0 0 0 0 rgba(34,211,238,.55)}
                   70%{box-shadow:0 12px 34px rgba(34,211,238,.45),0 0 0 20px rgba(34,211,238,0)}
                   100%{box-shadow:0 12px 34px rgba(34,211,238,.45),0 0 0 0 rgba(34,211,238,0)}}
  .ai-fab .tip{position:absolute;right:0;bottom:calc(100% + 12px);white-space:nowrap;font-size:12px;
               font-weight:700;color:#04121f;background:linear-gradient(135deg,#22d3ee,#a855f7);
               padding:6px 13px;border-radius:999px;box-shadow:0 6px 20px rgba(34,211,238,.45);
               transform-origin:bottom right;animation:tipIn .6s .8s both;}
  @keyframes tipIn{from{opacity:0;transform:scale(.7) translateY(6px)}to{opacity:1;transform:none}}
  .ai-fab .tip::after{content:"";position:absolute;right:14px;top:100%;border:6px solid transparent;
    border-top-color:#a855f7;}

  .ai-panel{
    position:fixed;right:26px;bottom:100px;width:412px;max-width:calc(100vw - 32px);height:590px;
    max-height:calc(100vh - 140px);z-index:61;display:none;flex-direction:column;
    background:linear-gradient(180deg,rgba(11,22,42,.97),rgba(6,12,24,.98));
    border:1px solid rgba(34,211,238,.32);border-radius:20px;overflow:hidden;
    box-shadow:0 28px 72px rgba(0,0,0,.66),0 0 40px rgba(34,211,238,.20);
    backdrop-filter:blur(22px);animation:pop .3s cubic-bezier(.2,.9,.3,1.25) both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.95)}}
  .ai-panel.open{display:flex;}
  .ai-head{display:flex;align-items:center;gap:11px;padding:13px 15px;position:relative;overflow:hidden;
           background:linear-gradient(90deg,rgba(34,211,238,.17),rgba(168,85,247,.15));
           border-bottom:1px solid rgba(34,211,238,.24);}
  .ai-head::after{content:"";position:absolute;bottom:0;left:0;height:1px;width:40%;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.9),transparent);animation:slidex 3.4s ease-in-out infinite;}
  @keyframes slidex{0%,100%{left:0}50%{left:60%}}
  .av-wrap{position:relative;width:36px;height:36px;flex:0 0 36px;}
  .av-wrap .halo{position:absolute;inset:-3px;border-radius:12px;
    background:conic-gradient(from 0deg,#22d3ee,#a855f7,#22d3ee);filter:blur(6px);animation:rot 4s linear infinite;}
  .av-wrap .av{position:absolute;inset:0;border-radius:11px;display:flex;align-items:center;justify-content:center;
               font-size:18px;background:linear-gradient(135deg,#22d3ee,#a855f7);color:#04121f;}
  .ai-head .ti{flex:1;}
  .ai-head .ti b{display:block;font-size:13.5px;letter-spacing:.5px;
                 background:linear-gradient(90deg,#ffffff,#9fe6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .ai-head .ti span{font-size:10px;color:#7de6f7;display:flex;align-items:center;gap:5px;margin-top:3px;letter-spacing:.6px;}
  .ai-head .ti span i{width:6px;height:6px;border-radius:50%;background:var(--green);

<script>
// ================= 数据读取（与发货计划系统共用同一套 localStorage） =================
var LS_DRAFT="shipping_draft_v1", LS_REC="shipping_plans_v1";
function load(k){ try{ return JSON.parse(localStorage.getItem(k))||null; }catch(e){ return null; } }
function num(v){ if(v==null) return 0; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function fmtD(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
// 与发货计划系统保持一致：todayStr()=日历明天（系统里“明日”即当日计划的边界）
function todayStr(){ var d=new Date(); d.setDate(d.getDate()+1); return fmtD(d); }
function realTodayStr(){ return fmtD(new Date()); }
function isBlank(v){ return v==null||String(v).trim()===""||String(v).trim()==="/"; }

// 汇总行：草稿 + 已发布记录，按 日期+客户+型号+数量 去重，避免重复发布导致重复计数
function collectRows(src){
  var out=[], seen={};
  function push(r){
    if(!r || !r.model || r.model==="/") return;
    var key=[r.shipdate,r.customer,r.model,r.qty,r.delivery].join("|");
    if(seen[key]) return;
    seen[key]=1; out.push(r);
  }
  if(src==="all"||src==="draft"){ var d=load(LS_DRAFT); if(d&&d.rows) d.rows.forEach(push); }
  if(src==="all"||src==="rec"){ var recs=load(LS_REC)||[]; recs.forEach(function(rec){ (rec.rows||[]).forEach(push); }); }
  return out;
}
function currentRows(){ return collectRows(document.getElementById("src").value); }

// ================= 通用聚合 =================
function agg(rows){
  var a={n:rows.length,qty:0,ton:0,cust:{},model:{},date:{},daily:{},overdue:[],today:[],future:[]};
  var b=todayStr();
  rows.forEach(function(r){
    var q=num(r.qty), t=num(r.ton), d=(r.shipdate||"").trim();
    a.qty+=q; a.ton+=t;
    var c=isBlank(r.customer)?"（未填客户）":String(r.customer).trim();
    if(!a.cust[c]) a.cust[c]={name:c,qty:0,ton:0,rows:0,min:"",max:""};
    a.cust[c].qty+=q; a.cust[c].ton+=t; a.cust[c].rows++;
    if(d&&d!=="/"){ if(!a.cust[c].min||d<a.cust[c].min) a.cust[c].min=d; if(!a.cust[c].max||d>a.cust[c].max) a.cust[c].max=d; }
    var m=isBlank(r.model)?"（未填型号）":String(r.model).trim();
    if(!a.model[m]) a.model[m]={model:m,customer:r.customer,qty:0,ton:0,rows:0};
    a.model[m].qty+=q; a.model[m].ton+=t; a.model[m].rows++;
    if(d&&d!=="/"){
      a.date[d]=(a.date[d]||0)+t;
      if(!a.daily[d]) a.daily[d]={qty:0,ton:0,n:0,cust:{}};
      a.daily[d].qty+=q; a.daily[d].ton+=t; a.daily[d].n++; a.daily[d].cust[c]=1;
      if(d<b) a.overdue.push(r); else if(d>b) a.future.push(r); else a.today.push(r);
    }
  });
  a.custList=Object.keys(a.cust).map(function(k){return a.cust[k];}).sort(function(x,y){return y.ton-x.ton;});
  a.modelList=Object.keys(a.model).map(function(k){return a.model[k];}).sort(function(x,y){return y.qty-x.qty;});
  a.dateKeys=Object.keys(a.date).sort();
  return a;
}

// ================= 迷你趋势图（sparkline） =================
var sparkUid=0;
function sparkline(vals, color){
  if(!vals||!vals.length) return "";
  var v=vals.slice();
  if(v.length===1) v=[0,v[0]];                       // 单点补一个 0，避免除零
  var w=150,h=32,pad=3;
  var max=Math.max.apply(null,v); if(!(max>0)) max=1;
  var pts=v.map(function(x,i){
    var px=v.length>1?(i/(v.length-1))*w:w/2;
    var py=h-pad-(x/max)*(h-pad*2);
    return [px,py];
  });
  var uid="sp"+(++sparkUid);
  var line=pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
  var area="0,"+h+" "+line+" "+w+","+h;
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+color+'" stop-opacity=".42"/>'+
      '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<polygon points="'+area+'" fill="url(#'+uid+')"/>'+
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.6" '+
      'stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px '+color+')"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.4" fill="#fff" '+
      'style="filter:drop-shadow(0 0 5px '+color+')"/></svg>';
}

// ================= 渲染 =================
function renderKPI(a){
  var b=todayStr(), keys=a.dateKeys;
  var ot=0,tt=0,ft=0;
  a.overdue.forEach(function(r){ot+=num(r.ton);});
  a.today.forEach(function(r){tt+=num(r.ton);});
  a.future.forEach(function(r){ft+=num(r.ton);});
  function pick(fn){ var arr=keys.filter(fn).map(function(k){return a.daily[k]?a.daily[k].ton:0;}); return arr.length?arr:[0]; }
  var pastKeys=keys.filter(function(k){return k<b;}), futKeys=keys.filter(function(k){return k>b;});
  var todayCustTon=a.today.map(function(r){return num(r.ton);}).sort(function(x,y){return y-x;});
  var cards=[
    {label:"计划总行数", value:a.n, unit:"行", ac:"#22d3ee",
     s:keys.map(function(k){return a.daily[k]?a.daily[k].n:0;})},
    {label:"客户数量", value:a.custList.length, unit:"家", ac:"#a855f7",
     s:keys.map(function(k){return a.daily[k]?Object.keys(a.daily[k].cust).length:0;})},
    {label:"总数量", value:Math.round(a.qty), unit:"件", ac:"#34d399",
     s:keys.map(function(k){return a.daily[k]?a.daily[k].qty:0;})},
    {label:"总吨位", value:a.ton.toFixed(1), unit:"t", ac:"#3b82f6",
     s:keys.map(function(k){return a.daily[k]?a.daily[k].ton:0;})},
    {label:"当日计划（明天）", value:a.today.length, unit:"行", ac:"#fb923c", s:todayCustTon},
    {label:"待发（后天起）", value:a.future.length, unit:"行", ac:"#22d3ee",
     s:futKeys.map(function(k){return a.daily[k]?a.daily[k].ton:0;})},
    {label:"⚠ 滞后（今天及之前）", value:a.overdue.length, unit:"行", ac:"#f87171",
     s:pastKeys.map(function(k){return a.daily[k]?a.daily[k].ton:0;})}
  ];
  document.getElementById("kpis").innerHTML=cards.map(function(c){
    return '<div class="kpi" style="--ac:'+c.ac+'">'+
      '<div class="glow" style="background:'+c.ac+'"></div>'+
      '<b class="cnr"></b>'+
      '<div class="label"><em></em>'+esc(c.label)+'</div>'+
      '<div class="value">'+esc(c.value)+'<span class="unit">'+esc(c.unit)+'</span></div>'+
      '<div class="spark">'+sparkline(c.s,c.ac)+'</div></div>';
  }).join("");
}

function renderRing(a){
  var ot=0,tt=0,ft=0;
  a.overdue.forEach(function(r){ot+=num(r.ton);});
  a.today.forEach(function(r){tt+=num(r.ton);});
  a.future.forEach(function(r){ft+=num(r.ton);});
  var tot=ot+tt+ft;
  var R=74, C=2*Math.PI*R, box=document.getElementById("ringBox");
  if(tot<=0){ box.innerHTML='<div class="empty">暂无吨位数据</div>'; return; }
  var segs=[{v:ot,c:"#f87171",n:"滞后",d:"今天及之前"},{v:tt,c:"#fb923c",n:"当日",d:"明天"},{v:ft,c:"#3b82f6",n:"待发",d:"后天起"}];
  var off=0, circles="";
  segs.forEach(function(s){
    var len=s.v/tot*C;
    if(len<=0) return;
    circles+='<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="'+s.c+'" stroke-width="16"'+
             ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"'+
             ' stroke-linecap="round" style="filter:drop-shadow(0 0 8px '+s.c+');opacity:.94"/>';
    off+=len;
  });
  box.innerHTML='<div class="ring-wrap"><div class="ring">'+
    '<div class="halo"></div>'+
    '<svg width="180" height="180"><circle cx="90" cy="90" r="'+R+'" fill="none" '+
    'stroke="rgba(255,255,255,.06)" stroke-width="16"></circle>'+circles+'</svg>'+
    '<div class="mid"><b>'+tot.toFixed(1)+'</b><span>总吨位 T</span></div></div>'+
    '<div class="ring-legend">'+segs.map(function(s){
      var p=tot?s.v/tot*100:0;
      return '<div><i style="background:'+s.c+';box-shadow:0 0 8px '+s.c+'"></i>'+
             s.n+'<em>'+s.d+'</em><b>'+s.v.toFixed(1)+'t · '+p.toFixed(0)+'%</b></div>';
    }).join("")+'</div></div>';
}

function renderDateChart(a){
  var keys=a.dateKeys, box=document.getElementById("dateChart");
  if(!keys.length){ box.innerHTML='<div class="empty">暂无数据</div>'; return; }
  var today=realTodayStr();
  var past=keys.filter(function(k){return k<today;}).slice(-3);
  var fut=keys.filter(function(k){return k>=today;}).slice(0,10);
  var show=past.concat(fut); if(!show.length) show=keys.slice(-10);
  var max=Math.max.apply(null,show.map(function(k){return a.date[k];}))||1;
  var b=todayStr();
  box.innerHTML='<div class="cols">'+show.map(function(k,i){
    var cls = k<today?"past" : (k===b?"today":"");
    var h=Math.max(a.date[k]/max*100,3);
    return '<div class="col '+cls+'"><div class="v">'+a.date[k].toFixed(1)+'</div>'+
           '<div class="bar" style="height:'+h.toFixed(1)+'%;animation-delay:'+(i*0.05)+'s" title="'+esc(k)+'"></div>'+
           '<div class="d">'+esc(k.slice(5).replace("-","/"))+'</div></div>';
  }).join("")+'</div>';
}

// ================= AI 问答引擎（本地，直接基于计划数据推理） =================
var GREET=/^(你好|您好|hi|hello|嗨|哈喽|在吗|你是谁|who)/i;
var HELP=/(能做什么|会什么|能干什么|帮助|怎么用|使用说明|功能|help|可以问什么|支持什么)/i;
var OVERDUE=/(滞后|逾期|超时|过期|超期|没发|未发|落后|延误|延迟|红了|红色的)/;
var FUTURE=/(待发|未来|以后|之后| upcoming|提前|远期)/;
var TODAY=/(明天|明日|今天|今日|当日|当天|today|tomorrow)/;
var RANK=/(最多|最大|最高|最少|最小|排行|排名|top|前几|哪家|哪个|谁最|最重|榜首|第一)/i;
var SUM=/(总共|一共|合计|总数|总量|总计|多少吨|总吨位|吨位多少|多少件|总数量|数量多少|多少行|几行|多少条|多少家|几个客户|汇总|总结|概况|overview)/;

function pickEntity(q, names){
  var best=null;
  names.forEach(function(n){
    var s=String(n).trim();
    if(s.length<2) return;
    if(q.indexOf(s)>=0 && (!best||s.length>best.length)) best=s;
  });
  return best;
}
// 日期解析：支持 2026-09-08 / 9月8日 / 9/8 / 9-8
function pickDate(q){
  var m=q.match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
  if(m) return m[1]+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0");
  m=q.match(/(\d{1,2})\s*[月\/-]\s*(\d{1,2})\s*日?/);
  if(m){ var y=new Date().getFullYear(); return y+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0"); }
  return null;
}
function lineOf(r){
  return {日期:(r.shipdate||"-"), 客户:(isBlank(r.customer)?"-":r.customer), 型号:(r.model||"-"),
          数量:Math.round(num(r.qty)), 吨位:num(r.ton).toFixed(1)};
}
function statOf(list){
  var q=0,t=0; list.forEach(function(r){ q+=num(r.qty); t+=num(r.ton); });
  return {n:list.length,qty:q,ton:t};
}

function aiAnswer(q){
  q=String(q||"").trim();
  if(!q) return {text:"你可以直接问我，比如「明天要发什么？」「哪些滞后了？」"};
  var rows=currentRows();
  if(!rows.length) return {text:"当前数据源里还没有计划数据。先到「发货计划」录入几行，或切换右上角的数据源再问我 🙂"};
  var a=agg(rows);
  var b=todayStr(), rt=realTodayStr();

  if(GREET.test(q)){
    return {text:"你好！我是<b>计划助手 AI</b> 🤖，已连接你当前的发货计划数据（共 "+a.n+" 行）。\n"+
      "可以直接用大白话问我，例如：\n· 明天要发什么？\n· 有哪些滞后的？\n· XX客户多少吨？\n· 哪个型号最多？\n· 9月10日发什么？\n· 帮我总结一下"};
  }
  if(HELP.test(q)){
    return {text:"我能做这些：\n"+
      "1️⃣ 查某天计划：「明天发什么」「9月10日有什么」\n"+
      "2️⃣ 查客户：「XX客户多少吨」「XX客户发什么」\n"+
      "3️⃣ 查型号：「XX型号多少件」「哪个型号最多」\n"+
      "4️⃣ 查风险：「有哪些滞后的」「待发的有哪些」\n"+
      "5️⃣ 查总量：「总吨位多少」「一共多少件」「多少个客户」\n"+
      "6️⃣ 排行榜：「哪个客户货量最大」「型号排行」\n"+
      "7️⃣ 总结：「帮我总结一下」\n\n数据口径与发货计划表一致：今天及之前=滞后，明天=当日，后天起=待发。"};
  }

  // 1) 具体日期
  var dq=pickDate(q);
  if(dq && !TODAY.test(q)){
    var list=rows.filter(function(r){ return (r.shipdate||"").trim()===dq; });
    if(!list.length) return {text:dq+" 没有安排发货计划。"};
    var s=statOf(list);
    var tag = dq<b?"（已滞后）" : (dq===b?"（当日计划）":"（待发）");
    return {text:"<b>"+dq+"</b> 共 <b>"+list.length+"</b> 行、<b>"+s.qty+"</b> 件、<b>"+s.ton.toFixed(1)+"t</b> "+tag+"：",
            table:list.map(lineOf).slice(0,20)};
  }

  // 2) 客户实体
  var custNames=a.custList.map(function(x){return x.name;});
  var cn=pickEntity(q,custNames);
  if(cn){
    var c=a.cust[cn];
    var list2=rows.filter(function(r){ return (isBlank(r.customer)?"（未填客户）":String(r.customer).trim())===cn; });
    var late=list2.filter(function(r){ var d=(r.shipdate||"").trim(); return d&&d!=="/"&&d<b; });
    var t="客户 <b>"+esc(cn)+"</b>：共 <b>"+c.rows+"</b> 行、<b>"+Math.round(c.qty)+"</b> 件、<b>"+c.ton.toFixed(1)+"t</b>。\n"+
          "发货区间："+(c.min||"-")+" ~ "+(c.max||"-")+
          (late.length?"\n⚠ 其中 <b>"+late.length+"</b> 行已滞后。":"\n✅ 没有滞后计划。");
    return {text:t, table:list2.map(lineOf).slice(0,20)};
  }

  // 3) 型号实体
  var modelNames=a.modelList.map(function(x){return x.model;});
  var mn=pickEntity(q,modelNames);
  if(mn){
    var m=a.model[mn];
    var list3=rows.filter(function(r){ return (isBlank(r.model)?"（未填型号）":String(r.model).trim())===mn; });
    var dates={}; list3.forEach(function(r){ var d=(r.shipdate||"").trim(); if(d&&d!=="/") dates[d]=(dates[d]||0)+num(r.qty); });
    var dk=Object.keys(dates).sort();
    return {text:"型号 <b>"+esc(mn)+"</b>：共 <b>"+m.rows+"</b> 行、<b>"+Math.round(m.qty)+"</b> 件、<b>"+m.ton.toFixed(1)+"t</b>。\n"+
                 "客户："+esc(isBlank(m.customer)?"-":m.customer)+"\n"+
                 "发货日期："+(dk.length?dk.join("、"):"-"),
            table:list3.map(lineOf).slice(0,20)};
  }

  // 4) 滞后
  if(OVERDUE.test(q)){
    if(!a.overdue.length) return {text:"🎉 没有滞后计划，今天及之前该发的都已安排。"};
    var s2=statOf(a.overdue);
    var byCust={}; a.overdue.forEach(function(r){
      var c=isBlank(r.customer)?"（未填客户）":String(r.customer).trim(); byCust[c]=(byCust[c]||0)+num(r.ton); });
    var topC=Object.keys(byCust).sort(function(x,y){return byCust[y]-byCust[x];}).slice(0,3)
             .map(function(k){return esc(k)+" "+byCust[k].toFixed(1)+"t";}).join("、");
    return {text:"⚠ 滞后（今天及之前）共 <b>"+a.overdue.length+"</b> 行、<b>"+s2.qty+"</b> 件、<b>"+s2.ton.toFixed(1)+"t</b>。\n"+
                 "主要涉及："+topC+"\n建议优先安排这批。",
            table:a.overdue.slice().sort(function(x,y){return (x.shipdate||"")<(y.shipdate||"")?-1:1;}).map(lineOf).slice(0,20)};
  }

  // 5) 待发
  if(FUTURE.test(q)){
    if(!a.future.length) return {text:"后天及以后暂无待发计划。"};
    var s3=statOf(a.future);
    var fk=a.dateKeys.filter(function(k){return k>b;});
    return {text:"🚚 待发（后天起）共 <b>"+a.future.length+"</b> 行、<b>"+s3.qty+"</b> 件、<b>"+s3.ton.toFixed(1)+"t</b>。\n"+
                 "日期跨度："+(fk[0]||"-")+" ~ "+(fk[fk.length-1]||"-")+"。",
            table:a.future.slice().sort(function(x,y){return (x.shipdate||"")<(y.shipdate||"")?-1:1;}).map(lineOf).slice(0,20)};
  }

  // 6) 明天 / 今天
  if(TODAY.test(q)){
    var wantToday=/今天|今日/.test(q)&&!/明天|明日/.test(q);
    var target=wantToday?rt:b;
    var list4=rows.filter(function(r){ return (r.shipdate||"").trim()===target; });
    var label=wantToday?("今天（"+rt+"）"):("明天（"+b+"）");
    if(!list4.length) return {text:label+" 没有安排发货计划。"};
    var s4=statOf(list4);
    return {text:"<b>"+label+"</b> 共 <b>"+list4.length+"</b> 行、<b>"+s4.qty+"</b> 件、<b>"+s4.ton.toFixed(1)+"t</b>：",
            table:list4.map(lineOf).slice(0,20)};
  }

  // 7) 排行榜
  if(RANK.test(q)){
    if(/型号|机型|产品|规格/.test(q)){
      var t5=a.modelList.slice(0,5).map(function(x,i){
        return {"#":i+1, 型号:x.model, 客户:isBlank(x.customer)?"-":x.customer,
                数量:Math.round(x.qty), 吨位:x.ton.toFixed(1)}; });
      return {text:"型号排行（按数量）：", table:t5};
    }
    var t6=a.custList.slice(0,5).map(function(x,i){
      return {"#":i+1, 客户:x.name, 行数:x.rows, 数量:Math.round(x.qty), 吨位:x.ton.toFixed(1)}; });
    return {text:"客户货量排行（按吨位）：", table:t6};
  }

  // 8) 总量 / 总结
  if(SUM.test(q)){
    var share=a.ton?(a.overdue.reduce(function(s,r){return s+num(r.ton);},0)/a.ton*100):0;
    return {text:"📊 当前数据概览：\n"+
      "· 计划行数：<b>"+a.n+"</b> 行\n"+
      "· 客户数量：<b>"+a.custList.length+"</b> 家\n"+
      "· 总数量：<b>"+Math.round(a.qty)+"</b> 件\n"+
      "· 总吨位：<b>"+a.ton.toFixed(1)+"</b> t\n"+
      "· 当日（明天）：<b>"+a.today.length+"</b> 行\n"+
      "· 待发（后天起）：<b>"+a.future.length+"</b> 行\n"+
      "· ⚠ 滞后：<b>"+a.overdue.length+"</b> 行（占吨位 "+share.toFixed(0)+"%）\n"+
      "· 日期范围："+(a.dateKeys[0]||"-")+" ~ "+(a.dateKeys[a.dateKeys.length-1]||"-")};
  }

  // 9) 备注 / 交货方式
  if(/备注|交货|方式|物流|备注写/.test(q)){
    var seen={}, arr=[];
    rows.forEach(function(r){
      var k=isBlank(r.delivery)?"-":String(r.delivery).trim();
      if(!seen[k]){ seen[k]={交货方式:k,行数:0,吨位:0}; arr.push(seen[k]); }
      seen[k].行数++; seen[k].吨位+=num(r.ton);
    });
    arr.sort(function(x,y){return y.吨位-x.吨位;});
    arr.forEach(function(x){ x.吨位=x.吨位.toFixed(1); });
    return {text:"按交货方式统计：", table:arr};
  }

  // 10) 兜底
  return {text:"这个问题我还没学会 😅 可以换个问法：\n"+
    "· 「明天要发什么？」\n· 「有哪些滞后的？」\n· 「XX客户多少吨？」\n· 「总吨位多少？」\n· 「哪个客户货量最大？」\n"+
    "· 「9月10日发什么？」\n\n也可以点下面的快捷问题。"};
}

// ================= AI 面板交互 =================
var aiBody=document.getElementById("aiBody");
function nowHM(){
  var d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function bubble(cls, html){
  var d=document.createElement("div"); d.className="msg "+cls; d.innerHTML=html;
  aiBody.appendChild(d); aiBody.scrollTop=aiBody.scrollHeight; return d;
}
function typeOut(el, html){
  var tmp=document.createElement("div"); tmp.innerHTML=html;
  var plain=tmp.textContent, i=0;
  var timer=setInterval(function(){
    i+=3;
    el.textContent=plain.slice(0,i);
    aiBody.scrollTop=aiBody.scrollHeight;
    if(i>=plain.length){ clearInterval(timer); el.innerHTML=html+'<span class="tm">'+nowHM()+'</span>';
      aiBody.scrollTop=aiBody.scrollHeight; }
  },11);
}
function ask(q){
  q=String(q||"").trim(); if(!q) return;
  bubble("me", esc(q)+'<span class="tm">'+nowHM()+'</span>');
  var thinking=document.createElement("div"); thinking.className="msg bot";
  thinking.innerHTML='<div class="typing"><div class="dots"><i></i><i></i><i></i></div><span>正在分析数据…</span></div>';
  aiBody.appendChild(thinking); aiBody.scrollTop=aiBody.scrollHeight;
  setTimeout(function(){
    var res;
    try{ res=aiAnswer(q); }catch(e){ res={text:"分析时出错了："+esc(e.message)}; }
    var html=String(res.text||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
    if(res.table && res.table.length){
      var cols=Object.keys(res.table[0]);
      html+='<table class="mini"><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+
            '</tr></thead><tbody>'+res.table.map(function(r){
              return '<tr>'+cols.map(function(c){return '<td>'+esc(r[c])+'</td>';}).join("")+'</tr>';
            }).join("")+'</tbody></table>';
    }
    thinking.remove();
    typeOut(bubble("bot",""), html);
  },420);
}
document.getElementById("aiFab").onclick=function(){
  var p=document.getElementById("aiPanel");
  p.classList.toggle("open");
  if(p.classList.contains("open")){
    if(!aiBody.children.length){
      var rows=currentRows();
      bubble("bot","你好 👋 我是<b>计划助手 AI</b>，已读取 <b>"+rows.length+"</b> 行计划数据。<br>想问什么直接说就行，比如「明天发什么？」"+
             '<span class="tm">'+nowHM()+'</span>');
    }
    setTimeout(function(){ document.getElementById("aiInput").focus(); },60);
  }
};
document.getElementById("aiClose").onclick=function(){ document.getElementById("aiPanel").classList.remove("open"); };
document.getElementById("aiClear").onclick=function(){
  aiBody.innerHTML="";
  bubble("bot","对话已清空 🔄 有什么想问的？"+'<span class="tm">'+nowHM()+'</span>');
};
document.getElementById("aiSend").onclick=function(){
  var i=document.getElementById("aiInput"); ask(i.value); i.value="";
};
document.getElementById("aiInput").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault();
  var v=this.value; if(v.trim()){ ask(v); this.value=""; } } });
document.getElementById("aiQuick").addEventListener("click",function(e){
  if(e.target && e.target.classList.contains("chip")) ask(e.target.textContent.replace(/^\S+\s/,""));
});

// ================= 装饰：四角角标 + 滚动渐入 =================
function decorateCorners(){
  var els=document.querySelectorAll(".card:not(.kpi)");
  for(var i=0;i<els.length;i++){
    var has=false, ch=els[i].children;
    for(var k=0;k<ch.length;k++){ if(ch[k].className==="cnr"){ has=true; break; } }
    if(has) continue;
    var b=document.createElement("b"); b.className="cnr"; els[i].appendChild(b);
  }
}
function initReveal(){
  var els=document.querySelectorAll(".reveal");
  if(!("IntersectionObserver" in window)){
    for(var i=0;i<els.length;i++) els[i].classList.add("in");
    return;
  }
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  },{threshold:0.06});
  for(var j=0;j<els.length;j++) io.observe(els[j]);
}

// ================= 时钟 =================
function tickClock(){
  var d=new Date();
  var el=document.getElementById("clock");
  if(el) el.textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
  var wd=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  var de=document.getElementById("cdate");
  if(de) de.textContent=d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")+" "+wd;
}

// ================= 主渲染 =================
function render(){
  var rows=currentRows(), a=agg(rows);
  renderInsights(a); renderKPI(a); renderRing(a); renderCustChart(a); renderDateChart(a);
  renderModelTable(a); renderCustTable(a); renderOverdue(a);
  decorateCorners();
  document.getElementById("updated").textContent=
    "共 "+a.n+" 条计划（已按 日期+客户+型号+数量 去重） · 更新于 "+new Date().toLocaleString("zh-CN");
}
document.getElementById("src").onchange=render;
document.getElementById("refresh").onclick=render;
render();
initReveal();
tickClock(); setInterval(tickClock,1000);
// 数据可能由其它页面写入，回到本页时自动刷新
window.addEventListener("focus", render);
</script>
