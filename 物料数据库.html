<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物料主数据库</title>
<script src="supabase.min.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud-sync.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --line:#e3e8ef; --txt:#1f2733;
    --muted:#7a8699; --brand:#2563eb; --brand-d:#1e4fb0;
    --red:#d92d20; --soft:#eef4ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:10px;}
  h1 .dot{width:10px;height:22px;background:var(--brand);border-radius:3px;display:inline-block;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .nav-link{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;background:#fff;border:1px solid var(--line);color:var(--txt);transition:.15s;box-shadow:0 2px 6px rgba(31,45,77,.04);}
  .nav-link:hover{background:var(--soft);color:var(--brand);}
  .nav-link.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(37,99,235,.28);}
  /* ===== 云端同步状态 + 手机自适应 ===== */
  .cloud-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;background:#f1f5f9;color:#64748b;border:1px solid var(--line);white-space:nowrap;}
  .cloud-pill.ok{background:#e7f8ee;color:#15803d;border-color:#bbe7c9;}
  .cloud-pill.err{background:#fdecea;color:#d92d20;border-color:#f3c7c2;}
  .cloud-pill.sync{background:#eef4ff;color:#2563eb;border-color:#c5d8ff;}
  .cloud-pill.warn{background:#fffbeb;color:#b45309;border-color:#fde68a;}
  .cloud-pill.off{background:#f1f5f9;color:#94a3b8;}
  @media (max-width:820px){
    .wrap{padding:12px 8px 56px;}
    h1{font-size:18px;}
    .nav{gap:6px;}
    .card{padding:12px;}
    .doc{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tbl{min-width:680px;}
    .toolbar{gap:8px;}
    .toolbar .btn{font-size:13px;padding:8px 12px;}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
  .card h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card h2 .tag{font-size:11px;background:var(--soft);color:var(--brand);padding:2px 8px;border-radius:20px;font-weight:600;}
  .hint{font-size:12px;color:var(--muted);}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;transition:.15s;}
  .btn-primary{background:var(--brand);color:#fff;} .btn-primary:hover{background:var(--brand-d);}
  .btn-ghost{background:var(--soft);color:var(--brand);} .btn-ghost:hover{background:#dfeaff;}
  .btn-line{background:#fff;color:var(--txt);border:1px solid var(--line);} .btn-line:hover{background:#f3f6fb;}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f3c7c2;} .btn-danger:hover{background:#fdecea;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center;}
  .doc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .doc-scroll{max-height:480px;overflow:auto;}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;}
  .tbl thead th{background:#f3f6fb;color:#44506a;font-weight:600;padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;}
  .tbl td{padding:6px 6px;border-bottom:1px solid #eef1f6;text-align:center;vertical-align:middle;}
  .tbl td input{border:1px solid transparent;background:transparent;width:100%;padding:6px 6px;text-align:center;border-radius:6px;font-size:13px;outline:none;}
  .tbl td input:focus{border-color:var(--brand);background:#fafcff;}
  .tbl tr:hover td{background:#fafcff;}
  .col-act{width:46px;}
  .del-x{border:none;background:#fff;color:var(--red);cursor:pointer;font-size:16px;line-height:1;}
  .lock-ico{color:#b8860b;font-size:13px;}
  .tbl td input[readonly]{cursor:not-allowed;}
  .mask{position:fixed;inset:0;background:rgba(31,41,55,.45);display:none;align-items:center;justify-content:center;z-index:98;padding:16px;}
  .mask.show{display:flex;}
  .pwd-box{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:330px;box-shadow:0 18px 50px rgba(15,23,42,.28);}
  .pwd-box h3{margin:0 0 2px;font-size:16px;}
  .pwd-sub{color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:14px;}
  .pwd-box input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;outline:none;background:#fafbfc;color:#1f2733;}
  .pwd-box input:focus{border-color:var(--brand);background:#fff;}
  .pwd-err{color:var(--red);font-size:12px;min-height:16px;margin:0 0 6px;}
  .pwd-actions{display:flex;justify-content:flex-end;gap:8px;}
  .empty{color:var(--muted);font-size:13px;padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px;}
  /* 搜索框 */
  .db-search{display:flex;align-items:center;gap:8px;margin:10px 0 8px;}
  .db-search input{flex:1;max-width:340px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;background:#fafbfc;color:#1f2733;}
  .db-search input:focus{border-color:var(--brand);background:#fff;}
  .db-search .hint{color:var(--muted);font-size:12px;}
  /* 分页控件 */
  .db-pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .db-pager .pg-info{color:var(--muted);font-size:12px;margin-right:6px;}
  .db-pager button{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;}
  .db-pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand);background:var(--soft);}
  .db-pager button:disabled{opacity:.45;cursor:not-allowed;}
  .db-pager button.cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;}
  .db-pager select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;color:var(--txt);cursor:pointer;}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#1f2733;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>物料主数据库</h1>
  <div class="sub">维护物料主数据，供发货计划页「输入型号自动带出」，与发货计划系统共享同一浏览器存储。</div>

  <nav class="nav">
    <a href="发货计划系统.html" class="nav-link" target="_blank">📋 发货计划</a>
    <a href="物料数据库.html" class="nav-link active">📦 物料数据库</a>
  </nav>

  <div class="card">
    <h2>物料清单 <span class="tag" id="dbCount">0 条</span>
      <span class="tag" id="lockTag" style="background:#fff4e5;color:#b45309;">🔒 修改需密码</span>
      <span class="hint">（字段：物料编码 / 型号 / 单重 / 一箱多少件 / 客户 / 备注；按型号或编码匹配）</span></h2>
    <div class="toolbar">
      <input type="file" id="dbFile" accept=".csv,.xlsx,.xls" hidden>
      <button class="btn btn-primary" id="importDb">导入表格</button>
      <button class="btn btn-ghost" id="addDbRow">＋ 新增物料</button>
      <button class="btn btn-line" id="exportDb">导出数据库</button>
      <button class="btn btn-line" id="tplDb">下载模板</button>
      <button class="btn btn-line" id="sampleDb">载入示例</button>
      <button class="btn btn-danger" id="clearDb">清空</button>
      <button class="btn btn-ghost" id="lockDbBtn" style="margin-left:auto;">🔓 解锁修改</button>
      <button class="btn btn-line" id="pwdDbBtn">🔑 修改密码</button>
    </div>
    <div class="db-search">
      <input type="text" id="dbSearch" placeholder="🔍 搜索型号 / 物料编码 / 客户 / 物流 / 备注">
      <span class="hint" id="dbSearchInfo"></span>
      <button class="btn btn-line" id="dbSearchClear" style="display:none;">清空搜索</button>
    </div>
    <div class="doc doc-scroll">
      <table class="tbl" id="dbTbl">
        <thead><tr>
          <th>物料编码</th><th>型号</th><th>单重(kg)</th><th>一箱多少件</th><th>客户</th><th>物流</th><th>备注</th><th class="col-act">操作</th>
        </tr></thead>
        <tbody id="dbBody"></tbody>
      </table>
      <div class="empty" id="dbEmpty">数据库为空。可点「导入表格」或「载入示例」开始。</div>
    </div>
    <div class="db-pager" id="dbPager"></div>
  </div>
</div>

<div class="mask" id="pwdMask">
  <div class="pwd-box">
    <h3 id="pwdTitle">输入修改密码</h3>
    <div class="pwd-sub" id="pwdSub"></div>
    <div id="pwdFields"></div>
    <div class="pwd-err" id="pwdErr"></div>
    <div class="pwd-actions">
      <button class="btn btn-line" id="pwdCancel">取消</button>
      <button class="btn btn-primary" id="pwdOk">确定</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const LS_DB = "shipping_db_v1";
const LS_PWD = "shipping_db_pwd_v1";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

let DB = loadDB();
let dbUnlocked = false;
const freshRows = new Set();
function loadDB(){ try{ return JSON.parse(localStorage.getItem(LS_DB)) || []; }catch(e){ return []; } }
function saveDB(){ try{ localStorage.setItem(LS_DB, JSON.stringify(DB)); }catch(e){ toast("数据库保存失败：存储空间不足"); } if(window.CloudSync) CloudSync.autoPush(LS_DB); }

// ===== 分页 / 搜索 / 防抖（3000+ 条时不卡的关键）=====
let dbPage=1, dbPageSize=100, dbKeyword="", saveTimer=null, searchTimer=null;

// 防抖保存：避免每敲一个字就「全量序列化 + 写 localStorage + 推云端」
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ saveDB(); }, 600); }

// 返回「筛选后的原始 DB 索引」数组；编辑时按原索引写回，保证分页/搜索下数据不错位
function getViewIdx(){
  const kw=dbKeyword.trim().toLowerCase();
  const idx=[];
  if(!kw){ for(let i=0;i<DB.length;i++) idx.push(i); return idx; }
  for(let i=0;i<DB.length;i++){
    const r=DB[i];
    const hay=((r.code||"")+" "+(r.model||"")+" "+(r.customer||"")+" "+(r.logistics||"")+" "+(r.remark||"")).toLowerCase();
    if(hay.indexOf(kw)!==-1) idx.push(i);
  }
  return idx;
}
const totalPages = n => Math.max(1, Math.ceil(n/dbPageSize));

function renderDB(){
  const tb=$("dbBody"); tb.innerHTML="";
  const viewIdx=getViewIdx();
  const total=viewIdx.length;
  const pages=totalPages(total);
  if(dbPage>pages) dbPage=pages;
  if(dbPage<1) dbPage=1;

  const emptyEl=$("dbEmpty");
  if(!DB.length){ emptyEl.style.display="block"; emptyEl.textContent="数据库为空。可点「导入表格」或「载入示例」开始。"; }
  else if(!total){ emptyEl.style.display="block"; emptyEl.textContent="没有匹配「"+dbKeyword+"」的物料，换个关键词试试。"; }
  else emptyEl.style.display="none";

  $("dbCount").textContent = DB.length+" 条"+(dbKeyword?"（筛选出 "+total+" 条）":"");
  const info=$("dbSearchInfo");
  if(info) info.textContent = dbKeyword ? ("匹配 "+total+" 条") : (DB.length>dbPageSize ? ("共 "+DB.length+" 条，每页显示 "+dbPageSize+" 条") : "");
  const clr=$("dbSearchClear"); if(clr) clr.style.display = dbKeyword?"":"none";

  const start=(dbPage-1)*dbPageSize;
  const pageIdx=viewIdx.slice(start, start+dbPageSize);
  const frag=document.createDocumentFragment();
  pageIdx.forEach(oi=>{
    const r=DB[oi];
    const tr=document.createElement("tr");
    tr.dataset.i=oi;
    const fresh=freshRows.has(r);
    const locked=!dbUnlocked && !fresh;
    const ro=locked?"readonly":"";
    tr.innerHTML=`
      <td><input data-k="code" ${ro} value="${esc(r.code)}" placeholder="物料编码"></td>
      <td><input data-k="model" ${ro} value="${esc(r.model)}" placeholder="型号"></td>
      <td><input data-k="unit" ${ro} type="number" min="0" step="0.0001" value="${esc(r.unit)}" placeholder="kg"></td>
      <td><input data-k="perbox" ${ro} type="number" min="1" value="${esc(r.perbox)}" placeholder="件/箱"></td>
      <td><input data-k="customer" ${ro} value="${esc(r.customer)}" placeholder="客户"></td>
      <td><input data-k="logistics" ${ro} value="${esc(r.logistics)}" placeholder="物流"></td>
      <td><input data-k="remark" ${ro} value="${esc(r.remark)}" placeholder="备注"></td>
      <td class="col-act">${locked?'<span class="lock-ico" title="已有物料：修改/删除需先解锁">🔒</span>':'<button class="del-x" title="删除">✕</button>'}</td>`;
    frag.appendChild(tr);
  });
  tb.appendChild(frag);            // 一次性插入，避免逐行 append 反复重排
  renderPager(total, pages);
  syncLockUI();
}

function renderPager(total, pages){
  const box=$("dbPager"); if(!box) return;
  if(!DB.length){ box.innerHTML=""; return; }
  const btn=(label,pg,dis,cur)=>`<button ${dis?"disabled":""} ${cur?'class="cur"':""} data-pg="${pg}">${label}</button>`;
  let h=`<span class="pg-info">共 ${total} 条 · 第 ${dbPage}/${pages} 页</span>`;
  h+=btn("首页",1,dbPage===1,false);
  h+=btn("上一页",dbPage-1,dbPage===1,false);
  let s=Math.max(1,dbPage-2), e=Math.min(pages,s+4); s=Math.max(1,e-4);
  for(let p=s;p<=e;p++) h+=btn(String(p),p,false,p===dbPage);
  h+=btn("下一页",dbPage+1,dbPage===pages,false);
  h+=btn("末页",pages,dbPage===pages,false);
  h+=`<select id="dbPageSize">`;
  [50,100,200,500].forEach(n=>{ h+=`<option value="${n}" ${n===dbPageSize?"selected":""}>每页 ${n} 条</option>`; });
  h+=`</select>`;
  box.innerHTML=h;
  box.querySelectorAll("[data-pg]").forEach(b=>{ b.onclick=()=>{ dbPage=+b.dataset.pg; renderDB(); }; });
  const sel=$("dbPageSize");
  if(sel) sel.onchange=()=>{ dbPageSize=+sel.value; dbPage=1; renderDB(); };
}

// 事件委托：整个表格只绑 3 个监听器，替代「每格一个」（3000 条时从 21000 个降到 3 个）
(function bindDbDelegates(){
  const tb=$("dbBody"); if(!tb||tb._delegated) return; tb._delegated=true;
  tb.addEventListener("input", e=>{
    const inp=e.target; if(!inp||inp.tagName!=="INPUT") return;
    const tr=inp.closest("tr"); if(!tr) return;
    const oi=+tr.dataset.i, k=inp.dataset.k;
    if(!k||!DB[oi]) return;
    DB[oi][k]=inp.value.trim();
    scheduleSave();                                   // 防抖，不再每敲一下就写盘+推云端
  });
  tb.addEventListener("click", e=>{
    const b=e.target.closest(".del-x"); if(!b) return;
    const tr=b.closest("tr"); if(!tr) return;
    const oi=+tr.dataset.i, r=DB[oi];
    if(r){ DB.splice(oi,1); freshRows.delete(r); saveDB(); renderDB(); }
  });
  tb.addEventListener("focusin", e=>{
    const inp=e.target; if(!inp||inp.tagName!=="INPUT") return;
    if(inp.hasAttribute("readonly")){ inp.blur(); toast("修改已有物料需先点「🔓 解锁修改」输入密码"); }
  });
})();

function addDbRow(){
  const rec={code:"",model:"",unit:"",perbox:"",customer:"",logistics:"",remark:""};
  freshRows.add(rec);
  DB.unshift(rec);
  dbKeyword=""; const s=$("dbSearch"); if(s) s.value="";   // 清空搜索并回第 1 页，保证能看到新增的空行
  dbPage=1;
  saveDB(); renderDB();
  const first=$("dbBody").querySelector('input[data-k="model"]'); if(first) first.focus();
}
function syncLockUI(){
  const b=$("lockDbBtn"), t=$("lockTag");
  if(b){ b.textContent=dbUnlocked?"🔒 重新锁定":"🔓 解锁修改"; b.className=dbUnlocked?"btn btn-line":"btn btn-ghost"; }
  if(t){ t.textContent=dbUnlocked?"🔓 编辑中":"🔒 修改需密码"; t.style.background=dbUnlocked?"#e7f8ee":"#fff4e5"; t.style.color=dbUnlocked?"#15803d":"#b45309"; }
}
function storedPwd(){ return localStorage.getItem(LS_PWD)||""; }
function hashPwd(s){ let h=5381; s=String(s==null?"":s); for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; } return "d"+h.toString(36); }
function setStoredPwd(p){ localStorage.setItem(LS_PWD, hashPwd(p)); }
function verifyPwd(p){ const s=storedPwd(); return !!s && hashPwd(p)===s; }
function closeModal(){ const m=$("pwdMask"); if(m) m.classList.remove("show"); }
function openModal(title,sub,fields,onOk){
  $("pwdTitle").textContent=title; $("pwdSub").textContent=sub||"";
  $("pwdFields").innerHTML=fields; $("pwdErr").textContent="";
  $("pwdOk").onclick=()=>{ const err=onOk(); if(err){ $("pwdErr").textContent=err; } else closeModal(); };
  $("pwdCancel").onclick=closeModal;
  $("pwdMask").classList.add("show");
  const first=$("pwdFields").querySelector("input"); if(first){ first.focus(); }
}
function openUnlock(){
  if(dbUnlocked) return true;
  openModal("解锁修改","输入密码后，本次打开期间可修改、删除已有物料；新增物料无需密码。",
    '<input type="password" id="pwdIn" placeholder="请输入修改密码" autocomplete="off">',
    ()=>{
      const v=$("pwdIn").value;
      if(!v) return "请输入密码";
      if(!verifyPwd(v)) return "密码错误，请重试";
      dbUnlocked=true; syncLockUI(); renderDB(); toast("已解锁，可修改已有物料");
      return "";
    });
  return false;
}
function openChangePwd(){
  const has=!!storedPwd();
  const fields=(has?'<input type="password" id="oldPwd" placeholder="当前密码" autocomplete="off">':'')
    +'<input type="password" id="np1" placeholder="新密码" autocomplete="off">'
    +'<input type="password" id="np2" placeholder="再次输入新密码" autocomplete="off">';
  openModal("修改密码","建议 6 位以上；修改后解锁需使用新密码。", fields, ()=>{
    if(has && !verifyPwd($("oldPwd").value)) return "当前密码错误";
    const a=$("np1").value, b=$("np2").value;
    if(!a) return "请输入新密码";
    if(a!==b) return "两次输入的新密码不一致";
    setStoredPwd(a); toast("修改密码成功"); return "";
  });
}
function ensurePwdSeed(){
  if(!storedPwd()){ setStoredPwd("123456"); toast("已启用：修改物料需密码，初始密码 123456"); }
}
function pick(obj, names){ for(const n of names){ if(obj[n]!==undefined && obj[n]!=="") return String(obj[n]).trim(); } return ""; }
function findDbIdx(x){
  return DB.findIndex(d =>
    (
      (x.model && d.model && d.model===x.model && (!x.code || !d.code || d.code===x.code)) ||
      (x.code && d.code && d.code===x.code && (!x.model || !d.model || d.model===x.model))
    ) && (!x.customer || !d.customer || d.customer===x.customer));
}
function mergeDbRows(rows){
  const prep=[];
  rows.forEach(raw=>{
    const code=pick(raw,["物料编码","物料代码","编码","code","sku","SKU","物料号"]);
    const model=pick(raw,["型号","规格","model","spec","MODEL"]);
    if(!code && !model) return;
    prep.push({
      code,model,
      unit:pick(raw,["单重","单重(kg)","重量","unit","Unit","kg/件","净重"]),
      perbox:pick(raw,["一箱多少件","每箱件数","装箱数","每箱数量","perbox","PerBox","箱规"]),
      customer:pick(raw,["客户","customer","Customer","购货方"]),
      logistics:pick(raw,["物流","logistics","Logistics","物流公司","承运商","货运"]),
      remark:pick(raw,["备注","remark","Remark","说明","描述"])
    });
  });
  if(!prep.length){ toast("未解析到有效数据"); return; }
  // 用索引匹配，避免「导入 M 条 × 全表 N 条」的 O(M×N) 全表扫描（3000 条时会卡好几十秒）
  const ix=dbIndexMap();
  if(!dbUnlocked){
    const touches=prep.some(x=>findDbIdxFast(x, ix)>=0);
    if(touches){ toast("本次内容会改动已有物料，请先「🔓 解锁修改」再导入"); return; }
  }
  let added=0, updated=0;
  prep.forEach(x=>{
    const idx=findDbIdxFast(x, ix);
    if(idx>=0){
      const t=DB[idx];
      t.code=x.code||t.code; t.model=x.model||t.model;
      if(x.unit) t.unit=x.unit; if(x.perbox) t.perbox=x.perbox;
      if(x.customer) t.customer=x.customer; if(x.logistics) t.logistics=x.logistics; if(x.remark) t.remark=x.remark;
      updated++;
    }else{
      DB.push({code:x.code,model:x.model,unit:x.unit,perbox:x.perbox,customer:x.customer,logistics:x.logistics,remark:x.remark});
      const ni=DB.length-1;                                   // 新记录也要进索引，避免同类物料重复插入
      const m=x.model?String(x.model).trim():"";
      const c=x.code?String(x.code).trim():"";
      if(m){ if(!ix.byModel.has(m)) ix.byModel.set(m,[]); ix.byModel.get(m).push(ni); }
      if(c){ if(!ix.byCode.has(c)) ix.byCode.set(c,[]); ix.byCode.get(c).push(ni); }
      added++;
    }
  });
  dbPage=1;                                                   // 导入后回到第 1 页
  saveDB(); renderDB(); toast(`导入完成：新增 ${added} 条，更新 ${updated} 条`);
}
// 按型号 / 编码建倒排索引：型号→行号数组、编码→行号数组
function dbIndexMap(){
  const byModel=new Map(), byCode=new Map();
  for(let i=0;i<DB.length;i++){
    const d=DB[i]||{};
    const m=d.model?String(d.model).trim():"";
    const c=d.code?String(d.code).trim():"";
    if(m){ if(!byModel.has(m)) byModel.set(m,[]); byModel.get(m).push(i); }
    if(c){ if(!byCode.has(c)) byCode.set(c,[]); byCode.get(c).push(i); }
  }
  return {byModel,byCode};
}
// 只在索引命中的候选行里做精确校验，命中不了就当新物料
function findDbIdxFast(x, ix){
  const m=x.model?String(x.model).trim():"";
  const c=x.code?String(x.code).trim():"";
  const cand=[];
  if(m && ix.byModel.has(m)) cand.push(...ix.byModel.get(m));
  if(c && ix.byCode.has(c)) cand.push(...ix.byCode.get(c));
  if(!cand.length) return -1;
  for(const i of new Set(cand)){
    const d=DB[i]; if(!d) continue;
    const byModel = x.model && d.model && d.model===x.model && (!x.code || !d.code || d.code===x.code);
    const byCode  = x.code && d.code && d.code===x.code && (!x.model || !d.model || d.model===x.model);
    if((byModel || byCode) && (!x.customer || !d.customer || d.customer===x.customer)) return i;
  }
  return -1;
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else{ if(c==='"') q=true; else if(c===","){ row.push(cur); cur=""; }
      else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==="\r"){} else cur+=c; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  if(!rows.length) return [];
  const head=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{ const o={}; head.forEach((h,j)=>o[h]=r[j]!==undefined?r[j]:""); return o; });
}

function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector('script[src="'+src+'"]')){res();return;} const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("加载失败")); document.head.appendChild(s); }); }
$("importDb").onclick=()=>$("dbFile").click();
$("dbFile").onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      let rows;
      if(/\.csv$/i.test(file.name)) rows=parseCSV(ev.target.result);
      else{ if(!window.XLSX){ await loadScript("xlsx.full.min.js"); } const wb=XLSX.read(ev.target.result,{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; rows=XLSX.utils.sheet_to_json(ws,{defval:""}); }
      if(!rows.length){ toast("未解析到数据"); return; }
      mergeDbRows(rows);
    }catch(err){ toast("导入失败："+err.message); }
    finally{ e.target.value=""; }
  };
  if(/\.csv$/i.test(file.name)) reader.readAsText(file); else reader.readAsArrayBuffer(file);
};
$("exportDb").onclick=()=>{
  if(!DB.length){ toast("数据库为空"); return; }
  const head=["物料编码","型号","单重(kg)","一箱多少件","客户","物流","备注"];
  const lines=[head.join(",")];
  DB.forEach(r=>lines.push([r.code,r.model,r.unit,r.perbox,r.customer,r.logistics,r.remark].map(csvCell).join(",")));
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="物料主数据库.csv"; a.click();
};
$("tplDb").onclick=async ()=>{
  if(!window.XLSX){ await loadScript("xlsx.full.min.js"); }
  const aoa=[["物料编码","型号","单重(kg)","一箱多少件","客户","物流","备注"]];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:14},{wch:16},{wch:10},{wch:12},{wch:12},{wch:12},{wch:14},{wch:18}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "物料库模板");
  XLSX.writeFile(wb, "物料库导入模板.xlsx");
  toast("模板已下载：物料库导入模板.xlsx");
};
$("sampleDb").onclick=()=>mergeDbRows([
  {code:"M1001",model:"AX-200",unit:"12.5",perbox:"20",customer:"华东机电",remark:"标准件"},
  {code:"M1002",model:"BX-350",unit:"8.2",perbox:"30",customer:"华南汽配",remark:"加急"},
  {code:"M1003",model:"CX-500",unit:"25.0",perbox:"10",customer:"北方重工",remark:""},
  {code:"M1004",model:"DX-120",unit:"3.4",perbox:"50",customer:"西部材料",remark:"易碎"}
]);
$("clearDb").onclick=()=>{ if(!DB.length) return; if(!dbUnlocked){ openUnlock(); return; } if(!confirm("确认清空整个物料数据库？此操作不可恢复。")) return; DB=[]; freshRows.clear(); dbPage=1; dbKeyword=""; const _s=$("dbSearch"); if(_s) _s.value=""; saveDB(); renderDB(); };
$("addDbRow").onclick=addDbRow;
// 搜索：防抖 250ms，输入停顿后才重新筛选（避免每敲一个字就重渲染整页）
$("dbSearch").addEventListener("input", e=>{
  const v=e.target.value;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{ dbKeyword=v; dbPage=1; renderDB(); }, 250);
});
$("dbSearchClear").onclick=()=>{ $("dbSearch").value=""; dbKeyword=""; dbPage=1; renderDB(); };
$("lockDbBtn").onclick=()=>{ if(dbUnlocked){ dbUnlocked=false; syncLockUI(); renderDB(); toast("已锁定：修改已有物料需重新输入密码"); } else openUnlock(); };
$("pwdDbBtn").onclick=openChangePwd;
$("pwdCancel").onclick=closeModal;
$("pwdMask").addEventListener("click",e=>{ if(e.target===$("pwdMask")) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t);   t._t=setTimeout(()=>t.classList.remove("show"),2200); }

ensurePwdSeed();
renderDB();

// ===================== 云端同步 =====================
if(window.CloudSync){
  CloudSync.init();
  const CLOUD_KEYS=[LS_DB];
  const nav=document.querySelector('.nav');
  const pill=document.createElement('span'); pill.id='cloudPill'; pill.className='cloud-pill';
  const btn=document.createElement('button'); btn.id='cloudSyncBtn'; btn.className='btn btn-ghost'; btn.textContent='☁ 拉取最新';
  if(nav){ nav.appendChild(pill); nav.appendChild(btn); CloudSync.bindStatus(pill);
    btn.onclick=()=>CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); renderDB(); }, true); }   // 手动点同步 = 明确以云端为准
  if(CloudSync.ready()){
    CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); renderDB(); }).then((r)=>{
      // ★ 只在"这次拉取真的没失败"时才把本机数据回写云端：否则会把本机旧物料库冲掉云端。
      //   手动点「☁ 拉取最新」是明确操作，不受此限制。
      if(r && r.failed && r.failed.length) return;
      CLOUD_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } });
    });
  } else { CloudSync.setStatus('未配置云端','off'); }
}
