<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排产计划表</title>
<script src="supabase.min.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud-sync.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --line:#e3e8ef; --txt:#1f2733;
    --muted:#7a8699; --brand:#2563eb; --brand-d:#1e4fb0;
    --red:#d92d20; --green:#15803d; --yellow:#f59e0b;
    --soft:#eef4ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;}
  .wrap{max-width:100%;margin:0 auto;padding:18px 14px 60px;}
  h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:10px;}
  h1 .dot{width:10px;height:22px;background:var(--brand);border-radius:3px;display:inline-block;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .nav-link{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;background:#fff;border:1px solid var(--line);color:var(--txt);transition:.15s;box-shadow:0 2px 6px rgba(31,45,77,.04);}
  .nav-link:hover{background:var(--soft);color:var(--brand);}
  .nav-link.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(37,99,235,.28);}
  /* ===== 云端同步状态 + 手机自适应 ===== */
  .cloud-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;background:#f1f5f9;color:#64748b;border:1px solid var(--line);white-space:nowrap;}
  .cloud-pill.ok{background:#e7f8ee;color:#15803d;border-color:#bbe7c9;}
  .cloud-pill.err{background:#fdecea;color:#d92d20;border-color:#f3c7c2;}
  .cloud-pill.sync{background:#eef4ff;color:#2563eb;border-color:#c5d8ff;}
  .cloud-pill.off{background:#f1f5f9;color:#94a3b8;}
  @media (max-width:820px){
    .wrap{padding:12px 8px 56px;}
    h1{font-size:18px;}
    .nav{gap:6px;}
    .topbar{gap:10px;padding:12px;}
    .field{width:auto;}
    .card{padding:12px;}
    .table-wrap{max-height:calc(100vh - 200px);}
  }
  .topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(31,45,77,.05);}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input,.field select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;background:#fff;}
  .field input:focus,.field select:focus{border-color:var(--brand);}
  .spacer{flex:1;}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-d);}
  .btn-ghost{background:var(--soft);color:var(--brand);}
  .btn-ghost:hover{background:#dfeaff;}
  .btn-line{background:#fff;color:var(--txt);border:1px solid var(--line);}
  .btn-line:hover{background:#f3f6fb;}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f3c7c2;}
  .btn-danger:hover{background:#fdecea;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 8px 24px rgba(31,45,77,.05);}
  .card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .card h2 .tag{font-size:11px;background:var(--soft);color:var(--brand);padding:2px 8px;border-radius:20px;font-weight:600;}

  /* 表格 */
  .table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff;max-height:calc(100vh - 230px);position:relative;}
  .sch-table{border-collapse:separate;border-spacing:0;font-size:12px;table-layout:fixed;min-width:max-content;}
  .sch-table th,.sch-table td{border-right:1px solid #e3e8ef;border-bottom:1px solid #e3e8ef;padding:5px 6px;text-align:center;vertical-align:middle;white-space:nowrap;min-width:68px;height:34px;background:#fff;}
  .sch-table th{background:#f1f4fb;color:#64748b;font-weight:600;position:sticky;top:0;z-index:2;}
  .sch-table th.fixed,.sch-table td.fixed{position:sticky;left:0;z-index:3;background:#fff;box-shadow:2px 0 6px rgba(0,0,0,.06);}
  .sch-table th.fixed.head,.sch-table td.fixed.head{z-index:4;background:#f8fafc;}
  /* 左侧各列宽度 */
  .sch-table .col-code{width:130px;min-width:130px;}
  .sch-table .col-name{width:180px;min-width:180px;}
  .sch-table .col-spec{width:120px;min-width:120px;}
  .sch-table .col-num{width:72px;min-width:72px;}
  .sch-table .col-status{width:84px;min-width:84px;}
  /* 日期列 */
  .sch-table .col-day{width:54px;min-width:54px;}
  .sch-table th.col-day{white-space:nowrap;}
  .sch-table tbody tr:nth-child(even) td{background:#fafbff;}
  .sch-table tbody tr:nth-child(even) td.fixed{background:#f8fafc;}
  .sch-table tbody tr:hover td{background:#eef3ff;}

  /* 可编辑单元格 */
  .cell-input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-size:12px;font-weight:600;color:inherit;outline:none;padding:0;}
  .day-cell{cursor:pointer;position:relative;}
  .day-cell:hover::after{content:"";position:absolute;inset:0;border:2px solid var(--brand);pointer-events:none;}
  .status-normal{background:#fff;}
  .status-warn{background:#fef3c7;color:#92400e;}
  .status-urgent{background:#fee2e2;color:#991b1b;}
  .status-ok{background:#dcfce7;color:#14532d;}
  .status-select{position:absolute;left:0;top:100%;z-index:10;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.12);overflow:hidden;}
  .status-select div{padding:6px 10px;font-size:12px;cursor:pointer;}
  .status-select div:hover{background:var(--soft);}

  .del-x{border:none;background:transparent;color:var(--red);cursor:pointer;font-size:14px;line-height:1;width:20px;height:20px;border-radius:5px;}
  .del-x:hover{background:#fdecea;}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
  .toast.show{opacity:1;}

  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200;}
  .modal.show{display:flex;}
  .modal-box{background:#fff;border-radius:12px;padding:18px;width:520px;max-width:90vw;max-height:80vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal-box h3{margin:0 0 12px;font-size:16px;}
  .modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .modal-row input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;}
  .modal-ac{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;}
  .modal-ac-item{padding:8px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid #f1f4f9;}
  .modal-ac-item:hover{background:var(--soft);}
  .modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>排产计划表</h1>
  <div class="sub">左侧为物料信息，右侧按天展开；点击单元格可填数量，点击色块可切换状态。</div>

  <nav class="nav">
    <a href="发货计划系统.html" class="nav-link" target="_blank">📋 发货计划</a>
    <a href="排产计划表.html" class="nav-link active">📅 排产计划表</a>
    <a href="物料数据库.html" class="nav-link" target="_blank">📦 物料数据库</a>
  </nav>

  <div class="topbar">
    <div class="field"><label>开始日期</label><input type="date" id="startDate"></div>
    <div class="field"><label>天数</label><input type="number" id="dayCount" value="30" min="7" max="90" style="width:80px"></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="back">← 发货计划</button>
    <button class="btn btn-line" id="addRow">＋ 添加行</button>
    <button class="btn btn-line" id="loadDb">从物料库导入</button>
    <button class="btn btn-line" id="exportCsv">导出 CSV</button>
    <button class="btn btn-line" id="exportImg">导出图片</button>
    <button class="btn btn-primary" id="save">保存</button>
  </div>

  <div class="card">
    <h2>计划明细 <span class="tag" id="rowCount">0 行</span></h2>
    <div class="table-wrap" id="tableWrap">
      <table class="sch-table" id="schTable"></table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 添加行弹窗 -->
<div class="modal" id="rowModal">
  <div class="modal-box">
    <h3>添加计划行</h3>
    <div class="modal-row">
      <input id="mCode" placeholder="物料编码">
      <input id="mName" placeholder="物料描述">
    </div>
    <div class="modal-row">
      <input id="mSpec" placeholder="规格">
      <input id="mStock" placeholder="总库存" type="number">
    </div>
    <div class="modal-row">
      <input id="mSap" placeholder="SAP需求" type="number">
      <input id="mInStock" placeholder="在库" type="number">
    </div>
    <div class="modal-row">
      <input id="mFollowUp" placeholder="后序">
      <input id="mReserve" placeholder="备货" type="number">
    </div>
    <div style="font-size:12px;color:var(--muted)">从物料库搜索：</div>
    <input id="mSearch" placeholder="输入型号/编码/客户搜索物料库" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;">
    <div class="modal-ac" id="modalAc"></div>
    <div class="modal-btns">
      <button class="btn btn-line" id="cancelRow">取消</button>
      <button class="btn btn-primary" id="confirmRow">确定</button>
    </div>
  </div>
</div>

<script>
const LS_DB="shipping_db_v1", LS_SCH="shipping_schedule_v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

let rows=[]; // 每行数据
let days=[]; // 日期数组
let startDay="", dayCnt=30;

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function formatDate(d){return (d.getMonth()+1)+"月"+d.getDate()+"日";}
function weekNum(d){const oneJan=new Date(d.getFullYear(),0,1);const dayOfYear=Math.floor((d-oneJan)/86400000)+1;return Math.ceil(dayOfYear/7);}
function loadDB(){try{return JSON.parse(localStorage.getItem(LS_DB))||[];}catch(e){return [];}}
function loadSch(){try{const s=JSON.parse(localStorage.getItem(LS_SCH))||{};rows=s.rows||[];startDay=s.startDay||todayStr();dayCnt=s.dayCnt||30;}catch(e){rows=[];startDay=todayStr();dayCnt=30;}}
function saveSch(){localStorage.setItem(LS_SCH,JSON.stringify({rows,startDay,dayCnt,updatedAt:new Date().toLocaleString("zh-CN")})); if(window.CloudSync) CloudSync.autoPush(LS_SCH);}

function buildDays(){
  days=[];
  const d=new Date(startDay); if(isNaN(d.getTime())){startDay=todayStr(); d.setTime(new Date().getTime());}
  for(let i=0;i<dayCnt;i++){
    const cur=new Date(d); cur.setDate(d.getDate()+i);
    days.push({date:cur.toISOString().slice(0,10),label:formatDate(cur),week:weekNum(cur)});
  }
}

function renderHeader(){
  const thead=document.createElement("thead");
  // 第一层：左侧固定列标题 + 日期（按周分组）
  const tr1=document.createElement("tr");
  const fixedCols=[{cls:"col-code",txt:"物料编码"},{cls:"col-name",txt:"物料描述"},{cls:"col-spec",txt:"规格"},{cls:"col-num",txt:"总库存"},{cls:"col-num",txt:"SAP需求"},{cls:"col-num",txt:"在库"},{cls:"col-status",txt:"后序"},{cls:"col-num",txt:"备货"},{cls:"col-status",txt:"状态"}];
  fixedCols.forEach((c,idx)=>{
    const th=document.createElement("th"); th.className=(idx===0?"fixed head ":"fixed head ")+c.cls; th.textContent=c.txt; tr1.appendChild(th);
  });
  // 按周合并日期
  let lastWeek=null, span=0, firstTh=null;
  days.forEach((day,i)=>{
    if(day.week!==lastWeek){
      if(firstTh){firstTh.colSpan=span; firstTh.textContent=day.week+"周";}
      const th=document.createElement("th"); th.className="col-day"; th.textContent="..."; tr1.appendChild(th);
      firstTh=th; span=1; lastWeek=day.week;
    }else{span++;}
  });
  if(firstTh){firstTh.colSpan=span; firstTh.textContent=lastWeek+"周";}
  thead.appendChild(tr1);

  // 第二层：每日
  const tr2=document.createElement("tr");
  fixedCols.forEach((c,idx)=>{
    const th=document.createElement("th"); th.className=(idx===0?"fixed head ":"fixed head ")+c.cls; th.textContent=""; tr2.appendChild(th);
  });
  days.forEach(day=>{
    const th=document.createElement("th"); th.className="col-day"; th.textContent=day.label; th.title=day.date; tr2.appendChild(th);
  });
  thead.appendChild(tr2);
  return thead;
}

function statusClass(status){
  if(status==="urgent")return "status-urgent";
  if(status==="warn")return "status-warn";
  if(status==="ok")return "status-ok";
  return "status-normal";
}
function nextStatus(status){
  if(status==="normal")return "warn";
  if(status==="warn")return "urgent";
  if(status==="urgent")return "ok";
  return "normal";
}
function statusText(status){
  if(status==="urgent")return "缺料";
  if(status==="warn")return "预警";
  if(status==="ok")return "充足";
  return "正常";
}

function renderBody(){
  const tbody=document.createElement("tbody");
  rows.forEach((row,ri)=>{
    const tr=document.createElement("tr");
    // 固定列
    const fixedKeys=["code","name","spec","stock","sap","inStock","followUp","reserve"];
    const fixedCls=["col-code","col-name","col-spec","col-num","col-num","col-num","col-status","col-num"];
    fixedKeys.forEach((k,i)=>{
      const td=document.createElement("td"); td.className="fixed "+fixedCls[i];
      const inp=document.createElement("input"); inp.className="cell-input"; inp.value=row[k]||""; inp.dataset.r=ri; inp.dataset.k=k;
      inp.addEventListener("change",e=>{row[k]=e.target.value; saveSch();});
      td.appendChild(inp); tr.appendChild(td);
    });
    // 状态列（整行状态）
    const tdSt=document.createElement("td"); tdSt.className="fixed col-status day-cell "+statusClass(row.status);
    tdSt.textContent=statusText(row.status); tdSt.dataset.r=ri; tdSt.dataset.day="_status";
    tdSt.addEventListener("click",()=>{row.status=nextStatus(row.status); tdSt.className="fixed col-status day-cell "+statusClass(row.status); tdSt.textContent=statusText(row.status); saveSch();});
    tr.appendChild(tdSt);
    // 日期列
    days.forEach(day=>{
      const cell=(row.days&&row.days[day.date])||{qty:"",status:"normal"};
      const td=document.createElement("td"); td.className="col-day day-cell "+statusClass(cell.status);
      const inp=document.createElement("input"); inp.className="cell-input"; inp.value=cell.qty||""; inp.dataset.r=ri; inp.dataset.date=day.date;
      inp.addEventListener("change",e=>{
        if(!row.days)row.days={};
        row.days[day.date]={qty:e.target.value,status:cell.status};
        saveSch();
      });
      td.appendChild(inp);
      td.addEventListener("click",e=>{if(e.target.tagName!=="INPUT"){toggleStatus(ri,day.date,td,inp);}});
      tr.appendChild(td);
    });
    // 删除
    const tdDel=document.createElement("td"); tdDel.className="col-day"; tdDel.style.position="sticky"; tdDel.style.right="0"; tdDel.style.zIndex="1"; tdDel.style.background="#fff";
    const del=document.createElement("button"); del.className="del-x"; del.textContent="✕"; del.title="删除";
    del.onclick=()=>{rows.splice(ri,1); render(); saveSch();};
    tdDel.appendChild(del); tr.appendChild(tdDel);
    tbody.appendChild(tr);
  });
  $("rowCount").textContent=rows.length+" 行";
  return tbody;
}

function toggleStatus(ri,date,td,inp){
  if(!rows[ri].days)rows[ri].days={};
  const cell=rows[ri].days[date]||{qty:"",status:"normal"};
  cell.status=nextStatus(cell.status);
  rows[ri].days[date]=cell;
  td.className="col-day day-cell "+statusClass(cell.status);
  saveSch();
}

function render(){
  buildDays();
  const tbl=$("schTable"); tbl.innerHTML="";
  tbl.appendChild(renderHeader());
  tbl.appendChild(renderBody());
}

// 弹窗
function openModal(){$("rowModal").classList.add("show"); $("mSearch").focus();}
function closeModal(){$("rowModal").classList.remove("show"); ["mCode","mName","mSpec","mStock","mSap","mInStock","mFollowUp","mReserve","mSearch"].forEach(id=>$(id).value=""); $("modalAc").innerHTML="";}
function confirmRow(){
  const r={
    code:$("mCode").value.trim(),name:$("mName").value.trim(),spec:$("mSpec").value.trim(),
    stock:$("mStock").value.trim(),sap:$("mSap").value.trim(),inStock:$("mInStock").value.trim(),
    followUp:$("mFollowUp").value.trim(),reserve:$("mReserve").value.trim(),
    status:"normal",days:{}
  };
  if(!r.code && !r.name){toast("请至少填写物料编码或描述"); return;}
  rows.push(r); render(); saveSch(); closeModal(); toast("已添加");
}

// 物料库搜索
$("mSearch").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase(); const box=$("modalAc"); box.innerHTML="";
  if(!q)return;
  const DB=loadDB();
  const list=DB.filter(r=>(r.model||"").toLowerCase().includes(q)||(r.code||"").toLowerCase().includes(q)||(r.customer||"").toLowerCase().includes(q)).slice(0,10);
  list.forEach(r=>{
    const div=document.createElement("div"); div.className="modal-ac-item";
    div.innerHTML=`<b>${esc(r.code||r.model||"-")}</b> ${esc(r.model||"")} <span style="color:var(--muted)">${esc(r.customer||"")}</span>`;
    div.onclick=()=>{
      $("mCode").value=r.code||""; $("mName").value=r.model||""; $("mSpec").value=r.unit?r.unit+"kg/件":"";
      $("mStock").value=""; $("mSap").value=""; $("mInStock").value=""; $("mFollowUp").value=r.customer||""; $("mReserve").value="";
      box.innerHTML="";
    };
    box.appendChild(div);
  });
});

function toast(msg){const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);}

// 导出CSV
function exportCsv(){
  if(!rows.length){toast("暂无数据"); return;}
  const heads=["物料编码","物料描述","规格","总库存","SAP需求","在库","后序","备货","状态"].concat(days.map(d=>d.label));
  const lines=[heads.join(",")];
  rows.forEach(r=>{
    const base=[r.code,r.name,r.spec,r.stock,r.sap,r.inStock,r.followUp,r.reserve,statusText(r.status)];
    const dayVals=days.map(d=>{const c=(r.days&&r.days[d.date])||{}; return c.qty||"";});
    lines.push(base.concat(dayVals).map(v=>{v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="排产计划表_"+startDay+".csv"; a.click();
}

// 事件
$("startDate").addEventListener("change",e=>{startDay=e.target.value; render(); saveSch();});
$("dayCount").addEventListener("change",e=>{dayCnt=Math.max(7,Math.min(90,parseInt(e.target.value)||30)); render(); saveSch();});
$("addRow").onclick=openModal;
$("cancelRow").onclick=closeModal;
$("confirmRow").onclick=confirmRow;
$("save").onclick=()=>{saveSch(); toast("已保存");};
$("back").onclick=()=>location.href="发货计划系统.html";
$("loadDb").onclick=()=>{
  const DB=loadDB();
  if(!DB.length){toast("物料库为空"); return;}
  DB.forEach(r=>{
    if(!rows.find(x=>x.code===r.code && x.name===r.model)){
      rows.push({code:r.code||"",name:r.model||"",spec:(r.unit?r.unit+"kg/件":""),stock:"",sap:"",inStock:"",followUp:r.customer||"",reserve:"",status:"normal",days:{}});
    }
  });
  render(); saveSch(); toast("已导入 "+DB.length+" 条物料");
};
$("exportCsv").onclick=exportCsv;
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector('script[src="'+src+'"]')){res();return;} const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("加载失败")); document.head.appendChild(s); }); }
$("exportImg").onclick=async()=>{
  if(!rows.length){toast("暂无数据"); return;}
  toast("正在准备导出…");
  try{
    if(!window.html2canvas){ await loadScript("html2canvas.min.js"); }
    const canvas=await html2canvas($("tableWrap"),{scale:1.5,backgroundColor:"#fff",useCORS:true});
    const a=document.createElement("a"); a.href=canvas.toDataURL("image/png"); a.download="排产计划表_"+startDay+".png"; a.click();
    toast("图片已导出");
  }catch(e){toast("导出失败："+e.message);}
};

// 启动
loadSch();
$("startDate").value=startDay; $("dayCount").value=dayCnt;
render();

// ===================== 云端同步 =====================
if(window.CloudSync){
  CloudSync.init();
  const CLOUD_KEYS=[LS_SCH, LS_DB];
  const nav=document.querySelector('.nav');
  const pill=document.createElement('span'); pill.id='cloudPill'; pill.className='cloud-pill';
  const btn=document.createElement('button'); btn.id='cloudSyncBtn'; btn.className='btn btn-ghost'; btn.textContent='☁ 拉取最新';
  if(nav){ nav.appendChild(pill); nav.appendChild(btn); CloudSync.bindStatus(pill);
    btn.onclick=()=>CloudSync.pullAll(CLOUD_KEYS, ()=>{ loadSch(); render(); }); }
  if(CloudSync.ready()){
    CloudSync.pullAll(CLOUD_KEYS, ()=>{ loadSch(); render(); }).then(()=>{
      CLOUD_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } });
    });
    CloudSync.startAutoPull(CLOUD_KEYS, ()=>{ loadSch(); render(); });
  } else { CloudSync.setStatus('未配置云端','off'); }
}
</script>
</body>
