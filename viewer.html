<style>
  :root{
    --blue:#2563eb; --blue-d:#1d4ed8;
    --bg:#f6f8fa; --card:#fff; --line:#d0d7de;
    --txt:#1f2328; --muted:#4b5563; --muted-2:#94a3b8;

  table.dt tr.sum td{background:#eef2ff;font-weight:700;}
  table.dt input.row-sel{width:15px;height:15px;cursor:pointer;}
  /* 可编辑的「客户吨位」 */
  table.dt input.custton-in{
    width:100%;min-width:62px;box-sizing:border-box;
    border:1px solid transparent;background:transparent;
    font:inherit;color:inherit;text-align:right;
    font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:4px;
  }
  table.dt input.custton-in:hover{border-color:#c7d2fe;background:#fff;}
  table.dt input.custton-in:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.12);}
  table.dt input.custton-in.edited{border-color:#f59e0b;background:#fffbeb;font-weight:700;color:#b45309;}
  /* 打印时不显示输入框边框，只出数值 */
  @media print{ table.dt input.custton-in{border:none;background:transparent;padding:0;} }
  .empty{background:#fff;border:1px dashed var(--line);padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;}
  .empty b{color:var(--blue);}

    body::before{display:none;}
    .wrap{max-width:none;padding:0;}
    header.top,.toolbar,.rec-head .rec-acts,.dt-acts,.rec-sel{display:none!important;}

    .rec{border:none;page-break-inside:avoid;}
    table.dt th{background:#2563eb!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  /* 按发货日期分组的颜色分区 */
  .cat-sec{margin-bottom:4px;}
  .cat-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;
    padding:9px 14px;margin:16px 0 10px;border-radius:6px;color:#fff;cursor:pointer;user-select:none;
    box-shadow:0 2px 10px rgba(0,0,0,.10);letter-spacing:.5px;}
  .cat-head .cat-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.92);flex-shrink:0;}

  .cat-head .cat-selall{margin-left:auto;}
  .cat-head .cat-selall,.cat-head .cat-fold{
    font:inherit;font-size:12px;font-weight:800;color:#fff;letter-spacing:.3px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);
    border-radius:6px;padding:3px 11px;cursor:pointer;line-height:1.5;}
  .cat-head .cat-selall:hover,.cat-head .cat-fold:hover{background:rgba(255,255,255,.34);}
  .cat-body{padding-top:2px;}
  .cat-sec.collapsed .cat-body{display:none;}
  .cat-past .cat-head{background:linear-gradient(90deg,#b45309,#d97706);}      /* 今天之前：琥珀 */
  .cat-today .cat-head{background:linear-gradient(90deg,#047857,#059669);}     /* 今天：绿 */
  .cat-tomorrow .cat-head{background:linear-gradient(90deg,#1d4ed8,#2563eb);}  /* 明天：蓝 */
  .cat-future .cat-head{background:linear-gradient(90deg,#6d28d9,#7c3aed);}    /* 明天之后：紫 */
  .cat-other .cat-head{background:linear-gradient(90deg,#475569,#64748b);}     /* 其它：灰 */
  .cat-past .rec{border-left:4px solid #d97706;}
  .cat-today .rec{border-left:4px solid #059669;}
  .cat-tomorrow .rec{border-left:4px solid #2563eb;}
  .cat-future .rec{border-left:4px solid #7c3aed;}
  .cat-other .rec{border-left:4px solid #94a3b8;}
  .cat-tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;line-height:1.6;}
  .cat-tag.past{background:#d97706;}
  .cat-tag.today{background:#059669;}
  .cat-tag.tomorrow{background:#2563eb;}
  .cat-tag.future{background:#7c3aed;}
  .cat-tag.other{background:#94a3b8;}
</style>

<script>
// ===================== 配置 =====================
const KEY = "shipping_plans_v1";           // 与管理端发布记录键一致
const KEY_CT = "shipping_custton_v1";      // 客户吨位手动修改的本地备份（防云端旧数据覆盖）
const $ = (id) => document.getElementById(id);
let RECORDS = [];

const pad = (s) => { s = String(s == null ? "" : s).trim(); return s === "" ? "/" : s; };
// HTML 属性转义（客户名可能含引号 / 尖括号）
const escAttr = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ===================== 按发货日期分组（今天之前 / 今天 / 明天 / 明天之后）=====================
function ymdStr(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
const TODAY = ymdStr(new Date());
const _tmr = new Date(); _tmr.setDate(_tmr.getDate()+1);
const TOMORROW = ymdStr(_tmr);
function classify(dateStr){
  dateStr = String(dateStr == null ? "" : dateStr).trim();
  if (!dateStr) return "other";
  if (dateStr < TODAY) return "past";
  if (dateStr === TODAY) return "today";
  if (dateStr === TOMORROW) return "tomorrow";
  return "future";
}
const CAT_LABEL = { past:"今天之前", today:"今天", tomorrow:"明天", future:"明天之后", other:"其它" };

// 取一份计划的「真实发货日期」：优先用明细行里的发货日期（第一行有值即采用），没有再退回计划顶部日期
function recShipDate(rec){
  const rows = rec.rows || [];
  for (const r of rows){ if (r && r.shipdate && String(r.shipdate).trim()) return String(r.shipdate).trim(); }
  return rec.date || "";
}


// ===================== 初始化 =====================
function init(){
  if (window.CloudSync) CloudSync.init();
  load();
  setInterval(load, 30000);                // 每 30 秒自动拉取最新
  $("refresh").onclick = load;
  $("selAll").onchange = (e) => {
    document.querySelectorAll(".rec-sel").forEach(c => c.checked = e.target.checked);
    updateSel();
  };
  $("batchExcel").onclick = () => batchDownload("excel");
  $("batchCsv").onclick   = () => batchDownload("csv");
  $("batchPrint").onclick = () => batchPrint();
}

// ===================== 拉取云端数据 =====================
async function load(){
  $("status").textContent = "正在拉取云端数据…";
  let list = null;
  if (window.CloudSync && CloudSync.ready()){
    try { list = await CloudSync.pull(KEY); } catch(e){ list = null; }
  }
  if (!Array.isArray(list)){
    // 本地兜底（同一浏览器曾打开过管理端）
    try { list = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){}
  }
  RECORDS = Array.isArray(list) ? list : [];
  restoreCustTon();                        // 用本地备份补齐客户吨位修改（页面每 30 秒自动刷新，防止改动被冲掉）
  render();
  const t = new Date().toLocaleTimeString("zh-CN");
  $("status").textContent = `已连接云端 · 共 ${RECORDS.length} 个计划 · 更新于 ${t}`;
}

// ===================== 渲染列表（按发货日期分组 + 颜色分区）=====================
function render(){
  const box = $("list");
  box.innerHTML = "";
  $("empty").style.display = RECORDS.length ? "none" : "block";
  if (!RECORDS.length) return;
  // collapsed=true 的分组默认折叠（今天之前 / 明天之后）
  const groups = [
    { key:"past",     label:"今天之前发货计划", collapsed:true },
    { key:"today",    label:"今天发货计划",     collapsed:false },
    { key:"tomorrow", label:"明天发货计划",     collapsed:false },
    { key:"future",   label:"明天之后发货计划", collapsed:true },
    { key:"other",    label:"其它",             collapsed:false }
  ];
  const buckets = { past:[], today:[], tomorrow:[], future:[], other:[] };
  RECORDS.forEach(rec => buckets[classify(recShipDate(rec))].push(rec));
  groups.forEach(g => {
    const arr = buckets[g.key];
    if (!arr.length) return;
    const sec = document.createElement("div");
    sec.className = "cat-sec cat-" + g.key + (g.collapsed ? " collapsed" : "");
    sec.innerHTML = `<div class="cat-head">
        <span class="cat-dot"></span>
        <span class="cat-title">${g.label}</span><b>(${arr.length})</b>
        <button type="button" class="cat-selall" title="全选 / 取消全选本区域计划">全选</button>
        <button type="button" class="cat-fold" title="展开 / 折叠本区域">${g.collapsed ? "▸ 展开" : "▾ 折叠"}</button>
      </div>
      <div class="cat-body"></div>`;
    const body = sec.querySelector(".cat-body");
    arr.forEach(rec => body.appendChild(card(rec)));

    // 一键勾选本区域（已全选则取消全选，否则全部勾上）
    sec.querySelector(".cat-selall").onclick = (e) => {
      e.stopPropagation();
      const boxes = [...sec.querySelectorAll(".rec-sel")];
      const allChecked = boxes.length > 0 && boxes.every(b => b.checked);
      boxes.forEach(b => { b.checked = !allChecked; });
      updateSel();
    };
    // 折叠 / 展开（标题条与按钮都可触发，按钮自带 stopPropagation）
    const toggleFold = () => {
      sec.classList.toggle("collapsed");
      sec.querySelector(".cat-fold").textContent = sec.classList.contains("collapsed") ? "▸ 展开" : "▾ 折叠";
    };
    sec.querySelector(".cat-fold").onclick = (e) => { e.stopPropagation(); toggleFold(); };
    sec.querySelector(".cat-head").addEventListener("click", (e) => {
      if (e.target.closest(".cat-selall") || e.target.closest(".cat-fold")) return;
      toggleFold();
    });

    box.appendChild(sec);
  });
  updateSel();
}

function card(rec){
  const div = document.createElement("div");
  const cat = classify(recShipDate(rec));
  div.className = "rec cat-" + cat;
  const rows = rec.rows || [];
  const tonByCust = {};
  rows.forEach(r => { const c = pad(r.customer); tonByCust[c] = (tonByCust[c] || 0) + (parseFloat(r.ton) || 0) + (parseFloat(r.cwt) || 0); });

  div.innerHTML = `
    <div class="rec-head">
      <input type="checkbox" class="rec-sel" data-id="${rec.id}">
      <div class="rec-info">
        <b>${pad(rec.no)}</b>
        <div class="meta">
          <span class="cat-tag ${cat}">${CAT_LABEL[cat]}</span>
          <span>发货日期 ${pad(recShipDate(rec))}</span>
          <span>${rows.length} 行</span>
          <span>数量 ${pad(rec.sumQty)}</span>
          <span>吨位 ${pad(rec.sumTon)}</span>
          ${rec.sumSubTon ? `<span data-subton>客户吨位 ${pad(rec.sumSubTon)}</span>` : `<span data-subton style="display:none">客户吨位 ${pad(rec.sumSubTon)}</span>`}
          <span>箱数 ${pad(rec.sumBox)}</span>
          <span class="muted">发布 ${pad(rec.publishedAt)}</span>
        </div>
      </div>
      <div class="rec-acts">
        <button class="btn sm" data-act="toggle">查看明细</button>
        <button class="btn sm" data-act="excel">Excel</button>
        <button class="btn sm" data-act="csv">CSV</button>
        <button class="btn sm" data-act="print">打印</button>
      </div>
    </div>
    <div class="rec-detail" style="display:none"></div>`;

  div.querySelector(".rec-sel").onchange = updateSel;
  div.querySelector('[data-act="toggle"]').onclick = () => {
    const d = div.querySelector(".rec-detail");
    if (d.style.display === "none"){ d.innerHTML = detailTable(rec, tonByCust); d.style.display = "block"; bindDetail(d, rec); }
    else d.style.display = "none";
  };
  div.querySelector('[data-act="excel"]').onclick = () => downloadOne(rec, "excel");
  div.querySelector('[data-act="csv"]').onclick   = () => downloadOne(rec, "csv");
  div.querySelector('[data-act="print"]').onclick = () => printRec(rec);
  return div;
}

// ===================== 客户吨位：可手动修改（带覆盖值）=====================
// 覆盖值存在 rec.custTon = { "客户|发货日期": 数值 }
function custTonKey(r){ return pad(r.customer) + "|" + pad(r.shipdate); }
function hasOverride(rec, key){
  const ov = rec && rec.custTon;
  return !!(ov && ov[key] !== undefined && ov[key] !== null && String(ov[key]).trim() !== "");
}
// 取某一行的客户吨位：有手动覆盖值用覆盖值，否则用自动合计值
function custTonVal(rec, r, tonByKey){
  const key = custTonKey(r);
  if (hasOverride(rec, key)) return parseFloat(rec.custTon[key]) || 0;
  return tonByKey[key] || 0;
}

function detailTable(rec, tonByCust){
  const rows = rec.rows || [];
  // 先用「rec.rows 原始数据」算 tonByKey（key 形如 "客户|发货日期"），与下方构建的 raw 数组所用字段完全一致
  const tonByKey = {};
  rows.forEach(r => { const key = pad(r.customer) + "|" + pad(r.shipdate); tonByKey[key] = (tonByKey[key] || 0) + (parseFloat(r.ton) || 0) + (parseFloat(r.cwt) || 0); });

  // 构建行数据（不做单元格合并，每行都完整显示客户 / 时效要求 / 客户吨位）
  const numCols = [4, 6, 7, 9];            // 发货数量 / 箱重T / 产品重量T / 箱数
  let body = rows.map((r, i) => {
    const key = custTonKey(r);
    const val = custTonVal(rec, r, tonByKey).toFixed(1);
    const ovd = hasOverride(rec, key) ? " edited" : "";
    const cells = [
      `<input type="checkbox" class="row-sel" data-id="${rec.id}-${i}">`, // 0
      pad(r.shipdate), pad(r.customer), pad(r.model), pad(r.qty), pad(r.shippt), pad(r.cwt), pad(r.ton),
      pad(r.delivery), pad(r.box), pad(r.remark),
      `<input type="text" class="custton-in${ovd}" value="${val}" data-key="${escAttr(key)}" data-old="${val}" inputmode="decimal">`,
      pad(r.logistics), pad(r.code)
    ];
    const tds = cells.map((c, ci) => numCols.includes(ci) ? `<td class="num">${c}</td>` : `<td>${c}</td>`).join("");
    return `<tr>${tds}</tr>`;
  }).join("");

  const sumQ = rows.reduce((a, r) => a + (parseFloat(r.qty) || 0), 0);
  const sumT = rows.reduce((a, r) => a + (parseFloat(r.ton) || 0), 0);
  const sumB = rows.reduce((a, r) => a + (parseFloat(r.box) || 0), 0);
  const sumCwt = rows.reduce((a, r) => a + (parseFloat(r.cwt) || 0), 0);
  // 合计按 key 去重：同一「客户+发货日期」只算一次
  const finalByKey = {};
  rows.forEach(r => { const k = custTonKey(r); if (finalByKey[k] === undefined) finalByKey[k] = custTonVal(rec, r, tonByKey); });
  const sumCustT = Object.values(finalByKey).reduce((a, v) => a + v, 0);
  body += `<tr class="sum">
      <td></td><td colspan="3">合计</td>
      <td class="num">${sumQ}</td><td></td><td class="num">${sumCwt.toFixed(1)}</td><td class="num">${sumT.toFixed(1)}</td>
      <td></td><td class="num">${sumB}</td><td></td><td class="num" data-act="sumCustT">${sumCustT.toFixed(1)}</td><td></td><td></td>
    </tr>`;

  return `
    <div class="dt-acts">
      <button class="btn sm" data-act="excelRows">下载勾选行 Excel</button>
      <button class="btn sm" data-act="csvRows">下载勾选行 CSV</button>
      <button class="btn sm" data-act="printRows">打印勾选行</button>
      <span class="sub" data-act="rowinfo"></span>
      <span class="sub" data-act="custtonTip" style="color:#b45309;font-weight:700"></span>
      <span class="sub" style="font-size:11px;color:#64748b">（「客户吨位」可直接点开修改，回车确认；右键可撤回改动）</span>
    </div>
    <table class="dt"><thead><tr>
      <th></th><th>发货日期</th><th>送达方</th><th>型号</th><th>发货数量</th><th>发货点</th><th>箱重T</th><th>产品重量T</th>
      <th>交货单</th><th>箱数</th><th>时效要求</th><th>客户吨位</th><th>物流</th><th>物料编码</th>
    </tr></thead><tbody>${body}</tbody></table>`;
}

function bindDetail(d, rec){
  const rows = rec.rows || [];
  const update = () => {
    const n = d.querySelectorAll(".row-sel:checked").length;
    const inf = d.querySelector('[data-act="rowinfo"]');
    if (inf) inf.textContent = `已选 ${n} 行`;
  };
  const pick = () => [...d.querySelectorAll(".row-sel:checked")].map(c => rows[+c.dataset.id.split("-")[1]]);
  d.querySelectorAll(".row-sel").forEach(c => c.onchange = update);

  // ---- 客户吨位：可编辑，改完需确认 ----
  d.querySelectorAll("input.custton-in").forEach(inp => {
    const commit = () => {
      const key = inp.dataset.key;
      const old = inp.dataset.old;
      let nv = String(inp.value).trim();
      if (nv === old) return;                       // 没改，忽略
      if (nv !== "" && !/^-?\d+(\.\d+)?$/.test(nv)){ // 非法输入
        alert("客户吨位只能填数字（可带小数点），请重新填写。");
        inp.value = old; return;
      }
      const cust = key.split("|")[0];
      const oldTxt = old === "" ? "（空）" : old;
      const newTxt = nv === "" ? "（清空，恢复自动合计）" : nv;
      const ok = confirm(
        `确认修改客户吨位？\n\n` +
        `客户：${cust}\n` +
        `原值：${oldTxt}\n` +
        `新值：${newTxt}\n\n` +
        `说明：该客户同一发货日期的所有行都会一起更新，并同步到导出与打印。`
      );
      if (!ok){ inp.value = old; return; }

      if (!rec.custTon) rec.custTon = {};
      if (nv === "") delete rec.custTon[key];        // 清空 = 恢复自动合计
      else rec.custTon[key] = parseFloat(nv);

      saveCustTon(rec);                              // 持久化（本地 + 云端）
      applyCustTon(d, rec);                          // 同组所有行同步 + 刷新合计
      const tip = d.querySelector('[data-act="custtonTip"]');
      if (tip) tip.textContent = "已保存 ✓";
      setTimeout(() => { if (tip) tip.textContent = ""; }, 2500);
    };
    inp.onchange = commit;
    inp.onkeydown = (e) => {
      if (e.key === "Enter"){ e.preventDefault(); inp.blur(); }
      if (e.key === "Escape"){ inp.value = inp.dataset.old; inp.blur(); }
    };
    // 撤回该客户吨位的手动修改
    inp.oncontextmenu = (e) => {
      const key = inp.dataset.key;
      if (!hasOverride(rec, key)) return;
      e.preventDefault();
      if (confirm(`撤回【${key.split("|")[0]}】的客户吨位修改，恢复为系统自动合计？`)){
        delete rec.custTon[key];
        saveCustTon(rec); applyCustTon(d, rec);
      }
    };
  });

  d.querySelector('[data-act="excelRows"]').onclick = () => { const s = pick(); if (!s.length){ alert("请先勾选要下载的行"); return; } exportExcel(s, rec.no + "_勾选行", recShipDate(rec), rec); };
  d.querySelector('[data-act="csvRows"]').onclick   = () => { const s = pick(); if (!s.length){ alert("请先勾选要下载的行"); return; } exportCsv(s, rec.no + "_勾选行", recShipDate(rec), rec); };
  d.querySelector('[data-act="printRows"]').onclick = () => { const s = pick(); if (!s.length){ alert("请先勾选要下载的行"); return; } printRows(s, rec.no + "（勾选行）", recShipDate(rec), rec); };
  update();
}

// 把 rec.custTon 的最新值刷回表格（同 key 的所有行 + 合计行）
function applyCustTon(d, rec){
  const rows = rec.rows || [];
  const tonByKey = {};
  rows.forEach(r => { const k = custTonKey(r); tonByKey[k] = (tonByKey[k] || 0) + (parseFloat(r.ton) || 0) + (parseFloat(r.cwt) || 0); });
  const finalByKey = {};
  rows.forEach(r => { const k = custTonKey(r); if (finalByKey[k] === undefined) finalByKey[k] = custTonVal(rec, r, tonByKey); });

  d.querySelectorAll("input.custton-in").forEach(inp => {
    const k = inp.dataset.key;
    const v = (finalByKey[k] || 0).toFixed(1);
    inp.value = v; inp.dataset.old = v;
    inp.classList.toggle("edited", hasOverride(rec, k));
  });
  const sumEl = d.querySelector('[data-act="sumCustT"]');
  if (sumEl) sumEl.textContent = Object.values(finalByKey).reduce((a, v) => a + v, 0).toFixed(1);

  // 卡片头部的「客户吨位」汇总也一起更新
  rec.sumSubTon = Object.values(finalByKey).reduce((a, v) => a + v, 0).toFixed(1);
  const headMeta = d.closest(".rec") && d.closest(".rec").querySelector(".meta [data-subton]");
  if (headMeta) headMeta.textContent = `客户吨位 ${pad(rec.sumSubTon)}`;
}

// 保存：本地 + 本地独立备份 + 云端
async function saveCustTon(rec){
  try { localStorage.setItem(KEY, JSON.stringify(RECORDS)); } catch(e){}
  // 单独备份一份覆盖表：页面每 30 秒会从云端重新拉取，若云端还没同步成功，用本地备份兜底
  try {
    const bak = {};
    RECORDS.forEach(r => {
      if (r && r.custTon && Object.keys(r.custTon).length) bak[r.id != null ? r.id : r.no] = r.custTon;
    });
    localStorage.setItem(KEY_CT, JSON.stringify(bak));
  } catch(e){}
  if (window.CloudSync && CloudSync.ready()){
    try { await CloudSync.push(KEY, RECORDS); } catch(e){}
  }
}

// 拉取数据后，用本地备份补齐 custTon（云端已有值则优先用云端的）
function restoreCustTon(){
  let bak = null;
  try { bak = JSON.parse(localStorage.getItem(KEY_CT) || "null"); } catch(e){}
  if (!bak || typeof bak !== "object") return;
  RECORDS.forEach(r => {
    if (!r) return;
    const id = r.id != null ? r.id : r.no;
    if (bak[id]) r.custTon = Object.assign({}, bak[id], r.custTon || {});
  });
}

// ===================== 渲染行（不合并单元格，每行完整显示）=====================
// numCols：需要右对齐 + 等宽数字的列号
function rowsToTbody(data, numCols){
  return data.map(row => {
    const tds = row.map((cell, ci) => numCols.includes(ci) ? `<td class="num">${cell}</td>` : `<td>${cell}</td>`).join("");
    return `<tr>${tds}</tr>`;
  }).join("");
}

// ===================== 导出 =====================
// rec 可选：传入后「客户吨位」优先取 rec.custTon 里的手动修改值
function matrix(rows, date, rec){
  const head = ["发货日期","送达方","型号","发货数量","发货点","箱重T","产品重量T","交货单","箱数","时效要求","客户吨位","物流","物料编码"];
  // 先把行数据（不含客户吨位列）按 rec.rows 算 tonByKey，key 为「客户|发货日期」与原始 r.ton/r.cwt 一致
  const tonByKey = {};
  rows.forEach(r => { const key = pad(r.customer) + "|" + pad(r.shipdate); tonByKey[key] = (tonByKey[key] || 0) + (parseFloat(r.ton) || 0) + (parseFloat(r.cwt) || 0); });
  // data 第 0 列是「发货日期」（用传入的 date 兜底），第 1 列是「客户」
  const data = rows.map(r => {
    const key = pad(r.customer) + "|" + pad(r.shipdate);
    return [pad(date || r.shipdate), pad(r.customer), pad(r.model), pad(r.qty), pad(r.shippt), pad(r.cwt), pad(r.ton),
      pad(r.delivery), pad(r.box), pad(r.remark),
      custTonVal(rec, r, tonByKey).toFixed(1), pad(r.logistics), pad(r.code)];
  });
  return {head, data};
}

function exportExcel(rows, name, date, rec){
  if (typeof XLSX === "undefined"){ alert("Excel 库未加载，请刷新页面"); return; }
  const {head, data} = matrix(rows, date, rec);
  const ws = XLSX.utils.aoa_to_sheet([head, ...data]);   // 不做单元格合并，每行完整
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, String(name).slice(0, 28));
  XLSX.writeFile(wb, `发货计划_${name}.xlsx`);
}

function exportCsv(rows, name, date, rec){
  const {head, data} = matrix(rows, date, rec);
  const csv = "﻿" + [head, ...data].map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `发货计划_${name}.csv`;
  a.click();
}

function downloadOne(rec, fmt){
  const rows = rec.rows || [];
  if (fmt === "excel") exportExcel(rows, rec.no, recShipDate(rec), rec); else exportCsv(rows, rec.no, recShipDate(rec), rec);
}

// 批量导出：把多个单合并成一张表（首个字段为「单号」，方便区分来源）
function batchMatrix(recs){
  const head = ["单号","发货日期","送达方","型号","发货数量","发货点","箱重T","产品重量T","交货单","箱数","时效要求","客户吨位","物流","物料编码"];
  // 逐单独立计算 tonByKey：不同单的同客户同日期不应互相加总，避免跨单泄漏
  const data = [];
  recs.forEach(rec => {
    const sd = pad(recShipDate(rec));
    const tonByKey = {};
    (rec.rows || []).forEach(x => { const key = pad(x.customer) + "|" + pad(x.shipdate); tonByKey[key] = (tonByKey[key] || 0) + (parseFloat(x.ton) || 0) + (parseFloat(x.cwt) || 0); });
    (rec.rows || []).forEach(r => {
      const key = pad(r.customer) + "|" + pad(r.shipdate);
      data.push([pad(rec.no), sd, pad(r.customer), pad(r.model), pad(r.qty), pad(r.shippt), pad(r.cwt), pad(r.ton),
        pad(r.delivery), pad(r.box), pad(r.remark), custTonVal(rec, r, tonByKey).toFixed(1), pad(r.logistics), pad(r.code)]);
    });
  });
  return {head, data};
}

function batchDownload(fmt){
  const ids = [...document.querySelectorAll(".rec-sel:checked")].map(c => c.dataset.id);
  const recs = RECORDS.filter(r => ids.includes(String(r.id)));
  if (!recs.length){ alert("请先勾选要下载的计划单（卡片左侧的方框）"); return; }

  const {head, data} = batchMatrix(recs);
  if (fmt === "excel"){
    if (typeof XLSX === "undefined"){ alert("Excel 库未加载，请刷新页面"); return; }
    const ws = XLSX.utils.aoa_to_sheet([head, ...data]);   // 不做单元格合并，每行完整
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "批量发货计划");
    XLSX.writeFile(wb, `发货计划_批量${recs.length}单.xlsx`);
  } else {
    const csv = "﻿" + [head, ...data].map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `发货计划_批量${recs.length}单.csv`;
    a.click();
  }
}

// ===================== 打印 =====================
function printRows(rows, title, date, rec){
  const {head, data} = matrix(rows, date, rec);
  const thead = "<tr>" + head.map(h => `<th>${h}</th>`).join("") + "</tr>";
  const tbody = rowsToTbody(data, [3, 5, 6, 8]);   // 不合并单元格
  const html = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
    <title>发货计划 ${pad(title)}</title>
    <style>
      body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-size:12px;color:#000;margin:18px;}
      h2{font-size:16px;margin:0 0 10px;}
      table{border-collapse:collapse;width:100%;}
      th,td{border:1px solid #000;padding:5px 7px;text-align:center;vertical-align:middle;}
      th{background:#2563eb;color:#fff;}
      td:nth-child(4),td:nth-child(6),td:nth-child(7),td:nth-child(9){text-align:right;}
    </style></head><body>
    <h2>发货计划 ${pad(title)}</h2>
    <table><thead>${thead}</thead><tbody>${tbody}</tbody></table>
    <script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script>
    </body></html>`;
  const w = window.open("", "_blank");
  w.document.write(html);
  w.document.close();
  w.focus();
}

function printRec(rec){ printRows(rec.rows || [], rec.no, recShipDate(rec), rec); }

// ===================== 选择状态 =====================
function updateSel(){
  const n = document.querySelectorAll(".rec-sel:checked").length;
  $("selInfo").textContent = n ? `已选 ${n} 个单` : "";
  const all = $("selAll");
  const boxes = document.querySelectorAll(".rec-sel");
  all.checked = boxes.length > 0 && n === boxes.length;
  all.indeterminate = n > 0 && n < boxes.length;
}

init();
