<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>物流进度大屏（门口 · 保密）</title>

<script src="supabase.min.js?v=lib"></script>

<script src="cloud-config.js?v=20260920a"></script>

<script src="cloud-sync.js?v=20261026a"></script>

<script src="scan-lib.js?v=20261030a"></script>

<style>

  /* ==========================================================================

     物流门口大屏 · 保密版（只读，摆在物流门口给现场远远地看）

     --------------------------------------------------------------------------

     【本页存在的唯一理由：保密】

       现场涉及保密，所以这一屏：

         · **一律不显示送达方名称**，只显示「送达方代码」；

         · **不带「物流」列**（哪家承运、走哪条线，不铺在门口）。

       ★ 硬规则：查不到代码就显示占位「未编代码」，**绝不回落到客户名** ——

         保密不能留后门（少显示一条信息，也不能多露一个字）。

       ★ 代码从哪来（三级，前一级优先）：

         ① 发布时已经刻进记录行的 custcode（最准，日后改物料库也不影响已发布的单）

         ② 物料库按「型号」匹配（同型号可能对应多个送达方时取第一个有代码的）

         ③ 物料库按「客户名」匹配（型号换了但客户没换时兜底）

       物料库（shipping_db_v1）本身在云端同步范围内，所以这一屏在任何一台机器上

       都能自己把代码查出来，不依赖这台机器有没有导过库。

     --------------------------------------------------------------------------

     【与内部看板（物流大屏.html）的关系】

       两屏共用同一份口径：「取哪些行 / 什么算完成 / 怎么排序」全部来自 scan-lib.js

       的 boardRows，配色、字号自适应、自动滚动也是同一套实现 —— 只是这一屏

       把「客户 / 送达方」换成「送达方代码」，并去掉了物流列。

       内部要看送达方全名的，用物流大屏.html（请勿摆在物流门口）。

     ========================================================================== */

  :root{

    --bg:#0a0e15;

    --panel:rgba(255,255,255,.032);

    --line:rgba(148,163,184,.16);

    --txt:#f2f6fc; --muted:#a9b8cf; --dim:#6d7d99;

    --cyan:#38c8d8; --green:#3ddc97; --amber:#ffb454; --red:#ff5d5d; --blue:#5b8def;

    --rows:14;

  }

  *{box-sizing:border-box;}

  html,body{margin:0;height:100%;}

  body{

    font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;

    color:var(--txt); font-variant-numeric:tabular-nums; overflow:hidden;

    background:

      radial-gradient(1100px 560px at 12% -10%, rgba(56,140,216,.10), transparent 60%),

      linear-gradient(180deg,#0a0e15 0%,#0d131d 46%,#0a0e15 100%);

    background-attachment:fixed;

  }

  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;

    background-image:linear-gradient(rgba(148,180,220,.03) 1px, transparent 1px),

                     linear-gradient(90deg, rgba(148,180,220,.03) 1px, transparent 1px);

    background-size:44px 44px;

    mask-image:radial-gradient(circle at 50% 16%, #000 0%, transparent 82%);

    -webkit-mask-image:radial-gradient(circle at 50% 16%, #000 0%, transparent 82%);}



  .wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:10px 20px 10px;}



  /* ============ 顶部 HUD ============ */

  .hud{

    /* ★ 一行到底（2026-09-19）：原来 flex-wrap:wrap，笔记本一缩放就掉成 3 行，

       白占掉两行表格高度。现在 nowrap + 各段尺寸都用 clamp(小, vw, 大)，

       窄屏自动缩、宽屏跟原来一样大。 */

    flex:0 0 auto;position:relative;display:flex;align-items:center;flex-wrap:nowrap;

    gap:clamp(6px,.72vw,15px);

    padding:5px clamp(9px,.9vw,18px);margin-bottom:8px;border-radius:14px;overflow:hidden;

    background:linear-gradient(100deg,rgba(56,200,216,.08),rgba(91,141,239,.05) 45%,rgba(255,255,255,.02));

    border:1px solid rgba(56,200,216,.22);

    box-shadow:0 12px 40px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);

    backdrop-filter:blur(16px);

  }

  .hud::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;

    background:linear-gradient(90deg,transparent,rgba(56,200,216,.7),transparent);}

  .hud::after{content:"";position:absolute;top:-60%;left:-10%;width:34%;height:220%;

    background:linear-gradient(90deg,transparent,rgba(56,200,216,.07),transparent);

    transform:rotate(18deg);animation:sweep 7s linear infinite;pointer-events:none;}

  @keyframes sweep{0%{left:-20%}100%{left:120%}}

  .logo{width:clamp(22px,1.9vw,32px);height:clamp(22px,1.9vw,32px);flex:0 0 auto;

    border-radius:clamp(6px,.55vw,9px);display:flex;align-items:center;justify-content:center;

    font-size:clamp(11px,.95vw,16px);background:linear-gradient(140deg,#38c8d8,#5b8def);color:#04101c;

    box-shadow:0 0 18px rgba(56,200,216,.35);}

  /* 标题块压成一行：原来标题下面还有一行灰色小字说明 —— 那些话页脚已经全说了，

     挤在头上只会多占一行（窄屏就更明显）。整句说明挪到 title，鼠标放上去还能看全。 */

  .tt{flex:0 1 auto;min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap;}

  .tt .t{font-size:clamp(12.5px,1vw,17px);font-weight:800;letter-spacing:.6px;white-space:nowrap;

    overflow:hidden;text-overflow:ellipsis;}

  .tt .tag{font-size:clamp(8.5px,.6vw,10.5px);font-weight:800;letter-spacing:.5px;color:#9fe8ff;

    padding:1px 5px;border-radius:5px;background:rgba(56,200,216,.14);border:1px solid rgba(56,200,216,.34);}



  /* 「保密」徽章：让现场一眼确认摆的是保密版那一屏（而不是内部看板） */

  .secbadge{display:inline-flex;flex:0 0 auto;align-items:center;gap:4px;padding:2px clamp(5px,.55vw,10px);border-radius:999px;

    font-size:clamp(8.5px,.64vw,11px);font-weight:800;letter-spacing:.5px;white-space:nowrap;

    background:rgba(61,220,151,.13);color:#a9f2d3;border:1px solid rgba(61,220,151,.34);}



  .kpis{display:flex;gap:clamp(4px,.45vw,9px);flex-wrap:nowrap;margin-left:2px;min-width:0;}

  .kpi{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;flex:0 0 auto;

    padding:2px clamp(6px,.6vw,12px);min-width:0;position:relative;overflow:hidden;}

  .kpi i{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);opacity:.85;}

  .kpi b{display:block;font-size:20px;font-weight:800;line-height:1.12;}

  .kpi span{display:block;font-size:clamp(8.5px,.6vw,10.5px);color:var(--muted);letter-spacing:.4px;white-space:nowrap;}

  .kpi.red i{background:var(--red);} .kpi.red b{color:var(--red);}

  .kpi.amber i{background:var(--amber);} .kpi.amber b{color:var(--amber);}

  .kpi.green i{background:var(--green);} .kpi.green b{color:var(--green);}



  .spacer{flex:1 1 auto;min-width:0;}

  .ctrl{display:flex;flex:0 0 auto;align-items:center;gap:6px;}

  .ctrl button{background:rgba(34,211,238,.13);border:1px solid rgba(34,211,238,.42);color:var(--txt);

    padding:3px clamp(6px,.7vw,12px);border-radius:8px;font-size:clamp(9.5px,.72vw,12.5px);font-weight:700;

    cursor:pointer;font-family:inherit;letter-spacing:.4px;white-space:nowrap;}

  .ctrl button:hover{background:rgba(34,211,238,.24);}

  /* 时间 / 日期 / 同步状态**摊在同一行**（原来竖着三行，等于白占两行高） */

  .clock{display:flex;flex:0 0 auto;align-items:baseline;gap:clamp(6px,.6vw,11px);white-space:nowrap;}

  .clock b{font-size:clamp(15px,1.42vw,23px);font-weight:800;letter-spacing:1px;line-height:1;}

  .clock span{font-size:clamp(9px,.62vw,11px);color:var(--dim);letter-spacing:.6px;}

  .sync{letter-spacing:.4px;}

  .sync.ok{color:var(--green);} .sync.warn{color:var(--amber);} .sync.err{color:var(--red);}



  /* ============ 主体表格 ============ */

  .box{flex:1 1 auto;min-height:0;position:relative;border-radius:16px;overflow:auto;

    border:1px solid var(--line);background:var(--panel);box-shadow:0 12px 40px rgba(0,0,0,.38);}

  table{width:100%;border-collapse:collapse;table-layout:fixed;}

  thead th{

    position:sticky;top:0;z-index:2;

    font-size:12.5px;color:var(--muted);font-weight:700;text-align:left;

    padding:9px 12px;letter-spacing:1px;background:rgba(9,14,26,.96);

    border-bottom:1px solid var(--line);white-space:nowrap;

  }

  tbody td{padding:var(--rowpad,8px) 12px;border-bottom:1px solid rgba(120,180,255,.09);

    font-size:var(--rowfs,17px);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}



  /* 序号列（2026-10-19 用户要求：门口大屏也加，与内部大屏同一套视觉）

     只做行锚点，不承载业务数据。**门口这一屏仍然只显代码、不显客户名** ——

     序号只是"第几行"，不含任何客户信息，不影响保密口径（test_dash_safe 的 customer 断言仍应全过）。


     ★ 胶囊高度必须 ≤ 同行文字自然高度（padding 只 1px、line-height 1.25）：

       这一屏有 fitCodeFont 的「一行不许高过 --perrow 配额」硬约束，

       序号胶囊一旦把行顶高，代码字号就再也放不大 —— 门口最关键的信息被这一列连累。


     ★ 行左色条（tr.stN td:first-child 的 inset 阴影）跟着这一格走 —— 本来就在最左格，

       序号列接管最左格后色条位置不变，老观感零变化（流体条那套测试里的 first-child 契约也不用动）。 */

  thead th.idx{text-align:right;padding-right:10px;letter-spacing:0;}

  tbody td.idx{padding-left:11px;padding-right:10px;text-align:right;

    font-variant-numeric:tabular-nums;}

  tbody td.idx .n{display:inline-block;min-width:1.75em;padding:1px 0;border-radius:6px;

    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;

    font-size:.82em;font-weight:800;line-height:1.25;text-align:center;

    color:var(--dim);background:rgba(148,163,184,.10);}

  /* 序号跟着行状态换色：一行一行扫下来，今天这些活儿各自走到哪一步就出来了 */

  tbody tr.st0 td.idx .n{color:#ff8f8f;background:rgba(255,93,93,.13);}

  tbody tr.st1 td.idx .n{color:#6fd8e6;background:rgba(56,200,216,.13);}

  tbody tr.st2 td.idx .n{color:#ffc978;background:rgba(255,180,84,.13);}

  tbody tr.st3 td.idx .n{color:#79e7b4;background:rgba(61,220,151,.13);}

  tbody tr.done td.idx .n{color:#8fe8c2;background:rgba(61,220,151,.09);}




  /* 每道工序一种颜色（左细条 + 极淡同色底），一眼分清走到哪一步：

     货待确认=红 · 货好=青 · 装货中=琥珀 · 已完成=绿（红只是标记，正文保持清晰） */

  tr.st0{background:linear-gradient(90deg,rgba(255,93,93,.075),rgba(255,93,93,.02) 55%,transparent);}

  tr.st0 td:first-child{box-shadow:inset 4px 0 0 var(--red);}

  tr.st1{background:linear-gradient(90deg,rgba(56,200,216,.07),rgba(56,200,216,.02) 55%,transparent);}

  tr.st1 td:first-child{box-shadow:inset 4px 0 0 var(--cyan);}

  tr.st2{background:linear-gradient(90deg,rgba(255,180,84,.07),rgba(255,180,84,.02) 55%,transparent);}

  tr.st2 td:first-child{box-shadow:inset 4px 0 0 var(--amber);}

  /* st3 = 工序已经走完、但车还没到（所以不算 done）：淡一档的绿 ——

     之前只有 st0/st1/st2/done 四档，st3 这一档漏了色条，整行看着像"没着色"。 */

  tr.st3{background:linear-gradient(90deg,rgba(61,220,151,.045),rgba(61,220,151,.015) 55%,transparent);}

  tr.st3 td:first-child{box-shadow:inset 4px 0 0 rgba(61,220,151,.5);}

  tr.done{background:linear-gradient(90deg,rgba(61,220,151,.07),transparent 62%);}

  tr.done td:first-child{box-shadow:inset 4px 0 0 var(--green);}

  tr.done .cust{color:#c9d6e8;}



  /* 送达方代码：这一屏最关键的信息，字号**专门放大**（整行的 1.5 倍，门口远远地看数字不会串行）。

     倍数走 --coder（由 fitCodeFont 按列宽实测定，塞不下会自动降一档，绝不让省略号把代码截断）；

     CSS 里这个 1.5 只是脚本没跑起来时的兜底值。 */

  /* ★ 2026-09-17 用户要求「再加大」：这一列的字号已经到了"能多大就多大"的算法上限，

     真正压着它的是**行高配额**（一行高过配额整屏就要滚）。所以这里把这一列白白占掉的高度

     全部让给字号 —— 等宽数字没有下伸部，行高贴到 1.0 也不会切到字；上下内边距同理，

     只剩 2px 做视觉留白。腾出来的高度全给 fitCodeFont 去放大字号。 */

  .cust{font-size:calc(var(--rowfs,17px) * var(--coder,1.5));line-height:1;

    font-weight:800;letter-spacing:1px;color:var(--txt);

    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;}

  .cust.miss{font-family:inherit;font-weight:700;letter-spacing:.3px;color:var(--dim);}

  /* 最后的保险（2026-09-17）：真遇到"缩到最小也放不下"的超长代码，宁可折成两行，

     也绝不让省略号吃掉一位 —— 门口把 10017388 看成 1001… 比不显示还糟。

     平时不开（折行会让行变高），只在 fitCodeFont 试完所有档位都塞不下时才加上 body.codewrap。 */

  body.codewrap .cust{white-space:normal;overflow-wrap:anywhere;letter-spacing:.5px;}

  /* 代码这一格的上下内边距单独收紧（其它列照旧保留 --rowpad 的呼吸感）：

     这一列永远是全行最高的，它的内边距就是"从字号嘴里抢走的行高"。

     ★ 2026-09-21 状态列删掉后代码是第 1 格；2026-10-19 加序号列后 → 第 2 格 */

  tbody td:nth-child(2){padding-top:2px;padding-bottom:2px;}

  /* 单号（2026-09-17 起从代码格里分出来，独占一列）：单号本身用等宽字体，

     后面跟的计划员姓名真名显示（★ 2026-09-23 老板要求恢复姓名，打码已删）——

     一眼分清哪段是单号、哪段是人名 */

  /* ★ 2026-09-23：单号必须完整（同内部屏）。改成 inline-flex，单号自己优先占位、

     字号由 fitNoFont 按实测降档；后面的名字放不下先缩字号（2026-09-24 恢复显示）。 */

  /* 容器不用 gap（gap 不参与收缩，计划员缩到 0 后间隙还占着）—— 间距交给 .pl */

  .no{display:inline-flex;align-items:baseline;max-width:100%;color:var(--muted);

    font-size:.72em;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;

    vertical-align:baseline;}

  /* 单号不收缩、优先占够空间；名字绝不换行（放不下先缩字号，2026-09-24） */

  .no .sn{flex:0 0 auto;white-space:nowrap;font-weight:700;color:#c9d6e8;

    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;letter-spacing:.2px;}

  body.nowrap .no .sn{white-space:normal;overflow-wrap:anywhere;line-height:1.15;}

  .no .pl{flex:0 1 auto;min-width:0;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .no .sep{color:var(--dim);margin:0 3px;}

  .ton{font-weight:800;font-size:1.12em;}

  .ton s{text-decoration:none;font-size:.62em;color:var(--dim);font-weight:600;margin-left:2px;}



  /* ============ 工序 · 流体进度条（2026-09-17）============

     把原来的「四个圆点 + 工序名徽章」换成一条**会流动的液体进度条**：

     · 左侧液体按工序进度涨（0% / 33% / 67% / 100%）；

     · 液面一直在轻轻起伏，液体内部有流光在走，看着像液体在流；

     · 液面右缘有一点"奔向下一道工序"的脉动光（颜色 = 下一道工序的颜色）；

     · 右侧是进度百分比（数字比液体准，够大，远处一眼读）。

     四道工序四种液体：待确认红 · 货好青 · 装货中琥珀 · 已完成绿（与整行底色同一套色）。

     ★ 这一格的上下内边距收到 0（见下面 tbody td:nth-child(5)；2026-10-19 加序号列后工序是第 5 格）：

       进度条自带高度，让它"吃自己的"内边距，整行高度仍由别的列说了算，

       不许它把行顶高（行一高，整屏就要滚，门口能看到的单子就少了）。 */

  .flw{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.45em;

    height:1.62em;padding:0 .5em 0 .66em;border-radius:999px;overflow:hidden;

    background:rgba(6,10,18,.9);font-size:.9em;line-height:1;white-space:nowrap;

    box-shadow:inset 0 0 0 1px rgba(148,163,184,.26), inset 0 1px 0 rgba(255,255,255,.06), 0 2px 10px rgba(0,0,0,.42);

    /* 液面波浪的图案（内联 SVG，不依赖任何外部文件）：宽 13 / 高 26，

       左半实心、右边鼓出两个波峰；竖向重复时上下无缝，所以能一直往下滚。 */

    --wvm:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='60'><path d='M0 0H6C17 4 17 9 6 13L6 20C11 24 11 28 6 31L6 38C19 44 19 50 6 52L6 60H0Z' fill='%23fff'/></svg>");

    --wvm2:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='48'><path d='M0 0H7C22 6 22 12 7 17L7 26C16 30 16 34 7 38L7 48H0Z' fill='%23fff'/></svg>");}

  /* 液体本体：宽度 = 进度。左端跟着胶囊的圆角走，右缘靠 ::after 那个自转的椭圆化出波纹 */

  .flq{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);

    background:linear-gradient(90deg,var(--f1),var(--f2));

    box-shadow:0 0 16px -2px var(--fglow);filter:saturate(1.2);}

  .flq::before{content:"";position:absolute;inset:0;opacity:.4;

    background:repeating-linear-gradient(96deg,rgba(255,255,255,.20) 0 2px,transparent 2px 10px);

    animation:flflow 2.4s linear infinite;}

  @keyframes flflow{to{transform:translateX(10px)}}

  .flq::after{content:"";position:absolute;inset:0;opacity:.16;

    background:repeating-linear-gradient(74deg,rgba(255,255,255,.16) 0 3px,transparent 3px 14px);

    animation:flflow2 5.2s linear infinite;}

  @keyframes flflow2{to{transform:translateX(-14px)}}

  /* 液面：液体右缘的**波浪边** —— 上面那张 SVG 波浪贴在这里，

     往左压 6px（正好让图案里的"实心段"在 --w 处结束），于是液体的右缘形状**就是**

     那条波浪线；再让它慢慢往下走一个周期 = 液面在起伏。

     ★ 别用"自转椭圆"那套（第一版试过）：椭圆会鼓到液体右边变成一个球，看着像浮了颗蛋。

     ★ 也别把波做小：周期 26px / 波幅 3px 那版（第二版）在 38px 高的胶囊里只有 1.5 个波，

       看着是"扇贝花边"。现在的 20px 周期 / 7.5px 波幅才有液面的样子。

     液面正中的那盏灯 = 「下一道工序」（颜色 = 下一道工序色）：四步

     货待确认 → 货好(青) → 装货中(琥珀) → 已完成(绿)。 */

  .flnx{position:absolute;top:0;bottom:0;left:var(--w,0%);width:18px;margin-left:-6px;

    background-color:var(--f1);

    -webkit-mask-image:var(--wvm);mask-image:var(--wvm);

    100%{transform:translateX(300%) skewX(-16deg);opacity:0}}

     工人扫一下码 → 这一行的工序往前走一步 → 它会按「完成的排最前」自动从下面跳到上面。
     原来整表是 innerHTML 重画的，行是"瞬移"的看不出动静；这里补两样东西：

  /* ============ 工序更新 · 卡片弹出动画（2026-11-04）============

       ① 卡片与表格里它的最终位置完全对齐，带阴影/金边/轻微放大，像被拎起来；
       ② 卡片顶部横幅演示「上一工序 ▶ 下一工序」，流体条从旧进度涨到新进度；
       ③ 演示完，卡片渐变缩回、落回表格里它的最终位置（"完成多排最前"此刻已就位）。

       全部被它裁掉，表现为"卡片外面的金光没了"。.popcard 自己没有裁剪，画这里才出得来。

    border-radius:16px;

       卡片下方压出一大片黑 → 缩小压淡，只留一点点"悬浮"的落地感。

               0 0 140px rgba(255,160,45,.60),
               0 10px 30px rgba(0,0,0,.42);}
  .popcard.lift{transform:translate(-50%,-50%) translate(var(--lx,0px),var(--ly,0px)) scale(.82);
    opacity:1;}
  .popcard.pop{transform:translate(-50%,-50%) translate(0,0) scale(1);
    opacity:1;
    transition:transform .25s cubic-bezier(.2,.7,.25,1),opacity .25s ease;}
  .popcard.pull{transform:translate(-50%,-50%) translate(var(--px,0px),var(--py,0px)) scale(.82);
    opacity:1;
    transition:transform 1s cubic-bezier(.45,0,.7,.25),opacity .6s ease;}
  /* ★ 送回分两拍（2026-11-06）：先稳稳落到新格子、停一下让人看清落在哪一行，再淡出。

  .popcard.back{transform:translate(-50%,-50%) translate(var(--bx,0px),var(--by,0px)) scale(.62);

  @keyframes cardLandFade{0%,68%{opacity:1}100%{opacity:0}}

  .cspark{position:fixed;z-index:61;width:26px;height:26px;margin:-13px 0 0 -13px;

  .popcard .cflash{position:absolute;inset:0;border-radius:16px;z-index:2;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(255,252,236,.92),rgba(255,208,112,.82));
    box-shadow:inset 0 0 70px 22px rgba(255,246,206,.95);
    will-change:opacity;}
  .popcard .cflash.go{animation:cflash .5s cubic-bezier(.2,.6,.3,1) .1s forwards;}

  @media (prefers-reduced-motion:reduce){.cburst{display:none}.popcard .cflash.go{animation:none}}

  .popcard .cwrap{position:relative;border-radius:18px;overflow:hidden;}
  /* ★ 超清三处改动（2026-11-04）：
     ① 卡片底改「实色」：原来 rgba(18,14,8,.96) 半透明 + backdrop-filter:blur(3px)，

     ③ 扫光从 .5~.8 压到 .14~.22：原来那道白亮斜带正压在文字上，那一段字看不清。

  .popcard /* ★ 去黑框（2026-11-05）：底色原来是**死黑**，卡片横贯 92vw 屏宽 →

  .popcard .csweep{position:absolute;top:0;left:-45%;width:45%;height:100%;
    background:linear-gradient(100deg,rgba(255,190,70,0),rgba(255,205,110,.14),rgba(255,238,180,.22),rgba(255,190,70,0));

<script>

/* ==========================================================================

   物流门口大屏 · 保密版（只读）

   设计要点：

   1. 保密是这一屏的硬约束：**送达方只出代码，不出名称**；也不出物流。

      查不到代码就显示「未编代码」占位，绝不回落到客户名 —— 宁可少显示，

      也不能因为"查不到"就把名字漏出去。

   2. 「取哪些行、什么算没走完、怎么排序」全部来自 scan-lib.js 的 boardRows ——

      和手机端、管理端、内部看板用的是同一份实现。几处数字不可能对不上。

   3. 本页**永远不写**任何数据。只读，避免门岗手滑把进度点了。

   4. 字号按行数自动缩放 + 全屏再加一档，保证整屏不滚动、站在门口能看清。

   ========================================================================== */

const SL = window.ScanLib;

const $ = (id) => document.getElementById(id);

const esc = SL.esc, raw = SL.raw;

const POLL_MS = 3000;    // 2026-11-05：2s->3s（用户要求刷新频率改为 3 秒；戳没变只查戳，不费流量；加 pullingProg 重叠守卫防堆叠）

/* 夜间 23:30–次日 7:30 停刷省流量（2026-11-02）：该时段完全不轮询云端，
   屏幕保持进入夜间前最后状态；白天（7:30–23:29）仍每 3 秒刷新。
   凌晨 4 点的 reload 保留（清内存/拾取新发布），其后的轮询仍受本闸门约束。 */
function nightPaused(){
  const d = new Date(), h = d.getHours(), m = d.getMinutes();
  if (h < 7) return true;                       // 0:00–6:59
  if (h === 7 && m < 30) return true;           // 7:00–7:29
  if (h === 23 && m >= 30) return true;         // 23:30–23:59
  return false;                                 // 7:30–23:29 白天
}

let pollN = 0;           // 轮询计数：定期强制全文拉一次进度（防「戳没变」误判把旧数据锁死）
let lastForceProg = 0;   // 2026-11-02：自愈强制全量改为按时间（每10分钟），不再按轮次（避免刷新调快后自愈变频繁吃流量）
let pullingProg = false;  // 2026-11-03：0.5s 高频轮询的重叠守卫（上一轮没回就跳过本轮），避免并发戳查询/重复渲染

let progHeal = false;    // 本轮是否发生过「进度缓存中毒自愈」（顶栏提示用）

const FETCH_MS = 15000;              // 云端拉取超时（别让一次卡住的请求把整屏拖死）



const KEY_DB = SL.KEY_DB;

const KEY_PLANS_STAMP = "shipping_plans_stamp_v1", KEY_DB_STAMP = "shipping_db_stamp_v1";            // 物料库（含送达方代码）—— 用于把客户名换成代码



let RECORDS = [];

let PROG = {};

let DB = [];                         // 物料库

let IDX = { byModel: {}, byCust: {} };   // 代码索引（型号→代码 / 客户名→代码），由 scan-lib 构建

let rows = [];

let lastFp = "";

let rendered = false;

let missCount = 0;                   // 本次渲染里有几条查不到代码（页脚提醒去补）

let okCount = 0, badCount = 0;



/* ---------- 从本机兜底读（断网时大屏不能变白板） ---------- */

function loadLocal(){

  try { const v = JSON.parse(localStorage.getItem(SL.KEY_PLANS) || "null"); if (Array.isArray(v)) RECORDS = v; } catch(e){}

  try { const v = JSON.parse(localStorage.getItem(SL.KEY_PROG) || "null"); if (v && typeof v === "object") PROG = v; } catch(e){}

  loadLocalDb();

}

/* 物料库单独兜底：★ 别把它混进上面那个整体兜底 ——

   否则"物料库为空"会把刚拉到的最新计划又用本机旧缓存盖回去。 */

function loadLocalDb(){

  if (DB.length){ buildDbIndex(); return; }

  try { const v = JSON.parse(localStorage.getItem(KEY_DB) || "null"); if (Array.isArray(v)) DB = v; } catch(e){}

  buildDbIndex();

}

function setSync(txt, cls){ const e = $("sync"); e.textContent = txt; e.className = "sync " + (cls || ""); }



/* ---------- 送达方代码：解析口径搬到了 scan-lib.js（司机页共用同一份） ----------

   ★ 保密口径**只允许有一处实现** —— 从前这份 codeOf 就写在本页里，

     司机页要用时若照抄一遍，日后"漏填代码怎么显示"改一处、漏一处，

     两块屏就会对不上（一个显「未编代码」、一个显客户名，那就泄密了）。

   索引只收「有代码」的记录，查不到就返回空。 */

function buildDbIndex(){ IDX = SL.codeIndex(DB); }



/* 这一行该显示什么代码：三级兜底全在 scan-lib.codeOf 里（司机页同一份）。

   ★ 查不到返回 ""，**不返回客户名** —— 调用方一律用占位「未编代码」。 */

function codeOf(r){ return SL.codeOf(r, IDX); }



/* ---------- 拉取（超时保护：卡住的请求不能让整屏停摆） ---------- */

function withTimeout(p, ms){

  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

}



/* ★ 电视/老浏览器兼容（2026-09-30）：部分电视自带浏览器内核（Chromium < 76）

   没有 Promise.allSettled —— 以前 pull() 一跑就抛错、整屏静默没数据。

   这里补一个等价实现（Promise.all + 每项包一层结果），老内核也能拉到数据。 */

if (!Promise.allSettled) {

  Promise.allSettled = function (list) {

    var arr = Array.prototype.slice.call(list);

    return Promise.all(arr.map(function (p) {

      return Promise.resolve(p).then(

        function (v) { return { status: "fulfilled", value: v }; },

        function (e) { return { status: "rejected",  reason: e }; }

      );

    }));

  };

}



async function pull(){

  const cs = !!(window.CloudSync && CloudSync.ready());

  let okA = !cs, okP = !cs;

  if (cs){

    /* 性能（2026-09-24）：先并行查「更新时间戳」（几十字节），没变就不下载全文。

       计划(~268KB)和物料库(大)都极少变；剩下的请求三路同时发，弱网同步时间约降为 1/3。 */

    let skipA = false, newAStamp = null, skipDb = false, newDbStamp = null;

    if (CloudSync.pullStamp && RECORDS.length){

      try {

        const st = await withTimeout(CloudSync.pullStamp(SL.KEY_PLANS), 8000);

        if (st){ if (localStorage.getItem(KEY_PLANS_STAMP) === st && !(SL.planCacheSuspect && SL.planCacheSuspect())){ skipA = true; okA = true; } else newAStamp = st; }

      } catch(e){}

    }

    if (CloudSync.pullStamp && DB.length){

      try {

        const st = await withTimeout(CloudSync.pullStamp(KEY_DB), 8000);

        if (st){ if (localStorage.getItem(KEY_DB_STAMP) === st) skipDb = true; else newDbStamp = st; }

      } catch(e){}

    }

    /* 省流量（2026-10-12）：进度也先查戳，没变就不下载全文 */

    let skipProg = false, newProgStamp = null;

pollN++;



    /* ★ 定期强制全文拉一次进度（2026-10-30）：约每 40 轮（10 分钟）无视戳下载全文。

       「戳没变就跳过」省流量，但哪台电脑的戳/缓存一旦不对（旧代码探错键、写坏戳），

       就会永远「已同步 ✓」却永远不下载 —— 定期强拉一次兜底自愈。 */

    /* 改为按时间（固定每 10 分钟）强制全文拉一次，而不是按轮次：
       这样白天的刷新频率再怎么调（15s→5s），自愈兜底频率都不变，不会多吃流量。 */
    const forceProg = (Date.now() - lastForceProg) >= 600000;
    if (forceProg) lastForceProg = Date.now();



    if (CloudSync.pullStamp){

      try {

        const st2 = await withTimeout(CloudSync.pullStamp(SL.KEY_PROG), 8000);

        if (st2 && !forceProg){ if (localStorage.getItem("shipping_progress_stamp_v1") === st2) skipProg = true; else newProgStamp = st2; }

      } catch(e){}

    }


    const rs = await Promise.allSettled([

      skipA ? Promise.resolve({ ok: true, value: null }) : withTimeout(CloudSync.pullResult(SL.KEY_PLANS), FETCH_MS),

      skipProg ? Promise.resolve({ ok: true, value: null }) : withTimeout(CloudSync.pullResult(SL.KEY_PROG), FETCH_MS),

      skipDb ? Promise.resolve({ ok: true, value: null }) : withTimeout(CloudSync.pullResult(KEY_DB), FETCH_MS)

    ]);

    const ra = rs[0].status === "fulfilled" ? rs[0].value : null;

    const rp = rs[1].status === "fulfilled" ? rs[1].value : null;

    const rd = rs[2].status === "fulfilled" ? rs[2].value : null;

    if (!skipA){

      okA = !!(ra && ra.ok);

      if (okA && Array.isArray(ra.value)){

        RECORDS = ra.value;

        try { localStorage.setItem(SL.KEY_PLANS, JSON.stringify(RECORDS));

              if (newAStamp) localStorage.setItem(KEY_PLANS_STAMP, newAStamp); } catch(e){}

        if (SL.notePlanCloud) SL.notePlanCloud(ra.value.length);

      }

    }

    okP = !!(rp && rp.ok);

    if (okP && rp.value && typeof rp.value === "object"){

/* ★ 进度缓存健全性自检（2026-10-30）：本机缓存里若留着「rv 更高、内容却更旧」

         的格子，mergeProg 会永远输给本机旧值 —— 屏幕显示「已同步 ✓」却整屏锁在

         几天前的状态（门口屏 2026-10-30 实况）。检出中毒：整份信云端，顶栏提示。 */

      const sm = SL.mergeProgSafe ? SL.mergeProgSafe(PROG, rp.value)

                                  : { data: SL.mergeProg(PROG, rp.value), poisoned: false };

      if (sm.poisoned && SL.mergeProgSafe) progHeal = true;

      PROG = sm.data;


      if (newProgStamp){ try { localStorage.setItem("shipping_progress_stamp_v1", newProgStamp); } catch(e){} }

    }

    if (!skipDb && rd && rd.ok && Array.isArray(rd.value)){

      DB = rd.value;

      try { localStorage.setItem(KEY_DB, JSON.stringify(DB));

            if (newDbStamp) localStorage.setItem(KEY_DB_STAMP, newDbStamp); } catch(e){}

      buildDbIndex();

    }

  }



  if (!RECORDS.length) loadLocal();     // 云端没拉到 → 用本机缓存（别让大屏变白板）

  if (!DB.length) loadLocalDb();        // 物料库单独兜底（不动刚拉到的计划）

  // 墓碑：管理端删掉的单不再上屏

  try {

    const del = JSON.parse(localStorage.getItem(SL.KEY_DEL) || "null");

    if (Array.isArray(del) && del.length){

      const st = new Set(del.map(String));

      RECORDS = RECORDS.filter(r => !(r && r.id != null && st.has(String(r.id))));

    }

  } catch(e){}

  try { localStorage.setItem(SL.KEY_PROG, JSON.stringify(PROG)); } catch(e){}



  const degraded = !okA || !okP;

  degraded ? badCount++ : (badCount = 0);

  okCount++;

  const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });

  /* 文案缩短：顶部只有一行，长句会顶出去（全文留在 title 里） */

  const sw = $("sync");

  if (!cs){ setSync("本机缓存 " + t, "warn"); sw.title = "云端未配置，正在显示本机缓存的数据"; }

  else if (degraded){ setSync("网络波动 " + t, "warn"); sw.title = "网络有波动，正在显示上一次拉到的数据"; }

else if (progHeal){ progHeal = false; setSync("已按云端校正本机缓存 ✓ " + t, "warn"); sw.title = "发现本机进度缓存落后于云端，已自动用云端数据纠正"; }

  else { setSync("已同步 ✓ " + t, "ok"); sw.title = "已同步云端，时间 " + t; }



  render();

}



/* ---------- 渲染 ---------- */

function fmtTime(ts){

  if (!ts) return "";

  const d = new Date(ts);

  if (isNaN(d.getTime())) return "";

  const p = (n) => String(n).padStart(2, "0");

  const today = SL.todayYmd();

  const day = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());

  return (day === today ? "" : (d.getMonth() + 1) + "/" + d.getDate() + " ") + p(d.getHours()) + ":" + p(d.getMinutes());

}



// 字号按行数自动缩放：行少就放大（门口看得清），行多就收紧。

// 下限 15px：再小门口就看不清了，塞不下交给自动慢速滚动（不再硬缩到看不清）。

// ★ 2026-09-17 改成**直接量**表格容器剩下多少高度，再扣掉表头那一行。

//   原来写死"vh - 172"没把表头算进去：屏幕一矮（比如 1366×768）就估多了，

//   15 行会整屏溢出、要多滚一下。量出来的数在哪种窗口下都是对的。

//   量不到布局时（jsdom 里 clientHeight 恒为 0）才退回按视口估算：192=全屏 / 172=窗口。

// --perrow = 每行能分到的高度配额，fitCodeFont 拿它当"行不许再高"的上限。

function fitRows(n){

  const box = document.querySelector(".box");

  const thead = box ? box.querySelector("thead") : null;

  const boxH = box ? box.clientHeight : 0;

  let avail;

  if (boxH > 40){

    avail = boxH - (thead ? thead.getBoundingClientRect().height : 0) - 2;   // 2px 留给圆角/边框

  } else {

    avail = window.innerHeight - (document.body.classList.contains("fs") ? 192 : 172);

  }

  avail = Math.max(160, avail);

  /* ★ 2026-09-17 修（「字体还是没变大」的真凶）：**行数多到一屏放不下时，不能拿总行数去分高度**。

     表格本来就带自动滚动（塞不下就慢慢往下滚），可以前 per = avail / n 会把配额压到 20px 上下，

     而 fitCodeFont 拿 per 当"一行不许再高"的上限 —— 于是 36 行时 --coder 被压到 1.00，

     代码跟正文一样大，用户看到的就是"字号没放大"。

     现场三四十行是常态，所以给每行配额一个下限：至少放得下一个看得清的代码；

     行数超过一屏时，多出来的高度交给已有的自动滚动去消化。 */

  /* 下限 40px（够放 ~36px 的代码）；但也要保证"一屏至少还能看见 ~12 行"，

     免得屏幕特别矮时行被顶得老高、全程都在滚。 */

  const PER_MIN = Math.min(40, avail / 12);

  const per = Math.max(avail / Math.max(1, n), PER_MIN);

  const fs = Math.max(15, Math.min(26, Math.floor(per * 0.40)));

  const root = document.documentElement.style;

  root.setProperty("--rowfs", fs + "px");

  root.setProperty("--rowpad", Math.max(3, Math.floor(fs * 0.36)) + "px");

  root.setProperty("--perrow", per + "px");

}



/* 一行有没有"塞不下"：代码列被挤到溢出，或者这一行高过了配额 */

function rowOverflows(tds){

  for (let i = 0; i < tds.length; i++){

    const td = tds[i];

    if (td.scrollWidth > td.clientWidth + 1) return true;

  }

  const per = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--perrow")) || 0;

  const rowEl = tds[0] && tds[0].parentElement;

  /* 容差只能是"亚像素"级别：per 是"每行配额"，n 行加起来就是整屏高度，

     一行放宽 1px、15 行就白溢出 15px（会莫名其妙多出一条滚动）。只留浮点噪声的余量。 */

  return !!(per > 0 && rowEl && rowEl.getBoundingClientRect().height > per + 0.25);

}



/* 送达方代码用多大字（2026-09-17 用户要求「加到最大」）——

   唯一的硬约束有两条：**不许被省略号截断**（门口把 100173 看成 1001… 比不显示还糟），

   **一行也不许高过配额**（否则整屏要滚，看表更费劲）。在两条之内，能多大就多大。

   做法不猜公式，全部用真实排版量出来的数：

     ① 在 1.5 倍、2.5 倍各量一次（这一列最宽的代码有多宽、这一行有多高）

     ② 宽度和高度对字号都是线性的 → 直接解出"刚好塞得下"的倍数，取两者较小值

     ③ 定下来后复核一次，真超了就往下降档；降到底（1 倍，跟别的列一样大）还放不下才开折行 */

const CODE_R_MAX = 3, CODE_R_MIN = 1, CODE_R_LO = 1.5, CODE_R_HI = 2.5, CODE_R_STEP = 0.05;

function fitCodeFont(){

  const tds = Array.prototype.slice.call(document.querySelectorAll("#tbody td:nth-child(2)"));   // ★ 2026-10-19 加序号列后，代码是第 2 格

  if (!tds.length) return;

  const root = document.documentElement, style = root.style;

  document.body.classList.remove("codewrap");     // 先按"不折行"量（折行会让行变高，能不用就不用）

  const per = parseFloat(getComputedStyle(root).getPropertyValue("--perrow")) || 0;

  const rowEl = tds[0].parentElement;

  const sample = (r) => {

    style.setProperty("--coder", r.toFixed(2));

    let w = 0;

    tds.forEach(td => { const c = td.querySelector(".cust"); if (c) w = Math.max(w, c.getBoundingClientRect().width); });

    return { w: w, h: rowEl.getBoundingClientRect().height, room: tds[0].clientWidth - 28 };

  };

  const lo = sample(CODE_R_LO), hi = sample(CODE_R_HI);

  // 两点连线解出"刚好顶到上限"的倍数；量不到数（比如 jsdom 里宽度恒为 0）就取硬上限

  const solve = (v1, v2, limit) => (v2 - v1 > 0.5 ? CODE_R_LO + (CODE_R_HI - CODE_R_LO) * (limit - v1) / (v2 - v1) : CODE_R_MAX);

  let r = Math.min(CODE_R_MAX, solve(lo.w, hi.w, lo.room), per > 0 ? solve(lo.h, hi.h, per) : CODE_R_MAX);

  r = Math.max(CODE_R_MIN, Math.floor(r / CODE_R_STEP) * CODE_R_STEP);

  for (; r >= CODE_R_MIN - 1e-6; r -= CODE_R_STEP){

    style.setProperty("--coder", r.toFixed(2));

    if (!rowOverflows(tds)) break;       // 量着没超，就定这一档

  }

  if (r < CODE_R_MIN - 1e-6){                  // 缩到最小还放不下 → 折行，一个字都不丢

    document.body.classList.add("codewrap");

    style.setProperty("--coder", CODE_R_MIN.toFixed(2));

    return;

  }

  /* ★ 2026-09-17 补：上面那个解析解只量了 1.5/2.5 两点，而**行高有一截是被别的列撑起来的固定下限**

     （内边距 + 其它列的行高），这段"白送的高度"不受代码字号影响 —— 于是两点连线被压平、解出来的倍数

     偏保守，配额根本没用满。所以定档之后再逐档往上顶，量到刚好放不下为止（真正照"实测"来定，不靠公式）。 */

  for (let up = r + CODE_R_STEP; up <= CODE_R_MAX + 1e-6; up += CODE_R_STEP){

    style.setProperty("--coder", up.toFixed(2));

    if (rowOverflows(tds)){ style.setProperty("--coder", r.toFixed(2)); break; }

    r = up;

  }

}

/* 单号自适应字号（2026-09-23；2026-09-24 起名字恢复显示，口径改为「缩字号、绝不撤名字」）

   为什么需要：大屏字号按行数自适应（--rowfs 15~26px），行少字号就大 ——

   单号是 15 位等宽字符，字号一大就把这一格撑破，td 的 overflow:hidden 会把最后 1~2 位吃掉

   （真机实测 26px 时缺 11px）。单号缺一位就查不到单，比显示小字糟得多。

   优先级（2026-09-24 用户要求）：单号必须完整 > 名字必须显示（不换行、可以缩小）。

   做法：先整批复位（只触发一次布局），再整批量（读写分离，别交错触发重排）。

   ① 先缩名字（96%→56%）；② 名字到底了还放不下 → 缩单号（96%→56%）；

   ③ 都到下限仍放不下（超长单号）→ 折行，一位都不丢（极端兜底）。 */

const NO_R_MIN = 0.56;

const PL_R_MIN = 0.56;

function fitNoFont(){

  const tb = document.getElementById("tbody"); if (!tb) return;

  document.body.classList.remove("nowrap");

  const list = Array.prototype.slice.call(tb.querySelectorAll(".no"));

  if (!list.length) return;

  const sns = list.map(no => no.querySelector(".sn"));

  const pls = list.map(no => no.querySelector(".pl"));

  for (let i = 0; i < list.length; i++){                 // 整批复位（只触发一次布局）

    if (sns[i]) sns[i].style.fontSize = "";

    if (pls[i]) pls[i].style.fontSize = "";

  }

  const over = no => no.scrollWidth > no.clientWidth + 1;

  let fold = false;

  for (let i = 0; i < list.length; i++){

    const no = list[i], sn = sns[i], pl = pls[i];

    if (!sn) continue;

    if (!over(no)) continue;                             // 本来就放得下

    // ① 先缩名字（用户明确：名字可以缩小）—— 单号保持原字号

    if (pl){

      let pk;

      for (pk = 0.96; pk >= PL_R_MIN - 1e-6; pk -= 0.04){

        pl.style.fontSize = Math.round(pk * 100) + "%";

        if (!over(no)) break;

      }

      if (!over(no)) continue;

    }

    // ② 名字到底了还放不下 → 逐档降单号字号（名字停在 56% 不再动）

    let k = NO_R_MIN;

    for (k = 0.96; k >= NO_R_MIN - 1e-6; k -= 0.04){

      sn.style.fontSize = Math.round(k * 100) + "%";

      if (!over(no)) break;

    }

    // ③ 都到下限仍放不下（超长单号）→ 折行，一位都不丢

    if (k < NO_R_MIN - 1e-6){ fold = true; sn.style.fontSize = Math.round(NO_R_MIN * 100) + "%"; }

  }

  if (fold) document.body.classList.add("nowrap");

}



/* ★ 时间两列（工序更新/车辆更新）自动缩字号（2026-09-24）：逐格量 scrollWidth，

   放不下就降字号（下限 55%），保证单行放得下 —— 不换行、也绝不让省略号吃掉。 */

const TM_R_MIN = 0.55;

function fitUpdFont(){

  const tb = document.getElementById("tbody"); if (!tb) return;

  const tds = tb.querySelectorAll("td:nth-child(8),td:nth-child(9)");

  const tms = Array.prototype.map.call(tds, td => td.querySelector(".tm"));

  tms.forEach(el => { if (el) el.style.fontSize = ""; });   // 整批复位（只触发一次布局）

  tms.forEach(el => {

    if (!el) return;

    const td = el.parentElement;

    if (td.scrollWidth <= td.clientWidth + 1) return;       // 本来就放得下

    for (let k = 0.96; k >= TM_R_MIN - 1e-6; k -= 0.04){

      el.style.fontSize = Math.round(k * 100) + "%";

      if (td.scrollWidth <= td.clientWidth + 1) break;

    }

  });

}

/* 计划员 / 经手人姓名显示（2026-09-23）：老板要求恢复真名，此前的

   maskName / maskNameHtml 打码逻辑已整块删除。姓名一律经 esc() 输出。 */



/* 一行怎么画 —— 注意：这里**没有**任何一处输出客户名，改动前先想清楚这句话 */

/* i = 这一行在当前排序里的序号（0 起）；只用来印行号，不参与任何业务判断。

   ★ 不含客户信息 —— 门口这一屏的保密口径不受影响。 */
function rowHtml(r, i){

  const s = Math.min(3, r.s || 0);

  /* 流体进度条（2026-09-17）：液体宽度 = 工序进度（0 / 33 / 67 / 100）。

     0 档给一小片"刚起步"的液滴（6%），但右边的数字仍按真实进度印 0% ——

     数字永远准，液体只负责好看（别把这一小片读成"已经有进度了"）。 */

  const pct = Math.round(s / 3 * 100);

  const flw = '<span class="flw s' + s + '" style="--w:' + (pct || 6) + '%">' +

      '<i class="flq"></i>' +

      (s < 3 ? '<i class="flnx c' + (s + 1) + '"></i><i class="flnx2"></i>' : '') +

      '<span class="flt">' + esc(SL.STEP_NAME[s]) + '</span>' +

      '<span class="flp">' + pct + '%</span>' +

    '</span>';

  const stale = r.isYesterday ? '<span class="stale">昨</span>' : "";

  /* 两列更新分开报（2026-09-21；2026-09-24 换位后两列相邻放在最右）：

     · 工序更新 = 只报四道工序的进度时间（谁点的一并带出真名，2026-09-23 恢复姓名）；

     · 车辆更新 = 只报司机签到（车已到）的时间 —— 司机扫码签到了才冒出来。 */

  const byTxt = r.by ? "·" + esc(r.by) : "";   // 紧凑（2026-09-24）：时间列字少一点，单行更容易放得下

  const stepWhen = r.t ? SL.fmtHM(r.t) : "";

  const carWhen = r.car && r.ct ? SL.fmtHM(r.ct) : "";

  const code = codeOf(r);

  if (!code) missCount++;

  const codeCell = code

    ? '<span class="cust">' + esc(code) + "</span>"

    : '<span class="cust miss">未编代码</span>';

  // 单号独立成一列（2026-09-17）；名字恢复显示（2026-09-24 用户要求，放不下缩字号、不换行）

  const plCell = r.planner ? '<span class="pl"><span class="sep">·</span>' + esc(r.planner) + "</span>" : "";

  const noCell = '<span class="no"><span class="sn">' + esc(r.no || "（无单号）") + "</span>" + plCell + "</span>";

  /* 行标识写进 data-rid：★ 这里只放**纯数字短 id**，绝不写 rk|ck
     （门口大屏是保密版，标签属性里也不能出现客户名） */
  const rid = ridOf(r);

  return '<tr class="' + (r.done ? "done" : "st" + s) + '" data-rid="' + rid + '">' +

    '<td class="idx"><i class="gcur"></i><span class="n">' + (i + 1) + '</span></td>' +

    '<td>' + stale + codeCell + "</td>" +

    '<td><span class="ton">' + (r.ton ? r.ton.toFixed(1) : "/") + '<s>吨</s></span></td>' +

    '<td>' + noCell + "</td>" +

    '<td>' + flw + "</td>" +

    '<td>' + (r.cx ? '<span class="carx">取消</span>' : '<span class="car ' + (r.car ? "on" : "off") + '">' + (r.car ? "✓ 已到" : "未到") + "</span>") + "</td>" +

    '<td>' + (r.cx ? '<s>已取消</s>' : (r.bz ? '<span class="bzon">已备好</span>' : '<span class="bzoff">未确认</span>')) + "</td>" +

    '<td><span class="tm">' + (stepWhen ? "工序 " + esc(stepWhen) + byTxt : '<s>还没动</s>') + "</span></td>" +

    '<td><span class="tm">' + (r.cx ? '<s>已取消</s>'

      : (carWhen ? "车到 " + esc(carWhen) : '<s>还没签到</s>')) + "</span></td>" +

  "</tr>";

}



/* 查不到代码的行数 → 页脚提醒（只报条数：这屏不出现客户名，与 2026-09-23 恢复的人名无关） */

/* ---------- 工序更新 · 醒目提醒（2026-11-03）------------
   工人扫一下码 → 这一行的工序往前走一步 → 它会按「完成的排最前」自动从下面跳到上面。
   整表是 innerHTML 重画的，行是"瞬移"的看不出动静；这里补两样：
     ① 跳位动画（FLIP）：重画前记下每行的位置和名次，重画后算出"它挪了多少"，
        用 CSS animation 从旧位置滑到新位置 —— 于是"从下面跳到上面"的过程看得见。
     ② 金色光标：刚更新过的那一行，序号格左边立一枚金色箭头，序号套金圈、工序流体条
        套金光 —— 站在屏幕前一眼就看出"这单动了"。金色只留 12 秒。

   ★ 行标识（rk|ck）只在内存里比对，**绝不写进 DOM** ——
     门口大屏是保密版，整页不允许出现客户名（含标签属性）。DOM 上只放纯数字短 id。 */

const HOT_MS = 12000;                  // 金色光标停留多久（毫秒）
const ROW_IDS = Object.create(null);   // 行标识 → 纯数字短 id（DOM 上只出现这个）
let ROW_SEQ = 0;
let HOT_UNTIL = Object.create(null);   // 短 id → 金色到什么时候为止
let HOT_TIMER = 0;                     // 收金色的定时器
let PREV_ROW = Object.create(null);    // 短 id → 上一轮的状态签名
let PREV_POS = Object.create(null);    // 短 id → 上一轮的行位置（top/idx + 工序条中心 px/py）＝卡片起点
let PREV_SCROLL = 0;                   // 上一轮取位置时的滚动量（用于把起点换算到当前视口）

/* 行标识（只在内存里用）：记录键 + 客户/日期组键 */
function rowKey(r){ return r.rk + "|" + r.ck; }

/* 行标识 → 纯数字短 id（同一个业务行每次渲染拿到的 id 一样，FLIP 才對得上） */
function ridOf(r){
  const k = rowKey(r);
  return ROW_IDS[k] || (ROW_IDS[k] = ++ROW_SEQ);
}

/* 找出这一轮里"工序刚推进"的行 → 记下金色窗口 */
function markHotRows(rows, cardIds){
  const now = Date.now();
  let fresh = false;

  for (let i = 0; i < rows.length; i++){
    const r = rows[i];
    const id = ridOf(r);
    const sig = (r.s || 0) + ":" + (r.t || 0);
    const was = PREV_ROW[id];

    if (was !== undefined && was !== sig){ HOT_UNTIL[id] = now + HOT_MS; fresh = true; }

    PREV_ROW[id] = sig;
  }

  // 工序往前走的行 → 排队弹卡片（detectStepUp 已算好 from/to）
  if (cardIds){
    for (const id in cardIds){
      if (HOT_UNTIL[id]){
        cardQueue.push({ id: id, from: cardIds[id].from, to: cardIds[id].to });
      }
    }
  }

  if (fresh) scheduleHotSweep();
}

/* 金色到点自己褪去：定时清掉过期的，不用重画整表（重画会闪） */
function scheduleHotSweep(){
  if (HOT_TIMER) clearTimeout(HOT_TIMER);

  let soonest = Infinity;
  for (const k in HOT_UNTIL) if (HOT_UNTIL[k] < soonest) soonest = HOT_UNTIL[k];
  if (soonest === Infinity) return;

  HOT_TIMER = setTimeout(function(){
    HOT_TIMER = 0;
    const t = Date.now();
    for (const k in HOT_UNTIL) if (HOT_UNTIL[k] <= t) delete HOT_UNTIL[k];
    applyHot();
    scheduleHotSweep();
  }, Math.max(80, soonest - Date.now() + 40));
}

/* 把 hot 状态落到 DOM 上（只切 class，不动结构） */
function applyHot(){
  const trs = $("tbody").children;
  for (let i = 0; i < trs.length; i++){
    const tr = trs[i];
    const id = tr.getAttribute("data-rid");
    const on = !!(id && HOT_UNTIL[id] && HOT_UNTIL[id] > Date.now());
    tr.classList.toggle("hot", on);
  }
}

/* ---------- 跳位动画（FLIP） ----------
   重画前记下每行的位置（相对表格）和名次；重画后：
     · 名次变了 = 它"跳位"了 → 播动画，从旧位置滑到新位置；
     · 名次没变 = 只是行高被字号微调挤了一下 → 不播（免得整屏一起抖）。
   位移量用"旧位置 − 新位置"，落点永远精确（动画结束就落在新位置）。 */
function snapshotRows(){
  const trs = $("tbody").children;
  const pos = Object.create(null);
  for (let i = 0; i < trs.length; i++){
    const tr = trs[i];
    const id = tr.getAttribute("data-rid");
    if (!id) continue;
    const flw = tr.querySelector(".flw");          // 工序进度条所在列（卡片要从这里被抽出来）
    const r = flw ? flw.getBoundingClientRect() : null;
    pos[id] = { top: tr.offsetTop, idx: i,
      px: r ? r.left + r.width / 2 : 0,             // 工序条中心（视口坐标）＝卡片起点
      py: r ? r.top + r.height / 2 : 0 };
  }
  return pos;
}

function flipRows(rows, prev, cardIds){
  const trs = $("tbody").children;
  if (!trs.length) return;

  for (let i = 0; i < trs.length && i < rows.length; i++){
    const tr = trs[i];
    const id = tr.getAttribute("data-rid");
    const was = id ? prev[id] : undefined;
    if (!was) continue;                    // 新上屏的行：没有"旧位置"，不播

    if (was.idx === i) continue;           // 名次没变 → 不播（整屏齐抖最难看）

    const dy = was.top - tr.offsetTop;     // >0 = 往上跳了
    if (Math.abs(dy) < 2) continue;

    tr.style.setProperty("--dy", dy + "px");
    /* ★ 2026-11-05：要弹卡片的行**先按住不跳** —— 等屏幕滚动锁定到它之后（startCard 的定位回调里）
       再松手，让「装货中→已完成」这一跳当着观众的面发生；别的行照旧直接跳。 */
    if (!reduceMotion && cardIds && cardIds[id]) tr.classList.add("jumphold");
    else tr.classList.add("jump");
  }
}

/* ★ 松手（2026-11-05）：把「按住」的行放出去 —— 它从旧位置滑到新名次。
   时机＝屏幕已经滚动锁定到它之后（startCard 的定位回调里调用）。 */
function releaseJump(id){
  let tr = null;
  try { tr = $("tbody").querySelector('tr[data-rid="' + id + '"]'); } catch(e){}
  if (!tr) return;
  if (tr.classList.contains("jumphold")){
    tr.classList.remove("jumphold");
    tr.classList.add("jump");             // 从旧位置滑到新名次（接着 .hot 的跳位曲线）
  }
}

/* 兜底：卡片被清掉/出错时，别让按住的行永远钉在旧位置 */
function releaseAllJumps(){
  const trs = $("tbody").children;
  for (let i = 0; i < trs.length; i++){
    const tr = trs[i];
    if (tr.classList.contains("jumphold")){
      tr.classList.remove("jumphold");
      tr.classList.add("jump");
    }
  }
}

/* ---------- 工序更新 · 卡片弹出动画（2026-11-04 改：居中最大化 + 放慢）------------
   工人扫一下码 → 这一行工序往前走一步 → 不管大屏当前滚到哪，先把这一行"快速滚到视口正中"锁定，
   然后弹出一张居中屏幕、最大化的悬浮卡片：
     ① 卡片从「工序变动列」被"拿出来"——起点是上一轮那一行的工序进度条（原地炸出橙金光球），
        缓慢斜向飞起（0.25s）→ 落定屏幕正中最大化（0.25s）；整行文字带金光、扫光掠过。
     ② 卡片顶部横幅演示「上一工序 ▶ 下一工序」，流体条从旧进度慢慢涨到新进度（正中停留 1 秒）。
     ③ 演示完，卡片从正中缓慢斜向抽出（1s）→ 落到该行「工序推进后跳到的新格子」并淡出（1.1s）。
   本屏保密：卡片只含「送达方代码」、绝不出现客户名（克隆的就是表格里那一行）。
   不支持动画（prefers-reduced-motion）时只保留金色高亮、不弹卡片。
   播放中若 3 秒轮询又来新数据：render 会延迟到卡片结束再刷新，避免把动画打断。 */

const STEP_COLOR = { 0:"#ff5d5d", 1:"#38c8d8", 2:"#ffb454", 3:"#3ddc97" };
const CARD_HOLD = 1000;     // 卡片居中停留、演示"上一步→下一步"的时长（ms，停留 1 秒）
const LIFT_MS   = 250;      // 取出第一程：从工序条斜向飞起（ms）
const SETTLE_MS = 250;      // 取出第二程：落定屏幕正中（★ LIFT+SETTLE=0.5 秒＝"飞到正中展示"共 0.5 秒）
const CARD_KEEP = [0,1,3,4,2]; // ★ 卡片只保留这几列（序号/送达方代码/单号/工序/吨位）→ 每列空间翻倍，字号才能真放大
const CARD_COLW = [8,30,18,28,16]; // ★ 裁列后**定制**各列宽度（与 CARD_KEEP 一一对应，单位 %）
const CARD_FS   = 2.0;        // ★ 卡片字号放大倍数（改 font-size 重新排版渲染，不是 transform 缩放 → 像素清晰）
const PULL_MS   = 1000;     // 送回第一程：从正中斜向抽出
const BACK_MS   = 1340;     // 送回第二程：落到新格子(620ms) + 停住(380ms) + 淡出(340ms)
// ★ 与 CSS .popcard.back 的 cardLandFade 1.34s 对齐：落到位后先不透明地停一下，最后才淡出。
const CARD_BACK = 2100;     // 送回总时长（PULL_MS + BACK_MS）
const CARD_GAP  = 400;      // 一轮多行同时推进时，卡片之间的错峰间隔（ms）
const POP_MS    = 500;     // 取出总时长（LIFT_MS + SETTLE_MS）＝0.5 秒（飞到正中展示）

let cardActive = null;      // 正在播放的卡片 { id, el, row }
let cardQueue  = [];        // 待播队列（本轮可能多行同时推进，按顺序一个一个播）
let cardTimer  = 0;
let cardTimer2 = 0;         // 送回第二段（缩回落回原行）计时
let cardBusy   = false;     // ★ 卡片动画全程占用（含送回落位那 2 秒）：动画没播完就不许重绘表格
let cardSeek   = false;     // ★ 正在「快速滚动定位」目标行：这段时间自动滚动也别来抢
let cardBackdrop = null;    // 卡片背后的全屏遮罩
let pendingRender = false;  // 卡片播放期间，render 被推迟的标记（卡片结束后补刷）
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

/* 识别本轮里"工序往前走"的行：和上一轮 PREV_ROW 比，step 变大即算 */
function detectStepUp(rows){
  const map = Object.create(null);
  for (let i = 0; i < rows.length; i++){
    const r = rows[i];
    const id = ridOf(r);
    const was = PREV_ROW[id];
    if (was === undefined) continue;
    const wasStep = parseInt(String(was).split(":")[0], 10) || 0;
    const cur = r.s || 0;
    if (cur > wasStep) map[id] = { from: wasStep, to: cur };
  }
  return map;
}

/* 重绘前清掉上一张还在播的卡片（行节点会被 innerHTML 替换，这里只撤卡片本体） */
function clearCards(){
  if (cardTimer){ clearTimeout(cardTimer); cardTimer = 0; }
  if (cardTimer2){ clearTimeout(cardTimer2); cardTimer2 = 0; }
  if (cardActive){
    const a = cardActive; cardActive = null;
    try { a.el.remove(); } catch(e){}
    if (a.row){ a.row.style.visibility = ""; a.row.classList.remove("srcslot"); }
  }
  if (cardBackdrop){ try { cardBackdrop.remove(); } catch(e){} cardBackdrop = null; }
  cardQueue.length = 0;
  releaseAllJumps();                      // ★ 兜底：别让「按住」的行永远钉在旧位置
}

/* 一轮多张时：上一张播完再播下一张，避免叠在一起 */
function pumpCards(){
  if (reduceMotion){ cardQueue.length = 0; return; }
  if (cardActive) return;                  // 上一张还在播，等它结束再取
  const item = cardQueue.shift();
  if (!item){ resumeScroll(); return; }
  // ★ 兜底：卡片启动若抛错，必须把 cardBusy 放开、把这张拆掉、继续下一张
  //   （否则 cardBusy 永远为 true → 表格再也不重绘 → 整屏像"卡住"）
  try{ startCard(item); }
  catch(e){
    try{ console.error('[bigscreen-card] start failed, skipped:', e && e.message ? e.message : e); }catch(_){}
    cardBusy = false;
    try{ if (cardActive && cardActive.el) cardActive.el.remove(); }catch(_){}
    cardActive = null;
    pumpCards();
  }
}

/* ---------- ★ 快速滚动定位（2026-11-05） ----------
   大屏正滚着的时候，"工序变了"的那个客户往往根本不在画面里。
   以前是「一步跳过去」（画面闪一下，客户来不及看到自己在哪儿）；
   现在改成「滚动条快速滑过去」——**滑到位了再开始卡片动画**，
   送回时也一样：先定位到目标行再落位（否则卡片飞到屏幕外，等于白演）。 */
const SEEK_MIN_MS = 200;    // 定位最短也要这么长（一眼能看清"在滚"）
const SEEK_MAX_MS = 560;    // 再远也不超过这么久（不能拖沓）

/* 取「跳位动画结束后」的最终位置：FLIP 跳位期间行身上挂着 translateY，
   直接量 rect 量到的是半路位置 → 定位会差一点。这里把当前位移减掉。 */
function rowFinalRect(tr){
  const r = tr.getBoundingClientRect();
  let ty = 0;
  /* ★ 按住中的行：transform 是钉死的旧位置 → **不减**，定位就锁在它现在的位置（观众看得见它）。
     正在跳位的行：transform 是动画中的位移 → 减掉它，量它跳完之后的落点。 */
  if (!tr.classList.contains("jumphold")){
    try{
      const tf = window.getComputedStyle(tr).transform;
      if (tf && tf !== "none"){
        const m = tf.match(/matrix\(([^)]+)\)/);
        if (m){
          const p = m[1].split(",").map(Number);
          if (p.length >= 6 && isFinite(p[5])) ty = p[5];   // matrix(a,b,c,d,e,f)：f = translateY
        }
      }
    }catch(e){}
  }
  return { top: r.top - ty, bottom: r.bottom - ty, height: r.height };
}

/* 算出「让这一行刚好进画面」要滚到哪儿；已经在画面里 → 返回 null（不用滚） */
function rowSeekTarget(tr){
  if (!boxEl || !tr) return null;
  const bRect = boxEl.getBoundingClientRect();
  const fr = rowFinalRect(tr);
  const max = Math.max(0, boxEl.scrollHeight - boxEl.clientHeight);
  let target = boxEl.scrollTop;
  if (fr.top < bRect.top + 4)              target = boxEl.scrollTop + (fr.top - bRect.top) - 8;
  else if (fr.bottom > bRect.bottom - 4)   target = boxEl.scrollTop + (fr.bottom - bRect.bottom) + 8;
  else return null;                            // 已经在画面里 → 不用定位
  target = Math.max(0, Math.min(max, target));
  if (Math.abs(target - boxEl.scrollTop) < 1) return null;
  return target;
}

/* 把滚动条快速滑到 target，**滑完**才回调 cb（没定位到位绝不开演） */
function seekScrollTo(target, cb){
  const from = boxEl.scrollTop;
  const dist = Math.abs(target - from);
  if (dist < 1){ cb(); return; }               // 本来就到位了
  const now = function(){ return (window.performance && performance.now) ? performance.now() : Date.now(); };
  const dur = Math.max(SEEK_MIN_MS, Math.min(SEEK_MAX_MS, 130 + dist * 0.5));
  const t0 = now();
  const raf = (typeof requestAnimationFrame === "function") ? requestAnimationFrame
           : function(cb2){ return setTimeout(function(){ cb2(0); }, 16); };
  const caf = (typeof cancelAnimationFrame === "function") ? cancelAnimationFrame
           : function(id){ clearTimeout(id); };
  let rafId = 0, bail = 0, done = false;
  const finish = function(){
    if (done) return;
    done = true;
    if (rafId) caf(rafId);
    if (bail) clearTimeout(bail);
    try { boxEl.scrollTop = target; } catch(e){}
    try { cb(); } catch(e){ console.error('[bigscreen-card] 定位完成回调出错:', e && e.message ? e.message : e); }
  };
  const step = function(){
    if (done) return;
    const p = Math.min(1, (now() - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);           // easeOutCubic：起步快、末尾稳
    boxEl.scrollTop = from + (target - from) * e;
    if (p >= 1) finish();
    else rafId = raf(step);
  };
  rafId = raf(step);
  bail = setTimeout(finish, dur + 300);        // 兜底：万一 rAF 掉了也一定往下走
}

/* ★ 送回专用定位（2026-11-06）：工序推进后这一行通常跳到表格最前几名，
   而屏幕还停在自动滚动的中间位置 —— 必须先把滚动条拉上去（前几名就是「拉到顶」），
   卡片才有一个看得见的落点。与 rowSeekTarget 不同：这里**无条件滚到位**，
   不因为「差得少 / 判定已在画面里」就短路。 */
function rowBackTarget(tr){
  if (!boxEl || !tr) return null;
  const bRect = boxEl.getBoundingClientRect();
  const fr = rowFinalRect(tr);
  const max = Math.max(0, boxEl.scrollHeight - boxEl.clientHeight);
  const rowH = Math.max(18, fr.height || 24);
  /* 行在「内容坐标」里的位置（与滚动无关） */
  const contentY = fr.top - bRect.top + boxEl.scrollTop;
  /* 让这一行落在可视区靠上 1/4 处；排在表格前段时自然被 clamp 到 0 ＝ 拉到顶 */
  let target = contentY - Math.max(rowH * 2, bRect.height * 0.22);
  return Math.max(0, Math.min(max, Math.round(target)));
}

/* 定位某一行；到位（或本来就在画面里）后回调 cb。
   mode === "back"：送回专用，强制拉到目标行（必要时拉到顶），且等一帧布局稳定再回调。 */
function seekRowIntoView(tr, cb, mode){
  const back = (mode === "back");
  const target = back ? rowBackTarget(tr) : rowSeekTarget(tr);
  if (target == null){ cb(); return; }
  if (Math.abs(target - boxEl.scrollTop) < 1){
    if (!back){ cb(); return; }
    /* 已经在位也要等一帧：确保 FLIP / 滚动 settle 之后再量终点坐标 */
    const next = (typeof requestAnimationFrame === "function") ? requestAnimationFrame
               : function(f){ return setTimeout(function(){ f(0); }, 16); };
    next(function(){ try { cb(); } catch(e){} });
    return;
  }
  seekScrollTo(target, cb);
}

function startCard(item){
  const tr = $("tbody").querySelector('tr[data-rid="' + item.id + '"]');
  if (!tr){ pumpCards(); return; }          // 行不在了（极端情况），跳过这张
  cardBusy = true;                           // ★ 先占住：定位期间也不许重绘（行引用必须保持有效）
  pauseScrollNoReset();                      // 先停自动滚动，下面要定位
  cardSeek = true;                           // ★ 定位中：自动滚动别来抢
  /* ★ 关键（2026-11-05）：客户不在画面里时，**先快速滚动定位到这一行，定位到位再开始动画**
     —— 原来是一步跳过去（客户根本来不及看到自己在哪儿），现在改成看得见的"滚动条滑过去"，
        滑到位了卡片才起飞。送回时同理（见 endCard）。 */
  seekRowIntoView(tr, function(){
    cardSeek = false;
    if (!tr.isConnected){                   // 极端情况：定位期间这一行被换掉了 → 放弃这张
      cardBusy = false;
      pumpCards();
      return;
    }
    /* ★ 锁定到位了 → 现在才让这一行跳到新名次：「装货中→已完成」这一跳当着观众的面发生；
       卡片同时从它原来的位置起飞（位置正好对得上那一行）。 */
    releaseJump(item.id);
    try { playCard(item, tr); }
    catch(e){
      console.error('[bigscreen-card] 卡片启动失败，已跳过:', e && e.message ? e.message : e);
      cardBusy = false;
      try { if (cardActive && cardActive.el) cardActive.el.remove(); }catch(_){}
      cardActive = null;
      pumpCards();
    }
  });
}

/* 定位完成 → 真正开始演卡片（从工序变动列取出 → 飞向屏幕正中 → 落回新格子） */
function playCard(item, tr){


  /* ★ 起点 = 旧位置那一行的「工序变动列」（进度条中心），按滚动差换算到当前视口 */
  const vw = window.innerWidth, vh = window.innerHeight;
  const cx = vw / 2, cy = vh / 2;
  const dScroll = (boxEl ? boxEl.scrollTop : 0) - PREV_SCROLL;
  const old = PREV_POS[item.id];
  const sx = (old && old.px) ? old.px : cx;  // 起点 x（工序条中心）
  const sy = (old && old.py) ? old.py - dScroll : cy;   // 起点 y（减去滚动差）

  const fromPct = Math.round((item.from / 3) * 100);
  const toPct   = Math.round((item.to   / 3) * 100);

  // 克隆表格（same colgroup + 同一行），卡片视觉与表格行完全一致
  const srcTbl = $("tbl");
  const colg = srcTbl.querySelector("colgroup");
  const el = document.createElement("div");
  el.className = "popcard";                  // 居中交给 CSS（left/top），宽度/字号下面按需算

  /* ★ 尺寸：卡片铺满屏宽（比原表更宽也行），字号靠改 font-size 放大 → 浏览器按新字号
     **重新排版渲染**，像素清晰、文字完整；**不用 transform:scale**（那才是「放大后像素差、
     文字被截断」的根源 —— 缩放是重采样，文字边缘会被插值糊掉）。
     列宽全是百分比 → 卡片变宽，列同比变宽 → 原本放不下的文字这次能显示全。 */
  const baseFs = parseFloat(getComputedStyle(srcTbl).fontSize) || 16;
  el.style.width = Math.max(320, vw - 48) + "px";
  el.style.maxWidth = "none";
  el.style.setProperty("--dx", (sx - cx) + "px");
  el.style.setProperty("--dy", (sy - cy) + "px");
  el.style.setProperty("--lx", ((sx - cx) * 0.62 - 40) + "px");   // 斜向飞起点：再往上/往左偏一点
  el.style.setProperty("--ly", ((sy - cy) * 0.62 - 120) + "px");

  const fromName = SL.STEP_NAME[item.from] || ("工序" + item.from);
  const toName   = SL.STEP_NAME[item.to]   || ("工序" + item.to);
  const fc = STEP_COLOR[item.from] || "#fff", tc = STEP_COLOR[item.to] || "#fff";
  el.innerHTML =
    '<div class="cbanner">' +
      '<span class="cfrom" style="color:' + fc + '">' + esc(fromName) + '</span>' +
      '<span class="carrow">▶</span>' +
      '<span class="cto" style="color:' + tc + '">' + esc(toName) + '</span>' +
    '</div>' +
    '<div class="cwrap">' +
      '<table class="ctbl">' + (colg ? colg.outerHTML : "") +
        '<tbody>' + tr.innerHTML + '</tbody></table>' +
      '<div class="csweep"></div>' +          // 整行扫过的橙金高光（模仿抽卡光爆）
    '</div>' +
    '<div class="cflash"></div>';             // ★ 金光爆：卡片白热闪一层（只动 opacity，不重绘卡片）

  // 流体条从"旧进度"起步，再慢慢涨到"新进度"（演示工序推进的过程，放慢到 2s）
  /* ★ 裁列：只留关键列（客户/单号/工序/吨位…），并把它们的宽度归一化 → 每列空间翻倍，
     字号就能真正放大到 CARD_FS 倍而**不被截断**；同时字号是改 font-size 重新排版渲染的，
     不是缩放 → 像素清晰。 */
  const ctbl0 = el.querySelector(".ctbl");
  if (ctbl0){
    /* ★ 裁列 + **按目标顺序重排**（thead / tbody / colgroup 三者必须同步，否则表头与数据错位）：
       CARD_KEEP 写的是"要保留的原列号"，重排后的顺序以 CARD_KEEP 数组顺序为准
       （内部屏 = 序号·客户·单号·工序·吨位），CARD_COLW 与之一一对应。
       ★ 之前只做"删列"不重排，保留下来的是原序（序号·客户·吨位·单号·工序），
         列宽按 CARD_COLW 依次发下去就**错位**了（工序格只拿到 16% → 文字挤爆）。 */
    const cg = ctbl0.querySelector("colgroup");
    if (cg){
      const cols = [...cg.querySelectorAll("col")];
      const picked = CARD_KEEP.map(i=>cols[i]).filter(Boolean);
      cols.forEach(c=>c.remove());
      picked.forEach((c,i)=>{ c.style.width = (CARD_COLW[i] != null ? CARD_COLW[i] : 20) + "%"; cg.appendChild(c); });
    }
    const ths = [...ctbl0.querySelectorAll("thead > tr > th")];
    if (ths.length){
      const pickedTh = CARD_KEEP.map(i=>ths[i]).filter(Boolean);
      ths.forEach(t=>t.remove());
      const trh = ctbl0.querySelector("thead > tr");
      pickedTh.forEach(t=>trh.appendChild(t));
    }
    const tds = [...ctbl0.querySelectorAll("tbody > tr > td")];
    if (tds.length){
      const pickedTd = CARD_KEEP.map(i=>tds[i]).filter(Boolean);
      tds.forEach(t=>t.remove());
      const trb = ctbl0.querySelector("tbody > tr");
      pickedTd.forEach(t=>trb.appendChild(t));
    }
    ctbl0.style.fontSize = (baseFs * CARD_FS).toFixed(2) + "px";
    // ★ 克隆过来的单元格里带着原表算好的内联 font-size（客户名自适应等）→ 会压过卡片新字号。
    //   这里清掉，让它们统一继承卡片字号（真正放大）；放不下的长文本再逐档微缩兜底。
    ctbl0.querySelectorAll("td, td *").forEach(n=>{ if(n.style && n.style.fontSize) n.style.fontSize = ""; });
    // 统一字号：非工序列的文本一律继承卡片字号（工序条内部保留它自己的设计字号）
    ctbl0.querySelectorAll("td > *").forEach(n=>{ if(!n.closest(".flw")) n.style.fontSize = "inherit"; });
    ctbl0.querySelectorAll("td").forEach(td=>{
      const cell = td.querySelector(".cust") || td.firstElementChild;
      if(!cell || !cell.clientWidth) return;
      let fs = parseFloat(getComputedStyle(cell).fontSize) || (baseFs * CARD_FS);
      let guard = 0;
      while(cell.scrollWidth > cell.clientWidth + 1 && fs > 13 && guard++ < 20){ fs -= 1; cell.style.fontSize = fs + "px"; }
    });
  }

  const fq = el.querySelector(".flq");
  if (fq){ fq.style.transition = "width .6s ease"; fq.style.width = (fromPct || 0) + "%"; }

  document.body.appendChild(el);
  tr.classList.add("srcslot");              // 新格子先留金框：卡片随后要送到这里
  cardActive = { id: item.id, el: el, row: tr };

  // 起点光球：进度条位置炸出橙金光，像"这一格被抽出来了"
  const sp = document.createElement("div");
  sp.className = "cspark";
  sp.style.left = sx + "px";
  sp.style.top  = sy + "px";
  document.body.appendChild(sp);
  setTimeout(function(){ try { sp.remove(); } catch(e){} }, 900);

  // 全屏遮罩：把后面表格完全隔开（动画出现后才浮现），让卡片干净突出
  const bd = document.createElement("div");
  bd.className = "cbackdrop";
  document.body.appendChild(bd);
  cardBackdrop = bd;

  void el.offsetWidth;                      // 强制重排：先锁定「起点小卡片」，下一帧再飞起，确保取出轨迹能演出来
  requestAnimationFrame(function(){
    bd.classList.add("show");
    el.classList.add("lift");                // 取出第一程：从工序条斜向飞起，橙金光爆拉满（慢动作，看得出从哪到哪）
    cardTimer2 = setTimeout(function(){
      el.classList.remove("lift");
      el.classList.add("pop");               // 取出第二程：落定屏幕正中、放大到最大
      /* ★ 金光爆（2026-11-05）：卡片白热闪一下 + 从卡片位置炸开一圈金色放射光芒 */
      const cfEl = el.querySelector(".cflash");
      if (cfEl) cfEl.classList.add("go");
      fireBurst();
      requestAnimationFrame(function(){
        if (fq) fq.style.width = (toPct || 6) + "%";   // 流体条慢慢涨到新进度
      });
    }, LIFT_MS);
  });

  cardTimer = setTimeout(endCard, POP_MS + CARD_HOLD);   // 取出 + 停留演示
}

/* ★ 金光爆（2026-11-05）：参照三国「寻访」抽卡特效 —— 卡片落到正中的瞬间，从卡片位置
   炸开一圈**金色放射光芒**（射线 + 火焰云雾），卡片同时白热闪一下。
   光芒是独立的 fixed 层（z-index 在遮罩之上、卡片之下），只动 transform/opacity：
   conic 渐变一次绘制后被合成器搬运，全程不重算高斯模糊 → 4K 大屏也不掉帧。 */
/* ★ 火焰贴图（2026-11-05）：照参考图画出「中心白热 + 一圈柔软火焰花瓣」的形态。
   —— 花瓣长短不一、角度带抖动、边缘化成火舌的软边，整体像一朵金色的火。
   —— 只画一次（canvas 一次性绘制），之后每次爆发直接 drawImage 复用；不碰 filter/blur 动画 → 零重算。 */
let FLAME_TEX = null;
function buildFlameTex(){
  const S = 1800;   // 贴图分辨率：4K 大屏上火焰铺到 ~2450px，1800 够清晰（生成仅 ~1ms）
  const raw = document.createElement("canvas");
  raw.width = S; raw.height = S;
  const g = raw.getContext("2d");
  const cx = S / 2, cy = S / 2;
  g.globalCompositeOperation = "lighter";        // 加色混合 → 火焰叠加更炽
  // ① 火焰花瓣（主体）：根部白热 → 中段金黄 → 尖端橙 → 全透。
  //    ★ 花瓣之间**必须留黑缝**——这是"火焰"和"直线射线"最大的区别：
  //      之前铺了一层大范围柔光，结果整个糊成一个橙色圆盘，花瓣全看不见了。
  const N = 14;
  const petals = [];
  for(let i = 0; i < N; i++){
    petals.push({
      ang: (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.18,   // 角度抖动，不呆板
      len: S * (0.30 + Math.random() * 0.17),                        // 花瓣长短不一
      wid: S * (0.042 + Math.random() * 0.034),                      // 花瓣胖瘦不一
    });
  }
  for(const p of petals){
    g.save();
    g.translate(cx, cy); g.rotate(p.ang);
    const lg = g.createLinearGradient(0, 0, p.len, 0);
    lg.addColorStop(0,    "rgba(255,255,252,1)");
    lg.addColorStop(0.07, "rgba(255,247,208,.95)");
    lg.addColorStop(0.26, "rgba(255,203,92,.66)");
    lg.addColorStop(0.55, "rgba(255,158,42,.30)");
    lg.addColorStop(0.82, "rgba(255,116,20,.09)");
    lg.addColorStop(1,    "rgba(255,110,20,0)");
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(p.len * 0.20, -p.wid * 1.05, p.len * 0.70, -p.wid * 0.55, p.len, 0);
    g.bezierCurveTo(p.len * 0.70, p.wid * 0.55, p.len * 0.20, p.wid * 1.05, 0, 0);
    g.fill();
    g.restore();
  }
  // ② 每瓣再叠一条更细更亮的"火芯"：让火舌中段有炽白高光
  for(const p of petals){
    g.save();
    g.translate(cx, cy); g.rotate(p.ang + (Math.random() - 0.5) * 0.05);
    const l2 = p.len * (0.55 + Math.random() * 0.30);
    const w2 = p.wid * 0.34;
    const lg = g.createLinearGradient(0, 0, l2, 0);
    lg.addColorStop(0,   "rgba(255,255,255,.80)");
    lg.addColorStop(0.3, "rgba(255,240,190,.42)");
    lg.addColorStop(1,   "rgba(255,200,110,0)");
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(l2 * 0.25, -w2, l2 * 0.75, -w2 * 0.5, l2, 0);
    g.bezierCurveTo(l2 * 0.75, w2 * 0.5, l2 * 0.25, w2, 0, 0);
    g.fill();
    g.restore();
  }
  // ③ 中心白热核（小而炽）
  const core = g.createRadialGradient(cx, cy, 0, cx, cy, S * 0.065);
  core.addColorStop(0,   "rgba(255,255,255,.95)");
  core.addColorStop(0.4, "rgba(255,244,200,.62)");
  core.addColorStop(1,   "rgba(255,210,120,0)");
  g.fillStyle = core; g.fillRect(0, 0, S, S);
  // ④ 整体柔化：一次性模糊（不是每帧）→ 把生硬边缘化成火舌的软边
  const out = document.createElement("canvas");
  out.width = S; out.height = S;
  const o = out.getContext("2d");
  o.filter = "blur(" + Math.round(S * 0.009) + "px)";
  o.drawImage(raw, 0, 0);
  o.filter = "none";
  // ⑤ 模糊后再补一次白热核，保持炽白中心
  const core2 = o.createRadialGradient(cx, cy, 0, cx, cy, S * 0.038);
  core2.addColorStop(0,   "rgba(255,255,255,.92)");
  core2.addColorStop(0.5, "rgba(255,248,220,.38)");
  core2.addColorStop(1,   "rgba(255,230,160,0)");
  o.fillStyle = core2; o.fillRect(0, 0, S, S);
  return out;
}

/* 页面空闲时先把贴图画好，爆发时零延迟 */
(function(){
  const warm = function(){
    try { if(!FLAME_TEX) FLAME_TEX = buildFlameTex(); }
    catch(e){ console.warn('[flame] build failed:', e && e.message, e && e.stack); }
    try { window.FLAME_TEX = FLAME_TEX; } catch(e){}
    try { window.buildFlameTex = buildFlameTex; } catch(e){ console.warn('[flame] expose failed:', e && e.message); }
  };
  // ★ 用 setTimeout 而不是 requestIdleCallback：本页有 3 秒轮询 + rAF 循环，浏览器几乎从不满闲，
  //   rIC 迟迟不触发 → 贴图到第一次爆发时才现画（会卡一下）。setTimeout 是确定性的。
  setTimeout(warm, 700);
})();

function fireBurst(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (!FLAME_TEX) { try { FLAME_TEX = buildFlameTex(); } catch(e){ return; } }
  const b = document.createElement("canvas");
  b.className = "cburst";
  b.width = FLAME_TEX.width; b.height = FLAME_TEX.height;
  b.getContext("2d").drawImage(FLAME_TEX, 0, 0);
  document.body.appendChild(b);
  void b.offsetWidth;                       // 先落位，下一帧再起播，保证动画从头走
  b.classList.add("go");
  setTimeout(function(){ try { b.remove(); } catch(e){} }, 1200);
}

function endCard(){
  if (!cardActive) return;
  const a = cardActive;

  /* ★ 送回阶段（2026-11-05）：目标行不在画面里时，**先快速滚动定位到它，定位到位再落位**
     —— 否则卡片会飞到屏幕外看不见，送回等于白演。 */
  const doBack = function(){
    if (cardActive === a) cardActive = null;
    /* ★ 终点 = 该行「工序推进后跳到的新格子」：FLIP 跳位已结束，此刻的 rect 就是最终位置 */
    const vw = window.innerWidth, vh = window.innerHeight;
    const cx = vw / 2, cy = vh / 2;
    let bx = 0, by = 0;
    if (a.row && a.row.isConnected){
      const nr = a.row.getBoundingClientRect();
      bx = (nr.left + nr.width / 2) - cx;
      by = (nr.top + nr.height / 2) - cy;
      /* ★ 终点绝不飞出画面（2026-11-06）：夹进 .box 的可视区。
         工序推进后这一行常跳到表格最顶，滚动若还没跟上，nr.top 是画面外的负值，
         卡片就会往上飞出去「看不见」。 */
      if (boxEl){
        const br = boxEl.getBoundingClientRect();
        const ty = Math.max(br.top + 26, Math.min(br.bottom - 26, nr.top + nr.height / 2));
        by = ty - cy;
      }
    }
    a.el.style.setProperty("--bx", bx + "px");
    a.el.style.setProperty("--by", by + "px");
    a.el.style.setProperty("--px", (bx * 0.5 - 20) + "px");   // 斜向抽出点：朝新格子方向
    a.el.style.setProperty("--py", (by * 0.5 - 70) + "px");
    a.el.classList.remove("pop");
    a.el.classList.add("pull");                // 送回第一程：从正中斜向抽出（慢动作，看得出回哪去）
    if (cardBackdrop){ cardBackdrop.classList.remove("show"); }  // 遮罩同步淡出
    cardTimer = setTimeout(function(){
      a.el.classList.remove("pull");
      a.el.classList.add("back");              // 送回第二程：落到新格子并淡出
      cardTimer2 = setTimeout(function(){
        try { a.el.remove(); } catch(e){}
        if (a.row) a.row.classList.remove("srcslot");   // 新格子的金框撤掉（镀金高亮仍在）
        if (cardBackdrop){ try { cardBackdrop.remove(); } catch(e){} cardBackdrop = null; }
        cardBusy = false;                         // ★ 卡片彻底收尾，才允许重绘表格
        if (cardQueue.length) pumpCards();        // 还有排队的就接着播（按序一个一个）
        else {                                    // 最后一张播完
          resumeScroll();                          // 恢复自动滚动
          if (pendingRender){ pendingRender = false; render(); }  // 播放期间积压的刷新现在补上
        }
      }, BACK_MS);
    }, PULL_MS);
  };

  if (a.row && a.row.isConnected){
    cardSeek = true;
    pauseScrollNoReset();
    seekRowIntoView(a.row, function(){
      cardSeek = false;
      doBack();
    }, "back");                     // ★ 送回专用：先把滚动条拉到目标行（表格前段＝拉到顶）
  } else {
    doBack();
  }
}


function render(){
  if (cardBusy){ pendingRender = true; return; }   // ★ 卡片正在播（含送回落位）：推迟本轮重绘，等它彻底结束再刷新。
  //   ★ 2026-11-04 修「卡片卡在表格上」：原来这里只判 cardActive，而 endCard 一开头就把 cardActive 置空，
  //   卡片却还要播 2 秒送回 → 这 2 秒里 render 插进来 → 表格重画把目标行替换掉 →
  //   旧卡片终点算成 (0,0) 飞到左上角卡住，同时新卡片又起一张 → 两张卡片叠在表格上。

  rows = SL.boardRows(RECORDS, PROG);

  const s = SL.boardStats(rows);

  const fp = rows.map(r => [r.ck, r.rk, r.s, r.car, r.cx, r.u, r.by, r.t, r.ct, r.bz].join(":")).join("|") + "#" + rows.length;

  $("kpis").innerHTML = kpiHtml(s);



  const empty = rows.length === 0;

  $("empty").style.display = empty ? "flex" : "none";

  $("tbl").style.display = empty ? "none" : "";

  if (empty){

    try {

      $("emptySub").textContent = (RECORDS.length

        ? "云端有 " + RECORDS.length + " 张已发布的单，但都不是今天的。"

        : "云端还没有已发布的发货单，请先在管理端点「发布」。");

    } catch(e){}

    lastFp = "";

    missCount = 0; updateMissNote();

    stopScroll();

    return;

  }

  if (rendered && fp === lastFp) return;      // 内容没变就不重绘（避免整屏闪烁）

  lastFp = fp;

  rendered = true;

  clearCards();          // 上一张卡片（若还在播）先撤掉，避免和新一轮重排错位

  fitRows(rows.length);

  /* 跳位动画：先把"重画前"每行的位置和名次量下来 */
  const flipPrev = snapshotRows();
  PREV_POS = flipPrev;                              // ★ 卡片起点（旧位置的工序条）从这里取
  PREV_SCROLL = boxEl ? boxEl.scrollTop : 0;

  missCount = 0;

  $("tbody").innerHTML = rows.map((r, i) => rowHtml(r, i)).join("");

  fitCodeFont();                       // 行出来了才知道这一列多宽，再定代码字号

  fitNoFont();                         // 单号必须完整：按实测宽度逐档降字号

  fitUpdFont();                        // 时间两列：单行放得下（不换行、不截断）

  updateMissNote();

  /* 这一轮里"工序往前走"的行 → 先识别出来：它们要弹卡片，不参与普通跳位 */
  const cardIds = detectStepUp(rows);

  /* 跳位动画：跟"重画前"比一比，挪了名次的那几行滑过去（弹卡片的行跳过，由卡片接管） */
  flipRows(rows, flipPrev, cardIds);

  /* 工序刚推进的行 → 金色光标 + 镀金（12 秒后自动褪去） */
  markHotRows(rows, cardIds);
  applyHot();

  /* 弹卡片：把"工序推进"的行拎出来变悬浮卡，演示"上一步 ▶ 下一步"后落回位置 */
  pumpCards();

  setupScroll();

}



/* ---------- 超出一屏 → 自动慢速循环滚动 ----------

   门口没人动鼠标：内容塞得下就静止，塞不下就慢慢往下滚，

   滚到底停几秒，再快速回到顶部停几秒，周而复始。

   有人滚轮/触屏干预时暂停 10 秒，别跟人抢屏幕。 */

const boxEl = document.querySelector(".box");

const SCROLL_SPEED = 26;        // 往下滚：26px/秒（慢，远远能看清）

const SCROLL_BACK  = 170;       // 回顶：快一些，别浪费时间

const WAIT_TOP_MS = 2200, WAIT_BOTTOM_MS = 3800, MANUAL_PAUSE_MS = 10000;

let sc = { on: false, raf: 0, last: 0, phase: "top", until: 0, manual: 0 };



function scrollStep(ts){

  if (!sc.on) return;

  const max = boxEl.scrollHeight - boxEl.clientHeight;

  if (max <= 4){ stopScroll(); return; }

  if (ts < sc.manual){ sc.last = ts; sc.raf = requestAnimationFrame(scrollStep); return; }

  if (sc.phase === "top"){

    if (ts >= sc.until){ sc.phase = "down"; sc.last = ts; }

  } else if (sc.phase === "down"){

    const dt = Math.min(0.1, (ts - sc.last) / 1000); sc.last = ts;

    boxEl.scrollTop = Math.min(max, boxEl.scrollTop + SCROLL_SPEED * dt);

    if (boxEl.scrollTop >= max - 1){ sc.phase = "bottom"; sc.until = ts + WAIT_BOTTOM_MS; }

  } else if (sc.phase === "bottom"){

    if (ts >= sc.until){ sc.phase = "back"; sc.last = ts; }

  } else {                                        // back：快速回到顶部

    const dt = Math.min(0.1, (ts - sc.last) / 1000); sc.last = ts;

    boxEl.scrollTop = Math.max(0, boxEl.scrollTop - SCROLL_BACK * dt);

    if (boxEl.scrollTop <= 0){ sc.phase = "top"; sc.until = ts + WAIT_TOP_MS; }

  }

  sc.raf = requestAnimationFrame(scrollStep);

}

function stopScroll(){

  sc.on = false;

  if (sc.raf) cancelAnimationFrame(sc.raf);

  sc.raf = 0;

  boxEl.scrollTop = 0;

}

function setupScroll(){

  if (cardBusy || cardActive || cardSeek) return;   // 卡片播放/定位期间不抢滚动（由卡片自己暂停）

  const max = boxEl.scrollHeight - boxEl.clientHeight;

  if (max <= 4){ stopScroll(); return; }

  if (sc.on) return;                             // 已经在滚就不用重启（避免每次拉取都从头来）

  sc.on = true; sc.phase = "top"; sc.until = performance.now() + WAIT_TOP_MS; sc.last = 0;

  sc.raf = requestAnimationFrame(scrollStep);

}



/* 暂停滚动但**不**把滚动条弹回顶部（截图/卡片动画期间用，结束后由 resumeScroll 恢复） */

function pauseScrollNoReset(){ sc.on = false; if (sc.raf) cancelAnimationFrame(sc.raf); sc.raf = 0; }

function resumeScroll(){ if (boxEl.scrollHeight - boxEl.clientHeight > 4) setupScroll(); }



/* ---------- 时钟 / 全屏 / 隐藏光标 ---------- */

function tickClock(){

  const d = new Date();

  const p = (n) => String(n).padStart(2, "0");

  $("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());

  const wd = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];

  /* 顶部要挤成一行：日期只留「09月19日 周六」，年份那截挪进 title（鼠标放上去看全） */

  $("cdate").textContent = p(d.getMonth() + 1) + "月" + p(d.getDate()) + "日 周" + wd;

  $("cdate").title = d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 星期" + wd;

}



let idleTimer = 0;

function pokeCursor(){

  document.body.classList.remove("hidecur");

  clearTimeout(idleTimer);

  idleTimer = setTimeout(() => {

    if (document.body.classList.contains("fs")) document.body.classList.add("hidecur");

  }, 8000);

}



function toggleFs(){

  const el = document.documentElement;

  if (!document.fullscreenElement){

    const p = el.requestFullscreen ? el.requestFullscreen()

      : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);

    if (p && p.catch) p.catch(() => alert("浏览器不允许自动全屏：请按 F11 手动全屏。"));

    else if (!p) alert("这个浏览器不支持自动全屏：请按 F11 手动全屏。");

  } else {

    document.exitFullscreen && document.exitFullscreen();

  }

}

function onFsChange(){

  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);

  document.body.classList.toggle("fs", on);

  $("fsBtn").textContent = on ? "⛶ 退出全屏" : "⛶ 全屏显示";

  stopScroll(); fitRows(rows.length); fitCodeFont(); fitNoFont(); fitUpdFont(); setupScroll();   // 全屏切换字号变了，滚动要重新量

  pokeCursor();

}



/* ---------- 启动 ---------- */

function boot(){

  if (window.CloudSync){

    CloudSync.init();

    try { if (CloudSync.guard) CloudSync.guard(SL.KEY_PROG, SL.guardFn); } catch(e){}

  }

  loadLocal();

  $("fsBtn").onclick = toggleFs;

  document.addEventListener("fullscreenchange", onFsChange);

  document.addEventListener("webkitfullscreenchange", onFsChange);

  document.addEventListener("mousemove", pokeCursor);

  document.addEventListener("touchstart", pokeCursor);

  window.addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") toggleFs(); });

  window.addEventListener("resize", () => { stopScroll(); fitRows(rows.length); fitCodeFont(); fitNoFont(); fitUpdFont(); setupScroll(); });

  // 有人手动滚了（滚轮/触屏），自动滚动让路 10 秒

  boxEl.addEventListener("wheel", () => { sc.manual = performance.now() + MANUAL_PAUSE_MS; }, { passive: true });

  boxEl.addEventListener("touchstart", () => { sc.manual = performance.now() + MANUAL_PAUSE_MS; }, { passive: true });

  window.addEventListener("online", () => { if (!nightPaused()) pull(); });

  tickClock(); setInterval(tickClock, 1000);

  pokeCursor();

  pull();

  setInterval(() => {
    if (document.hidden) return;
    if (nightPaused()){ setSync("🌙 夜间 23:30–7:30 省流量 · 已暂停刷新", "ok"); return; }
    if (pullingProg) return;                       // 3s 轮询：上一轮没回就跳过本轮，避免并发戳查询/重复渲染
    pullingProg = true;
    pull().finally(() => { pullingProg = false; });
  }, POLL_MS);

  document.addEventListener("visibilitychange", () => { if (!document.hidden && !nightPaused()) pull(); });
  window.addEventListener("focus", () => { if (!document.hidden && !nightPaused()) pull(); });      // 窗口重新获得焦点也立刻刷新（2026-10-15，对齐扫码页）
  window.addEventListener("pageshow", () => { if (!document.hidden && !nightPaused()) pull(); });    // 从后台/bfcache 回来也立刻刷新
const APP_VER = "20261106a";   // ★ 本页版本：改动本页内联逻辑必须 bump，ver.json 的 door 字段同步改

if (SL.verWatch) SL.verWatch({ field: "door", pageVer: APP_VER });   // 线上版本自检：scan-lib + 本页版本，变了自动重载（2026-10-30 加固）


  // 长时间挂着的大屏：每天凌晨 4 点自动重载一次，清掉累积的内存/定时器

  setInterval(() => {

    const d = new Date();

    if (d.getHours() === 4 && d.getMinutes() < 1) location.reload();

  }, 60000);

}

boot();
