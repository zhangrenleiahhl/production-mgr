<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>物流进度大屏（门口 · 保密）</title>

<script src="supabase.min.js?v=lib"></script>

<script src="cloud-config.js?v=20260920a"></script>

<script src="cloud-sync.js?v=20260922d"></script>

<script src="scan-lib.js?v=20260924g"></script>

<style>

  /* ==========================================================================

     物流门口大屏 · 保密版（只读，摆在物流门口给现场远远地看）

     --------------------------------------------------------------------------

     【本页存在的唯一理由：保密】

       现场涉及保密，所以这一屏：

         · **一律不显示送达方名称**，只显示「送达方代码」；

         · **不带「物流」列**（哪家承运、走哪条线，不铺在门口）。

       ★ 硬规则：查不到代码就显示占位「未编代码」，**绝不回落到客户名** ——

         保密不能留后门（少显示一条信息，也不能多露一个字）。

       ★ 代码从哪来（三级，前一级优先）：

         ① 发布时已经刻进记录行的 custcode（最准，日后改物料库也不影响已发布的单）

         ② 物料库按「型号」匹配（同型号可能对应多个送达方时取第一个有代码的）

         ③ 物料库按「客户名」匹配（型号换了但客户没换时兜底）

       物料库（shipping_db_v1）本身在云端同步范围内，所以这一屏在任何一台机器上

       都能自己把代码查出来，不依赖这台机器有没有导过库。

     --------------------------------------------------------------------------

     【与内部看板（物流大屏.html）的关系】

       两屏共用同一份口径：「取哪些行 / 什么算完成 / 怎么排序」全部来自 scan-lib.js

       的 boardRows，配色、字号自适应、自动滚动也是同一套实现 —— 只是这一屏

       把「客户 / 送达方」换成「送达方代码」，并去掉了物流列。

       内部要看送达方全名的，用物流大屏.html（请勿摆在物流门口）。

     ========================================================================== */

  :root{

    --bg:#0a0e15;

    --panel:rgba(255,255,255,.032);

    --line:rgba(148,163,184,.16);

    --txt:#f2f6fc; --muted:#a9b8cf; --dim:#6d7d99;

    --cyan:#38c8d8; --green:#3ddc97; --amber:#ffb454; --red:#ff5d5d; --blue:#5b8def;

    --rows:14;

  }

  *{box-sizing:border-box;}

  html,body{margin:0;height:100%;}

  body{

    font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;

    color:var(--txt); font-variant-numeric:tabular-nums; overflow:hidden;

    background:

      radial-gradient(1100px 560px at 12% -10%, rgba(56,140,216,.10), transparent 60%),

      linear-gradient(180deg,#0a0e15 0%,#0d131d 46%,#0a0e15 100%);

    background-attachment:fixed;

  }

  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;

    background-image:linear-gradient(rgba(148,180,220,.03) 1px, transparent 1px),

                     linear-gradient(90deg, rgba(148,180,220,.03) 1px, transparent 1px);

    background-size:44px 44px;

    mask-image:radial-gradient(circle at 50% 16%, #000 0%, transparent 82%);

    -webkit-mask-image:radial-gradient(circle at 50% 16%, #000 0%, transparent 82%);}



  .wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:10px 20px 10px;}



  /* ============ 顶部 HUD ============ */

  .hud{

    /* ★ 一行到底（2026-09-19）：原来 flex-wrap:wrap，笔记本一缩放就掉成 3 行，

       白占掉两行表格高度。现在 nowrap + 各段尺寸都用 clamp(小, vw, 大)，

       窄屏自动缩、宽屏跟原来一样大。 */

    flex:0 0 auto;position:relative;display:flex;align-items:center;flex-wrap:nowrap;

    gap:clamp(6px,.72vw,15px);

    padding:5px clamp(9px,.9vw,18px);margin-bottom:8px;border-radius:14px;overflow:hidden;

    background:linear-gradient(100deg,rgba(56,200,216,.08),rgba(91,141,239,.05) 45%,rgba(255,255,255,.02));

    border:1px solid rgba(56,200,216,.22);

    box-shadow:0 12px 40px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);

    backdrop-filter:blur(16px);

  }

  .hud::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;

    background:linear-gradient(90deg,transparent,rgba(56,200,216,.7),transparent);}

  .hud::after{content:"";position:absolute;top:-60%;left:-10%;width:34%;height:220%;

    background:linear-gradient(90deg,transparent,rgba(56,200,216,.07),transparent);

    transform:rotate(18deg);animation:sweep 7s linear infinite;pointer-events:none;}

  @keyframes sweep{0%{left:-20%}100%{left:120%}}

  .logo{width:clamp(22px,1.9vw,32px);height:clamp(22px,1.9vw,32px);flex:0 0 auto;

    border-radius:clamp(6px,.55vw,9px);display:flex;align-items:center;justify-content:center;

    font-size:clamp(11px,.95vw,16px);background:linear-gradient(140deg,#38c8d8,#5b8def);color:#04101c;

    box-shadow:0 0 18px rgba(56,200,216,.35);}

  /* 标题块压成一行：原来标题下面还有一行灰色小字说明 —— 那些话页脚已经全说了，

     挤在头上只会多占一行（窄屏就更明显）。整句说明挪到 title，鼠标放上去还能看全。 */

  .tt{flex:0 1 auto;min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap;}

  .tt .t{font-size:clamp(12.5px,1vw,17px);font-weight:800;letter-spacing:.6px;white-space:nowrap;

    overflow:hidden;text-overflow:ellipsis;}

  .tt .tag{font-size:clamp(8.5px,.6vw,10.5px);font-weight:800;letter-spacing:.5px;color:#9fe8ff;

    padding:1px 5px;border-radius:5px;background:rgba(56,200,216,.14);border:1px solid rgba(56,200,216,.34);}



  /* 「保密」徽章：让现场一眼确认摆的是保密版那一屏（而不是内部看板） */

  .secbadge{display:inline-flex;flex:0 0 auto;align-items:center;gap:4px;padding:2px clamp(5px,.55vw,10px);border-radius:999px;

    font-size:clamp(8.5px,.64vw,11px);font-weight:800;letter-spacing:.5px;white-space:nowrap;

    background:rgba(61,220,151,.13);color:#a9f2d3;border:1px solid rgba(61,220,151,.34);}



  .kpis{display:flex;gap:clamp(4px,.45vw,9px);flex-wrap:nowrap;margin-left:2px;min-width:0;}

  .kpi{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;flex:0 0 auto;

    padding:2px clamp(6px,.6vw,12px);min-width:0;position:relative;overflow:hidden;}

  .kpi i{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);opacity:.85;}

  .kpi b{display:block;font-size:20px;font-weight:800;line-height:1.12;}

  .kpi span{display:block;font-size:clamp(8.5px,.6vw,10.5px);color:var(--muted);letter-spacing:.4px;white-space:nowrap;}

  .kpi.red i{background:var(--red);} .kpi.red b{color:var(--red);}

  .kpi.amber i{background:var(--amber);} .kpi.amber b{color:var(--amber);}

  .kpi.green i{background:var(--green);} .kpi.green b{color:var(--green);}



  .spacer{flex:1 1 auto;min-width:0;}

  .ctrl{display:flex;flex:0 0 auto;align-items:center;gap:6px;}

  .ctrl button{background:rgba(34,211,238,.13);border:1px solid rgba(34,211,238,.42);color:var(--txt);

    padding:3px clamp(6px,.7vw,12px);border-radius:8px;font-size:clamp(9.5px,.72vw,12.5px);font-weight:700;

    cursor:pointer;font-family:inherit;letter-spacing:.4px;white-space:nowrap;}

  .ctrl button:hover{background:rgba(34,211,238,.24);}

  /* 时间 / 日期 / 同步状态**摊在同一行**（原来竖着三行，等于白占两行高） */

  .clock{display:flex;flex:0 0 auto;align-items:baseline;gap:clamp(6px,.6vw,11px);white-space:nowrap;}

  .clock b{font-size:clamp(15px,1.42vw,23px);font-weight:800;letter-spacing:1px;line-height:1;}

  .clock span{font-size:clamp(9px,.62vw,11px);color:var(--dim);letter-spacing:.6px;}

  .sync{letter-spacing:.4px;}

  .sync.ok{color:var(--green);} .sync.warn{color:var(--amber);} .sync.err{color:var(--red);}



  /* ============ 主体表格 ============ */

  .box{flex:1 1 auto;min-height:0;position:relative;border-radius:16px;overflow:auto;

    border:1px solid var(--line);background:var(--panel);box-shadow:0 12px 40px rgba(0,0,0,.38);}

  table{width:100%;border-collapse:collapse;table-layout:fixed;}

  thead th{

    position:sticky;top:0;z-index:2;

    font-size:12.5px;color:var(--muted);font-weight:700;text-align:left;

    padding:9px 12px;letter-spacing:1px;background:rgba(9,14,26,.96);

    border-bottom:1px solid var(--line);white-space:nowrap;

  }

  tbody td{padding:var(--rowpad,8px) 12px;border-bottom:1px solid rgba(120,180,255,.09);

    font-size:var(--rowfs,17px);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}



  /* 每道工序一种颜色（左细条 + 极淡同色底），一眼分清走到哪一步：

     货待确认=红 · 货好=青 · 装货中=琥珀 · 已完成=绿（红只是标记，正文保持清晰） */

  tr.st0{background:linear-gradient(90deg,rgba(255,93,93,.075),rgba(255,93,93,.02) 55%,transparent);}

  tr.st0 td:first-child{box-shadow:inset 4px 0 0 var(--red);}

  tr.st1{background:linear-gradient(90deg,rgba(56,200,216,.07),rgba(56,200,216,.02) 55%,transparent);}

  tr.st1 td:first-child{box-shadow:inset 4px 0 0 var(--cyan);}

  tr.st2{background:linear-gradient(90deg,rgba(255,180,84,.07),rgba(255,180,84,.02) 55%,transparent);}

  tr.st2 td:first-child{box-shadow:inset 4px 0 0 var(--amber);}

  /* st3 = 工序已经走完、但车还没到（所以不算 done）：淡一档的绿 ——

     之前只有 st0/st1/st2/done 四档，st3 这一档漏了色条，整行看着像"没着色"。 */

  tr.st3{background:linear-gradient(90deg,rgba(61,220,151,.045),rgba(61,220,151,.015) 55%,transparent);}

  tr.st3 td:first-child{box-shadow:inset 4px 0 0 rgba(61,220,151,.5);}

  tr.done{background:linear-gradient(90deg,rgba(61,220,151,.07),transparent 62%);}

  tr.done td:first-child{box-shadow:inset 4px 0 0 var(--green);}

  tr.done .cust{color:#c9d6e8;}



  /* 送达方代码：这一屏最关键的信息，字号**专门放大**（整行的 1.5 倍，门口远远地看数字不会串行）。

     倍数走 --coder（由 fitCodeFont 按列宽实测定，塞不下会自动降一档，绝不让省略号把代码截断）；

     CSS 里这个 1.5 只是脚本没跑起来时的兜底值。 */

  /* ★ 2026-09-17 用户要求「再加大」：这一列的字号已经到了"能多大就多大"的算法上限，

     真正压着它的是**行高配额**（一行高过配额整屏就要滚）。所以这里把这一列白白占掉的高度

     全部让给字号 —— 等宽数字没有下伸部，行高贴到 1.0 也不会切到字；上下内边距同理，

     只剩 2px 做视觉留白。腾出来的高度全给 fitCodeFont 去放大字号。 */

  .cust{font-size:calc(var(--rowfs,17px) * var(--coder,1.5));line-height:1;

    font-weight:800;letter-spacing:1px;color:var(--txt);

    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;}

  .cust.miss{font-family:inherit;font-weight:700;letter-spacing:.3px;color:var(--dim);}

  /* 最后的保险（2026-09-17）：真遇到"缩到最小也放不下"的超长代码，宁可折成两行，

     也绝不让省略号吃掉一位 —— 门口把 10017388 看成 1001… 比不显示还糟。

     平时不开（折行会让行变高），只在 fitCodeFont 试完所有档位都塞不下时才加上 body.codewrap。 */

  body.codewrap .cust{white-space:normal;overflow-wrap:anywhere;letter-spacing:.5px;}

  /* 代码这一格的上下内边距单独收紧（其它列照旧保留 --rowpad 的呼吸感）：

     这一列永远是全行最高的，它的内边距就是"从字号嘴里抢走的行高"。

     ★ 2026-09-21 状态列删掉后，代码是第 1 格 */

  tbody td:nth-child(1){padding-top:2px;padding-bottom:2px;}

  /* 单号（2026-09-17 起从代码格里分出来，独占一列）：单号本身用等宽字体，

     后面跟的计划员姓名真名显示（★ 2026-09-23 老板要求恢复姓名，打码已删）——

     一眼分清哪段是单号、哪段是人名 */

  /* ★ 2026-09-23：单号必须完整（同内部屏）。改成 inline-flex，单号自己优先占位、

     字号由 fitNoFont 按实测降档；后面的名字放不下先缩字号（2026-09-24 恢复显示）。 */

  /* 容器不用 gap（gap 不参与收缩，计划员缩到 0 后间隙还占着）—— 间距交给 .pl */

  .no{display:inline-flex;align-items:baseline;max-width:100%;color:var(--muted);

    font-size:.72em;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;

    vertical-align:baseline;}

  /* 单号不收缩、优先占够空间；名字绝不换行（放不下先缩字号，2026-09-24） */

  .no .sn{flex:0 0 auto;white-space:nowrap;font-weight:700;color:#c9d6e8;

    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;letter-spacing:.2px;}

  body.nowrap .no .sn{white-space:normal;overflow-wrap:anywhere;line-height:1.15;}

  .no .pl{flex:0 1 auto;min-width:0;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .no .sep{color:var(--dim);margin:0 3px;}

  .ton{font-weight:800;font-size:1.12em;}

  .ton s{text-decoration:none;font-size:.62em;color:var(--dim);font-weight:600;margin-left:2px;}



  /* ============ 工序 · 流体进度条（2026-09-17）============

     把原来的「四个圆点 + 工序名徽章」换成一条**会流动的液体进度条**：

     · 左侧液体按工序进度涨（0% / 33% / 67% / 100%）；

     · 液面一直在轻轻起伏，液体内部有流光在走，看着像液体在流；

     · 液面右缘有一点"奔向下一道工序"的脉动光（颜色 = 下一道工序的颜色）；

     · 右侧是进度百分比（数字比液体准，够大，远处一眼读）。

     四道工序四种液体：待确认红 · 货好青 · 装货中琥珀 · 已完成绿（与整行底色同一套色）。

     ★ 这一格的上下内边距收到 0（见下面 tbody td:nth-child(4)）：

       进度条自带高度，让它"吃自己的"内边距，整行高度仍由别的列说了算，

       不许它把行顶高（行一高，整屏就要滚，门口能看到的单子就少了）。 */

  .flw{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.45em;

    height:1.62em;padding:0 .5em 0 .66em;border-radius:999px;overflow:hidden;

    background:rgba(6,10,18,.9);font-size:.9em;line-height:1;white-space:nowrap;

    box-shadow:inset 0 0 0 1px rgba(148,163,184,.26), inset 0 1px 0 rgba(255,255,255,.06), 0 2px 10px rgba(0,0,0,.42);

    /* 液面波浪的图案（内联 SVG，不依赖任何外部文件）：宽 13 / 高 26，

       左半实心、右边鼓出两个波峰；竖向重复时上下无缝，所以能一直往下滚。 */

    --wvm:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='60'><path d='M0 0H6C17 4 17 9 6 13L6 20C11 24 11 28 6 31L6 38C19 44 19 50 6 52L6 60H0Z' fill='%23fff'/></svg>");

    --wvm2:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='48'><path d='M0 0H7C22 6 22 12 7 17L7 26C16 30 16 34 7 38L7 48H0Z' fill='%23fff'/></svg>");}

  /* 液体本体：宽度 = 进度。左端跟着胶囊的圆角走，右缘靠 ::after 那个自转的椭圆化出波纹 */

  .flq{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);

    background:linear-gradient(90deg,var(--f1),var(--f2));

    box-shadow:0 0 16px -2px var(--fglow);filter:saturate(1.2);}

  .flq::before{content:"";position:absolute;inset:0;opacity:.4;

    background:repeating-linear-gradient(96deg,rgba(255,255,255,.20) 0 2px,transparent 2px 10px);

    animation:flflow 2.4s linear infinite;}

  @keyframes flflow{to{transform:translateX(10px)}}

  .flq::after{content:"";position:absolute;inset:0;opacity:.16;

    background:repeating-linear-gradient(74deg,rgba(255,255,255,.16) 0 3px,transparent 3px 14px);

    animation:flflow2 5.2s linear infinite;}

  @keyframes flflow2{to{transform:translateX(-14px)}}

  /* 液面：液体右缘的**波浪边** —— 上面那张 SVG 波浪贴在这里，

     往左压 6px（正好让图案里的"实心段"在 --w 处结束），于是液体的右缘形状**就是**

     那条波浪线；再让它慢慢往下走一个周期 = 液面在起伏。

     ★ 别用"自转椭圆"那套（第一版试过）：椭圆会鼓到液体右边变成一个球，看着像浮了颗蛋。

     ★ 也别把波做小：周期 26px / 波幅 3px 那版（第二版）在 38px 高的胶囊里只有 1.5 个波，

       看着是"扇贝花边"。现在的 20px 周期 / 7.5px 波幅才有液面的样子。

     液面正中的那盏灯 = 「下一道工序」（颜色 = 下一道工序色）：四步

     货待确认 → 货好(青) → 装货中(琥珀) → 已完成(绿)。 */

  .flnx{position:absolute;top:0;bottom:0;left:var(--w,0%);width:18px;margin-left:-6px;

    background-color:var(--f1);

    -webkit-mask-image:var(--wvm);mask-image:var(--wvm);

    -webkit-mask-size:18px 60px;mask-size:18px 60px;

    -webkit-mask-repeat:repeat-y;mask-repeat:repeat-y;

    -webkit-mask-position:0 0;mask-position:0 0;

    animation:flwave 5.2s linear infinite;}

  @keyframes flwave{to{-webkit-mask-position:0 60px;mask-position:0 60px;}}

  /* 第二层波浪：周期/相位/速度都跟主波不同，两层叠加 → 不规则的水面（自然感） */

  .flnx2{position:absolute;top:0;bottom:0;left:var(--w,0%);width:24px;margin-left:-13px;

    background-color:var(--f1);opacity:.55;

    -webkit-mask-image:var(--wvm2);mask-image:var(--wvm2);

    -webkit-mask-size:24px 48px;mask-size:24px 48px;

    -webkit-mask-repeat:repeat-y;mask-repeat:repeat-y;

    -webkit-mask-position:0 0;mask-position:0 0;

    animation:flwave2 3.9s linear infinite;}

  @keyframes flwave2{to{-webkit-mask-position:0 48px;mask-position:0 48px;}}

  /* 这盏灯挪到**波浪外侧**（液体右边、深色区里）：第一版它压在波浪正中，

     9px 的光晕会把波浪整个染成"下一步"的颜色（橙色液体上浮出一条黄绿边）。 */

  .flnx::after{content:"";position:absolute;right:-4px;top:0;bottom:0;width:2px;

    background:linear-gradient(180deg,transparent,var(--nc),transparent);

    box-shadow:0 0 7px 0 var(--nc);opacity:.92;animation:flpulse 1.6s ease-in-out infinite;}

  .flnx.c1{--nc:var(--cyan);} .flnx.c2{--nc:var(--amber);} .flnx.c3{--nc:var(--green);}

  @keyframes flpulse{0%,100%{opacity:.25;} 50%{opacity:1;}}

  /* 液体颜色：左亮右暗（像光从左打进液体里），与整行底色同一套色系 */

  .flw.s0{--f1:#ff5d5d;--f2:#6d1120;--fglow:rgba(255,93,93,.55);}

  .flw.s1{--f1:#38c8d8;--f2:#0f4f6d;--fglow:rgba(56,200,216,.5);}

  .flw.s2{--f1:#ffb454;--f2:#7d4306;--fglow:rgba(255,180,84,.5);}

  .flw.s3{--f1:#3ddc97;--f2:#0d6448;--fglow:rgba(61,220,151,.5);}

  /* 仪表盘 HUD 同款「从左到右的高亮光标」（2026-09-24）：扫过还没走完的三种状态

     （货待确认 0 / 货好 1 / 装货中 2）；已完成 3 不扫（满进度不用再催）。

     光带压在液体上、工序名/百分比文字之下（文字 z-index:1），.flw 的 overflow:hidden 负责裁边。 */

  .flw.s0::after,.flw.s1::after,.flw.s2::after{content:"";position:absolute;top:-20%;bottom:-20%;

    left:-45%;width:55%;pointer-events:none;

    background:

      linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%),

      linear-gradient(100deg,transparent 0%,rgba(255,255,255,.12) 38%,rgba(255,255,255,.12) 62%,transparent 100%);

    transform:translateX(0) skewX(-16deg);will-change:transform,opacity;

    animation:flsweep 4.6s cubic-bezier(.6,.05,.4,.95) infinite;}

  @keyframes flsweep{0%{transform:translateX(0) skewX(-16deg);opacity:0}

    10%{opacity:1}86%{opacity:1}

    100%{transform:translateX(300%) skewX(-16deg);opacity:0}}

  /* 压在液体上面的字：工序名在左、百分比在右，都带投影，泡在液体里也读得清 */

  .flt{position:relative;z-index:1;font-weight:800;letter-spacing:.6px;color:#eef4ff;

    text-shadow:0 1px 4px rgba(0,0,0,.8);}

  .flp{position:relative;z-index:1;font-size:1.3em;font-weight:800;letter-spacing:.4px;color:#fff;

    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;

    text-shadow:0 1px 5px rgba(0,0,0,.85);}

  /* 工序列上下内边距收到 0：进度条"吃自己的"内边距，不许把行顶高（门口/内部两屏同一口径）

     ★ 2026-09-21 状态列删掉后，工序从第 5 格变成第 4 格 */

  tbody td:nth-child(4){padding-top:0;padding-bottom:0;}

  @media (prefers-reduced-motion:reduce){.flq::before,.flq::after,.flnx,.flnx2,.flnx::after,.flw.s0::after,.flw.s1::after,.flw.s2::after{animation:none;}}

  /* 状态列已删（2026-09-21）：工序状态只由「行底色 + 左色条 + 工序流体条」表达，

     旧的 .pill 状态徽章跟着状态列一起移除（不留死样式） */



  .car{font-weight:800;}

  .car.on{color:var(--green);} .car.off{color:var(--amber);font-weight:700;}

  tr.done .car.off{color:#94a3b8;font-weight:600;}

  .carx{color:#ff4d4f;font-weight:800;letter-spacing:1px;}

  .tm{font-size:.74em;color:var(--muted);} .tm s{text-decoration:none;color:var(--dim);}

  .bzon{color:var(--green);font-weight:800;}

  /* 品一质保书（2026-09-24 上色，跟车辆列同一套）：已备好=绿、未确认=琥珀；

     已完成的行里「未确认」转灰（跟 tr.done .car.off 同一口径，别再催已走完的单） */

  .bzoff{color:var(--amber);font-weight:700;}

  tr.done .bzoff{color:#94a3b8;font-weight:600;}

  /* 时间两列（工序更新 7 / 车辆更新 8，2026-09-24 换位后）绝不换行也绝不被切：

     全局 td 本就是 nowrap+省略号；字号由 fitUpdFont 逐格量宽自动降（下限 55%）。 */

  .stale{display:inline-block;padding:0 7px;border-radius:5px;font-size:.76em;font-weight:800;

    background:rgba(255,180,84,.22);color:#ffd9a0;border:1px solid rgba(255,180,84,.4);margin-right:6px;}



  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;

  /* 全屏时字号再放大一档（门口距离更远） */

  /* 窄屏兜底（有些笔记本 175% 缩放，CSS 宽度只有 ~1100px）：

     顶部永远一行 —— 先收字距、再丢日期，绝不换行、绝不把 KPI 挤到第二行 */

<body>

           「工序」「车辆」两个状态列相邻靠前，后面跟「品一质保书」；

    <span class="k" style="margin-left:auto">送达方仅显示代码 · 不显示物流 · 每 2 分钟自动刷新 · 超出一屏自动慢速滚动</span>

<script>

/* ==========================================================================

   物流门口大屏 · 保密版（只读）

   设计要点：

   1. 保密是这一屏的硬约束：**送达方只出代码，不出名称**；也不出物流。

      查不到代码就显示「未编代码」占位，绝不回落到客户名 —— 宁可少显示，

      也不能因为"查不到"就把名字漏出去。

   2. 「取哪些行、什么算没走完、怎么排序」全部来自 scan-lib.js 的 boardRows ——

      和手机端、管理端、内部看板用的是同一份实现。几处数字不可能对不上。

   3. 本页**永远不写**任何数据。只读，避免门岗手滑把进度点了。

   4. 字号按行数自动缩放 + 全屏再加一档，保证整屏不滚动、站在门口能看清。

   ========================================================================== */

const SL = window.ScanLib;

const $ = (id) => document.getElementById(id);

const esc = SL.esc, raw = SL.raw;

const POLL_MS = 120000;

const FETCH_MS = 15000;              // 云端拉取超时（别让一次卡住的请求把整屏拖死）



const KEY_DB = SL.KEY_DB;

const KEY_PLANS_STAMP = "shipping_plans_stamp_v1", KEY_DB_STAMP = "shipping_db_stamp_v1";            // 物料库（含送达方代码）—— 用于把客户名换成代码



let RECORDS = [];

let PROG = {};

let DB = [];                         // 物料库

let IDX = { byModel: {}, byCust: {} };   // 代码索引（型号→代码 / 客户名→代码），由 scan-lib 构建

let rows = [];

let lastFp = "";

let rendered = false;

let missCount = 0;                   // 本次渲染里有几条查不到代码（页脚提醒去补）

let okCount = 0, badCount = 0;



/* ---------- 从本机兜底读（断网时大屏不能变白板） ---------- */

function loadLocal(){

  try { const v = JSON.parse(localStorage.getItem(SL.KEY_PLANS) || "null"); if (Array.isArray(v)) RECORDS = v; } catch(e){}

  try { const v = JSON.parse(localStorage.getItem(SL.KEY_PROG) || "null"); if (v && typeof v === "object") PROG = v; } catch(e){}

  loadLocalDb();

}

/* 物料库单独兜底：★ 别把它混进上面那个整体兜底 ——

   否则"物料库为空"会把刚拉到的最新计划又用本机旧缓存盖回去。 */

function loadLocalDb(){

  if (DB.length){ buildDbIndex(); return; }

  try { const v = JSON.parse(localStorage.getItem(KEY_DB) || "null"); if (Array.isArray(v)) DB = v; } catch(e){}

  buildDbIndex();

}

function setSync(txt, cls){ const e = $("sync"); e.textContent = txt; e.className = "sync " + (cls || ""); }



/* ---------- 送达方代码：解析口径搬到了 scan-lib.js（司机页共用同一份） ----------

   ★ 保密口径**只允许有一处实现** —— 从前这份 codeOf 就写在本页里，

     司机页要用时若照抄一遍，日后"漏填代码怎么显示"改一处、漏一处，

     两块屏就会对不上（一个显「未编代码」、一个显客户名，那就泄密了）。

   索引只收「有代码」的记录，查不到就返回空。 */

function buildDbIndex(){ IDX = SL.codeIndex(DB); }



/* 这一行该显示什么代码：三级兜底全在 scan-lib.codeOf 里（司机页同一份）。

   ★ 查不到返回 ""，**不返回客户名** —— 调用方一律用占位「未编代码」。 */

function codeOf(r){ return SL.codeOf(r, IDX); }



/* ---------- 拉取（超时保护：卡住的请求不能让整屏停摆） ---------- */

function withTimeout(p, ms){

  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

}



async function pull(){

  const cs = !!(window.CloudSync && CloudSync.ready());

  let okA = !cs, okP = !cs;

  if (cs){

    /* 性能（2026-09-24）：先并行查「更新时间戳」（几十字节），没变就不下载全文。

       计划(~268KB)和物料库(大)都极少变；剩下的请求三路同时发，弱网同步时间约降为 1/3。 */

    let skipA = false, newAStamp = null, skipDb = false, newDbStamp = null;

    if (CloudSync.pullStamp && RECORDS.length){

      try {

        const st = await withTimeout(CloudSync.pullStamp(SL.KEY_PLANS), 8000);

        if (st){ if (localStorage.getItem(KEY_PLANS_STAMP) === st){ skipA = true; okA = true; } else newAStamp = st; }

      } catch(e){}

    }

    if (CloudSync.pullStamp && DB.length){

      try {

        const st = await withTimeout(CloudSync.pullStamp(KEY_DB), 8000);

        if (st){ if (localStorage.getItem(KEY_DB_STAMP) === st) skipDb = true; else newDbStamp = st; }

      } catch(e){}

    }

    const rs = await Promise.allSettled([

      skipA ? Promise.resolve({ ok: true, value: null }) : withTimeout(CloudSync.pullResult(SL.KEY_PLANS), FETCH_MS),

      withTimeout(CloudSync.pullResult(SL.KEY_PROG), FETCH_MS),

      skipDb ? Promise.resolve({ ok: true, value: null }) : withTimeout(CloudSync.pullResult(KEY_DB), FETCH_MS)

    ]);

    const ra = rs[0].status === "fulfilled" ? rs[0].value : null;

    const rp = rs[1].status === "fulfilled" ? rs[1].value : null;

    const rd = rs[2].status === "fulfilled" ? rs[2].value : null;

    if (!skipA){

      okA = !!(ra && ra.ok);

      if (okA && Array.isArray(ra.value)){

        RECORDS = ra.value;

        try { localStorage.setItem(SL.KEY_PLANS, JSON.stringify(RECORDS));

              if (newAStamp) localStorage.setItem(KEY_PLANS_STAMP, newAStamp); } catch(e){}

      }

    }

    okP = !!(rp && rp.ok);

    if (okP && rp.value && typeof rp.value === "object") PROG = SL.mergeProg(PROG, rp.value);

    if (!skipDb && rd && rd.ok && Array.isArray(rd.value)){

      DB = rd.value;

      try { localStorage.setItem(KEY_DB, JSON.stringify(DB));

            if (newDbStamp) localStorage.setItem(KEY_DB_STAMP, newDbStamp); } catch(e){}

      buildDbIndex();

    }

  }



  if (!RECORDS.length) loadLocal();     // 云端没拉到 → 用本机缓存（别让大屏变白板）

  if (!DB.length) loadLocalDb();        // 物料库单独兜底（不动刚拉到的计划）

  // 墓碑：管理端删掉的单不再上屏

  try {

    const del = JSON.parse(localStorage.getItem(SL.KEY_DEL) || "null");

    if (Array.isArray(del) && del.length){

      const st = new Set(del.map(String));

      RECORDS = RECORDS.filter(r => !(r && r.id != null && st.has(String(r.id))));

    }

  } catch(e){}

  try { localStorage.setItem(SL.KEY_PROG, JSON.stringify(PROG)); } catch(e){}



  const degraded = !okA || !okP;

  degraded ? badCount++ : (badCount = 0);

  okCount++;

  const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });

  /* 文案缩短：顶部只有一行，长句会顶出去（全文留在 title 里） */

  const sw = $("sync");

  if (!cs){ setSync("本机缓存 " + t, "warn"); sw.title = "云端未配置，正在显示本机缓存的数据"; }

  else if (degraded){ setSync("网络波动 " + t, "warn"); sw.title = "网络有波动，正在显示上一次拉到的数据"; }

  else { setSync("已同步 ✓ " + t, "ok"); sw.title = "已同步云端，时间 " + t; }



  render();

}



/* ---------- 渲染 ---------- */

function fmtTime(ts){

  if (!ts) return "";

  const d = new Date(ts);

  if (isNaN(d.getTime())) return "";

  const p = (n) => String(n).padStart(2, "0");

  const today = SL.todayYmd();

  const day = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());

  return (day === today ? "" : (d.getMonth() + 1) + "/" + d.getDate() + " ") + p(d.getHours()) + ":" + p(d.getMinutes());

}



// 字号按行数自动缩放：行少就放大（门口看得清），行多就收紧。

// 下限 15px：再小门口就看不清了，塞不下交给自动慢速滚动（不再硬缩到看不清）。

// ★ 2026-09-17 改成**直接量**表格容器剩下多少高度，再扣掉表头那一行。

//   原来写死"vh - 172"没把表头算进去：屏幕一矮（比如 1366×768）就估多了，

//   15 行会整屏溢出、要多滚一下。量出来的数在哪种窗口下都是对的。

//   量不到布局时（jsdom 里 clientHeight 恒为 0）才退回按视口估算：192=全屏 / 172=窗口。

// --perrow = 每行能分到的高度配额，fitCodeFont 拿它当"行不许再高"的上限。

function fitRows(n){

  const box = document.querySelector(".box");

  const thead = box ? box.querySelector("thead") : null;

  const boxH = box ? box.clientHeight : 0;

  let avail;

  if (boxH > 40){

    avail = boxH - (thead ? thead.getBoundingClientRect().height : 0) - 2;   // 2px 留给圆角/边框

  } else {

    avail = window.innerHeight - (document.body.classList.contains("fs") ? 192 : 172);

  }

  avail = Math.max(160, avail);

  /* ★ 2026-09-17 修（「字体还是没变大」的真凶）：**行数多到一屏放不下时，不能拿总行数去分高度**。

     表格本来就带自动滚动（塞不下就慢慢往下滚），可以前 per = avail / n 会把配额压到 20px 上下，

     而 fitCodeFont 拿 per 当"一行不许再高"的上限 —— 于是 36 行时 --coder 被压到 1.00，

     代码跟正文一样大，用户看到的就是"字号没放大"。

     现场三四十行是常态，所以给每行配额一个下限：至少放得下一个看得清的代码；

     行数超过一屏时，多出来的高度交给已有的自动滚动去消化。 */

  /* 下限 40px（够放 ~36px 的代码）；但也要保证"一屏至少还能看见 ~12 行"，

     免得屏幕特别矮时行被顶得老高、全程都在滚。 */

  const PER_MIN = Math.min(40, avail / 12);

  const per = Math.max(avail / Math.max(1, n), PER_MIN);

  const fs = Math.max(15, Math.min(26, Math.floor(per * 0.40)));

  const root = document.documentElement.style;

  root.setProperty("--rowfs", fs + "px");

  root.setProperty("--rowpad", Math.max(3, Math.floor(fs * 0.36)) + "px");

  root.setProperty("--perrow", per + "px");

}



/* 一行有没有"塞不下"：代码列被挤到溢出，或者这一行高过了配额 */

function rowOverflows(tds){

  for (let i = 0; i < tds.length; i++){

    const td = tds[i];

    if (td.scrollWidth > td.clientWidth + 1) return true;

  }

  const per = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--perrow")) || 0;

  const rowEl = tds[0] && tds[0].parentElement;

  /* 容差只能是"亚像素"级别：per 是"每行配额"，n 行加起来就是整屏高度，

     一行放宽 1px、15 行就白溢出 15px（会莫名其妙多出一条滚动）。只留浮点噪声的余量。 */

  return !!(per > 0 && rowEl && rowEl.getBoundingClientRect().height > per + 0.25);

}



/* 送达方代码用多大字（2026-09-17 用户要求「加到最大」）——

   唯一的硬约束有两条：**不许被省略号截断**（门口把 100173 看成 1001… 比不显示还糟），

   **一行也不许高过配额**（否则整屏要滚，看表更费劲）。在两条之内，能多大就多大。

   做法不猜公式，全部用真实排版量出来的数：

     ① 在 1.5 倍、2.5 倍各量一次（这一列最宽的代码有多宽、这一行有多高）

     ② 宽度和高度对字号都是线性的 → 直接解出"刚好塞得下"的倍数，取两者较小值

     ③ 定下来后复核一次，真超了就往下降档；降到底（1 倍，跟别的列一样大）还放不下才开折行 */

const CODE_R_MAX = 3, CODE_R_MIN = 1, CODE_R_LO = 1.5, CODE_R_HI = 2.5, CODE_R_STEP = 0.05;

function fitCodeFont(){

  const tds = Array.prototype.slice.call(document.querySelectorAll("#tbody td:nth-child(1)"));   // ★ 2026-09-21 状态列删掉后，代码是第 1 格

  if (!tds.length) return;

  const root = document.documentElement, style = root.style;

  document.body.classList.remove("codewrap");     // 先按"不折行"量（折行会让行变高，能不用就不用）

  const per = parseFloat(getComputedStyle(root).getPropertyValue("--perrow")) || 0;

  const rowEl = tds[0].parentElement;

  const sample = (r) => {

    style.setProperty("--coder", r.toFixed(2));

    let w = 0;

    tds.forEach(td => { const c = td.querySelector(".cust"); if (c) w = Math.max(w, c.getBoundingClientRect().width); });

    return { w: w, h: rowEl.getBoundingClientRect().height, room: tds[0].clientWidth - 28 };

  };

  const lo = sample(CODE_R_LO), hi = sample(CODE_R_HI);

  // 两点连线解出"刚好顶到上限"的倍数；量不到数（比如 jsdom 里宽度恒为 0）就取硬上限

  const solve = (v1, v2, limit) => (v2 - v1 > 0.5 ? CODE_R_LO + (CODE_R_HI - CODE_R_LO) * (limit - v1) / (v2 - v1) : CODE_R_MAX);

  let r = Math.min(CODE_R_MAX, solve(lo.w, hi.w, lo.room), per > 0 ? solve(lo.h, hi.h, per) : CODE_R_MAX);

  r = Math.max(CODE_R_MIN, Math.floor(r / CODE_R_STEP) * CODE_R_STEP);

  for (; r >= CODE_R_MIN - 1e-6; r -= CODE_R_STEP){

    style.setProperty("--coder", r.toFixed(2));

    if (!rowOverflows(tds)) break;       // 量着没超，就定这一档

  }

  if (r < CODE_R_MIN - 1e-6){                  // 缩到最小还放不下 → 折行，一个字都不丢

    document.body.classList.add("codewrap");

    style.setProperty("--coder", CODE_R_MIN.toFixed(2));

    return;

  }

  /* ★ 2026-09-17 补：上面那个解析解只量了 1.5/2.5 两点，而**行高有一截是被别的列撑起来的固定下限**

     （内边距 + 其它列的行高），这段"白送的高度"不受代码字号影响 —— 于是两点连线被压平、解出来的倍数

     偏保守，配额根本没用满。所以定档之后再逐档往上顶，量到刚好放不下为止（真正照"实测"来定，不靠公式）。 */

  for (let up = r + CODE_R_STEP; up <= CODE_R_MAX + 1e-6; up += CODE_R_STEP){

    style.setProperty("--coder", up.toFixed(2));

    if (rowOverflows(tds)){ style.setProperty("--coder", r.toFixed(2)); break; }

    r = up;

  }

}

/* 单号自适应字号（2026-09-23；2026-09-24 起名字恢复显示，口径改为「缩字号、绝不撤名字」）

   为什么需要：大屏字号按行数自适应（--rowfs 15~26px），行少字号就大 ——

   单号是 15 位等宽字符，字号一大就把这一格撑破，td 的 overflow:hidden 会把最后 1~2 位吃掉

   （真机实测 26px 时缺 11px）。单号缺一位就查不到单，比显示小字糟得多。

   优先级（2026-09-24 用户要求）：单号必须完整 > 名字必须显示（不换行、可以缩小）。

   做法：先整批复位（只触发一次布局），再整批量（读写分离，别交错触发重排）。

   ① 先缩名字（96%→56%）；② 名字到底了还放不下 → 缩单号（96%→56%）；

   ③ 都到下限仍放不下（超长单号）→ 折行，一位都不丢（极端兜底）。 */

const NO_R_MIN = 0.56;

const PL_R_MIN = 0.56;

function fitNoFont(){

  const tb = document.getElementById("tbody"); if (!tb) return;

  document.body.classList.remove("nowrap");

  const list = Array.prototype.slice.call(tb.querySelectorAll(".no"));

  if (!list.length) return;

  const sns = list.map(no => no.querySelector(".sn"));

  const pls = list.map(no => no.querySelector(".pl"));

  for (let i = 0; i < list.length; i++){                 // 整批复位（只触发一次布局）

    if (sns[i]) sns[i].style.fontSize = "";

    if (pls[i]) pls[i].style.fontSize = "";

  }

  const over = no => no.scrollWidth > no.clientWidth + 1;

  let fold = false;

  for (let i = 0; i < list.length; i++){

    const no = list[i], sn = sns[i], pl = pls[i];

    if (!sn) continue;

    if (!over(no)) continue;                             // 本来就放得下

    // ① 先缩名字（用户明确：名字可以缩小）—— 单号保持原字号

    if (pl){

      let pk;

      for (pk = 0.96; pk >= PL_R_MIN - 1e-6; pk -= 0.04){

        pl.style.fontSize = Math.round(pk * 100) + "%";

        if (!over(no)) break;

      }

      if (!over(no)) continue;

    }

    // ② 名字到底了还放不下 → 逐档降单号字号（名字停在 56% 不再动）

    let k = NO_R_MIN;

    for (k = 0.96; k >= NO_R_MIN - 1e-6; k -= 0.04){

      sn.style.fontSize = Math.round(k * 100) + "%";

      if (!over(no)) break;

    }

    // ③ 都到下限仍放不下（超长单号）→ 折行，一位都不丢

    if (k < NO_R_MIN - 1e-6){ fold = true; sn.style.fontSize = Math.round(NO_R_MIN * 100) + "%"; }

  }

  if (fold) document.body.classList.add("nowrap");

}



/* ★ 时间两列（工序更新/车辆更新）自动缩字号（2026-09-24）：逐格量 scrollWidth，

   放不下就降字号（下限 55%），保证单行放得下 —— 不换行、也绝不让省略号吃掉。 */

const TM_R_MIN = 0.55;

function fitUpdFont(){

  const tb = document.getElementById("tbody"); if (!tb) return;

  const tds = tb.querySelectorAll("td:nth-child(7),td:nth-child(8)");

  const tms = Array.prototype.map.call(tds, td => td.querySelector(".tm"));

  tms.forEach(el => { if (el) el.style.fontSize = ""; });   // 整批复位（只触发一次布局）

  tms.forEach(el => {

    if (!el) return;

    const td = el.parentElement;

    if (td.scrollWidth <= td.clientWidth + 1) return;       // 本来就放得下

    for (let k = 0.96; k >= TM_R_MIN - 1e-6; k -= 0.04){

      el.style.fontSize = Math.round(k * 100) + "%";

      if (td.scrollWidth <= td.clientWidth + 1) break;

    }

  });

}



function kpiHtml(s){

  return [

    { cls: "",      v: s.total, l: "在屏计划（趟）" },

    { cls: "red",   v: s.left,  l: "未完成" },

    { cls: "amber", v: s.tonLeft.toFixed(1), l: "未完成吨位" },

    { cls: "green", v: s.car + "/" + s.total, l: "车已到" },

    { cls: "",      v: s.pct + "%", l: "整体进度" },

    { cls: "",      v: s.ton.toFixed(1), l: "在屏吨位" }

  ].map(k => '<div class="kpi ' + k.cls + '"><i></i><b>' + esc(String(k.v)) + "</b><span>" + esc(k.l) + "</span></div>").join("");

}



/* 计划员 / 经手人姓名显示（2026-09-23）：老板要求恢复真名，此前的

   maskName / maskNameHtml 打码逻辑已整块删除。姓名一律经 esc() 输出。 */



/* 一行怎么画 —— 注意：这里**没有**任何一处输出客户名，改动前先想清楚这句话 */

function rowHtml(r){

  const s = Math.min(3, r.s || 0);

  /* 流体进度条（2026-09-17）：液体宽度 = 工序进度（0 / 33 / 67 / 100）。

     0 档给一小片"刚起步"的液滴（6%），但右边的数字仍按真实进度印 0% ——

     数字永远准，液体只负责好看（别把这一小片读成"已经有进度了"）。 */

  const pct = Math.round(s / 3 * 100);

  const flw = '<span class="flw s' + s + '" style="--w:' + (pct || 6) + '%">' +

      '<i class="flq"></i>' +

      (s < 3 ? '<i class="flnx c' + (s + 1) + '"></i><i class="flnx2"></i>' : '') +

      '<span class="flt">' + esc(SL.STEP_NAME[s]) + '</span>' +

      '<span class="flp">' + pct + '%</span>' +

    '</span>';

  const stale = r.isYesterday ? '<span class="stale">昨</span>' : "";

  /* 两列更新分开报（2026-09-21；2026-09-24 换位后两列相邻放在最右）：

     · 工序更新 = 只报四道工序的进度时间（谁点的一并带出真名，2026-09-23 恢复姓名）；

     · 车辆更新 = 只报司机签到（车已到）的时间 —— 司机扫码签到了才冒出来。 */

  const byTxt = r.by ? "·" + esc(r.by) : "";   // 紧凑（2026-09-24）：时间列字少一点，单行更容易放得下

  const stepWhen = r.t ? SL.fmtHM(r.t) : "";

  const carWhen = r.car && r.ct ? SL.fmtHM(r.ct) : "";

  const code = codeOf(r);

  if (!code) missCount++;

  const codeCell = code

    ? '<span class="cust">' + esc(code) + "</span>"

    : '<span class="cust miss">未编代码</span>';

  // 单号独立成一列（2026-09-17）；名字恢复显示（2026-09-24 用户要求，放不下缩字号、不换行）

  const plCell = r.planner ? '<span class="pl"><span class="sep">·</span>' + esc(r.planner) + "</span>" : "";

  const noCell = '<span class="no"><span class="sn">' + esc(r.no || "（无单号）") + "</span>" + plCell + "</span>";

  return '<tr class="' + (r.done ? "done" : "st" + s) + '">' +

    '<td>' + stale + codeCell + "</td>" +

    '<td><span class="ton">' + (r.ton ? r.ton.toFixed(1) : "/") + '<s>吨</s></span></td>' +

    '<td>' + noCell + "</td>" +

    '<td>' + flw + "</td>" +

    '<td>' + (r.cx ? '<span class="carx">取消</span>' : '<span class="car ' + (r.car ? "on" : "off") + '">' + (r.car ? "✓ 已到" : "未到") + "</span>") + "</td>" +

    '<td>' + (r.cx ? '<s>已取消</s>' : (r.bz ? '<span class="bzon">已备好</span>' : '<span class="bzoff">未确认</span>')) + "</td>" +

    '<td><span class="tm">' + (stepWhen ? "工序 " + esc(stepWhen) + byTxt : '<s>还没动</s>') + "</span></td>" +

    '<td><span class="tm">' + (r.cx ? '<s>已取消</s>'

      : (carWhen ? "车到 " + esc(carWhen) : '<s>还没签到</s>')) + "</span></td>" +

  "</tr>";

}



/* 查不到代码的行数 → 页脚提醒（只报条数：这屏不出现客户名，与 2026-09-23 恢复的人名无关） */

function updateMissNote(){

  const el = $("missNote");

  if (!el) return;

  if (missCount){

    el.textContent = "⚠ " + missCount + " 条未编送达方代码 · 请到「物料数据库」补齐";

    el.style.color = "var(--amber)";

  } else {

    el.textContent = "";

    el.style.color = "";

  }

}



function render(){

  rows = SL.boardRows(RECORDS, PROG);

  const s = SL.boardStats(rows);

  const fp = rows.map(r => [r.ck, r.rk, r.s, r.car, r.cx, r.u, r.by, r.t, r.ct, r.bz].join(":")).join("|") + "#" + rows.length;

  $("kpis").innerHTML = kpiHtml(s);



  const empty = rows.length === 0;

  $("empty").style.display = empty ? "flex" : "none";

  $("tbl").style.display = empty ? "none" : "";

  if (empty){

    try {

      $("emptySub").textContent = (RECORDS.length

        ? "云端有 " + RECORDS.length + " 张已发布的单，但都不是今天的。"

        : "云端还没有已发布的发货单，请先在管理端点「发布」。");

    } catch(e){}

    lastFp = "";

    missCount = 0; updateMissNote();

    stopScroll();

    return;

  }

  if (rendered && fp === lastFp) return;      // 内容没变就不重绘（避免整屏闪烁）

  lastFp = fp;

  rendered = true;

  fitRows(rows.length);

  missCount = 0;

  $("tbody").innerHTML = rows.map(rowHtml).join("");

  fitCodeFont();                       // 行出来了才知道这一列多宽，再定代码字号

  fitNoFont();                         // 单号必须完整：按实测宽度逐档降字号

  fitUpdFont();                        // 时间两列：单行放得下（不换行、不截断）

  updateMissNote();

  setupScroll();

}



/* ---------- 超出一屏 → 自动慢速循环滚动 ----------

   门口没人动鼠标：内容塞得下就静止，塞不下就慢慢往下滚，

   滚到底停几秒，再快速回到顶部停几秒，周而复始。

   有人滚轮/触屏干预时暂停 10 秒，别跟人抢屏幕。 */

const boxEl = document.querySelector(".box");

const SCROLL_SPEED = 26;        // 往下滚：26px/秒（慢，远远能看清）

const SCROLL_BACK  = 170;       // 回顶：快一些，别浪费时间

const WAIT_TOP_MS = 2200, WAIT_BOTTOM_MS = 3800, MANUAL_PAUSE_MS = 10000;

let sc = { on: false, raf: 0, last: 0, phase: "top", until: 0, manual: 0 };



function scrollStep(ts){

  if (!sc.on) return;

  const max = boxEl.scrollHeight - boxEl.clientHeight;

  if (max <= 4){ stopScroll(); return; }

  if (ts < sc.manual){ sc.last = ts; sc.raf = requestAnimationFrame(scrollStep); return; }

  if (sc.phase === "top"){

    if (ts >= sc.until){ sc.phase = "down"; sc.last = ts; }

  } else if (sc.phase === "down"){

    const dt = Math.min(0.1, (ts - sc.last) / 1000); sc.last = ts;

    boxEl.scrollTop = Math.min(max, boxEl.scrollTop + SCROLL_SPEED * dt);

    if (boxEl.scrollTop >= max - 1){ sc.phase = "bottom"; sc.until = ts + WAIT_BOTTOM_MS; }

  } else if (sc.phase === "bottom"){

    if (ts >= sc.until){ sc.phase = "back"; sc.last = ts; }

  } else {                                        // back：快速回到顶部

    const dt = Math.min(0.1, (ts - sc.last) / 1000); sc.last = ts;

    boxEl.scrollTop = Math.max(0, boxEl.scrollTop - SCROLL_BACK * dt);

    if (boxEl.scrollTop <= 0){ sc.phase = "top"; sc.until = ts + WAIT_TOP_MS; }

  }

  sc.raf = requestAnimationFrame(scrollStep);

}

function stopScroll(){

  sc.on = false;

  if (sc.raf) cancelAnimationFrame(sc.raf);

  sc.raf = 0;

  boxEl.scrollTop = 0;

}

function setupScroll(){

  const max = boxEl.scrollHeight - boxEl.clientHeight;

  if (max <= 4){ stopScroll(); return; }

  if (sc.on) return;                             // 已经在滚就不用重启（避免每次拉取都从头来）

  sc.on = true; sc.phase = "top"; sc.until = performance.now() + WAIT_TOP_MS; sc.last = 0;

  sc.raf = requestAnimationFrame(scrollStep);

}



/* ---------- 时钟 / 全屏 / 隐藏光标 ---------- */

function tickClock(){

  const d = new Date();

  const p = (n) => String(n).padStart(2, "0");

  $("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());

  const wd = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];

  /* 顶部要挤成一行：日期只留「09月19日 周六」，年份那截挪进 title（鼠标放上去看全） */

  $("cdate").textContent = p(d.getMonth() + 1) + "月" + p(d.getDate()) + "日 周" + wd;

  $("cdate").title = d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 星期" + wd;

}



let idleTimer = 0;

function pokeCursor(){

  document.body.classList.remove("hidecur");

  clearTimeout(idleTimer);

  idleTimer = setTimeout(() => {

    if (document.body.classList.contains("fs")) document.body.classList.add("hidecur");

  }, 8000);

}



function toggleFs(){

  const el = document.documentElement;

  if (!document.fullscreenElement){

    const p = el.requestFullscreen ? el.requestFullscreen()

      : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);

    if (p && p.catch) p.catch(() => alert("浏览器不允许自动全屏：请按 F11 手动全屏。"));

    else if (!p) alert("这个浏览器不支持自动全屏：请按 F11 手动全屏。");

  } else {

    document.exitFullscreen && document.exitFullscreen();

  }

}

function onFsChange(){

  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);

  document.body.classList.toggle("fs", on);

  $("fsBtn").textContent = on ? "⛶ 退出全屏" : "⛶ 全屏显示";

  stopScroll(); fitRows(rows.length); fitCodeFont(); fitNoFont(); fitUpdFont(); setupScroll();   // 全屏切换字号变了，滚动要重新量

  pokeCursor();

}



/* ---------- 启动 ---------- */

function boot(){

  if (window.CloudSync){

    CloudSync.init();

    try { if (CloudSync.guard) CloudSync.guard(SL.KEY_PROG, SL.guardFn); } catch(e){}

  }

  loadLocal();

  $("fsBtn").onclick = toggleFs;

  document.addEventListener("fullscreenchange", onFsChange);

  document.addEventListener("webkitfullscreenchange", onFsChange);

  document.addEventListener("mousemove", pokeCursor);

  document.addEventListener("touchstart", pokeCursor);

  window.addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") toggleFs(); });

  window.addEventListener("resize", () => { stopScroll(); fitRows(rows.length); fitCodeFont(); fitNoFont(); fitUpdFont(); setupScroll(); });

  // 有人手动滚了（滚轮/触屏），自动滚动让路 10 秒

  boxEl.addEventListener("wheel", () => { sc.manual = performance.now() + MANUAL_PAUSE_MS; }, { passive: true });

  boxEl.addEventListener("touchstart", () => { sc.manual = performance.now() + MANUAL_PAUSE_MS; }, { passive: true });

  window.addEventListener("online", () => pull());

  tickClock(); setInterval(tickClock, 1000);

  pokeCursor();

  pull();

  setInterval(() => { if (!document.hidden) pull(); }, POLL_MS);

  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });

  // 长时间挂着的大屏：每天凌晨 4 点自动重载一次，清掉累积的内存/定时器

  setInterval(() => {

    const d = new Date();

    if (d.getHours() === 4 && d.getMinutes() < 1) location.reload();

  }, 60000);

}

boot();
