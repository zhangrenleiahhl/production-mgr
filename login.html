<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海立铸运通 · 登录</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{ --brand:#2563eb; --brand-d:#1e4fb0; --bg:#0b1220; --txt:#1f2733; --muted:#7a8699; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(160deg,rgba(11,18,32,.78) 0%,rgba(11,18,32,.45) 45%,rgba(11,18,32,.82) 100%),url(login-bg.jpg) center/cover no-repeat fixed;
    color:#e6edf6;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{width:100%;max-width:380px;background:rgba(255,255,255,.04);border:1px solid rgba(120,170,255,.18);
    border-radius:18px;padding:30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(6px);}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .brand img{width:46px;height:46px;border-radius:12px;box-shadow:0 6px 18px rgba(37,99,235,.4);}
  .brand .t1{font-size:20px;font-weight:800;letter-spacing:1px;}
  .brand .t2{font-size:12px;color:#9fb3d1;margin-top:2px;letter-spacing:.5px;}
  label{display:block;font-size:13px;color:#b9c8e0;margin:14px 0 6px;}
  input{width:100%;height:46px;border-radius:11px;border:1px solid rgba(120,170,255,.25);
    background:rgba(255,255,255,.06);color:#fff;font-size:15px;padding:0 14px;outline:none;transition:.15s;}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.25);}
  input::placeholder{color:#6b7c98;}
  .btn{width:100%;height:48px;margin-top:22px;border:none;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:#fff;font-size:16px;font-weight:800;cursor:pointer;transition:.15s;box-shadow:0 10px 24px rgba(37,99,235,.35);}
  .btn:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:14px;font-size:13px;color:#ff9a9a;min-height:18px;text-align:center;}
  .hint{margin-top:18px;font-size:12px;color:#7e90ad;line-height:1.7;text-align:center;}
  .hint b{color:#9fb3d1;font-weight:700;}
  .who{margin-top:10px;font-size:13px;color:#cfe0ff;background:rgba(37,99,235,.16);
    border:1px solid rgba(37,99,235,.3);border-radius:10px;padding:10px 12px;display:flex;
    justify-content:space-between;align-items:center;}
  .who button{border:none;background:#fff;color:var(--brand);border-radius:8px;padding:6px 12px;
    font-size:12px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="icon.svg" alt="海立铸运通">
      <div><div class="t1">海立铸运通</div><div class="t2">发货管理平台 · 账号登录</div></div>
    </div>

    <div id="whoBox"></div>

    <div id="formBox">
      <label for="ac">账号 / 手机号</label>
      <input id="ac" type="text" inputmode="text" autocomplete="username" placeholder="内部人员用手机号，或管理员给的账号">
      <label for="pw">密码</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="请输入密码">
      <button class="btn" id="loginBtn">登 录</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="hint">
      内部人员用 <b>手机号</b> 登录；还没账号 → 联系管理员在 Supabase 开通。<br>
      忘记密码 → 让管理员重置（Supabase 控制台可发重置邮件）。
    </div>
  </div>

<script src="cloud-config.js"></script>
<script src="supabase.min.js?v=lib"></script>
<script src="auth.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const back = params.get("redirect") || "index.html";

  (function init(){
    const s = (window.Auth && Auth.getSession && Auth.getSession()) || null;
    if (s) {
      $("formBox").style.display = "none";
      $("whoBox").innerHTML = '<div class="who"><span>已登录：<b>' + (s.name || s.email) + '</b></span>' +
        '<button id="goBtn">进入</button></div>';
      $("goBtn").onclick = () => location.href = back;
      $("whoBox").insertAdjacentHTML("beforeend",
        '<div style="text-align:center;margin-top:10px"><a id="outBtn" style="color:#9fb3d1;font-size:12px;cursor:pointer">退出登录</a></div>');
      $("outBtn").onclick = async () => { await Auth.logout(); location.reload(); };
    }
  })();

  function err(m){ $("msg").textContent = m || ""; }
  function busy(b){ $("loginBtn").disabled = b; $("loginBtn").textContent = b ? "登录中…" : "登 录"; }

  async function doLogin(){
    const id = $("ac").value.trim(), pw = $("pw").value;
    if (!id || !pw){ err("请输入账号和密码"); return; }
    busy(true); err("");
    const r = await Auth.login(id, pw);
    busy(false);
    if (!r.ok){ err(r.msg); return; }
    location.href = back;
  }
  $("loginBtn").onclick = doLogin;
  $("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("ac").addEventListener("keydown", e => { if (e.key === "Enter") $("pw").focus(); });
</script>
<script src="brand.js?v=1"></script>
</body>
</html>
