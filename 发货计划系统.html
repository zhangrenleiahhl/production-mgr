<style>
  :root{

  /* ===== 顶部应用导航栏（与框架页风格一致，紧凑版） ===== */
  .appbar{position:sticky;top:0;z-index:210;display:flex;align-items:center;gap:8px;

  .appbar .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-left:8px;}
  .appbar .tab{border:none;border-radius:8px;padding:4px 13px;font-size:13px;font-weight:600;cursor:pointer;background:#eff6ff;color:#2563eb;transition:.15s;text-decoration:none;}
  .appbar .tab:hover{background:#dbeafe;}
  .appbar .tab.active{background:#2563eb;color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.22);}
  .appbar .spacer{flex:1;}.appbar .spacer{order:8;}.appbar .brandLogo{order:9;}
  .appbar .clock{display:inline-flex;align-items:center;gap:7px;padding:3px 12px;border-radius:999px;
    background:linear-gradient(135deg,#0b1220 0%,#1e293b 100%);
    border:1px solid rgba(56,189,248,.35);
    box-shadow:0 0 10px rgba(56,189,248,.18), inset 0 0 8px rgba(56,189,248,.08);
    color:#38bdf8;font-family:"SF Mono","Consolas","Monaco","Microsoft YaHei",monospace;
    font-size:16px;font-weight:700;letter-spacing:1px;text-shadow:0 0 6px rgba(56,189,248,.5);
    position:relative;overflow:hidden;white-space:nowrap;}
  .appbar .clock::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(56,189,248,.18),transparent);
    animation:scan 2.4s linear infinite;pointer-events:none;}
  @keyframes scan{0%{left:-100%}100%{left:100%}}
  .appbar .clock .date{color:#94a3b8;font-size:14px;font-weight:600;letter-spacing:0;text-shadow:none;}
  .appbar .clock .time{color:#e0f2fe;}

  @keyframes blink{50%{opacity:0}}
  @media (max-width:900px){.appbar .clock{display:none;}}
  /* ===== 本机存储水位（导航栏实时监控）：一眼看出还能装多少 ===== */
  .appbar .store{display:inline-flex;flex-direction:column;gap:2px;padding:3px 10px;border-radius:10px;
    background:#f8fafc;border:1px solid #e2e8f0;position:relative;cursor:default;flex-shrink:0;}
  .appbar .store .row1{display:flex;align-items:baseline;gap:6px;font-size:12px;color:#64748b;white-space:nowrap;line-height:1;}
  .appbar .store .pct{font-weight:700;font-size:13px;color:#1f2328;font-variant-numeric:tabular-nums;}
  .appbar .store .pct.warn{color:#b45309;}
  .appbar .store .pct.danger{color:#dc2626;}
  .appbar .store .bar{width:170px;height:7px;border-radius:999px;background:#e5e7eb;overflow:hidden;}
  .appbar .store .bar>i{display:block;height:100%;width:0;border-radius:999px;background:#2563eb;transition:width .35s ease,background .35s ease;}
  .appbar .store .bar>i.warn{background:#f59e0b;}
  .appbar .store .bar>i.danger{background:#dc2626;}
  .appbar .store .pop{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:400;background:#fff;
    border:1px solid #d0d7de;border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.14);padding:11px 14px;
    font-size:12.5px;color:#334155;white-space:nowrap;min-width:230px;}
  .appbar .store:hover .pop{display:block;}
  .appbar .store .pop .hd{font-weight:700;color:#1f2328;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #eef2f7;}
  .appbar .store .pop .li{display:flex;justify-content:space-between;gap:22px;padding:2.5px 0;}
  .appbar .store .pop .li b{font-weight:700;color:#1f2328;font-variant-numeric:tabular-nums;}
  .appbar .store .pop .li.total{border-top:1px solid #eef2f7;margin-top:6px;padding-top:7px;}
  .appbar .store .pop .ft{margin-top:6px;padding-top:6px;border-top:1px solid #eef2f7;color:#94a3b8;font-size:12px;}
  .appbar .store .pop .li .tagf{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:4px;background:#fef3c7;color:#b45309;font-size:11px;font-weight:700;vertical-align:1px;}
  .appbar .store .pop .act{margin-top:8px;padding-top:8px;border-top:1px solid #eef2f7;}
  .appbar .store .pop .act button{width:100%;height:28px;border:1px solid #fecaca;background:#fff;color:#dc2626;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
  .appbar .store .pop .act button:hover{background:#fef2f2;border-color:#fca5a5;}
  @media (max-width:1280px){.appbar .store .bar{width:110px;}}
  @media (max-width:1000px){.appbar .store{display:none;}}
  /* ===== KPI 统计卡片 ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
  .kpi-card{background:#fff;border:1px solid #d0d7de;border-radius:0;padding:14px 16px;box-shadow:none;display:flex;align-items:center;gap:12px;transition:none;}
  .kpi-icon{width:38px;height:38px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#f6f8fa;border:1px solid #d0d7de;}
  .kpi-icon.blue{color:#2563eb;}
  .kpi-icon.violet{color:#7c3aed;}
  .kpi-icon.green{color:#059669;}
  .kpi-icon.orange{color:#d97706;}
  .kpi-label{font-size:12px;color:#4b5563;font-weight:600;letter-spacing:0;margin-bottom:4px;}
  .kpi-value{font-size:20px;font-weight:700;color:#1f2328;line-height:1.1;font-variant-numeric:tabular-nums;}
  .kpi-unit{font-size:12px;color:#6b7280;font-weight:500;margin-left:3px;}
  /* ===== 云端同步状态 + 手机自适应 ===== */
  .cloud-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:0;font-size:11px;font-weight:600;background:#f6f8fa;color:#4b5563;border:1px solid #d0d7de;white-space:nowrap;transition:.15s;flex-shrink:0;}
  .cloud-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(75,85,99,.12);}
  .cloud-pill.ok{background:#ecfdf5;color:#059669;border-color:#a7f3d0;}
  .cloud-pill.err{background:#fef2f2;color:#dc2626;border-color:#fecaca;}
  .cloud-pill.sync{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
  .cloud-pill.warn{background:#fffbeb;color:#b45309;border-color:#fde68a;}
  .cloud-pill.off{background:#f9fafb;color:#9ca3af;}

  }
  .topbar{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;
    background:#fff;border:1px solid #d0d7de;border-radius:0;
    padding:5px 10px;margin-bottom:6px;box-shadow:0 2px 8px rgba(15,23,42,.06);overflow:visible;
    position:sticky;top:36px;z-index:200;}
  .topbar .btn-group{display:inline-flex;align-items:center;gap:0;flex-shrink:0;}
  .topbar .btn-group .btn{border-radius:0;margin-left:-1px;}
  .topbar .btn-group .btn:first-child{border-radius:6px 0 0 6px;margin-left:0;}
  .topbar .btn-group .btn:last-child{border-radius:0 6px 6px 0;}
  .topbar .btn-group .btn:disabled{z-index:0;}
  .topbar .btn-group .btn:not(:disabled):hover,.topbar .btn-group .btn:not(:disabled):focus{z-index:1;}
  .filter-group{display:inline-flex;align-items:center;gap:3px;flex-wrap:nowrap;background:#f6f8fa;border-radius:6px;padding:3px 7px;border:1px solid #d0d7de;}
  .filter-group input{border:1px solid #d0d7de;border-radius:4px;padding:4px 6px;font-size:13px;outline:none;width:58px;background:#fff;transition:.15s;color:#1f2328;height:28px;box-sizing:border-box;}
  .filter-group input:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12);}
  .filter-label{align-self:center;font-size:13px;font-weight:700;color:#4b5563;padding:0 2px;white-space:nowrap;}
  .filter-group .hint{font-size:13px;color:#6b7280;font-weight:600;white-space:nowrap;padding:0 3px;}

  .field-inline{flex-direction:row;align-items:center;gap:5px;}
  .field-inline input{width:88px;padding:4px 8px;font-size:13px;}
  /* 计划员：2026-09-23 老板要求顶栏不再显示。★ 只隐藏不删元素 ——

     删掉元素会让 $("planner").addEventListener 直接报错。 */
  #plannerWrap{display:none !important;}
  .field input:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12);}
  .field input[readonly]{background:#f3f4f6;color:#6b7280;border-style:dashed;cursor:pointer;}
  .card h2.section-head{border:none;background:transparent;padding-left:0;margin:0;min-height:0;display:none;}
  .card h2.section-head::before{display:none;}
  .spacer{flex:1;}
  .btn{border:1px solid #d0d7de;border-radius:6px;padding:5px 7px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s;letter-spacing:0;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;background:#fff;color:#1f2328;height:30px;box-sizing:border-box;}
  .btn:active{transform:none;}
  .btn-primary{background:#2563eb;color:#fff;border-color:#2563eb;}
  .btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8;}
  /* 「添加一行」按钮：绿色醒目款，方便一眼找到 */
  .btn-add{background:linear-gradient(135deg,#10b981 0%,#059669 100%);color:#fff;border-color:#059669;

    box-shadow:0 2px 10px rgba(16,185,129,.38);}
  .btn-add:hover{background:linear-gradient(135deg,#0ea472 0%,#047857 100%);border-color:#047857;
    box-shadow:0 3px 14px rgba(16,185,129,.5);}
  .btn-ghost{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;}
  .btn-ghost:hover{background:#dbeafe;}
  .btn-line{background:#fff;color:#1f2328;border:1px solid #d0d7de;}
  .btn-line:hover{background:#f6f8fa;border-color:#9ca3af;color:#1f2328;}
  .btn-danger{background:#fff;color:#dc2626;border:1px solid #fecaca;}
  .btn-danger:hover{background:#fef2f2;}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none;background:#f9fafb;border-color:#e5e7eb;color:#9ca3af;}
  .cloud-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;font-size:13px;font-weight:600;background:#f6f8fa;color:#4b5563;border:1px solid #d0d7de;white-space:nowrap;transition:.15s;flex-shrink:0;height:28px;box-sizing:border-box;}
  .cloud-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(75,85,99,.12);}
  .card{background:#fff;border:1px solid #d0d7de;border-radius:0;padding:10px 16px;margin-bottom:10px;box-shadow:none;}
  .card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;letter-spacing:0;color:#1f2328;}
  .card h2::before{content:"";width:4px;height:18px;background:#2563eb;display:inline-block;}
  .card h2 .tag{font-size:11.5px;background:var(--soft);color:var(--brand-d);padding:4px 12px;border-radius:999px;font-weight:700;border:1px solid #dbe6ff;}

  .folded-dates:empty{display:none;}
  .folded-date-btn{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:5px;padding:4px 10px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.15s;height:28px;box-sizing:border-box;}
  .folded-date-btn:hover{background:#dbeafe;border-color:#2563eb;}
  .hint{font-size:12px;color:#6b7280;}
  /* ===== 发货计划单（WPS 清晰风） ===== */
  /* overflow 必须为 visible，否则表头 sticky 冻结会失效（父级 overflow:hidden 会截断 sticky） */
  .doc{border:none;border-radius:0;overflow:visible;background:#fff;box-shadow:none;width:100%;max-width:100%;}
  .doc-head{display:none;}
  .doc-head .t{font-size:18px;font-weight:700;letter-spacing:0;display:inline-flex;align-items:center;gap:8px;color:#1f2328;}
  .doc-head .meta{display:none;}
  .tbl{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;background:#fff;}
  /* 表头冻结：吸附在「顶栏 + 工具栏」下方（--head-top 由 JS 动态计算） */
  /* z-index:20 让表头始终盖在行内悬浮元素（复制按钮等 z-index:1~2）之上，避免被挡住 */
  .tbl thead th{background:#4472c4;color:#fff;font-weight:700;padding:7px 4px;text-align:center;border:1px solid #000;white-space:nowrap;position:sticky;top:var(--head-top,0px);z-index:20;font-size:15px;letter-spacing:0;}
  .tbl thead th .req{color:#ffd24d;font-weight:800;margin-left:1px;}  /* 必填项红/黄星号标记 */
  .tbl td{padding:0;border:1px solid #000;text-align:center;vertical-align:middle;min-height:26px;}
  .tbl td input,.tbl td textarea{border:1px solid transparent;background:#fff;width:100%;text-align:center;border-radius:0;font-size:14px;font-weight:600;color:#1f2328;outline:none;transition:.15s;box-sizing:border-box;min-height:26px;line-height:1.35;}
  .tbl td input{padding:2px 3px;height:26px;text-align:center;}
  .tbl td textarea{resize:none;overflow:hidden;font-family:inherit;padding:2px 3px;white-space:pre-wrap;word-break:break-word;display:block;text-align:center;}
  .tbl td textarea[data-f="model"],.tbl td textarea[data-f="code"]{text-align:center;}
  .tbl td input:focus,.tbl td textarea:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.15);}
  @keyframes flashc{0%,100%{box-shadow:0 0 0 2px rgba(139,92,246,.15)}50%{box-shadow:0 0 0 3px rgba(239,68,68,.45)}}
  .tbl td input.flash{border-color:var(--red)!important;animation:flashc .8s ease 3;}
  .tbl td.calc{padding:3px 4px;text-align:center;vertical-align:middle;}
  .tbl tr.subtotal td{background:#f6f8fa;border-top:1px solid #000;font-weight:700;color:#1f2328;padding:2px 3px;font-size:14px;}
  .tbl tr.subtotal .sub-label{text-align:left;padding-left:8px;}
  .tbl tr.subtotal .sub-ton{text-align:center;color:var(--purple-d);}
  /* 隔离区分隔带：位于「明日」计划之后，视觉隔离其后（后天及以后）的计划 */
  .tbl tbody tr.isolation-band > td{padding:0 !important;border:none;background:transparent;height:auto;}
  .tbl tbody tr.isolation-band .isolation-cell{height:30px;line-height:30px;text-align:center;background:linear-gradient(90deg,#fff7ed,#fed7aa 50%,#fff7ed);border-top:2px solid #fb923c;border-bottom:2px solid #fb923c;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
  .tbl tbody tr.isolation-band .isolation-label{display:inline-block;background:#ea580c;color:#fff;font-size:11px;font-weight:700;letter-spacing:2px;padding:3px 16px;border-radius:999px;box-shadow:0 1px 3px rgba(234,88,12,.3);}
  .tbl tbody tr{transition:none;}
  .tbl tbody tr:nth-child(even){background:#fafafa;}
  .tbl tbody tr:hover td{background:var(--purple-bg);}
  .tbl tr.group-end td{border-bottom:1px solid #000;}
  .col-idx{width:3%;color:#6b7280;}
  .col-check{width:3%;text-align:center;vertical-align:middle;padding:0!important;}
  .row-check{width:16px;height:16px;margin:0 auto;padding:0;cursor:pointer;accent-color:#2563eb;display:block;}
  #checkAll{width:16px;height:16px;margin:0 auto;padding:0;cursor:pointer;accent-color:#2563eb;display:block;}
  .hide-col{width:0!important;max-width:0!important;padding:0!important;border:0!important;overflow:hidden;visibility:hidden;white-space:nowrap;font-size:0;line-height:0;}
  .hide-col input,.hide-col textarea{display:none!important;}
  .tbl th:nth-child(1),.tbl tbody td:nth-child(1){width:2%;}    /* 序号 */
  .tbl th:nth-child(2),.tbl tbody td:nth-child(2){width:2%;}    /* 勾选 */
  .tbl th:nth-child(3),.tbl tbody td:nth-child(3){width:10%;}   /* 发货日期 */
  .tbl th:nth-child(4),.tbl tbody td:nth-child(4){width:10%;}   /* 送达方（原客户） */
  .tbl th:nth-child(5),.tbl tbody td:nth-child(5){width:20%;}   /* 型号 */
  .tbl th:nth-child(6),.tbl tbody td:nth-child(6){width:5%;}    /* 发货数量 */
  .tbl th:nth-child(7),.tbl tbody td:nth-child(7){width:6%;}    /* 发货点 */
  .tbl th:nth-child(8),.tbl tbody td:nth-child(8){width:5%;}    /* 交货单（可换行） */
  .tbl th:nth-child(9),.tbl tbody td:nth-child(9){width:3%;}    /* 箱数 */

  .tbl td input[data-f="shipdate"]{color:#1f2328;font-weight:600;text-align:center;padding-left:18px;padding-right:1px;font-size:12.5px;height:30px;min-height:30px;background:#fff;border-color:transparent;}

<script>
const LS_DB = "shipping_db_v1";
const LS_REC = "shipping_plans_v1";
const LS_DRAFT = "shipping_draft_v1";   // 未发布明细自动草稿，刷新/重开不丢
const LS_ARCHIVE = "shipping_plans_archive_v1"; // 超出保留上限的老发布记录 → 归档（不再直接丢弃）
const LS_SNAP = "shipping_snapshots_v1";        // 关键操作前的自动快照（滚动保留最近 3 份）
const LS_CT = "shipping_custton_v1";            // 客户吨位手动修改值
const LS_DEL = "shipping_plans_del_v1";         // 已删除发布记录的 id 墓碑（防止被别的端同步时"复活"）
const BACKUP_KEYS = [LS_DB, LS_REC, LS_ARCHIVE, LS_DEL, LS_DRAFT, LS_CT, "shipping_fold_dates_v1", "shipping_show_folded_v1"];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

// ===================== 存储安全层 =====================
// ① 写入不再静默失败：localStorage 可能因「空间满 / 被浏览器禁用」写入失败，
//    旧写法 try/catch 吞掉异常，用户以为存上了其实没存 → 统一走 safeSet，失败必提示。
// ② 关键操作自动快照：发布 / 删除记录 / 导入备份 / 云端覆盖 之前先留一份，随时可回滚。
// ③ 超量归档：发布记录超过 200 条时，老记录转入归档区而不是被丢弃。
let _quotaWarned = false;
function safeSet(key, val, quiet){
  try{
    localStorage.setItem(key, val);
    try{ if(window.touchStorageMeter) touchStorageMeter(); }catch(_){}   // 写入后刷新导航栏水位
    return true;
  }
  catch(e){
    if(!quiet && !_quotaWarned){
      _quotaWarned = true;
      try{ toast("⚠ 本地存储写入失败（空间可能已满），请立即到「数据备份」导出文件"); }catch(_){}
    }
    return false;
  }
}
function getSnapshots(){ try{ return JSON.parse(localStorage.getItem(LS_SNAP)) || []; }catch(e){ return []; } }
// 关键操作前留快照。最多 3 份、总体积约 1.2MB 以内；快照本身写不下就安静放弃，绝不影响主流程。
function snapshot(key, tag){
  try{
    const cur = localStorage.getItem(key);
    if(cur == null) return;
    const list = getSnapshots();
    list.unshift({ key:key, tag:(tag||"自动"), at:new Date().toISOString(), size:cur.length, data:cur });
    const picked = []; let total = 0;
    for(const s of list){
      if(picked.length >= 3) break;
      if(picked.length > 0 && total + s.size > 1200000) break;
      picked.push(s); total += s.size;
    }
    if(!picked.length) return;
    let arr = picked;
    for(let i=0;i<3 && arr.length;i++){
      try{ localStorage.setItem(LS_SNAP, JSON.stringify(arr)); return; }
      catch(e){ if(arr.length <= 1) return; arr = arr.slice(1); }
    }
  }catch(e){}
}
// 恢复到某份自动快照（0 = 最近一份）。恢复前会把「当前数据」也存成一份快照，可再退回来。
function restoreSnapshot(idx){
  const list = getSnapshots(), s = list[idx|0];
  if(!s){ try{ toast("没有可用的自动快照"); }catch(e){} return false; }
  const when = String(s.at||"").replace("T"," ").slice(0,19);
  if(!confirm("确定恢复到 "+when+" 的自动快照？\n（快照内容："+(s.tag||"自动")+" · "+(s.key||"")+"）\n当前数据会先自动备份一份，可再次恢复。")) return false;
  snapshot(s.key, "恢复前");
  safeSet(s.key, s.data);
  if(window.CloudSync){
    // 恢复发布记录后走「合并推送」（只增不减）：恢复本来就是为了找回不见的记录，整份覆盖会把云端别的计划冲掉。
    // 下面 700ms 就会刷新页面，所以先记「待补传」再推 —— 推送被打断也不会留下"本机有、云端没有"的不一致。
    if(s.key === LS_REC){ markPending(true); flushRec(false); }
    else { let v=s.data; try{ v=JSON.parse(v); }catch(e){} CloudSync.push(s.key, v); }
  }
  try{ toast("已恢复到 "+when+"，正在刷新…"); }catch(e){}
  setTimeout(()=>location.reload(), 700);
  return true;
}
function loadArchive(){ try{ return JSON.parse(localStorage.getItem(LS_ARCHIVE)) || []; }catch(e){ return []; } }
function archiveRecs(recs){   // 超出上限的老记录转入归档区（归档区最多 500 条），避免"静默丢数据"
  if(!recs || !recs.length) return;
  const a = loadArchive().concat(recs);
  // ★ 这里以前用裸 setItem + try/catch 吞异常：空间满时归档会「静默失败」，记录真丢且用户毫不知情。
  //   改走 safeSet（quiet：提示信息自己给，更具体），失败必须让用户看见。
  const ok = safeSet(LS_ARCHIVE, JSON.stringify(a.slice(-500)), true);
  if(!ok){
    try{ toast("⚠ 本机空间不足，" + recs.length + " 条较早的发布记录无法转入归档，请立即到「数据备份」导出文件"); }catch(e){}
  }
}

// ===================== 发布记录"只增不减"合并 =====================
// 背景：发布记录以前是「谁最后写谁覆盖整份列表」。只要有一端拿的是稍早的旧副本
// （例如发货员端 30 秒才拉一次、或拉取失败退回本地旧数据），它一保存就会把期间
// 新发布的计划整份盖掉 —— 本地和云端同时消失。改成按 id 取并集后就不可能再丢。
function loadDeletedIds(){ try{ const a=JSON.parse(localStorage.getItem(LS_DEL)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function markDeleted(id){
  if(id == null) return;
  const a = loadDeletedIds(), s = String(id);
  if(!a.some(x=>String(x)===s)) a.push(s);
  try{ localStorage.setItem(LS_DEL, JSON.stringify(a.slice(-800))); }catch(e){}
}
function recKeyOf(r){ return (r && r.id != null) ? ("i"+r.id) : (r && r.no ? ("n"+r.no) : null); }
// base=云端（底） extra=本地（优先）。两边都有的记录 —— 就地复用本地对象（保住调用方持有的引用），
// 只把客户吨位覆盖表做并集，这样两边各自改的吨位都不会丢。
function mergeRecords(base, extra){
  const map = new Map();
  (base||[]).forEach(r=>{ if(r && r.no!=null) r.no=fixPlanNo(r.no, recShipDate(r)); const k=recKeyOf(r); if(k) map.set(k,r); });
  (extra||[]).forEach(r=>{
    if(r && r.no!=null) r.no=fixPlanNo(r.no, recShipDate(r));
    const k=recKeyOf(r); if(!k) return;
    const b = map.get(k);
    if(b && r){
      try{
        r.custTon = Object.assign({}, b.custTon||{}, r.custTon||{});
        if(b.sumSubTon && !r.sumSubTon) r.sumSubTon = b.sumSubTon;
      }catch(e){}
    }
    map.set(k, r);
  });
  const del = new Set(loadDeletedIds().map(String));
  let out = [...map.values()].filter(r=>!(r && r.id != null && del.has(String(r.id))));
  out.sort((x,y)=>((Number(y && y.id)||0) - (Number(x && x.id)||0)));   // 置顶最新的
  if(out.length > 200){ archiveRecs(out.slice(200)); out = out.slice(0,200); }
  return out;
}

// ===================== 安全推送：先跟云端合并，再上传 =====================
// 以前发布/删除是「把本机这份清单整份推上云」。如果这台电脑是刚用的（本机只有刚发布的
// 那一条），或者开机拉取还没跑完，这一推就把云端上别人的计划全盖掉了 —— 表现就是
// 「新人员一发布，其他几条被删了」。
// 现在统一走这里：拉云端 → 按 id 合并（只增不减、剔除墓碑）→ 写回本机 → 再推合并结果。
// ★ 拉不到云端就绝不推送（那只说明网络不通，不能拿本机这份"可能不完整"的清单去覆盖）。
const LS_PENDING = "shipping_plans_pending_v1";   // 有改动还没推上云（本机私有标记，不参与同步/备份）
function markPending(on){ try{ on ? localStorage.setItem(LS_PENDING,"1") : localStorage.removeItem(LS_PENDING); }catch(e){} }
function isPending(){ try{ return localStorage.getItem(LS_PENDING)==="1"; }catch(e){ return false; } }
// 进度（发货进度看板）也一样：网络抖一下没推上去，得记着下一轮补传，
// 否则用户看到"已预约"，10 秒后又被云端旧数据盖回去，像是改动自己丢了。
const LS_PENDP = "shipping_prog_pending_v1";
function markPenP(on){ try{ on ? localStorage.setItem(LS_PENDP,"1") : localStorage.removeItem(LS_PENDP); }catch(e){} }
function isPenP(){ try{ return localStorage.getItem(LS_PENDP)==="1"; }catch(e){ return false; } }
async function flushRec(silent){
  const run = () => doFlushRec(silent);
  __flushChain = __flushChain.then(run, run);      // 串行化：连点两次发布也不会互相盖
  return __flushChain;
}
let __flushChain = Promise.resolve();
async function doFlushRec(silent){
  if(!window.CloudSync || !CloudSync.ready()){ markPending(true); return false; }
  let cloud = null;
  // ★ 用 pullResult 拿「本次拉取自己的结果」。
  //   以前用引擎的 lastPullFailed 判断——那是全局共享状态，页面上任何一个
  //   别的拉取（60 秒自动校对、切回前台、发货员端轮询…）成功都会把它刷成 false。
  //   于是「这次我没拉到」被误判成「云端真的没有这条」→ 拿本机那份不完整的清单推上去，
  //   把云端上别人发布的计划整份盖掉。而且只在恰好有并发拉取成功时才发生 —— 所以是「有时候」。
  let pr = null;
  try{ pr = await CloudSync.pullResult(LS_REC); }catch(e){ pr = null; }
  if(!pr || !pr.ok){ markPending(true); return false; }    // 拉不到 → 只记一笔待补传，绝不覆盖云端
  cloud = pr.value;
  if(cloud === null) cloud = [];                           // 云端确实还没有这条（首次使用）→ 以本机为准建起来
  let cloudArr = [], localArr = [];
  try{ cloudArr = (typeof cloud==="string") ? (JSON.parse(cloud)||[]) : (Array.isArray(cloud)?cloud:[]); }catch(e){ cloudArr = []; }
  try{ localArr = loadRec(); }catch(e){ localArr = []; }
  let merged = null;
  try{ merged = mergeRecords(cloudArr, localArr); }catch(e){ merged = null; }
  if(!merged){ markPending(true); return false; }        // 合并出错 → 宁可不推，也不拿本机这份去覆盖
  const mergedStr = JSON.stringify(merged);
  if(mergedStr !== JSON.stringify(localArr)){            // 云端独有的记录先落到本机
    safeSet(LS_REC, mergedStr);
    try{ renderRecords(); }catch(e){}
  }
  let ok = false;
  try{ ok = await CloudSync.push(LS_REC, merged); }catch(e){ ok = false; }
  try{ CloudSync.push(LS_DEL, loadDeletedIds()); }catch(e){}       // 墓碑一起同步，删掉的不会被别的端"复活"
  try{ if(loadArchive().length) CloudSync.push(LS_ARCHIVE, loadArchive()); }catch(e){}   // 归档一起同步（超过上限转归档的记录在别的端也能看到）
  markPending(!ok);
  if(!ok && !silent){ try{ toast("⚠ 没能同步到云端，已存本机，稍后自动补传"); }catch(e){} }
  return ok;
}

// ===================== 与云端"校对并同步"（人工一键 / 每 60 秒自动） =====================
// 作用：把云端的删除墓碑并过来 → 双向合并（只增不减）→ 本机补全 → 推回云端。
// 只要两边条数不一致（例如本机有记录没传上去），就会被发现并追平 —— 避免"编辑器和发货员看到的不是同一份"。
async function reconcileNow(manual){
  if(!window.CloudSync || !CloudSync.ready()){
    if(manual){ try{ toast("这个页面没有连上云端，请刷新后重试（或看右上角状态）"); }catch(e){} }
    return false;
  }
  let cloud = null;
  let pr2 = null;                                  // ★ 同上：用 pullResult 取本次结果，不用全局共享状态
  try{ pr2 = await CloudSync.pullResult(LS_REC); }catch(e){ pr2 = null; }
  if(!pr2 || !pr2.ok){
    if(manual){ try{ toast("暂时连不上云端，请稍后再试"); }catch(e){} }
    return false;
  }
  cloud = pr2.value;
  if(cloud === null) cloud = [];                   // 云端确实还没有这条
  const cloudArr = Array.isArray(cloud) ? cloud : [];
  const before = loadRec().length;
  // 先把云端的墓碑并到本机（取并集），否则会把别人删掉的记录又推回去
  try{
    const cd = await CloudSync.pull(LS_DEL);
    if(Array.isArray(cd) && cd.length){
      const mine = loadDeletedIds(), set = new Set(mine.map(String));
      cd.forEach(x=>{ if(!set.has(String(x))){ set.add(String(x)); mine.push(x); } });
      try{ localStorage.setItem(LS_DEL, JSON.stringify(mine.slice(-800))); }catch(e){}
    }
  }catch(e){}
  // 自动校对：条数一致且没有待补传 → 不用折腾（省流量、少写库）
  if(!manual && before === cloudArr.length && !isPending()) return true;
  const ok = await flushRec(true);
  if(manual){
    const after = loadRec().length;
    try{ toast("校对完成：本机 " + before + " 条 ｜ 云端 " + cloudArr.length + " 条 ｜ 合并后 " + after + " 条"
      + (ok ? " · 已同步到云端 ✓" : " · 未上传，已记待补传（稍后自动重试）")); }catch(e){}
  }
  return ok;
}
setInterval(()=>{ try{ if(!document.hidden) reconcileNow(false); }catch(e){} }, 60000);
document.addEventListener("visibilitychange", ()=>{ try{ if(!document.hidden) reconcileNow(false); }catch(e){} });

// ===================== 清理「内容完全相同」的重复发布记录 =====================
// 同一批货被发了两次（单号不同、内容一模一样）时，只保留最新的一条，重复的转入归档并打删除墓碑。
function findDupRecs(){
  const seen = new Set(), dups = [];
  loadRec().forEach(r=>{
    const f = r && r.fingerprint;
    if(!f) return;                                   // 老记录没有指纹，不动它
    // ★ 分组键带上"计划员"：内容相同但由不同人发布，很可能是两笔真实业务
    //   （同一客户/同一型号的正常重复发货），绝不能当成"重复记录"删掉。
    const key = String(r.planner||"") + "\u0000" + f;
    if(seen.has(key)) dups.push(r); else seen.add(key);
  });
  return dups;
}
function cleanDupRecs(){
  const dups = findDupRecs();
  if(!dups.length){ try{ toast("没有发现重复的发布记录"); }catch(e){} return; }
  const lines = dups.map(r=>"· "+(r.no||"?")+(r.planner?("（"+r.planner+"）"):"")+"　"+(r.publishedAt||"")).join("\n");
  if(!confirm("发现 "+dups.length+" 条【同一计划员】内容完全相同的重复记录：\n\n"+lines+"\n\n将保留最新的一条，这几条重复的转入归档（可从备份文件或自动快照取回）。\n\n确定清理吗？")) return;
  snapshot(LS_REC, "清理重复前");
  const dupIds = new Set(dups.map(r=>String(r.id)));
  dups.forEach(r=>{ if(r && r.id!=null) markDeleted(r.id); });
  archiveRecs(dups);
  safeSet(LS_REC, JSON.stringify(loadRec().filter(r=>!(r && r.id!=null && dupIds.has(String(r.id))))));
  try{ renderRecords(); }catch(e){}
  flushRec(true);
  toast("已清理 "+dups.length+" 条重复记录（已归档，可恢复）");
}

// 顶部导航栏动态时钟（精确到秒）
(function(){
  function pad(n){return String(n).padStart(2,"0");}
  function updateClock(){
    const clock=$("clock"); if(!clock) return;
    const now=new Date();
    const dateEl=clock.querySelector(".date");
    const timeEl=clock.querySelector(".time");
    const ds=now.getFullYear()+"/"+pad(now.getMonth()+1)+"/"+pad(now.getDate());
    const ts=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
    if(dateEl && dateEl.textContent!==ds) dateEl.textContent=ds;   // ★ 值没变就不动 DOM
    if(timeEl && timeEl.textContent!==ts) timeEl.textContent=ts;
  }
  if($("clock")){
    updateClock();
    // ★ 性能：① 对齐到整秒触发（原来固定 1 秒一次的漂移会累积成重复渲染）；
    //          ② 切到后台就不再跑（后台标签页每秒刷时钟纯属浪费）。
    let __clockTimer=0;
    const tick=()=>{
      clearTimeout(__clockTimer);
      if(document.hidden) return;
      updateClock();
      __clockTimer=setTimeout(tick, 1000-(Date.now()%1000)+5);
    };
    tick();
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tick(); });
  }
})();
// ===================== 「非本系统」占用识别 =====================
// 浏览器是按「网址」分配存储额度的，不按页面 —— 同一个网址下别的工具（答题助手、
// 自动排产系统…）的数据会和发货系统挤在同一份额度里。下面把不属于本套系统的键挑出来，
// 让用户一眼看清是谁在占地方。★ 清理永远「先导出备份、再删除」，绝不静默清数据。
const OWN_KEY_PREFIX = ["shipping_", "order_mgmt_"];
const OWN_KEYS = ["last_client_tab", "last_backup", "auto_backup"];

// 云端数据明显偏少被拒绝时，把云端那份存到 key+"__cloud"。体积和主键一样大。
// 能删（不影响运行），但删掉就失去"那次覆盖"的回退底 → 默认不勾。
const REDUNDANT_KEYS = {
  "shipping_db_v1__bak":1,        "shipping_db_v1_bak":1,

  "shipping_plans_v1__bak":1,     "shipping_plans_v1_bak":1,

  "shipping_plans_archive_v1__bak":1, "shipping_draft_v1__bak":1, "shipping_custton_v1__bak":1
};
const FOREIGN_LABELS = {
  "shipping_schedule_v1":"旧版排产表 · 残留数据",
  "auto_sched_v2":"生产自动排产系统 · 存档",
  "answer_helper_bank_v2":"答题助手 · 题库",
  "answer_helper_floating_pos":"答题助手 · 悬浮窗位置",
  "answer_helper_first_run_v2":"答题助手 · 使用提示",
  "shipping_db_v1__bak":"物料库 · 覆盖留底",
  "shipping_db_v1_bak":"物料库 · 覆盖留底",
  "shipping_db_v1__cloud":"物料库 · 被拒的云端旧数据",
  "shipping_db_v1_cloud":"物料库 · 被拒的云端旧数据",
  "shipping_plans_v1__bak":"发布记录 · 覆盖留底",

  "shipping_plans_v1__cloud":"发布记录 · 被拒的云端旧数据",
  "shipping_plans_v1_cloud":"发布记录 · 被拒的云端旧数据"
};
function isOwnKey(k){
  if(LEGACY_KEYS[k] || REDUNDANT_KEYS[k]) return false;  // 旧版残留 / 冗余留底 → 都可清理
  if(OWN_KEYS.indexOf(k) >= 0) return true;
  return OWN_KEY_PREFIX.some(p => k.indexOf(p) === 0);
}
function storeSizeText(n){ return n >= 1024 ? (n/1024).toFixed(0) + " K" : String(n); }
function foreignEntries(){
  const out = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i); if(!k) continue;
      if(isOwnKey(k)) continue;
      const n = k.length + (localStorage.getItem(k)||"").length;
      if(n <= 0) continue;
      out.push({ k:k, n:n, label:FOREIGN_LABELS[k] || ("未知： " + k),
        kind: REDUNDANT_KEYS[k] ? "redundant" : "foreign",
        keep: !!(FOREIGN_KEEP_DEFAULT[k] || REDUNDANT_KEYS[k]) });
    }
  }catch(e){}
  out.sort((a,b)=>b.n-a.n);
  return out;
}
// 把要清掉的键原样打包成 JSON 下载 —— 数据急救.html 可直接导入还原

// ===================== 本机存储水位（导航栏实时监控） =====================
// 浏览器给每个站点约 5,242,880 个字符的存储额度，而且是按「字符数」算，不是字节数。
// 这里直接遍历 localStorage 统计真实占用（不估算）——物料库是最大头，一眼看出还能装多少。
const STORE_LIMIT = 5242880;
const STORE_LABELS = {
  "shipping_db_v1":"物料库",
  "shipping_db_v1_bak":"物料库 · 覆盖留底",
  "shipping_db_v1__bak":"物料库 · 覆盖留底",
  "shipping_db_v1_cloud":"物料库 · 被拒的云端旧数据",
  "shipping_db_v1__cloud":"物料库 · 被拒的云端旧数据",
  "shipping_plans_v1_bak":"发布记录 · 覆盖留底",
  "shipping_plans_v1__bak":"发布记录 · 覆盖留底",
  "shipping_plans_v1_cloud":"发布记录 · 被拒的云端旧数据",
  "shipping_plans_v1__cloud":"发布记录 · 被拒的云端旧数据",
  "shipping_plans_v1":"发布记录",
  "shipping_plans_archive_v1":"归档区",
  "shipping_snapshots_v1":"自动快照",
  "shipping_draft_v1":"未发布草稿",
  "shipping_plans_del_v1":"删除墓碑",
  "shipping_custton_v1":"客户吨位",
  "shipping_modelcust_v1":"送达方记忆",
  "shipping_schedule_v1":"旧版排产表残留",
  "auto_sched_v2":"自动排产系统",
  "order_mgmt_data_v1":"订单管理系统"
};
// ★ 性能：全量统计要遍历所有键、把每个值整个读出来（几百万字符的备份键尤其贵）。
//   结果缓存起来，只有真的发生写入/删除才失效 —— 这样 3 秒一次的定时刷新几乎零成本。
let __storeCache=null;
function invalidateStoreCache(){ __storeCache=null; }
function storageBreakdown(){
  // 键的数量变了（别的页面删了键）也要重算 —— 这条判据几乎零成本，能兜住"外部删除"
  if(__storeCache && __storeCache.n === localStorage.length) return __storeCache;
  let used = 0; const byKey = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i); if(!k) continue;
      const n = k.length + (localStorage.getItem(k)||"").length;
      used += n; byKey.push({ k:k, n:n });
    }
  }catch(e){}
  byKey.sort((a,b)=>b.n-a.n);
  __storeCache = { used:used, limit:STORE_LIMIT, byKey:byKey, n:localStorage.length };
  return __storeCache;
}
function updateStorageMeter(){
  const el = $("storeMeter"); if(!el) return;
  const r = storageBreakdown();
  const pct = Math.min(100, r.used / r.limit * 100);
  const cls = pct >= 85 ? "danger" : (pct >= 60 ? "warn" : "");
  // ★ 数值没变就直接返回：原来每 3 秒无条件重建浮层 HTML、改进度条宽度（无谓的样式重算）
  const sig = r.used + "|" + r.byKey.length + "|" + (r.byKey[0]?r.byKey[0].n:0);
  if(el._storeSig === sig) return;
  el._storeSig = sig;
  const bar = $("storeBar"), pctEl = $("storePct"), pop = $("storePop");
  if(bar){ bar.style.width = Math.max(0.8, pct).toFixed(2)+"%"; bar.className = cls; }
  if(pctEl){ pctEl.textContent = pct.toFixed(1)+"%"; pctEl.className = "pct "+cls; }
  if(pop){
    const fmt = n => n >= 1024 ? (n/1024).toFixed(0)+" K" : String(n);
    const rows = r.byKey.filter(o=>o.n>0).slice(0,6)
      .map(o=>`<div class="li"><span>${STORE_LABELS[o.k]||FOREIGN_LABELS[o.k]||esc(o.k)}${isOwnKey(o.k)?"":`<span class="tagf">${REDUNDANT_KEYS[o.k]?"留底":"外来"}</span>`}</span><b>${fmt(o.n)} 字符 · ${(o.n/r.limit*100).toFixed(1)}%</b></div>`).join("");
    const tip = pct>=85 ? "已接近上限，请立即导出备份并清理无用记录"
              : pct>=60 ? "占用偏高，建议导出备份并清理"
              : "空间充足，可放心使用";
    const fe = foreignEntries(), feSum = fe.reduce((s,o)=>s+o.n,0);
    const act = fe.length ? `<div class="act"><button type="button" data-store-act="clean-foreign">清理可释放占用 ${fe.length} 项 · ${fmt(feSum)}</button></div>` : "";
    pop.innerHTML = `<div class="hd">本机存储占用</div>${rows||'<div class="li"><span>暂无数据</span><b>—</b></div>'}
      <div class="li total"><span>合计</span><b>${(r.used/1024).toFixed(0)} K 字符 / 上限约 5,120 K</b></div>
      <div class="ft">${tip}</div>${act}`;
  }
  el.title = "本机存储占用 " + pct.toFixed(1) + "%（鼠标悬停看明细）";
}
try{ updateStorageMeter(); }catch(e){}
// ★ 性能：原来固定每 3 秒无条件全量统计一次，而且切到后台标签页也照跑。
//   现在：① 后台不跑；② 平时用缓存（几乎零成本），每约 21 秒才真正重算一次，
//         以防同一个网址下别的页面/工具改了存储而本页不知道；③ 数据一变立即刷新（touchStorageMeter）。
let __storeSweep = 0;
setInterval(()=>{
  if(document.hidden) return;                       // 后台标签页不做任何事
  if((++__storeSweep % 7) === 0) invalidateStoreCache();
  try{ updateStorageMeter(); }catch(e){}
}, 3000);
// 从后台切回前台：立刻校正一次（后台期间可能被别处改动过）
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden){ invalidateStoreCache(); try{ updateStorageMeter(); }catch(e){} }
});
// 浮层里的「清理」按钮用事件委托绑定：浮层内容每次刷新都会重建，直接绑会丢
(function(){
  const pop = $("storePop"); if(!pop) return;
  pop.addEventListener("click", e=>{
    const t = e.target;
    const btn = (t && t.closest) ? t.closest("[data-store-act]") : null;
    if(btn && btn.getAttribute("data-store-act") === "clean-foreign"){ e.preventDefault(); openForeignClean(); }
  });
})();
// 数据变动时也立即刷新（节流 1.2 秒，避免高频写入时反复全量统计）
// 注意「尾部补一次」：连续写入（发布 → 删除 → 归档）时如果只做前向节流，
// 后几次改动会被直接丢掉、水位停在旧值上，直到 3 秒定时器才追上。这里补一个尾调用。
let __storeTick = 0, __storeTimer = 0;
function touchStorageMeter(){
  invalidateStoreCache();          // 有写入 → 缓存的统计作废，下次刷新才真正重算
  const now = Date.now();
  if(now - __storeTick >= 1200){
    __storeTick = now;
    try{ updateStorageMeter(); }catch(e){}
    return;
  }
  if(__storeTimer) return;                      // 已有待补的刷新 → 不重复排队
  __storeTimer = setTimeout(()=>{
    __storeTimer = 0; __storeTick = Date.now();
    try{ updateStorageMeter(); }catch(e){}
  }, 1200 - (now - __storeTick));
}
// 顶部吸附位置：工具栏钉在导航栏下方，表头再钉在工具栏下方（高度变化时自动重算）
function syncTopbarOffset(){
  const ab=$("appbar"), tb=document.querySelector(".topbar");
  if(!tb) return;
  const ah = ab ? ab.offsetHeight : 0;
  tb.style.top = ah + "px";
  // --head-top = 导航栏高度 + 工具栏高度，供 .tbl thead th 的 sticky 使用
  document.documentElement.style.setProperty("--head-top", (ah + tb.offsetHeight) + "px");
}

window.addEventListener("load", syncTopbarOffset);
// 窗口尺寸变了 → 列宽跟着变，已算好的 textarea 高度不再适用（长文本会被截断）→ 去抖后全量重测

// 发货点单选下拉选项（汽零铸造 / 汽零机加工 / 北区 / 昆山衍咏）—— 每个发货点一种颜色（SHIPPT_COLOR 一处定义）

// ===================== 物料库（与物料数据库页共享 localStorage） =====================
let DB = loadDB();
function loadDB(){ try{ return JSON.parse(localStorage.getItem(LS_DB)) || []; }catch(e){ return []; } }
function updateDbStatus(){
  const el=$("dbStatus");
  if(!el) return;
  if(!DB.length) el.innerHTML="库空，<a href=\"物料数据库.html\" target=\"_blank\" style=\"color:var(--brand)\">去导入</a>";
  else el.textContent="库 "+DB.length+" 条";
}
// 从物料库页面切回时刷新，保证待选最新
window.addEventListener("focus", ()=>{
  if(window.CloudSync && CloudSync.ready()){
    // ★ 云端物料库到位后要把表里空着物流的行补一次：页面刚打开时本地库可能是旧的/空的，
    //   那一刻建的行带不出物流；等库真到了再带一遍，否则一直空到用户手动重开页面为止
    CloudSync.pull(LS_DB).then(v=>{ if(v!==null){ localStorage.setItem(LS_DB, JSON.stringify(v)); DB=loadDB(); updateDbStatus(); syncLogisticsAll(); } });
  } else { DB = loadDB(); updateDbStatus(); }
});

// ===================== 型号模糊待选（自动带出） =====================
let acEl=null, acList=[], acActive=-1, acRow=null, acTyped=false, acSnap=null, lastApplied=null;   // acTyped：待选是否由用户主动输入触发；acSnap：打开待选前的整行快照；lastApplied：最近一次「物料带出」前的快照（供 Esc 整行撤销）
function closeAC(){ if(acEl){ acEl.remove(); acEl=null; } acList=[]; acActive=-1; acTyped=false; }
// 记录整行会被「物料带出」改写的字段，供按 Esc 时恢复原数据
function snapRow(row){
  if(!row) return null;
  const g=f=>(row.querySelector(`[data-f="${f}"]`)?.value)||"";
  const lgEl=row.querySelector('[data-f="logistics"]');
  // 物流的「手填」标记也一起快照：撤销后要让手填状态一并回到原样，
  // 否则撤销回一个自动带出的值却被当成手填，客户再改它就不跟了
  return { row, model:g("model"), code:g("code"), unit:g("unit"), perbox:g("perbox"), customer:g("customer"), remark:g("remark"), logistics:g("logistics"),
           logisticsManual:!!(lgEl&&lgEl.dataset.manual==="1") };
}
function restoreRowSnap(){
  if(!acSnap || !acSnap.row || !acSnap.row.parentNode) return false;
  const row=acSnap.row;
  const set=(f,v)=>{ const el=row.querySelector(`[data-f="${f}"]`); if(el) el.value=v||""; };
  set("model",acSnap.model); set("code",acSnap.code); set("unit",acSnap.unit);
  set("perbox",acSnap.perbox); set("customer",acSnap.customer); set("remark",acSnap.remark); set("logistics",acSnap.logistics);
  const lgEl2=row.querySelector('[data-f="logistics"]');
  if(lgEl2){ if(acSnap.logisticsManual) lgEl2.dataset.manual="1"; else delete lgEl2.dataset.manual; }
  recalc(); mergeCustomerCells(); fitTextareas();
  acSnap=null;
  return true;
}
// 记录可编辑框聚焦时的原始值，供按 Esc 恢复（隐藏字段无需记录）
function trackOrig(el){
  if(!el || el.type==="hidden") return;
  el.addEventListener("focus", ()=>{ if(el.dataset.orig===undefined) el.dataset.orig=el.value; });
  el.addEventListener("blur", ()=>{ delete el.dataset.orig; });
}
function matchDB(q){
  q=q.trim().toLowerCase();
  if(!q) return [];                                  // 空输入不匹配任何物料：避免把整库当成待选项被误填入行
  return DB.filter(r =>
    (r.model||"").toLowerCase().includes(q) ||
    (r.code||"").toLowerCase().includes(q) ||
    (r.customer||"").toLowerCase().includes(q)).slice(0,8);
}
// 待选项优先顺序：含「机加工」=1 > 含「毛坯」=2 > 含「粗抛」=3 > 其他=4；任一字段（型号/编码/客户）命中即取该优先级，数字越小越靠前
function rankPriority(r){
  const fields=[r.model,r.code,r.customer];
  let p=4;
  for(const f of fields){
    const s=(f||"").toString();
    if(s.includes("机加工")) return 1;       // 数字越小越靠前，命中最高级直接返回
    if(s.includes("毛坯") && p>2) p=2;
    if(s.includes("粗抛") && p>3) p=3;
  }
  return p;
}
// 某型号（或编码）在物料库里对应的不同客户集合（用于提示多客户）
function customersForModel(model, code){
  const set=new Set();
  matchDb(model, code).forEach(r=>{ const cu=(r.customer||"").trim(); if(cu) set.add(cu); });
  return [...set];
}
function showAC(input, row, typed){
  acRow=row; closeAC();
  // 型号栏为空时不弹待选：否则按 Tab/Enter 会把物料库第一条误填进整行（客户列被莫名填上）
  if(!(input.value||"").trim()) return;
  acTyped=!!typed;                    // 只有用户打字唤出的待选才允许被填入，单纯聚焦路过时不填入
  if(!DB.length){
    acEl=document.createElement("div"); acEl.className="ac";
    acEl.innerHTML=`<div class="ac-item" style="color:var(--muted)">物料库为空，请先导入或打开「物料数据库」添加</div>`;
    document.body.appendChild(acEl);
    const rect=input.getBoundingClientRect();
    acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
    return;
  }
  acList=matchDB(input.value);
  // 待选项优先顺序：含「机加工」=P1 > 含「毛坯」=P2 > 含「粗抛」=P3 > 其他=P4（数字越小越靠前，Array.sort 稳定同级保持原顺序）
  acList.sort((a,b)=>rankPriority(a)-rankPriority(b));
  if(!acList.length){
    acEl=document.createElement("div"); acEl.className="ac";
    acEl.innerHTML=`<div class="ac-item" style="color:var(--muted)">无匹配物料：${esc(input.value)}</div>`;
    document.body.appendChild(acEl);
    const rect=input.getBoundingClientRect();
    acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
    return;
  }
  acEl=document.createElement("div"); acEl.className="ac";
  acList.forEach((r,idx)=>{
    const it=document.createElement("div"); it.className="ac-item"+(idx===0?" active":"");
    it.innerHTML=`<span class="ac-model">${esc(r.model||"-")}</span> <span class="ac-code">${esc(r.code||"")}</span>`+
      `<span class="ac-meta">${esc(r.customer||"")} ｜ ${esc(r.unit)||""}kg/件 ｜ ${esc(r.perbox)||""}件/箱</span>`;
    it.addEventListener("mousedown", e=>{ e.preventDefault(); applyDb(row, r); closeAC(); });
    acEl.appendChild(it);
  });
  document.body.appendChild(acEl);
  acActive=0;
  const rect=input.getBoundingClientRect();
  acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
}
function applyDb(row, r){
  lastApplied={ row, snap: acSnap || snapRow(row) };   // 记录带出前的整行数据，带出后按 Esc 可整行撤销
  row.querySelector('[data-f="model"]').value=r.model||"";
  row.querySelector('[data-f="code"]').value=r.code||"";
  row.querySelector('[data-f="unit"]').value=r.unit||"";
  row.querySelector('[data-f="perbox"]').value=r.perbox||"";
  // 避免物料库中客户与型号相同（常见导入错位）时把型号填进客户列
  row.querySelector('[data-f="customer"]').value=(r.customer && r.customer!==r.model)?r.customer:"";
  row.querySelector('[data-f="remark"]').value=r.remark||"";
  const lgInpDb=row.querySelector('[data-f="logistics"]');
  if(lgInpDb){ delete lgInpDb.dataset.manual; lgInpDb.value=r.logistics||""; }   // 物流随物料/客户带出（带出来的就是自动值 → 清掉手填标记）
  ensureLogistics(row);                                                          // 该条物料本身没写物流 → 按客户兜底再带一次
  recalc(); mergeCustomerCells(); fitTextareas(); toast("已带出："+(r.model||r.code));
  // 一个型号发多个客户：带出后提示用户确认/修改
  const cs=customersForModel(r.model, r.code);
  if(cs.length>1){
    const inp=row.querySelector('[data-f="customer"]');
    toast("⚠ 型号 "+(r.model||r.code)+" 发往 "+cs.length+" 个客户，已带出「"+(r.customer||"")+"」；如需修改请在客户列直接调整");
    inp.classList.add("flash"); setTimeout(()=>inp.classList.remove("flash"), 2600);
  }
  // 自动聚焦到发货数量，避免光标跳到客户列
  setTimeout(()=>{ const q=row.querySelector('[data-f="qty"]'); if(q){ q.focus(); q.select(); } }, 10);
}
// 按「客户」从物料库反查物流：取该客户**出现次数最多**的那个物流。
// ★ 口径只此一份 —— 实现已搬进 scan-lib.logisticsIndex / logisticsOf，
//   内部看板给老单实时补物流也调同一份，免得两个页面算出不同答案。
function logisticsForCustomer(customer){
  const c=(customer||"").trim();
  if(!c || !DB.length) return "";
  const L=window.ScanLib;                      // 用 window.ScanLib 而不是 SLB：
  if(!L || !L.logisticsIndex) return "";       // SLB 是后面才 const 的，早调会踩 TDZ
  return L.logisticsOf(c, L.logisticsIndex(DB));
}
// ★★ 物流自动带出的**唯一口径** —— 所有「行进入系统」的路径都必须过这里：
//    建行(addRow) / 草稿恢复 / 撤回恢复 / 粘贴(fillDbFieldsForRow) / 客户被带出(applyCustomerToRow) / 云端物料库到位
//    规则：① 手填过（data-manual=1）→ 一个字都不动，人工永远优先
//          ② 物料库里查得到 → 写上
//          ③ 查不到 → 保持原样（**绝不清空**：宁可不带，也不能把人工/历史值抹成空）
function ensureLogistics(tr){
  const lgInp=tr && tr.querySelector && tr.querySelector('[data-f="logistics"]');
  if(!lgInp) return false;
  if(lgInp.dataset.manual==="1") return false;
  const cust=(tr.querySelector('[data-f="customer"]')||{}).value||"";
  const model=(tr.querySelector('[data-f="model"]')||{}).value||"";
  let lg=logisticsForCustomer(cust);
  if(!lg) lg=logisticsForRow(cust, model);   // 名字写法对不上 → 按型号认人
  if(!lg || String(lgInp.value==null?"":lgInp.value).trim()===lg) return false;
  lgInp.value=lg;
  return true;
}
// 全表按客户重带一次物流，返回补了多少行（云端物料库到位、发布前兜底时用）
function syncLogisticsAll(){
  let n=0;
  try{
    [...$("tbody").children].filter(isDataRow).forEach(tr=>{ if(ensureLogistics(tr)) n++; });
  }catch(e){}
  return n;
}
// 客户名在库里对不上时，用「型号」认人（该型号在库里只挂一个客户）—— 取代码就是这么认的
function logisticsForRow(customer, model){
  const L=window.ScanLib;
  const md=String(model||"").trim();
  if(!L || !L.logisticsIndex || !L.logisticsOfRow || !md) return "";
  return L.logisticsOfRow({customer:customer||"", models:[md]}, L.logisticsIndex(DB));
}
// 客户列变更时自动带出物流（手填过则不覆盖）
function autoFillLogistics(tr){ ensureLogistics(tr); }
/* ==========================================================================
   一天一家公司发 2 车（2026-09-20 定稿口径 v3：连在一起=同一车）
   --------------------------------------------------------------------------
   现场场景：同一天同一家发好几车（中间隔着别家 / 分开放），光看客户名分不出
   是哪一车 → 客户名末尾自动挂「（第二车）」/「（第三车）」…。

   ★ 车号**只看同一天**，绝不跨日期累计（按日期全局累计会闹出「当天就一车
     却挂第五车」的笑话，2026-09-20 现场反馈）：
     · **连在一起的行 = 同一车**：表格里相邻的同「客户+发货日期」行，哪怕
       发货点不同、装的是不同型号，都算同一车 → 一律不挂后缀；
     · **跨行了才编下一车**：同客户同日期的另一块，中间隔着别家客户（或空行/
       没填日期的行）→ 按当天块数挂「（第二车）」「（第三车）」…；
     · 不同日期各自从第一车算起，互不相干。

   ★ 后缀只加在**名字**上，认人一律回基名（scan-lib.custBase）：
     查物料编码 / 物流 / 送达方代码，第二车跟第一车完全一样；
     而分组（合并单元格、客户吨位、大屏一行）用全名 → 两车各自独立、各自算吨位。
   ★ 只认末尾的「第X车／X车」括号后缀，客户名本来就带括号的不受影响
     （例：宁波泰友（宁波甬微进仓）不是车号）。
   ★ 加错了随时删：把后缀删掉，这一行会被记住（存进草稿、跨刷新保留），
     系统不再给它自动挂 —— 同一车装多个型号的常规用法就靠这个。
   ========================================================================== */
let __carBusy=false;
function carBase(n){ const L=window.ScanLib; return (L&&L.custBase)?L.custBase(n):String(n==null?"":n).trim(); }
function carNo(n){ const L=window.ScanLib; return (L&&L.carNoOf)?L.carNoOf(n):1; }
function custName(base,n){ const L=window.ScanLib; return (L&&L.custWithCar)?L.custWithCar(base,n):String(base==null?"":base).trim(); }
function carField(tr,f){ const el=tr.querySelector('[data-f="'+f+'"]'); return el?String(el.value||"").trim():""; }
// 重新判定某一行是这一天的第几车（只在真的变了才动 DOM）
// ★ 车号口径（2026-09-20 定稿 v3）：车号**只看同一天**，绝不跨日期累计。
//   · **连在一起（表格里相邻）的同「基名+发货日期」行 = 同一车**——发货点不同、
//     型号不同都不拆，一律不挂后缀；
//   · 中间隔着别家客户（或空行/没填日期的行）才拆成新块 → 按当天块数挂后缀；
//   · **不同日期各自从第一车算起** —— 客户在这个月已经发过几次货，跟今天这车没关系。
// 全表算一遍「每一行是第几车」，返回 Map(tr → 车号)。syncCarSuffix / carFixAll 共用，口径唯一。
function carNumsAll(){
  const L=window.ScanLib; const map=new Map();
  if(!L||!L.custBase) return map;
  const cnt={};                        // base|date → 该客户当天已见到的块数
  let runKey=null;                     // 当前连续块键（中间隔别家/空行/缺日期都会打断）
  [...$("tbody").children].filter(isDataRow).forEach(tr=>{
    const v=carField(tr,"customer");
    const b=v?carBase(v):"";
    const d=b?carField(tr,"shipdate"):"";
    let num=1;
    if(b&&d){
      const k=b+"|"+d;
      if(k!==runKey){                  // 新的一块 → 该客户当天块数 +1
        runKey=k;
        cnt[k]=(cnt[k]||0)+1;
      }
      num=cnt[k];
    } else runKey=null;
    map.set(tr,num);
  });
  return map;
}
// 这一行是第几车（单行查询入口；批量修正请走 carNumsAll，避免每行重算全表）
function carNumOf(tr){
  return carNumsAll().get(tr)||1;
}
function syncCarSuffix(tr){
  if(__carBusy) return false;
  const inp=(tr&&tr.querySelector)?tr.querySelector('[data-f="customer"]'):null;
  if(!inp) return false;
  const cur=String(inp.value||"").trim();
  const base=carBase(cur); if(!base) return false;  // 空名字不处理
  let want;
  if(tr.dataset.carPin==="1") want=base;           // 用户明确不要后缀
  else { const n=carNumOf(tr); want=(n>1)?custName(base,n):base; }
  if(cur===want) return false;
  __carBusy=true;
  try{ inp.value=want; inp.dataset.carPrev=want; inp.dataset.autoCar=(want!==base?"1":"0"); } finally { __carBusy=false; }
  return true;
}
// 兜底修正（粘贴 / 删除 / 撤回 / 改日期之后）：按当天分块重排车号，孤儿后缀自动摘掉
function carFixAll(){
  const L=window.ScanLib; if(!L||!L.custBase) return 0;
  const nums=carNumsAll();
  let n=0;
  [...$("tbody").children].filter(isDataRow).forEach(tr=>{
    const inp=tr.querySelector('[data-f="customer"]'); if(!inp) return;
    const cur=String(inp.value||"").trim();
    const base=carBase(cur); if(!base) return;      // 空名字不处理
    let want;
    if(tr.dataset.carPin==="1") want=base;          // 豁免行 → 永远不挂
    else {
      const num=nums.get(tr)||1;
      want = num>1 ? custName(base,num) : base;
    }
    if(cur!==want){ inp.value=want; inp.dataset.carPrev=want; inp.dataset.autoCar=(want!==base?"1":"0"); n++; }
  });
  return n;
}
// 用户手动改了客户名。只有「把后缀那一截删掉」才算「这行不要后缀」（永久记住，跟草稿一起存）：
//   ★ 判据是「新值 = 旧值的基名」——即被删掉的正好是「（第N车）」。
//     不能只看「改完没后缀」：那样「全选删掉再手打原名」「先清空再输入」都会被误判成
//     「用户主动放弃后缀」，于是这一行被钉上 carPin，以后改回这家也永远加不了后缀
//     （现场反馈的「手写的客户不跳第二车」就是这条踩出来的）。
//   ★ 反过来，用户把名字改成**另一家客户**了 → 旧的豁免作废，重新交给 carTick 判定。
function carManualEdit(tr){
  const inp=tr.querySelector('[data-f="customer"]');
  if(!inp) return;
  const prev=inp.dataset.carPrev||"";
  const cur=String(inp.value||"").trim();
  if(inp.dataset.autoCar==="1" && carNo(prev)>1 && cur===carBase(prev)) tr.dataset.carPin="1";   // 只是删了后缀
  else if(tr.dataset.carPin==="1" && cur && carBase(cur)!==carBase(prev)) delete tr.dataset.carPin;  // 换成别家了
  inp.dataset.carPrev=cur;
  delete inp.dataset.autoCar;
}
// 送达方定下来 → 判定车号 + 兜底修正；有变化就重建合并格、存草稿（并提示一次）
function carTick(tr){
  let hit=false;
  if(tr && syncCarSuffix(tr)){
    hit=true;
    const now=String(tr.querySelector('[data-f="customer"]').value||"").trim();
    if(carNo(now)>1 && tr.dataset.carPin!=="1"){
      const tail=now.slice(carBase(now).length);
      toast("同一天分开发货（中间隔着别家），已自动排为 "+tail+"；若其实是同一车的不同型号，把后缀删掉即可（删掉后不再自动加）");
    }
  }
  if(carFixAll()>0) hit=true;
  if(hit){ mergeCustomerCells(); saveDraft(); }
  return hit;
}
function autoResizeTa(ta){ fitTextarea(ta); }
// 统一匹配物料库：型号 / 物料编码
// ★ 型号和编码都有时，必须「两者都一致」；都对不上（常见于改过型号、编码还是旧物料的）
//   就退回「只按型号」查——绝不用「或」把两个不同物料的客户/单重混进来
//   （「或」是备选里冒出无关送达方的根源：编码撞上别的物料，那条记录的客户也被算进来了）
function matchDb(model, code){
  const mk=(model||"").trim().toLowerCase(), ck=(code||"").trim().toLowerCase();
  const byModel=mk?DB.filter(r=>(r.model||"").trim().toLowerCase()===mk):[];
  if(mk && ck){
    const both=byModel.filter(r=>(r.code||"").trim().toLowerCase()===ck);
    if(both.length) return both;                       // 型号+编码完全一致 → 最准
    if(byModel.length) return byModel;                 // 编码对不上 → 以型号为准
    return DB.filter(r=>(r.code||"").trim().toLowerCase()===ck);
  }
  if(mk) return byModel;
  if(ck) return DB.filter(r=>(r.code||"").trim().toLowerCase()===ck);
  return [];
}
// 按型号（或物料编码）从物料库反查送达方集合：同型号可能发多个送达方
function customersForModelExactly(model, code){
  const set=[];
  matchDb(model, code).forEach(r=>{
    const cu=(r.customer||"").trim();
    if(cu && !set.includes(cu)) set.push(cu);
  });
  return set;
}
// 多送达方选择弹窗（队列化，避免多行同时弹多个）
let custModalQueue=[]; let custModalOpen=false;
function chooseCustomerModal(customers, model, cb){
  custModalQueue.push({customers, model, cb});
  if(!custModalOpen) processCustModalQueue();
}
function processCustModalQueue(){
  if(!custModalQueue.length){ custModalOpen=false; return; }
  custModalOpen=true;
  const {customers, model, cb}=custModalQueue.shift();
  const overlay=document.createElement("div"); overlay.className="modal-overlay";
  const box=document.createElement("div"); box.className="modal-box";
  const title=document.createElement("div"); title.className="modal-title";
  title.textContent=`型号「${model}」在物料库中发往 ${customers.length} 个送达方，请选择：`;
  box.appendChild(title);
  const hint=document.createElement("div");
  hint.style.cssText="font-size:12px;color:#6b7280;margin:-6px 0 10px;";
  hint.textContent="（本次选择自动用于本型号的所有行，一个型号只需确认一次）";
  box.appendChild(hint);
  const list=document.createElement("div"); list.className="modal-list";
  customers.forEach(cu=>{
    const b=document.createElement("button"); b.className="modal-opt"; b.textContent=cu;
    b.onclick=()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); cb(cu); processCustModalQueue(); };
    list.appendChild(b);
  });
  box.appendChild(list);
  const skip=document.createElement("button"); skip.className="modal-skip"; skip.textContent="跳过（不填送达方）";
  skip.onclick=()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); cb(null); processCustModalQueue(); };
  box.appendChild(skip);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
// 已确认过的「型号 → 送达方」记忆：一个型号只确认一次，且跨刷新保留（存本机）
const MODEL_CUST_KEY="shipping_modelcust_v1";
let modelCustChoice={};
try{ modelCustChoice=JSON.parse(localStorage.getItem(MODEL_CUST_KEY)||"{}")||{}; }catch(e){ modelCustChoice={}; }
function rememberModelCust(model, cust){
  const m=(model||"").trim(); if(!m||!cust) return;
  modelCustChoice[m]=cust;
  try{ localStorage.setItem(MODEL_CUST_KEY, JSON.stringify(modelCustChoice)); }catch(e){}
}
// 本次会话内被「跳过」的型号：不再重复弹窗（不存本机，刷新后重置）
const modelCustSkip={};
// 等待选择的「型号 → 行」列表：同型号多行只弹一次，选定后统一应用到所有这些行
let pendingModelRows={};
function applyCustomerToRow(tr, cust, overwrite){
  const custInp=tr.querySelector('[data-f="customer"]');
  if(!custInp) return;
  // 换客户名时把这行的车号原样带回来（原本是第二车就别写成第一车），随后由 carTick 复核
  if(overwrite===true || !custInp.value.trim()) custInp.value=custName(cust, carNo(custInp.value));   // 粘贴并确认选择时允许覆盖；其余情况保留已有手填值
  autoFillLogistics(tr);
  // 型号/物料已填时，自动带出客户后聚焦到发货数量列
  const modelInp=tr.querySelector('[data-f="model"]');
  const codeInp=tr.querySelector('[data-f="code"]');
  if((modelInp&&modelInp.value.trim()) || (codeInp&&codeInp.value.trim())){
    setTimeout(()=>{ const q=tr.querySelector('[data-f="qty"]'); if(q){ q.focus(); q.select(); } }, 10);
  }
  carTick(tr);        // 送达方带出来了 → 判定这一天的第几车
}
// 根据当前行的型号自动带出送达方：唯一则直接填入；多个则弹窗选择
// opts.force = true：粘贴批量数据时使用——只要该型号有 2 个以上送达方，就重新询问一次
//                  （无视本机记忆、无视本次「跳过」、无视行里残留的旧值；同型号只弹一个窗）
// opts.respectFilled = true：这次粘贴的内容里自带「送达方」列 → 以粘贴进来的值为准，不再多问
function autoFillCustomerByModel(tr, opts){
  const force=!!(opts&&opts.force);
  const respectFilled=!!(opts&&opts.respectFilled);
  const modelInp=tr.querySelector('[data-f="model"]');
  const custInp=tr.querySelector('[data-f="customer"]');
  if(!modelInp||!custInp) return;
  const model=(modelInp.value||"").trim();
  if(!model) return;
  const code=(tr.querySelector('[data-f="code"]')?.value||"").trim();
  const custs=customersForModelExactly(model, code);
  if(!custs.length) return;
  const filled=(custInp.value||"").trim();
  const filledBase=carBase(filled);
  const filledIsCandidate=!!filled && custs.some(c=>carBase(c).toLowerCase()===filledBase.toLowerCase());   // 行里已是一个有效候选 → 视为已确认
  if(!force){
    // 手动逐格录入：行里已有送达方 → 不再打扰（重复询问的根源就在这里）
    if(filled){
      if(filledIsCandidate && !modelCustChoice[model]) rememberModelCust(model, filledBase);
      return;
    }
    if(custs.length===1){ applyCustomerToRow(tr, custs[0]); return; }
    const remembered=modelCustChoice[model];
    if(remembered && custs.includes(remembered)){ applyCustomerToRow(tr, remembered); return; }   // 已确认过 → 直接沿用，不再弹窗
    if(modelCustSkip[model]) return;                                                              // 本型号本次已选「跳过」→ 不再询问
  }else{
    if(custs.length===1){ applyCustomerToRow(tr, custs[0]); return; }   // 唯一送达方无需选择
    if(respectFilled && filled) return;                                // 粘贴内容自带送达方列且写了值 → 以粘贴为准
    // 其余情况（空着 / 只是被旧记忆或残留带出来的）→ 一律重新询问一次
  }
  if(pendingModelRows[model]){ pendingModelRows[model].push(tr); return; }   // 正在等待本型号的选择 → 本行排队，不重复弹窗
  pendingModelRows[model]=[tr];
  chooseCustomerModal(custs, model, (chosen)=>{
    const rows=pendingModelRows[model]||[]; delete pendingModelRows[model];
    if(!chosen){ modelCustSkip[model]=1; return; }   // 跳过：本次会话不再重复询问
    rememberModelCust(model, chosen);                // 记住选择（跨刷新保留），后续手动录入同型号不再询问
    rows.forEach(r=>applyCustomerToRow(r, chosen, true));   // 粘贴场景需覆盖旧值，确保选择真实生效
    recalc(); mergeCustomerCells(); saveDraftNow();
  });
}
// 按型号/物料编码取物料库中所有候选记录
function dbRecordsForModel(model, code){
  return matchDb(model, code);
}
// 从物料库带出「物料编码 + 单重 + 每箱件数」：
// 单重(kg/件) → 产品重量T；每箱件数 → 箱数 → 箱重T；客户吨位 = 产品重量T + 箱重T 由合并逻辑汇总
function fillDbFieldsForRow(tr){
  const modelInp=tr.querySelector('[data-f="model"]');
  const codeInp=tr.querySelector('[data-f="code"]');
  if(!modelInp) return;
  const model=(modelInp.value||"").trim();
  const code=(codeInp?.value||"").trim();
  if(!model && !code) return;
  const recs=dbRecordsForModel(model, code);
  if(!recs.length) return;
  // 多条候选：优先与当前行送达方一致的，其次本型号已记住的选择，最后首条
  const cust=(tr.querySelector('[data-f="customer"]')?.value||"").trim();
  let r=(cust && recs.find(x=>carBase(x.customer).toLowerCase()===carBase(cust).toLowerCase()))||null;   // 「（第二车）」也认原客户
  if(!r && model){ const rm=modelCustChoice[model]; if(rm) r=recs.find(x=>(x.customer||"").trim()===rm)||null; }
  if(!r) r=recs[0];
  if(codeInp){
    const cur=(codeInp.value||"").trim();

      codeInp.value=r.code||"";                     // 空 → 按型号带出
    }else if(model){
      // 已填的编码若与本行型号不是同一个物料（改了型号、编码还是旧的）→ 以型号为准纠正，
      // 否则这行会「型号 A + 编码 B」，反查客户/单重时把 B 的客户也带出来，备选里就冒出无关送达方
      const mk=model.toLowerCase(), ck=cur.toLowerCase();
      const exact=DB.some(x=>(x.model||"").trim().toLowerCase()===mk && (x.code||"").trim().toLowerCase()===ck);
      if(!exact){
        const codes=[...new Set(DB.filter(x=>(x.model||"").trim().toLowerCase()===mk)
                                 .map(x=>(x.code||"").trim()).filter(Boolean))];
        if(codes.length===1 && codes[0]!==cur){     // 该型号只有一个编码才敢改，多个编码时不猜
          codeInp.value=codes[0];
          toast("已按型号纠正物料编码："+cur+" → "+codes[0]);
        }
      }
    }
  }
  const setH=(f,v)=>{ const el=tr.querySelector(`[data-f="${f}"]`); if(el) el.value=(v==null?"":String(v)); };
  setH("unit", r.unit);        // 单重 kg/件
  setH("perbox", r.perbox);    // 每箱件数
  ensureLogistics(tr);         // ★ 物流同源带出（粘贴/改型号回填物料字段时一起带，别让物流列空着）
}
function moveAC(d){

  acActive=(acActive+d+items.length)%items.length;
  items.forEach((it,i)=>it.classList.toggle("active", i===acActive));
  items[acActive].scrollIntoView({block:"nearest"});
}
document.addEventListener("click", e=>{ if(acEl && !acEl.contains(e.target)) closeAC(); });
document.addEventListener("keydown", e=>{
  if(!acEl) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); moveAC(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveAC(-1); }
  // 只有「用户打字唤出的待选」才允许 Enter/Tab 填入；单纯聚焦弹出的待选仅作提示，Tab 只关闭并跳格，绝不改数据
  else if(e.key==="Enter"){ if(acTyped && acList.length && acActive>=0){ e.preventDefault(); applyDb(acRow, acList[acActive]); } closeAC(); }
  else if(e.key==="Tab"){ if(acTyped && acList.length && acActive>=0){ e.preventDefault(); applyDb(acRow, acList[acActive]); } closeAC(); }
  else if(e.key==="Escape"){ const done=restoreRowSnap(); closeAC(); if(done) toast("已恢复原数据"); }
});
// Esc（无待选面板时）：把当前正在编辑的单元格恢复成聚焦时的值
document.addEventListener("keydown", e=>{

  if(lastApplied && lastApplied.row && el && el.closest && el.closest("tr")===lastApplied.row){
    const s=lastApplied.snap;

    set("model",s.model); set("code",s.code); set("unit",s.unit); set("perbox",s.perbox); set("customer",s.customer); set("remark",s.remark); set("logistics",s.logistics);

});

// ===================== 发货计划单 =====================
function todayStr(){ const d=new Date(); d.setDate(d.getDate()+1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function realTodayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
$("shipDate").value=todayStr();
function genPlanNo(){ const d=$("shipDate").value||todayStr(); const p=s=>String(s).padStart(2,"0"); const ymd=d.split("-"); return "FH"+ymd[0]+p(+ymd[1])+p(+ymd[2])+"-"+String(Math.floor(Math.random()*9000)+1000); }
$("planNo").value=genPlanNo();
// 单号里嵌着「发货日期」+ 4 位流水。历史上出过两种脏单号，都在这里一次修正：
//   ① 旧版页面生成的缺横杠单号：FH202609153955 → FH20260915-3955
//   ② 日期段跟实际发货日期对不上的（2026-09-16 用户反馈）：录计划时表头日期还没改成
//      实际发货日期就生成了单号，出现「FH20260915-xxxx 却 9/16 发货」。给了真实发货日期
//      就把日期段对齐过去（流水号保持不变，单号仍能唯一标识这批货）。
// 所有「读取 / 合并 / 发布」路径都过这道修正：脏单号只要被碰到一次就永久修好，
// 管理端打开后会随校对同步把修好的单号推上云端，发货员端 / 大屏 / 扫码页跟着显示正确。
function ymdOfDate(v){ const m=String(v==null?"":v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (m[1]+m[2]+m[3]) : ""; }
function fixPlanNo(no, shipdate){
  if(no==null) return no;                                // null/undefined 原样返回（显示层自己有兜底）
  let s = String(no);
  const m = s.match(/^(FH\d{8})(\d{4})$/);
  if(m) s = m[1] + "-" + m[2];                          // ① 补横杠
  const ymd = ymdOfDate(shipdate);                       // ② 日期段对齐真实发货日期
  if(ymd && /^FH\d{8}-\d{4}$/.test(s) && s.slice(2,10) !== ymd) s = "FH" + ymd + s.slice(10);
  return s;
}

function renumberVisible(){   // 对可见行做全局连续编号（折叠/筛选隐藏行跳过）

// ===================== 客户吨位：手动修改覆盖值 =====================
// ★ 2026-09-24 用户改口径：吨位按「车」算 —— 一个客户同一天（同一辆车）只有一个吨位，
//   走几个发货点都合成这一个数；同一天发第二车时，第二车的客户名带「（第二车）」后缀，
//   与日期一起构成不同的 key → 第二车单独一个吨位。所以 key = 「客户|发货日期」（客户名含车次后缀）。
//   发布时打包进 rec.custTon，发货员端 / 大屏 / 扫码页自动同步。
// 兼容旧数据：老版三段 key（客户|发货日期|发货点）是「按发货点各改各的」——
//   现在把各区域的值相加（手改值优先、否则该区域自动小计）= 该车合计，计划员改过的数不会丢。
const CT_KEY="shipping_custton_v1";
function loadCT(){ try{ return JSON.parse(localStorage.getItem(CT_KEY))||{}; }catch(e){ return {}; } }
function saveCT(o){
  try{ localStorage.setItem(CT_KEY, JSON.stringify(o)); }catch(e){}
  try{ if(window.CloudSync) CloudSync.autoPush(CT_KEY); }catch(e){}
}
// 主 key：客户（含「（第二车）」车次后缀）+ 发货日期 —— 一辆车一个吨位
function ctKeyOf(cust,date){ return String(cust==null?"":cust).trim()+"|"+String(date==null?"":date).trim(); }
// 旧三段 key（客户|日期|发货点）：只在读旧数据、折算旧值时用
function ctPtKey(cust,date,pt){ return ctKeyOf(cust,date)+"|"+String(pt==null?"":pt).trim(); }
function _ctNum(o,k){ if(o[k]===undefined||o[k]===null||String(o[k]).trim()==="") return null; const v=parseFloat(o[k]); return isNaN(v)?null:v; }
// 清掉某个「客户|日期」下所有旧三段 key（手改 / 恢复时把旧口径的数据一并归位，不让旧值复活）
function ctDropLegacy(o,cust,date){
  const pre=ctKeyOf(cust,date)+"|";
  Object.keys(o).forEach(k=>{ if(k.indexOf(pre)===0) delete o[k]; });
}
// 返回手动覆盖值；没改过返回 null。
// ptAuto（可选）= 本车各发货点的自动小计 { 发货点: 吨位 }，用来把旧三段值无损折算成本车合计。
function ctOverride(cust,date,ptAuto){
  const o=loadCT();
  const v=_ctNum(o,ctKeyOf(cust,date));
  if(v!==null) return v;
  if(ptAuto){
    let s=0, any=false;
    Object.keys(ptAuto).forEach(pt=>{
      const v3=_ctNum(o,ctPtKey(cust,date,pt));
      if(v3!==null){ s+=v3; any=true; } else s+=ptAuto[pt];
    });
    if(any) return s;        // 旧口径各区域相加 = 本车合计（改版前屏幕上显示的就是这个数）
  }
  return null;
}
// 提交一次修改（已在调用处做过校验与确认）
function commitSubTon(inp){
  const cust=inp.dataset.cust||"", date=inp.dataset.date||"", pt=inp.dataset.pt||"";
  const old=inp.dataset.shown||"";
  const nv=String(inp.value).trim();
  const o=loadCT(), k=ctKeyOf(cust,date);
  if(nv==="") delete o[k];               // 清空 = 恢复自动合计
  else o[k]=parseFloat(nv);
  ctDropLegacy(o,cust,date);             // 旧三段 key 一并清掉：这辆车从此只认一个数（旧值不许复活）
  saveCT(o);
  if(typeof recalc==="function") recalc();
  // ★ foldByDate 有「行内容没变就短路」的指纹捷径，改吨位不会推翻它 → 这里补一次合并重建，
  //   否则「清空恢复自动合计」后格子还停在旧输入值上不刷新
  if(typeof mergeCustomerCells==="function") mergeCustomerCells();
  if(typeof toast==="function") toast(nv===""?"已恢复自动合计 ✓":"客户吨位已修改 ✓");
}
// 绑定一个客户吨位输入框的交互：回车确认、Esc 放弃、右键撤回
function bindSubTonInput(inp){
  if(!inp || inp.dataset.bound==="1") return;
  inp.dataset.bound="1";
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); inp.blur(); }
    else if(e.key==="Escape"){ inp.value=inp.dataset.shown||""; inp.blur(); }
  });
  inp.addEventListener("change",()=>{
    const old=inp.dataset.shown||"";
    let nv=String(inp.value).trim();
    if(nv===old) return;                                  // 没改，忽略
    if(nv!=="" && !/^-?\d+(\.\d+)?$/.test(nv)){            // 非法输入
      alert("客户吨位只能填数字（可带小数点），请重新填写。");
      inp.value=old; return;
    }
    const cust=inp.dataset.cust||"";
    const newTxt=(nv===""?"（清空，恢复自动合计）":nv);
    const ok=confirm(
      "确认修改客户吨位？\n\n"+
      "客户："+cust+"\n"+
      "原值："+old+"\n"+
      "新值："+newTxt+"\n\n"+
      "说明：只更新这一辆车（同客户+同日期）：几个发货点合起来就是这一个数，\n"+
      "第二车（客户名带「（第二车）」）单独算；并同步到导出、打印与发货员端。"
    );
    if(!ok){ inp.value=old; return; }
    commitSubTon(inp);
  });
  inp.addEventListener("contextmenu",e=>{
    const cust=inp.dataset.cust||"", date=inp.dataset.date||"";
    // 本车手改值 or 旧三段值，有任一就允许撤回
    const _o=loadCT(), _p=ctKeyOf(cust,date);
    if(!(_ctNum(_o,_p)!==null || Object.keys(_o).some(k=>k.indexOf(_p+"|")===0))) return;
    e.preventDefault();
    if(confirm("撤回【"+cust+"】的客户吨位修改，恢复为系统自动合计？")){
      const o=loadCT(); delete o[ctKeyOf(cust,date)]; ctDropLegacy(o,cust,date); saveCT(o);
      if(typeof recalc==="function") recalc();
      if(typeof mergeCustomerCells==="function") mergeCustomerCells();   // 短路捷径会跳过合并，补一次
      if(typeof toast==="function") toast("已恢复自动合计 ✓");
    }
  });
}

// 「↺ 恢复」小按钮：把手填的客户吨位恢复为系统自动带出的值
function bindSubTonReset(btn, cust, date, pt, autoTxt){
  if(!btn) return;
  // 按下时不要让输入框失焦（否则会先弹「修改确认」框，变成两次弹窗）
  btn.addEventListener("mousedown", e=>e.preventDefault());
  btn.addEventListener("click", ()=>{
    const wrap=btn.closest(".subton-wrap");
    const inp=wrap && wrap.querySelector(".subton-in");
    if(inp) inp.value=inp.dataset.shown||"";        // 丢弃未提交的编辑，避免重复确认
    if(!confirm(
      "恢复【"+cust+"】的客户吨位为系统自动带出？\n\n"+
      "当前值："+(inp?inp.dataset.shown:"")+"\n"+
      "恢复后："+autoTxt
    )) return;
    const o=loadCT(); delete o[ctKeyOf(cust,date)]; ctDropLegacy(o,cust,date); saveCT(o);
  if(typeof recalc==="function") recalc();
  if(typeof mergeCustomerCells==="function") mergeCustomerCells();   // 短路捷径会跳过合并，补一次
  if(typeof toast==="function") toast("已恢复自动带出 ✓");
  });
}

function sortRowsByDate(){   // 按发货日期升序重新排列数据行（客户吨位合并在 recalc 中重建）
  const tb=$("tbody");
  const rows=[...tb.children].filter(isDataRow);
  rows.sort((a,b)=>{
    const da=a.querySelector('[data-f="shipdate"]')?.value||"";
    const db=b.querySelector('[data-f="shipdate"]')?.value||"";
    return da<db?-1:(da>db?1:0);
  });
  rows.forEach(r=>tb.appendChild(r));
}
// 自适应高度的缓存失效开关：列宽/可用宽度可能变了（窗口缩放、出现滚动条等）→ 下次全量重测。
// 不这么做的话，窄窗口下量出的「一行高度」会被缓存住，窗口拉宽/拉窄后长文本就一直被截断。
let __fitEpoch=1, __fitSeen=0;
function invalidateFitCache(){ __fitEpoch++; }
// 「（第二车）」后缀会让客户名一下子长一截：固定宽的格子里放不下就折行，
// 行高从 31px 顶到 43px，整张表的节奏就乱了。这里按内容把字号缩一档（最低 12px），
// 只要缩完能放回一行就缩；缩到 12px 还放不下（超长公司名 / 窄屏）就不缩，
// 照旧交给 fitTextarea 折行 —— 宁可折行，绝不裁字。
let __custFsCache=new WeakMap();
const CUST_FS_BASE=14;          // ★ 跟 .tbl td textarea 的 font-size 保持一致
const CUST_FS_MIN=11.5;         // 缩到这个字号仍放不下 → 回原字号折行（绝不裁字）
const CUST_ONE_LINE=27;         // 单行的 scrollHeight 上限（min-height:26px + 1px 余量）
// 「（第二车）」后缀会让客户名一下子长一截：固定宽的格子里放不下就折行，行高从 31px 顶到 43px，
// 整张表的节奏就乱了。这里逐档试字号，能回到一行就缩一档；缩到下限还放不下就回原字号照旧折行。
// ★ 用**真实排版反馈**（设字号 → 读 scrollHeight）而不是「先算文字宽度再决定」：
//   预算宽度跟 textarea 实际排版差 1~2px（字距、字体回退、浏览器内部内边距），
//   在「刚好卡边」的地方会算出「放得下」而实际折行 —— 这个坑实测踩过两次。
function custFontFor(ta){
  const val=(ta.value||"").trim();
  const box=ta.clientWidth-8;                   // 没有布局盒（折叠 / 被合并隐藏）时 ≈ 0
  if(!val || box<=10) return 0;
  const hit=__custFsCache.get(ta);
  if(hit && hit.val===val && hit.box===box) return hit.fs;
  // ★ 先关掉过渡再量：`.tbl td textarea` 上有 `transition:.15s`（focus 边框渐变用的），
  //   它连 font-size 一起做成了 150ms 动画 —— 设完字号立刻读 scrollHeight，
  //   读到的是**过渡中间态**（字号几乎还停在旧值），表现为「怎么降都还是两行」。
  ta.style.transition="none";
  ta.style.fontSize="";
  ta.style.height="auto";
  let out=0;
  if(ta.scrollHeight>CUST_ONE_LINE){            // 折行了 → 逐档降字号，直到回到一行
    for(let fs=CUST_FS_BASE-0.5; fs>=CUST_FS_MIN-0.01; fs-=0.5){
      ta.style.fontSize=fs+"px";
      ta.style.height="auto";
      if(ta.scrollHeight<=CUST_ONE_LINE){ out=Math.round(fs*10)/10; break; }
    }
    if(!out) ta.style.fontSize="";              // 缩到底仍折行 → 回原字号
  }
  ta.style.transition="";
  __custFsCache.set(ta, { val:val, box:box, fs:out });
  return out;
}
function fitTextarea(ta){
  if(!ta) return;
  if(ta.dataset.f==="customer"){               // 客户名：先定字号，再量高度（字号会影响换行）
    const fs3=custFontFor(ta), v3=fs3?fs3+"px":"";
    if(ta.style.fontSize!==v3) ta.style.fontSize=v3;
  }
  ta.style.height="auto";
  const raw=ta.scrollHeight;
  // ★ 元素此刻没有布局盒（被折叠、被合并隐藏、所在列被隐藏）→ scrollHeight 恒为 0，
  //   这个结果不能信、更不能缓存：一旦缓存住，它重新显示时会因为「值没变」被永久跳过，
  //   长文本就只显示第一行（如「杭州鑫洲制冷设备有限公司」只看到「杭州鑫洲制冷设备有限」）。
  if(raw===0){ ta._fitVal=undefined; ta.style.height="26px"; return; }
  ta._fitVal=ta.value;                 // 与全量版共享缓存，避免下次全量测量时又白测一遍
  const h=Math.max(26,raw);
  ta.style.height=h+"px";
  // 合并单元格：同时给 td 设最小高度，让 rowspan 组随内容撑开
  const td=ta.closest("td");
  if(td && td.rowSpan>1) td.style.height=(h+4)+"px";
}
// 批量自适应高度：读写分离（先统一置 auto → 统一读 scrollHeight → 统一写回），
// 把 N 次「强制同步布局」压到 1~2 次，折叠展开后几百行也不卡
function fitTextareas(force){
  // ★ 性能：原来是无条件全表测量。120 行的表里光 textarea 就有 500+ 个，
  //   每个都要「写 height:auto → 读 scrollHeight」——而读 scrollHeight 会强制浏览器同步重排，
  //   一次调用就是几百次强制布局，是最大的一处卡顿源。
  //   实际上 textarea 的高度只由它自己的文字决定：内容没变就不需要重新测量。
  //   最常做的「改数量 / 改箱数」根本不碰 textarea，所以这里能整段跳过（一次布局都不做）。
  const tas=$("tbody").querySelectorAll("textarea");
  if(!tas.length) return;
  // 列宽变过（窗口缩放/滚动条出现）→ 这一轮全量重测，否则旧高度会一直沿用
  force = !!force || __fitEpoch!==__fitSeen;
  if(force) __fitSeen=__fitEpoch;
  let anyChanged=force;
  if(!anyChanged){
    for(let i=0;i<tas.length;i++){ const ta=tas[i]; if(ta._fitVal!==ta.value){ anyChanged=true; break; } }
  }
  if(!anyChanged) return;
  // 只测量真正需要的那几行（首次 / 文字变了 / 强制全量）
  const dirty=[];
  for(let i=0;i<tas.length;i++){
    const ta=tas[i];
    if(force || ta._fitVal!==ta.value || !ta.style.height){ ta._fitVal=ta.value; dirty.push(ta); }
  }
  if(!dirty.length) return;
  // 客户名：先按内容定字号（能缩回一行就缩），再统一量高度 —— 顺序不能反，
  // 否则量到的高度是「还没缩字号」那份，缩完又要重排一次。
  for(let i=0;i<dirty.length;i++){
    const ta0=dirty[i];
    if(ta0.dataset.f!=="customer") continue;
    const fs0=custFontFor(ta0), v0=fs0?fs0+"px":"";
    if(ta0.style.fontSize!==v0) ta0.style.fontSize=v0;
  }
  // 读写分离：先批量写 auto，再批量读高度（这样浏览器只会做一次布局）
  for(let i=0;i<dirty.length;i++) dirty[i].style.height="auto";
  const raw=[];
  for(let i=0;i<dirty.length;i++) raw.push(dirty[i].scrollHeight);
  for(let i=0;i<dirty.length;i++){
    const ta=dirty[i];
    // ★ 没有布局盒（折叠/合并/隐藏列 → display:none）时 scrollHeight 恒为 0：
    //   这次测量作废，缓存清掉（不留 0 的结果），等它重新显示时自然会再测一次。
    //   老代码把 26px 缓存住 → 展开后因为「值没变」被跳过 → 长文本只显示一行被截断。
    if(raw[i]===0){ ta._fitVal=undefined; if(ta.style.height!=="26px") ta.style.height="26px"; continue; }
    const h=Math.max(26, raw[i]);
    const v=h+"px";
    if(ta.style.height!==v) ta.style.height=v;
    const td=ta.closest("td");
    if(td && td.rowSpan>1){ const tv=(h+4)+"px"; if(td.style.height!==tv) td.style.height=tv; }
  }
}
// —— 性能优化：输入时的全表刷新合批。打字会连续触发 recalc / 合并 / 折叠 / 高亮等多轮全表遍历，
//    用微任务队列合并成一次执行，重复调用只跑一遍。
function recalcLite(){ recalc(true); }   // 具名包装：便于合批调度器按引用去重
let _rq=0, _rjobs=null, _rqRAF=false;
function flushRefresh(){
  if(!_rq) return;
  if(typeof cancelAnimationFrame==="function" && _rqRAF) cancelAnimationFrame(_rq); else clearTimeout(_rq);
  _rq=0; _rqRAF=false;
  const j=_rjobs; _rjobs=null;
  if(j) j.forEach(f=>{ try{ f(); }catch(e){} });
}
function scheduleRefresh(){
  for(let i=0;i<arguments.length;i++){
    if(!_rjobs) _rjobs=new Set();
    _rjobs.add(arguments[i]);
  }
  if(_rq) return;
  if(typeof requestAnimationFrame==="function"){ _rqRAF=true; _rq=requestAnimationFrame(flushRefresh); }
  else { _rqRAF=false; _rq=setTimeout(flushRefresh, 16); }
}
// ===================== 误删撤回 + WPS 式单元格导航 =====================
let undoStack=[];
const EDITABLE_COLS=[3,4,5,6,7,8,9,10,12,14,15];   // 可编辑列的 nth-child 列号（跳过 #/✓/箱重T/客户吨位/操作；12=产品重量T 14=物流 15=物料编码）
function collectRowData(tr){
  // ★ 性能：撤回需要在删除每行前快照一次，原来一次 15 次 querySelector；改用行引用缓存
  const R=rowRefs(tr);
  const g=f=>R[f]?R[f].value:"";
  const tonI=R.ton, boxI=R.box, cwtI=R.cwt;
  return {
    shipdate:g("shipdate"), customer:g("customer"), code:g("code"), model:g("model"),
    qty:g("qty"), shippt:g("shippt"), unit:g("unit"), perbox:g("perbox"),
    ton:tonI?tonI.value:"", tonManual:(tonI&&tonI.dataset.manual==="1"),
    delivery:g("delivery"), box:boxI?boxI.value:"", boxManual:(boxI&&boxI.dataset.manual==="1"),
    cwt:cwtI.value, cwtDeleted:(cwtI.dataset.deleted==="1"),
    remark:g("remark"),
    // ★★ 物流值本身也必须在这份字段表里！原来漏了这一项：
    //    发布时读不到 → 记录里物流变成 "/"（2026-09-23 实测踩到）；
    //    撤回时也读不到 → 只能靠 addRow 再按客户自动带一次，手填过的物流就串了。
    logistics:g("logistics"),
    // ★ 手填物流标记也要带上：撤回/发布都走这一份字段表，缺了它「手填的物流」会被自动带出冲掉
    logisticsManual:!!(R.logistics&&R.logistics.dataset.manual==="1"),
    noCar:tr.dataset.carPin==="1"      // 撤回恢复时别把「不要后缀」弄丢
  };
}
function visibleRows(){ return [...$("tbody").children].filter(r=>!r.classList.contains("subtotal")&&!r.classList.contains("isolation-band")&&!r.classList.contains("date-fold-hidden")&&!r.classList.contains("filter-hidden")&&!r.classList.contains("date-fold-placeholder")); }
function allRows(){ return [...$("tbody").children].filter(r=>!r.classList.contains("subtotal")&&!r.classList.contains("isolation-band")&&!r.classList.contains("date-fold-placeholder")); }   // 全部数据行（含折叠隐藏），用于删除/撤回等结构性操作
function delRow(tr){
  if(!tr || !tr.parentNode) return;
  const list=allRows();
  const idx=list.indexOf(tr);
  if(idx<0) return;
  const model=tr.querySelector('[data-f="model"]')?.value?.trim()||"";
  const customer=tr.querySelector('[data-f="customer"]')?.value?.trim()||"";
  if(!confirm(`确认删除第 ${idx+1} 行${model?"（型号："+model+"）":""}？\n删除后可通过「撤回」按钮或 Ctrl+Z 恢复。`)) return;
  const data=collectRowData(tr);
  tr.remove();
  undoStack.push({rows:[data], atIndex:idx});
  if(undoStack.length>50) undoStack.shift();
  reindex(); recalc();
  if(carFixAll()) mergeCustomerCells();    // 删掉的若是第二车 → 剩下的"孤儿后缀"自动摘掉
  saveDraftNow(); updateCheckAll(); updateUndoBtn();
  toast("已删除 1 行，可点「撤回」恢复");
}
function undo(){
  const item=undoStack.pop();
  if(!item){ toast("没有可撤回的操作"); return; }
  if(item.positions && item.positions.length){
    // 批量删除（删空行）：按原行号从小到大回插，恢复到原来的位置
    [...item.positions].sort((a,b)=>a.atIndex-b.atIndex).forEach(p=>{
      const list=allRows();
      addRow(p.data, null, list[p.atIndex]||null, true);
    });
  } else {
    const list=allRows();
    const ref=list[item.atIndex]||null;
    item.rows.forEach(d=>{ addRow(d, null, ref, true); });
  }
  reindex(); recalc();
  if(carFixAll()) mergeCustomerCells();   // 撤回的行若是同一天第 2 车 → 后缀要跟着正确显示/摘除
  styleShipdate(); fitTextareas(); saveDraftNow(); updateCheckAll(); updateUndoBtn();
  toast("已撤回删除，恢复 "+(item.positions?item.positions.length:item.rows.length)+" 行");
}
// ===================== 一键删除空白行 =====================
// 空白行判定：这些「计划员会填」的列全空 = 空白行
// （发货日期默认带明天、箱重/产品重量T 是自动计算、物流是自动带出，都不算内容）
const BLANK_FIELDS=["customer","model","qty","shippt","delivery","remark","code"];
function rowIsBlank(tr){
  if(!tr) return false;
  // 手动改过的产品重量T / 箱数 / 物流 视为有内容
  const manual=["ton","box","logistics"];
  for(const f of manual){
    const el=tr.querySelector(`[data-f="${f}"]`);
    if(el && el.dataset.manual==="1" && String(el.value).trim()!=="") return false;
  }
  return BLANK_FIELDS.every(f=>{
    const el=tr.querySelector(`[data-f="${f}"]`);
    return !el || String(el.value||"").trim()==="";
  });
}
function cleanEmptyRows(){
  const list=allRows();
  const blanks=list.filter(rowIsBlank);
  if(!blanks.length){ toast("没有空白行，当前数据都是有效的 ✓"); return; }
  if(!confirm(`检测到 ${blanks.length} 行空白行（送达方、型号、发货数量等全都没填），确认一键删除？\n\n删除后可通过「撤回」按钮或 Ctrl+Z 一次性恢复。`)) return;
  const positions=blanks.map(tr=>({data:collectRowData(tr), atIndex:list.indexOf(tr)}));
  blanks.forEach(tr=>tr.remove());
  undoStack.push({rows:positions.map(p=>p.data), positions});
  if(undoStack.length>50) undoStack.shift();
  reindex(); recalc(); fitTextareas(); saveDraftNow(); updateCheckAll(); updateUndoBtn();
  toast(`已删除 ${blanks.length} 行空白行，可点「撤回」恢复`);
}
function updateUndoBtn(){ const b=$("undoBtn"); if(b) b.disabled=undoStack.length===0; }

// ===================== 多选批量删除 =====================
let lastCheckRow=null;   // Shift 连选的锚点（上一次勾选的那行）
function checkedRows(){   // 当前所有勾选中的数据行（含被折叠/筛选隐藏的行：用户勾了就算数）
  return allRows().filter(tr=>{ const R=rowRefs(tr); return R.rowCheck && R.rowCheck.checked; });
}
function updateDelCheckedBtn(){   // 按钮跟着勾选数量走：没勾=灰掉，勾了=亮起并显示数量
  const b=$("delCheckedBtn"); if(!b) return;
