<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>发货计划系统</title>
<script src="supabase.min.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud-sync.js"></script>
<script>if(!location.search.includes('_t=')&&!location.hash.includes('no_reload')){location.replace(location.href+(location.href.includes('?')?'&':'?')+'_t='+Date.now());}</script>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --line:#e3e8ef; --txt:#1f2733;
    --muted:#7a8699; --brand:#2563eb; --brand-d:#1e4fb0;
    --red:#d92d20; --green:#15803d; --soft:#eef4ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px;}
  .wrap{max-width:1320px;margin:0 auto;padding:14px 14px 60px;}
  h1{font-size:20px;margin:0 0 3px;display:flex;align-items:center;gap:10px;}
  h1 .dot{width:10px;height:22px;background:var(--brand);border-radius:3px;display:inline-block;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:10px;}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .nav-link{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;background:#fff;border:1px solid var(--line);color:var(--txt);transition:.15s;box-shadow:0 2px 6px rgba(31,45,77,.04);}
  .nav-link:hover{background:var(--soft);color:var(--brand);}
  .nav-link.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(37,99,235,.28);}
  /* ===== 云端同步状态 + 手机自适应 ===== */
  .cloud-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;background:#f1f5f9;color:#64748b;border:1px solid var(--line);white-space:nowrap;}
  .cloud-pill.ok{background:#e7f8ee;color:#15803d;border-color:#bbe7c9;}
  .cloud-pill.err{background:#fdecea;color:#d92d20;border-color:#f3c7c2;}
  .cloud-pill.sync{background:#eef4ff;color:#2563eb;border-color:#c5d8ff;}
  .cloud-pill.off{background:#f1f5f9;color:#94a3b8;}
  @media (max-width:820px){
    .wrap{padding:10px 8px 56px;}
    h1{font-size:18px;}
    .topbar{gap:10px;}
    .field{width:100%;}
    .nav{gap:6px;}
    .doc{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tbl{min-width:760px;}
    .tbl td input,.tbl td textarea{font-size:14px;}
    .card{padding:12px;}
  }
  .topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(31,45,77,.05);}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:14px;outline:none;background:#fff;}
  .field input:focus{border-color:var(--brand);}
  .spacer{flex:1;}
  .btn{border:none;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-d);}
  .btn-ghost{background:var(--soft);color:var(--brand);}
  .btn-ghost:hover{background:#dfeaff;}
  .btn-line{background:#fff;color:var(--txt);border:1px solid var(--line);}
  .btn-line:hover{background:#f3f6fb;}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f3c7c2;}
  .btn-danger:hover{background:#fdecea;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 6px 18px rgba(31,45,77,.05);}
  .card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card h2 .tag{font-size:11px;background:var(--soft);color:var(--brand);padding:2px 8px;border-radius:20px;font-weight:600;}
  .folded-dates{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto;}
  .folded-dates:empty{display:none;}
  .folded-date-btn{border:none;background:#e0e7ff;color:#4f46e5;border-radius:4px;padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap;}
  .folded-date-btn:hover{background:#c7d2fe;}
  .hint{font-size:12px;color:var(--muted);}
  /* ===== 发货计划单（美化） ===== */
  .doc{border:1px solid #e6e9f2;border-radius:14px;overflow:visible;background:#fff;box-shadow:0 12px 32px rgba(31,45,77,.07);width:100%;max-width:100%;}
  .doc-head{padding:12px 14px;border:none;background:linear-gradient(120deg,#3b5bdb 0%,#5b7cfa 55%,#4263eb 100%);color:#fff;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;}
  .doc-head .t{font-size:17px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
  .doc-head .t::before{content:"";width:8px;height:22px;border-radius:3px;background:#ffd43b;display:inline-block;}
  .doc-head .t::after{content:"SHIPPING PLAN";font-size:10px;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,.55);margin-left:8px;}
  .doc-head .meta{font-size:12px;color:rgba(255,255,255,.92);display:flex;gap:8px;flex-wrap:wrap;}
  .doc-head .meta span{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;}
  .doc-head .meta #docDate{background:#ffd43b;color:#1e3a8a;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
  .tbl thead th{background:#f1f4fb;color:#64748b;font-weight:600;padding:6px 4px;text-align:center;border:1px solid #dfe4ec;border-bottom:2px solid #cbd5e1;white-space:nowrap;position:sticky;top:0;font-size:11px;letter-spacing:.2px;}
  .tbl td{padding:6px 4px;border:1px solid #dfe4ec;text-align:center;vertical-align:middle;min-height:44px;}
  .tbl td input,.tbl td textarea{border:1px solid #c7d2e6;background:#fff;width:100%;text-align:center;border-radius:5px;font-size:12.5px;font-weight:600;color:#1e293b;outline:none;transition:.18s;box-sizing:border-box;min-height:34px;line-height:1.35;}
  .tbl td input{padding:7px 6px;}
  .tbl td textarea{resize:none;overflow:hidden;font-family:inherit;padding:8px 6px;white-space:pre-wrap;word-break:break-word;}
  .tbl td textarea[data-f="model"]{text-align:center;}
  .tbl td input:focus,.tbl td textarea:focus{border-color:#5b7cfa;background:#f5f8ff;box-shadow:0 0 0 2px rgba(91,124,250,.25);}
  @keyframes flashc{0%,100%{box-shadow:0 0 0 3px rgba(91,124,250,.14)}50%{box-shadow:0 0 0 3px rgba(217,45,20,.55)}}
  .tbl td input.flash{border-color:var(--red)!important;animation:flashc .8s ease 3;}
  .tbl td.calc{padding:4px 2px;text-align:center;vertical-align:middle;}
  .tbl tr.subtotal td{background:#f3f7ff;border-top:2px solid #cbd5e1;font-weight:700;color:#1e3a8a;padding:5px 6px;font-size:12px;}
  .tbl tr.subtotal .sub-label{text-align:left;padding-left:10px;}
  .tbl tr.subtotal .sub-ton{text-align:center;color:var(--brand);}
  .tbl tbody tr{border-bottom:1px solid #dfe4ec;}
  .tbl tbody tr:nth-child(even){background:#fafbff;}
  .tbl tr:hover td{background:#eef3ff;}
  .tbl tr.group-end td{border-bottom:2px solid #cbd5e1;}
  .col-idx{width:4%;color:var(--muted);}
  .hide-col{width:0!important;max-width:0!important;padding:0!important;border:0!important;overflow:hidden;visibility:hidden;white-space:nowrap;font-size:0;line-height:0;}
  .hide-col input,.hide-col textarea{display:none!important;}
  .tbl th:nth-child(2),.tbl tbody td:nth-child(2){width:10%;}   /* 发货日期 */
  .tbl th:nth-child(3),.tbl tbody td:nth-child(3){width:11%;}   /* 客户 */
  .tbl th:nth-child(5),.tbl tbody td:nth-child(5){width:20%;}   /* 型号 */
  .tbl th:nth-child(6),.tbl tbody td:nth-child(6){width:9%;}    /* 发货数量 */
  .tbl th:nth-child(8),.tbl tbody td:nth-child(8){width:8%;}    /* 吨位 */
  .tbl th:nth-child(10),.tbl tbody td:nth-child(10){width:8%;}  /* 交货单 */
  .tbl th:nth-child(11),.tbl tbody td:nth-child(11){width:8%;}  /* 箱数 */
  .tbl th:nth-child(12),.tbl tbody td:nth-child(12){width:15%;} /* 备注 */
  .tbl th:nth-child(13),.tbl tbody td:nth-child(13){width:5%;}  /* 操作 */
  .tbl td input[data-f="shipdate"]{color:#2563eb;font-weight:600;}
  .tbl td.col-shipdate{position:relative;padding:0 2px;vertical-align:middle;}
  .tbl td.col-shipdate .fold-btn{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:18px;height:18px;padding:0;border:none;background:#e0e7ff;color:#4f46e5;border-radius:4px;cursor:pointer;font-size:10px;line-height:18px;text-align:center;z-index:1;}
  .tbl td.col-shipdate .fold-btn:hover{background:#c7d2fe;}
  .tbl td.col-shipdate input[data-f="shipdate"]{padding-left:20px;}
  .tbl tr.date-fold-hidden{display:none;}
  .tbl tr.date-fold-placeholder{height:28px;background:#f8fafc;}
  .tbl tr.date-fold-placeholder td{padding:3px 8px;text-align:left;border:1px dashed #cbd5e1;background:#f8fafc;}
  .date-fold-placeholder-btn{border:none;background:#e0e7ff;color:#4f46e5;border-radius:4px;padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600;}
  .date-fold-placeholder-btn:hover{background:#c7d2fe;}
  .col-customer,.col-remark{text-align:center;vertical-align:middle;}
  .col-customer textarea,.col-remark textarea{min-height:34px;height:34px;display:block;margin:0 auto;}
  .col-customer.merged-cell,.col-remark.merged-cell{position:relative;padding:0!important;vertical-align:middle;}
  .col-customer.merged-cell textarea,.col-remark.merged-cell textarea{position:static;height:auto;width:calc(100% - 8px);min-height:0;padding:6px 4px;margin:0 auto;display:block;}
  .col-act{width:5%;}
  input[data-f="qty"]{min-width:0;}
  .tbl td input[data-f="delivery"]{color:#2563eb!important;font-weight:700!important;background:linear-gradient(180deg,#f0f7ff 0%,#ffffff 100%);border-color:#93c5fd!important;}
  .del-x{border:none;background:#fff;color:var(--red);cursor:pointer;font-size:15px;line-height:1;width:24px;height:24px;border-radius:7px;transition:.15s;}
  .del-x:hover{background:#fdecea;}
  .tbl tfoot td{font-weight:800;color:#1e3a8a;background:#eef2ff;border:1px solid #dfe4ec;border-top:2px solid #cbd5e1;padding:9px 6px;font-size:12.5px;}
  .num-cell{font-variant-numeric:tabular-nums;}
  .doc-foot{padding:12px 22px;font-size:12px;color:#8a94a8;background:#fbfcfe;border-top:1px dashed #e3e8f2;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center;}
  .records{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .rec{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
  .rec .info{padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.7;}
  .rec .info b{color:var(--txt);font-size:13px;}
  .rec .acts{display:flex;gap:8px;padding:0 12px 12px;}
  .rec .acts .btn{flex:1;padding:7px 0;font-size:12px;}
  .empty{color:var(--muted);font-size:13px;padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px;}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#1f2733;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
  .toast.show{opacity:1;}
  .req::after{content:"*";color:var(--red);margin-left:2px;}
  .ac{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,40,80,.18);max-height:300px;overflow-y:auto;}
  .ac-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1f4f9;font-size:13px;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item.active,.ac-item:hover{background:var(--soft);}
  .ac-model{font-weight:700;}
  .ac-code{color:var(--brand);font-size:12px;}
  .ac-meta{color:var(--muted);font-size:12px;display:block;margin-top:2px;}
  @media(max-width:600px){.tbl{font-size:12px}.doc-head .t{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>发货计划系统</h1>
  <div class="sub">做计划时只需填<b>型号 + 发货数量</b>，其余信息从「物料数据库」自动带出。</div>

  <nav class="nav">
    <a href="发货计划系统.html" class="nav-link active">📋 发货计划</a>
    <a href="排产计划表.html" class="nav-link" target="_blank">📅 排产计划表</a>
    <a href="物料数据库.html" class="nav-link" target="_blank">📦 物料数据库</a>
    <span id="dbStatus" style="margin-left:6px;align-self:center;color:var(--muted);font-size:13px"></span>
  </nav>

  <div class="topbar">
    <button class="btn btn-line" id="addRow">＋ 添加一行</button>
    <button class="btn btn-line" id="exportCsv">导出 CSV</button>
    <button class="btn btn-line" id="toggleFolded">显示折叠日期</button>
    <button class="btn btn-line" id="clearAll">清空</button>
    <button class="btn btn-primary" id="publish">发布</button>
    <div class="spacer"></div>
    <div class="field"><label class="req">发货日期</label><input type="date" id="shipDate"></div>
    <input type="hidden" id="planNo">
  </div>

  <div class="card">
    <h2>发货明细 <span class="tag" id="rowCount">0 行</span><span id="foldedDates" class="folded-dates"></span></h2>
    <div class="doc" id="doc">
      <div class="doc-head">
        <div class="t">发货计划单</div>
        <div class="meta">
          <span id="docDate">发货日期：-</span>
        </div>
      </div>
      <table class="tbl" id="tbl">
        <thead><tr>
          <th class="col-idx">#</th><th>发货日期</th><th>客户</th><th class="hide-col">物料编码</th><th>型号</th>
          <th>发货数量</th><th class="hide-col">单重(kg)</th><th>吨位(t)</th><th class="hide-col">一箱多少件</th>
          <th>交货单</th><th>箱数</th><th>备注</th><th class="col-act">操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot><tr>
          <td colspan="5" style="text-align:right">合计</td>
          <td class="num-cell" id="sumQty">0</td>
          <td class="hide-col"></td>
          <td class="num-cell" id="sumTon">0.0</td>
          <td class="hide-col"></td>
          <td></td>
          <td class="num-cell" id="sumBox">/</td>
          <td></td>
          <td></td>
        </tr></tfoot>
      </table>
      <div class="doc-foot" id="docFoot">共 0 行 ｜ 发布时间：-</div>
    </div>
  </div>

  <div class="card">
    <h2>发布记录 <span class="tag" id="recCount">0 条</span>
      <span class="hint">（发布时仅存档文本数据，不自动截图）</span></h2>
    <div class="records" id="records"></div>
    <div class="empty" id="recEmpty">暂无发布记录。填写明细后点击「发布」即可生成（最多保留 200 条）。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS_DB = "shipping_db_v1";
const LS_REC = "shipping_plans_v1";
const LS_DRAFT = "shipping_draft_v1";   // 未发布明细自动草稿，刷新/重开不丢
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

// ===================== 物料库（与物料数据库页共享 localStorage） =====================
let DB = loadDB();
function loadDB(){ try{ return JSON.parse(localStorage.getItem(LS_DB)) || []; }catch(e){ return []; } }
function updateDbStatus(){
  const el=$("dbStatus");
  if(!el) return;
  if(!DB.length) el.innerHTML="（物料库为空，<a href=\"物料数据库.html\" target=\"_blank\" style=\"color:var(--brand)\">去导入</a>）";
  else el.textContent="（物料库共 "+DB.length+" 条）";
}
// 从物料库页面切回时刷新，保证待选最新
window.addEventListener("focus", ()=>{
  if(window.CloudSync && CloudSync.ready()){
    CloudSync.pull(LS_DB).then(v=>{ if(v!==null){ localStorage.setItem(LS_DB, JSON.stringify(v)); DB=loadDB(); updateDbStatus(); } });
  } else { DB = loadDB(); updateDbStatus(); }
});

// ===================== 型号模糊待选（自动带出） =====================
let acEl=null, acList=[], acActive=-1, acRow=null;
function closeAC(){ if(acEl){ acEl.remove(); acEl=null; } acList=[]; acActive=-1; }
function matchDB(q){
  q=q.trim().toLowerCase();
  return DB.filter(r => !q ||
    (r.model||"").toLowerCase().includes(q) ||
    (r.code||"").toLowerCase().includes(q) ||
    (r.customer||"").toLowerCase().includes(q)).slice(0,8);
}
// 某型号（或编码）在物料库里对应的不同客户集合（用于提示多客户）
function customersForModel(model, code){
  const mk=(model||"").trim().toLowerCase(), ck=(code||"").trim().toLowerCase();
  const set=new Set();
  DB.forEach(r=>{
    const m=(r.model||"").trim().toLowerCase(), c=(r.code||"").trim().toLowerCase();
    if((mk && m===mk) || (ck && c===ck)){ const cu=(r.customer||"").trim(); if(cu) set.add(cu); }
  });
  return [...set];
}
function showAC(input, row){
  acRow=row; closeAC();
  if(!DB.length){
    acEl=document.createElement("div"); acEl.className="ac";
    acEl.innerHTML=`<div class="ac-item" style="color:var(--muted)">物料库为空，请先导入或打开「物料数据库」添加</div>`;
    document.body.appendChild(acEl);
    const rect=input.getBoundingClientRect();
    acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
    return;
  }
  acList=matchDB(input.value);
  if(!acList.length){
    acEl=document.createElement("div"); acEl.className="ac";
    acEl.innerHTML=`<div class="ac-item" style="color:var(--muted)">无匹配物料：${esc(input.value)}</div>`;
    document.body.appendChild(acEl);
    const rect=input.getBoundingClientRect();
    acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
    return;
  }
  acEl=document.createElement("div"); acEl.className="ac";
  acList.forEach((r,idx)=>{
    const it=document.createElement("div"); it.className="ac-item"+(idx===0?" active":"");
    it.innerHTML=`<span class="ac-model">${esc(r.model||"-")}</span> <span class="ac-code">${esc(r.code||"")}</span>`+
      `<span class="ac-meta">${esc(r.customer||"")} ｜ ${esc(r.unit)||""}kg/件 ｜ ${esc(r.perbox)||""}件/箱</span>`;
    it.addEventListener("mousedown", e=>{ e.preventDefault(); applyDb(row, r); closeAC(); });
    acEl.appendChild(it);
  });
  document.body.appendChild(acEl);
  acActive=0;
  const rect=input.getBoundingClientRect();
  acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
}
function applyDb(row, r){
  row.querySelector('[data-f="model"]').value=r.model||"";
  row.querySelector('[data-f="code"]').value=r.code||"";
  row.querySelector('[data-f="unit"]').value=r.unit||"";
  row.querySelector('[data-f="perbox"]').value=r.perbox||"";
  // 避免物料库中客户与型号相同（常见导入错位）时把型号填进客户列
  row.querySelector('[data-f="customer"]').value=(r.customer && r.customer!==r.model)?r.customer:"";
  row.querySelector('[data-f="remark"]').value=r.remark||"";
  recalc(); mergeCustomerCells(); fitTextareas(); toast("已带出："+(r.model||r.code));
  // 一个型号发多个客户：带出后提示用户确认/修改
  const cs=customersForModel(r.model, r.code);
  if(cs.length>1){
    const inp=row.querySelector('[data-f="customer"]');
    toast("⚠ 型号 "+(r.model||r.code)+" 发往 "+cs.length+" 个客户，已带出「"+(r.customer||"")+"」；如需修改请在客户列直接调整");
    inp.classList.add("flash"); setTimeout(()=>inp.classList.remove("flash"), 2600);
  }
  // 自动聚焦到发货数量，避免光标跳到客户列
  setTimeout(()=>{ const q=row.querySelector('[data-f="qty"]'); if(q){ q.focus(); q.select(); } }, 10);
}
function autoResizeTa(ta){ fitTextarea(ta); }
function moveAC(d){
  if(!acEl) return;
  const items=acEl.querySelectorAll(".ac-item");
  acActive=(acActive+d+items.length)%items.length;
  items.forEach((it,i)=>it.classList.toggle("active", i===acActive));
  items[acActive].scrollIntoView({block:"nearest"});
}
document.addEventListener("click", e=>{ if(acEl && !acEl.contains(e.target)) closeAC(); });
document.addEventListener("keydown", e=>{
  if(!acEl) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); moveAC(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveAC(-1); }
  else if(e.key==="Enter"){ e.preventDefault(); if(acActive>=0) applyDb(acRow, acList[acActive]); closeAC(); }
  else if(e.key==="Tab"){ e.preventDefault(); if(acActive>=0) applyDb(acRow, acList[acActive]); closeAC(); }
  else if(e.key==="Escape"){ closeAC(); }
});

// ===================== 发货计划单 =====================
function todayStr(){ const d=new Date(); d.setDate(d.getDate()+1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
$("shipDate").value=todayStr();
function genPlanNo(){ const d=$("shipDate").value||todayStr(); const p=s=>String(s).padStart(2,"0"); const ymd=d.split("-"); return "FH"+ymd[0]+p(+ymd[1])+p(+ymd[2])+"-"+String(Math.floor(Math.random()*9000)+1000); }
$("planNo").value=genPlanNo();

function addRow(data={}){
  const tb=$("tbody"); const tr=document.createElement("tr"); const idx=tb.children.length+1;
  const _q=parseFloat(data.qty), _u=parseFloat(data.unit), _p=parseFloat(data.perbox);
  const boxVal=(data.box!==undefined&&data.box!==null&&data.box!=='/'&&String(data.box).trim()!=='')?data.box:((_q>0&&_p>0)?Math.ceil(_q/_p):'');
  const tonVal=(data.ton!==undefined&&data.ton!==null&&data.ton!=='/'&&String(data.ton).trim()!=='')?data.ton:((_q>0&&_u>0)?(_q*_u/1000).toFixed(1):'');
  tr.innerHTML=`
    <td class="col-idx num-cell">${idx}</td>
    <td class="col-shipdate"><input type="date" data-f="shipdate" value="${esc(data.shipdate ?? $("shipDate").value)}" placeholder="/"></td>
    <td class="col-customer"><textarea data-f="customer" placeholder="/" rows="1">${esc(data.customer)}</textarea></td>
    <td class="hide-col"><input data-f="code" value="${esc(data.code)}" placeholder="/"></td>
    <td><textarea data-f="model" placeholder="/" rows="1">${esc(data.model)}</textarea></td>
    <td><input data-f="qty" type="number" min="0" value="${esc(data.qty)}" placeholder="/"></td>
    <td class="hide-col"><input data-f="unit" type="number" min="0" step="0.0001" value="${esc(data.unit)}" placeholder="/"></td>
    <td class="num-cell"><input data-f="ton" type="number" min="0" step="0.0001" value="${esc(tonVal)}" placeholder="/"></td>
    <td class="hide-col"><input data-f="perbox" type="number" min="1" value="${esc(data.perbox)}" placeholder="/"></td>
    <td><input data-f="delivery" value="${esc(data.delivery)}" placeholder="/"></td>
    <td><input data-f="box" type="number" min="0" step="1" value="${esc(boxVal)}" placeholder="/"></td>
    <td class="col-remark"><textarea data-f="remark" placeholder="/" rows="1">${esc(data.remark)}</textarea></td>
    <td class="col-act"><button class="del-x" title="删除">✕</button></td>`;
  tr.querySelector(".del-x").onclick=()=>{ tr.remove(); reindex(); recalc(); saveDraft(); };
  tr.querySelectorAll("input").forEach(inp=>{
    if(inp.dataset.f==="box"||inp.dataset.f==="ton"){
      inp.addEventListener("input", ()=>{
        if(inp.value.trim()==="") delete inp.dataset.manual;   // 清空 → 恢复自动带出
        else inp.dataset.manual="1";                          // 手填 → 保留，不被覆盖
        recalc(); saveDraft();
      });
    } else if(inp.dataset.f==="shipdate"){
      inp.addEventListener("input", ()=>{ recalc(); saveDraft(); });
      inp.addEventListener("change", ()=>{ foldByDate(); saveDraft(); });
    } else {
      inp.addEventListener("input", ()=>{ recalc(); saveDraft(); });
    }
  });
  // 载入已有箱数/吨位时标记为手填值，避免被自动计算覆盖
  ["box","ton"].forEach(k=>{
    if(data[k]!==undefined&&data[k]!==null&&data[k]!=='/'&&String(data[k]).trim()!==''){
      const inp=tr.querySelector(`[data-f="${k}"]`); if(inp) inp.dataset.manual="1";
    }
  });
  tr.querySelectorAll("textarea").forEach(ta=>{
    ta.addEventListener("input", ()=>{ recalc(); mergeCustomerCells(); fitTextarea(ta); saveDraft(); });
  });
  tr.querySelector('[data-f="customer"]').addEventListener("input", mergeCustomerCells);
  tr.querySelector('[data-f="remark"]').addEventListener("input", mergeCustomerCells);
  ["model","code"].forEach(k=>{
    const inp=tr.querySelector(`[data-f="${k}"]`);
    inp.addEventListener("focus", ()=>{ if(DB.length) showAC(inp, tr); });
    inp.addEventListener("input", ()=>showAC(inp, tr));
  });
  tb.appendChild(tr); reindex(); recalc(); fitTextareas();
}
function reindex(){
  [...$("tbody").querySelectorAll("tr.subtotal")].forEach(tr=>tr.remove());
  [...$("tbody").children].forEach((tr,i)=>tr.querySelector(".col-idx").textContent=i+1);
  $("rowCount").textContent=$("tbody").children.length+" 行"; mergeCustomerCells();
}
function fitTextarea(ta){ if(!ta) return; ta.style.height="auto"; ta.style.height=Math.max(34,ta.scrollHeight)+"px"; }
function fitTextareas(){ [...$("tbody").querySelectorAll("textarea")].forEach(fitTextarea); }
function mergeCustomerCells(){
  // 先移除旧的小计行，再按客户分组重建
  [...$("tbody").querySelectorAll("tr.subtotal")].forEach(tr=>tr.remove());
  const rows=[...$("tbody").children];
  rows.forEach(tr=>{
    tr.classList.remove("group-end");
    const c=tr.querySelector(".col-customer"), r=tr.querySelector(".col-remark");
    if(c){ c.style.display=""; c.rowSpan=1; c.classList.remove("merged-cell"); }
    if(r){ r.style.display=""; r.rowSpan=1; r.classList.remove("merged-cell"); }
  });
  let i=0;
  while(i<rows.length){
    const cust=rows[i].querySelector('[data-f="customer"]')?.value.trim()||"";
    let j=i+1;
    while(j<rows.length && (rows[j].querySelector('[data-f="customer"]')?.value.trim()||"")===cust) j++;
    const len=j-i;
    if(len>1 && cust){
      const c=rows[i].querySelector(".col-customer"), r=rows[i].querySelector(".col-remark");
      if(c){ c.rowSpan=len; c.classList.add("merged-cell"); }
      if(r){ r.rowSpan=len; r.classList.add("merged-cell"); }
      for(let k=i+1;k<j;k++){
        const c2=rows[k].querySelector(".col-customer"), r2=rows[k].querySelector(".col-remark");
        if(c2) c2.style.display="none"; if(r2) r2.style.display="none";
      }
    }
    rows[j-1].classList.add("group-end");
    // 每个客户下面加「吨位合计」小计行（吨位取当前各格实际值累加）
    if(cust){
      let subTon=0;
      for(let k=i;k<j;k++){ subTon+=parseFloat(rows[k].querySelector('[data-f="ton"]')?.value)||0; }
      const sub=document.createElement("tr"); sub.className="subtotal";
      sub.innerHTML='<td colspan="7" class="sub-label">「'+esc(cust)+'」吨位合计</td>'+
        '<td class="sub-ton">'+(subTon?subTon.toFixed(1):"/")+'</td>'+
        '<td colspan="5"></td>';
      rows[j-1].after(sub);
    }
    i=j;
  }
  fitTextareas();
  foldByDate();
}

const FOLD_STATE_KEY="shipping_fold_dates_v1";
const SHOW_FOLDED_KEY="shipping_show_folded_v1";
function getFoldState(){ try{ return JSON.parse(localStorage.getItem(FOLD_STATE_KEY))||{}; }catch(e){ return {}; } }
function setFoldState(date,collapsed){ const s=getFoldState(); s[date]=collapsed?1:0; localStorage.setItem(FOLD_STATE_KEY,JSON.stringify(s)); }
function getShowFolded(){ try{ return localStorage.getItem(SHOW_FOLDED_KEY)==="1"; }catch(e){ return false; } }
function setShowFolded(show){ try{ localStorage.setItem(SHOW_FOLDED_KEY, show?"1":"0"); }catch(e){} }

function foldByDate(){
  // 清理旧的折叠标记与按钮
  [...$("tbody").children].forEach(tr=>{
    tr.classList.remove("date-fold-hidden");
    const sd=tr.querySelector(".col-shipdate");
    if(sd){
      sd.classList.remove("date-expanded","date-collapsed");
      const btn=sd.querySelector(".fold-btn");
      if(btn) btn.remove();
      sd.style.display=""; sd.rowSpan=1;
    }
  });

  const rows=[...$("tbody").children];
  const groups=[];
  let cur=null;
  rows.forEach(tr=>{
    if(tr.classList.contains("subtotal")){ if(cur) cur.rows.push(tr); return; }
    const d=tr.querySelector('[data-f="shipdate"]')?.value||"";
    if(!cur||cur.date!==d){ cur={date:d, rows:[tr]}; groups.push(cur); }
    else cur.rows.push(tr);
  });

  const today=$("shipDate").value||todayStr();
  const state=getFoldState();
  const showFolded=getShowFolded();
  const foldedDates=[];

  groups.forEach(g=>{
    if(!g.rows.length) return;
    const first=g.rows[0];
    const sd=first.querySelector(".col-shipdate");
    if(!sd) return;

    let collapsed=state[g.date];
    if(collapsed===undefined) collapsed=!(g.date>today);  // 当天及之前的日期默认折叠，明天及以后默认展开
    else collapsed=!!collapsed;

    const btn=document.createElement("button");
    btn.type="button"; btn.className="fold-btn";
    btn.textContent=collapsed?"▶":"▼"; btn.title=collapsed?"展开":"折叠";
    btn.onclick=(e)=>{ e.stopPropagation(); toggleDateFold(g.date); };
    sd.insertBefore(btn, sd.firstChild);
    sd.classList.add(collapsed?"date-collapsed":"date-expanded");

    if(collapsed){
      foldedDates.push(g.date);
      if(showFolded){
        // 保留第一行作为折叠控制，方便单独展开
        for(let k=1;k<g.rows.length;k++) g.rows[k].classList.add("date-fold-hidden");
      }else{
        // 截图模式：折叠的日期整组隐藏，入口改到「发货明细」标题处
        g.rows.forEach(tr=>tr.classList.add("date-fold-hidden"));
      }
    }
  });

  // 在「发货明细」标题右侧渲染折叠日期入口
  const fd=$("foldedDates");
  fd.innerHTML="";
  if(!showFolded && foldedDates.length){
    foldedDates.forEach(d=>{
      const b=document.createElement("button");
      b.type="button"; b.className="folded-date-btn";
      b.textContent="▶ "+esc(d)+" 已折叠";
      b.title="展开 "+d;
      b.onclick=()=>{ setFoldState(d,0); foldByDate(); fitTextareas(); };
      fd.appendChild(b);
    });
  }

  // 行数只统计可见行
  const visible=[...$("tbody").children].filter(tr=>!tr.classList.contains("date-fold-hidden")).length;
  $("rowCount").textContent=visible+" 行";
}

function toggleDateFold(date){
  const state=getFoldState();
  setFoldState(date, state[date]?0:1);
  foldByDate();
  fitTextareas();
}

function recalc(){
  let sq=0,st=0,sb=0;
  [...$("tbody").children].forEach(tr=>{
    if(tr.classList.contains("subtotal")) return;   // 跳过客户小计行
    const qty=parseFloat(tr.querySelector('[data-f="qty"]').value)||0;
    const unit=parseFloat(tr.querySelector('[data-f="unit"]').value)||0;
    const perbox=parseFloat(tr.querySelector('[data-f="perbox"]').value)||0;
    // 吨位：自动带出（数量×单重/1000），除非手填
    const tonInput=tr.querySelector('[data-f="ton"]');
    const autoTon=(qty>0&&unit>0)?qty*unit/1000:0;
    if(tonInput.dataset.manual!=="1") tonInput.value=autoTon>0?autoTon.toFixed(1):"";
    const ton=parseFloat(tonInput.value)||0;
    // 箱数：自动带出（数量÷每箱件数），除非手填
    const boxInput=tr.querySelector('[data-f="box"]');
    const autoBox=(qty>0&&perbox>0)?Math.ceil(qty/perbox):0;
    if(boxInput.dataset.manual!=="1") boxInput.value=autoBox>0?autoBox:"";
    const box=parseFloat(boxInput.value)||0;
    sq+=qty; st+=ton; sb+=box;
  });
  $("sumQty").textContent=sq;
  $("sumTon").textContent=st.toFixed(1);
  $("sumBox").textContent=(sb>0)?sb:"/";
  mergeCustomerCells();
}
function collectRows(){
  const f=v=>{ v=(v==null?"":String(v).trim()); return v===""?"/":v; };
  return [...$("tbody").children].filter(tr=>!tr.classList.contains("subtotal")).map(tr=>({
    shipdate:f(tr.querySelector('[data-f="shipdate"]').value),
    customer:f(tr.querySelector('[data-f="customer"]').value),
    code:f(tr.querySelector('[data-f="code"]').value),
    model:f(tr.querySelector('[data-f="model"]').value),
    qty:f(tr.querySelector('[data-f="qty"]').value),
    unit:f(tr.querySelector('[data-f="unit"]').value),
    perbox:f(tr.querySelector('[data-f="perbox"]').value),
    ton:f(tr.querySelector('[data-f="ton"]').value),
    box:f(tr.querySelector('[data-f="box"]').value),
    delivery:f(tr.querySelector('[data-f="delivery"]').value),
    remark:f(tr.querySelector('[data-f="remark"]').value)
  }));
}
function syncDocHead(){
  $("docDate").textContent="发货日期："+($("shipDate").value||"/");
}
// ===================== 草稿自动保存（刷新/重开页面不丢未发布数据） =====================
function saveDraft(){
  try{
    const rows=[...$("tbody").children].filter(tr=>!tr.classList.contains("subtotal")).map(tr=>{
      const tonI=tr.querySelector('[data-f="ton"]'), boxI=tr.querySelector('[data-f="box"]');
      return {
        shipdate:tr.querySelector('[data-f="shipdate"]').value,
        customer:tr.querySelector('[data-f="customer"]').value,
        code:tr.querySelector('[data-f="code"]').value,
        model:tr.querySelector('[data-f="model"]').value,
        qty:tr.querySelector('[data-f="qty"]').value,
        unit:tr.querySelector('[data-f="unit"]').value,
        perbox:tr.querySelector('[data-f="perbox"]').value,
        ton:tonI.value, tonManual:(tonI.dataset.manual==="1"),
        delivery:tr.querySelector('[data-f="delivery"]').value,
        box:boxI.value, boxManual:(boxI.dataset.manual==="1"),
        remark:tr.querySelector('[data-f="remark"]').value
      };
    });
    if(!rows.length && !$("shipDate").value){ localStorage.removeItem(LS_DRAFT); return; }
    localStorage.setItem(LS_DRAFT, JSON.stringify({date:$("shipDate").value,no:$("planNo").value,rows}));
  }catch(e){}
}
function loadDraft(){ try{ return JSON.parse(localStorage.getItem(LS_DRAFT))||null; }catch(e){ return null; } }
function clearDraft(){ try{ localStorage.removeItem(LS_DRAFT); }catch(e){} }
$("shipDate").addEventListener("input",()=>{ syncDocHead(); $("planNo").value=genPlanNo(); saveDraft(); foldByDate(); });

// ===================== 发布：自动截图下载 + 文本存档（存档不带图片） =====================
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function publish(){
  const rows=collectRows();
  if(!rows.length){ toast("请先添加发货明细"); return; }
  if(rows.some(r=>!r.model || !r.qty) && !confirm("存在「型号」或「数量」为空行，仍要发布？")) return;

  // 仅存档文本数据（不截图、不下载图片）
  const rec={id:Date.now(),date:$("shipDate").value,no:$("planNo").value,
    publishedAt:new Date().toLocaleString("zh-CN"),rows,
    sumQty:$("sumQty").textContent,sumTon:$("sumTon").textContent,sumBox:$("sumBox").textContent};
  saveRec(rec); renderRecords();
  toast("已发布存档 ✓（单号 "+rec.no+"）");
  $("planNo").value=genPlanNo(); syncDocHead();
  saveDraft();
  try{ if(window.__clientBackup) window.__clientBackup(); }catch(e){}
}
function saveRec(rec){
  let list=loadRec(); list.unshift(rec);
  if(list.length>200) list=list.slice(0,200);   // 文本数据体积小，可保留更多
  try{ localStorage.setItem(LS_REC, JSON.stringify(list)); }
  catch(e){ localStorage.setItem(LS_REC, JSON.stringify(list.slice(0,50))); toast("存储空间不足，仅保留最近 50 条"); }
  if(window.CloudSync) CloudSync.autoPush(LS_REC);
}
function loadRec(){ try{ return JSON.parse(localStorage.getItem(LS_REC))||[]; }catch(e){ return []; } }
function renderRecords(){
  const list=loadRec(); $("recCount").textContent=list.length+" 条";
  const box=$("records"); box.innerHTML="";
  $("recEmpty").style.display=list.length?"none":"block";
  list.forEach(rec=>{
    const div=document.createElement("div"); div.className="rec";
    div.innerHTML=`
      <div class="info"><b>${rec.no}</b><br>日期：${rec.date}${rec.maker?' ｜ 制单：'+rec.maker:''}<br>
        共 ${rec.rows.length} 行 ｜ 数量 ${rec.sumQty} ｜ ${rec.sumTon}t ｜ ${rec.sumBox}箱<br>发布：${rec.publishedAt}</div>
      <div class="acts">
        <button class="btn btn-line" data-act="csv">导出CSV</button>
        <button class="btn btn-danger" data-act="del">删除</button>
      </div>`;
    div.querySelector('[data-act="csv"]').onclick=()=>exportRowsCsv(rec.rows, rec.no);
    div.querySelector('[data-act="del"]').onclick=()=>{
      if(confirm("确认删除该发布记录？")){ localStorage.setItem(LS_REC, JSON.stringify(loadRec().filter(r=>r.id!==rec.id))); renderRecords(); if(window.CloudSync) CloudSync.autoPush(LS_REC); }
    };
    box.appendChild(div);
  });
}

// ===================== 导出 =====================
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function rowsToCsv(rows){ 
  const head=["发货日期","客户","型号","发货数量","吨位(t)","交货单","箱数","备注"];
  const lines=[head.join(",")];
  rows.forEach(r=>lines.push([r.shipdate,r.customer,r.model,r.qty,r.ton,r.delivery,r.box,r.remark].map(csvCell).join(",")));
  return "﻿"+lines.join("\n");
}
function exportRowsCsv(rows, name){
  const blob=new Blob([rowsToCsv(rows)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`发货计划_${name}.csv`; a.click();
}
$("exportCsv").onclick=()=>{ const rows=collectRows(); if(!rows.length){ toast("暂无数据可导出"); return; } exportRowsCsv(rows, $("planNo").value); };

// ===================== 其它按钮 =====================
$("addRow").onclick=()=>{ addRow(); saveDraft(); };
$("clearAll").onclick=()=>{ if($("tbody").children.length && !confirm("确认清空当前所有明细行？")) return; $("tbody").innerHTML=""; clearDraft(); reindex(); recalc(); };
$("publish").onclick=publish;

function updateFoldedButton(){
  const show=getShowFolded();
  const btn=$("toggleFolded");
  btn.textContent=show?"隐藏折叠日期":"显示折叠日期";
  btn.title=show?"点击隐藏已折叠的历史日期":"截图时关闭，可彻底隐藏已折叠的历史日期";
}
$("toggleFolded").onclick=()=>{ setShowFolded(!getShowFolded()); updateFoldedButton(); foldByDate(); fitTextareas(); };

// ===================== 启动 =====================
syncDocHead();
updateFoldedButton();
updateDbStatus();
if(!DB.length) toast("提示：物料库为空，请先到「物料数据库」页导入");
const _draft=loadDraft();
if(_draft && (_draft.rows.length || _draft.date)){
  if(_draft.date) $("shipDate").value=_draft.date;
  $("planNo").value=_draft.no||genPlanNo();
  _draft.rows.forEach(r=>addRow(r));
  syncDocHead();
}else{
  addRow(); addRow();
}
renderRecords();

// ===================== 云端同步 =====================
if(window.CloudSync){
  CloudSync.init();
  const CLOUD_KEYS=[LS_DB, LS_REC];
  const nav=document.querySelector('.nav');
  const pill=document.createElement('span'); pill.id='cloudPill'; pill.className='cloud-pill';
  const btn=document.createElement('button'); btn.id='cloudSyncBtn'; btn.className='btn btn-ghost'; btn.textContent='☁ 拉取最新';
  if(nav){ nav.appendChild(pill); nav.appendChild(btn); CloudSync.bindStatus(pill);
    btn.onclick=()=>CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); updateDbStatus(); renderRecords(); }); }
  if(CloudSync.ready()){
    CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); updateDbStatus(); renderRecords(); }).then(()=>{
      CLOUD_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } });
    });
  } else { CloudSync.setStatus('未配置云端','off'); }
}
</script>
