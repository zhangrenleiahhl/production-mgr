<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>发货计划系统</title>
<script src="supabase.min.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud-sync.js"></script>
<script src="html2canvas.min.js"></script>
<script>if(!location.search.includes('_t=')&&!location.hash.includes('no_reload')){location.replace(location.href+(location.href.includes('?')?'&':'?')+'_t='+Date.now());}</script>
<style>
  :root{
    --bg:#f8f7ff; --bg-2:#eef2ff; --bg-3:#f5f3ff;
    --card:#ffffff; --line:#e6e9f4; --line-2:#f1f4fb;
    --txt:#0f172a; --txt-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
    --brand:#6366f1; --brand-2:#818cf8; --brand-d:#4f46e5;
    --soft:#eef2ff; --soft-2:#e0e7ff; --soft-line:#c7d2fe;
    --red:#ef4444; --red-bg:#fef2f2; --green:#10b981; --green-bg:#ecfdf5;
    --violet:#8b5cf6; --orange:#f59e0b;
    --purple:#60a5fa; --purple-d:#3b82f6; --purple-l:#93c5fd; --purple-bg:#eff6ff;
    --radius:16px; --radius-sm:12px; --radius-lg:20px;
    --sh-sm:0 1px 3px rgba(15,23,42,.06);
    --sh-md:0 4px 20px rgba(15,23,42,.06);
    --sh-lg:0 18px 45px rgba(15,23,42,.10);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"KaiTi","STKaiti","楷体","Microsoft YaHei","PingFang SC",sans-serif;
    background:#f6f8fa;color:#1f2328;font-size:14px;
    -webkit-font-smoothing:antialiased;text-align:center;}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;
    background:#2563eb;}
  .wrap{max-width:none;padding:28px 0 64px;}
  .page-header,.kpi-grid,.topbar,.card{padding-left:24px;padding-right:24px;}
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:18px;padding-top:4px;}
  .page-header .title-wrap{flex:1;min-width:260px;}
  h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:10px;letter-spacing:0;font-weight:700;color:#1f2328;}
  h1 .dot{width:8px;height:20px;background:#2563eb;border-radius:0;display:inline-block;}
  .sub{color:#4b5563;font-size:13px;margin:0;line-height:1.5;}
  .sub b{color:#2563eb;}
  .welcome{font-size:13px;color:#4b5563;display:flex;align-items:center;gap:8px;}
  .welcome strong{color:#1f2328;font-weight:700;}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .nav-link{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:0;font-size:13px;font-weight:600;text-decoration:none;background:#fff;border:1px solid #d0d7de;color:#4b5563;transition:.15s;box-shadow:none;}
  .nav-link:hover{background:#f6f8fa;color:#2563eb;border-color:#9ca3af;}
  .nav-link.active{background:#2563eb;color:#fff;border-color:#2563eb;}
  /* ===== KPI 统计卡片 ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
  .kpi-card{background:#fff;border:1px solid #d0d7de;border-radius:0;padding:14px 16px;box-shadow:none;display:flex;align-items:center;gap:12px;transition:none;}
  .kpi-icon{width:38px;height:38px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#f6f8fa;border:1px solid #d0d7de;}
  .kpi-icon.blue{color:#2563eb;}
  .kpi-icon.violet{color:#7c3aed;}
  .kpi-icon.green{color:#059669;}
  .kpi-icon.orange{color:#d97706;}
  .kpi-label{font-size:12px;color:#4b5563;font-weight:600;letter-spacing:0;margin-bottom:4px;}
  .kpi-value{font-size:20px;font-weight:700;color:#1f2328;line-height:1.1;font-variant-numeric:tabular-nums;}
  .kpi-unit{font-size:12px;color:#6b7280;font-weight:500;margin-left:3px;}
  /* ===== 云端同步状态 + 手机自适应 ===== */
  .cloud-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:0;font-size:11px;font-weight:600;background:#f6f8fa;color:#4b5563;border:1px solid #d0d7de;white-space:nowrap;transition:.15s;flex-shrink:0;}
  .cloud-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(75,85,99,.12);}
  .cloud-pill.ok{background:#ecfdf5;color:#059669;border-color:#a7f3d0;}
  .cloud-pill.err{background:#fef2f2;color:#dc2626;border-color:#fecaca;}
  .cloud-pill.sync{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
  .cloud-pill.off{background:#f9fafb;color:#9ca3af;}
  @media (max-width:820px){
    .wrap{padding:14px 14px 56px;}
    .page-header{flex-direction:column;align-items:flex-start;}
    h1{font-size:22px;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
    .kpi-card{padding:14px;}
    .kpi-icon{width:38px;height:38px;font-size:18px;}
    .kpi-value{font-size:18px;}
    .topbar{gap:10px;}
    .field{width:100%;}
    .nav{gap:8px;}
    .doc{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tbl{min-width:760px;}
    .tbl td input,.tbl td textarea{font-size:14px;}
    .card{padding:16px;}
  }
  .topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:#fff;border:1px solid #d0d7de;border-radius:0;
    padding:10px 14px;margin-bottom:16px;box-shadow:none;overflow:visible;}
  .filter-group{display:inline-flex;align-items:center;gap:5px;flex-wrap:nowrap;background:#f6f8fa;border-radius:0;padding:3px 8px;border:1px solid #d0d7de;}
  .filter-group input{border:1px solid #d0d7de;border-radius:0;padding:4px 8px;font-size:12px;outline:none;width:72px;background:#fff;transition:.15s;color:#1f2328;}
  .filter-group input:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12);}
  .filter-label{align-self:center;font-size:12px;font-weight:700;color:#4b5563;padding:0 1px 0 3px;white-space:nowrap;}
  .filter-group .hint{font-size:12px;color:#6b7280;font-weight:600;white-space:nowrap;}
  .field{display:flex;flex-direction:column;gap:3px;}
  .field label{font-size:12px;color:#4b5563;font-weight:700;letter-spacing:0;}
  .field input{border:1px solid #d0d7de;border-radius:0;padding:5px 8px;font-size:12px;outline:none;background:#fff;transition:.15s;color:#1f2328;}
  .field-inline{flex-direction:row;align-items:center;gap:5px;}
  .field-inline input{width:112px;padding:5px 8px;font-size:12px;}
  .field input:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12);}
  .spacer{flex:1;}
  .btn{border:1px solid #d0d7de;border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600;transition:.15s;letter-spacing:0;display:inline-flex;align-items:center;justify-content:center;gap:3px;flex-shrink:0;background:#fff;color:#1f2328;}
  .btn:active{transform:none;}
  .btn-primary{background:#2563eb;color:#fff;border-color:#2563eb;}
  .btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8;}
  .btn-ghost{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;}
  .btn-ghost:hover{background:#dbeafe;}
  .btn-line{background:#fff;color:#1f2328;border:1px solid #d0d7de;}
  .btn-line:hover{background:#f6f8fa;border-color:#9ca3af;color:#1f2328;}
  .btn-danger{background:#fff;color:#dc2626;border:1px solid #fecaca;}
  .btn-danger:hover{background:#fef2f2;}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none;background:#f9fafb;border-color:#e5e7eb;color:#9ca3af;}
  .card{background:#fff;border:1px solid #d0d7de;border-radius:0;padding:16px 20px;margin-bottom:16px;box-shadow:none;}
  .card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;letter-spacing:0;color:#1f2328;}
  .card h2::before{content:"";width:4px;height:18px;background:#2563eb;display:inline-block;}
  .card h2 .tag{font-size:11.5px;background:var(--soft);color:var(--brand-d);padding:4px 12px;border-radius:999px;font-weight:700;border:1px solid #dbe6ff;}
  .folded-dates{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;}
  .folded-dates:empty{display:none;}
  .folded-date-btn{border:1px solid #d0d7de;background:#eff6ff;color:#1d4ed8;border-radius:0;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.15s;}
  .folded-date-btn:hover{background:#dbeafe;border-color:#2563eb;}
  .hint{font-size:12px;color:#6b7280;}
  /* ===== 发货计划单（WPS 清晰风） ===== */
  .doc{border:1px solid var(--purple-l);border-radius:0;overflow:hidden;background:#fff;box-shadow:none;width:100%;max-width:100%;}
  .doc-head{padding:10px 0;border-bottom:1px solid var(--purple);background:#fff;color:#1f2328;text-align:center;}
  .doc-head .t{font-size:18px;font-weight:700;letter-spacing:0;display:inline-flex;align-items:center;gap:8px;color:#1f2328;}
  .doc-head .meta{display:none;}
  .tbl{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;background:#fff;}
  .tbl thead th{background:#4472c4;color:#fff;font-weight:700;padding:6px 4px;text-align:center;border:1px solid var(--purple-d);white-space:nowrap;position:sticky;top:0;z-index:2;font-size:14px;letter-spacing:0;}
  .tbl td{padding:0;border:1px solid var(--purple-l);text-align:center;vertical-align:middle;min-height:26px;}
  .tbl td input,.tbl td textarea{border:1px solid transparent;background:#fff;width:100%;text-align:center;border-radius:0;font-size:14px;font-weight:600;color:#1f2328;outline:none;transition:.15s;box-sizing:border-box;min-height:26px;line-height:1.35;}
  .tbl td input{padding:2px 3px;height:26px;text-align:center;}
  .tbl td textarea{resize:none;overflow:hidden;font-family:inherit;padding:2px 3px;white-space:pre-wrap;word-break:break-word;display:block;text-align:center;}
  .tbl td textarea[data-f="model"],.tbl td textarea[data-f="code"]{text-align:center;}
  .tbl td input:focus,.tbl td textarea:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 2px rgba(139,92,246,.15);}
  @keyframes flashc{0%,100%{box-shadow:0 0 0 2px rgba(139,92,246,.15)}50%{box-shadow:0 0 0 3px rgba(239,68,68,.45)}}
  .tbl td input.flash{border-color:var(--red)!important;animation:flashc .8s ease 3;}
  .tbl td.calc{padding:3px 4px;text-align:center;vertical-align:middle;}
  .tbl tr.subtotal td{background:#f6f8fa;border-top:1px solid var(--purple);font-weight:700;color:#1f2328;padding:2px 3px;font-size:14px;}
  .tbl tr.subtotal .sub-label{text-align:left;padding-left:8px;}
  .tbl tr.subtotal .sub-ton{text-align:center;color:var(--purple-d);}
  .tbl tbody tr{transition:none;}
  .tbl tbody tr:nth-child(even){background:#fafafa;}
  .tbl tbody tr:hover td{background:var(--purple-bg);}
  .tbl tr.group-end td{border-bottom:1px solid var(--purple);}
  .col-idx{width:3%;color:#6b7280;}
  .col-check{width:3%;text-align:center;vertical-align:middle;}
  .col-check input,.row-check{width:7px;height:7px;cursor:pointer;accent-color:#2563eb;}
  #checkAll{width:16px;height:16px;cursor:pointer;accent-color:#2563eb;}
  .hide-col{width:0!important;max-width:0!important;padding:0!important;border:0!important;overflow:hidden;visibility:hidden;white-space:nowrap;font-size:0;line-height:0;}
  .hide-col input,.hide-col textarea{display:none!important;}
  .tbl th:nth-child(1),.tbl tbody td:nth-child(1){width:2%;}    /* 序号 */
  .tbl th:nth-child(2),.tbl tbody td:nth-child(2){width:2%;}    /* 勾选 */
  .tbl th:nth-child(3),.tbl tbody td:nth-child(3){width:8%;}    /* 发货日期 */
  .tbl th:nth-child(4),.tbl tbody td:nth-child(4){width:8%;}    /* 客户 */
  .tbl th:nth-child(5),.tbl tbody td:nth-child(5){width:22%;}   /* 型号 */
  .tbl th:nth-child(6),.tbl tbody td:nth-child(6){width:7%;}    /* 发货数量 */
  .tbl th:nth-child(7),.tbl tbody td:nth-child(7){width:5%;}    /* 吨位 */
  .tbl th:nth-child(8),.tbl tbody td:nth-child(8){width:8%;}    /* 交货单 */
  .tbl th:nth-child(9),.tbl tbody td:nth-child(9){width:5%;}    /* 箱数 */
  .tbl th:nth-child(10),.tbl tbody td:nth-child(10){width:8%;}  /* 备注 */
  .tbl th:nth-child(11),.tbl tbody td:nth-child(11){width:5%;}  /* 客户吨位 */
  .tbl th:nth-child(12),.tbl tbody td:nth-child(12){width:11%;} /* 物料编码 */
  .tbl th:nth-child(13),.tbl tbody td:nth-child(13){width:9%;}  /* 操作 */
  .tbl tbody td:nth-child(12) textarea{text-align:center;}  /* 物料编码居中 */
  .tbl tbody td:nth-child(5) textarea{text-align:center;}  /* 型号居中 */
  .tbl tbody td:nth-child(6) input,.tbl tbody td:nth-child(7) input,.tbl tbody td:nth-child(9) input{text-align:center;} /* 发货数量/吨位/箱数居中 */
  .tbl tbody td:nth-child(9){color:#2563eb;font-weight:700;}    /* 交货单蓝色粗体 */
  .tbl td input[data-f="shipdate"]{color:#1f2328;font-weight:600;text-align:center;padding-left:16px;padding-right:1px;font-size:11px;background:#fff;border-color:transparent;}
  .tbl td input[data-f="shipdate"].jinling{font-family:"金陵体","JinlingTi","STKaiti","楷体",serif;font-weight:700;color:#1f2328;}
  .tbl td input[data-f="shipdate"]:focus{background:#fff;border-color:var(--purple);}
  .tbl td.col-shipdate{position:relative;padding:0;vertical-align:middle;}
  .tbl td.col-shipdate .fold-btn{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:14px;height:14px;padding:0;border:none;background:var(--purple-bg);color:var(--purple-d);border-radius:2px;cursor:pointer;font-size:9px;line-height:14px;text-align:center;z-index:1;transition:.15s;}
  .tbl td.col-shipdate .fold-btn:hover{background:#ede9fe;}
  .tbl td.col-shipdate input[data-f="shipdate"]{padding-left:16px;padding-right:1px;}
  .tbl th:nth-child(3){padding:6px 4px;}
  .tbl tr.date-fold-hidden{display:none;}
  .tbl tr.filter-hidden{display:none;}
  .tbl tr.date-fold-placeholder{height:24px;background:#fafafa;}
  .tbl tr.date-fold-placeholder td{padding:3px 8px;text-align:left;border:1px dashed var(--purple-l);background:#fafafa;}
  .date-fold-placeholder-btn{border:1px solid var(--purple-l);background:#fff;color:var(--purple-d);border-radius:4px;padding:4px 12px;font-size:13px;cursor:pointer;font-weight:600;}
  .date-fold-placeholder-btn:hover{background:var(--purple-bg);}
  .col-customer,.col-remark{text-align:center;vertical-align:middle;}
  .col-customer textarea,.col-remark textarea{min-height:26px;height:26px;display:block;margin:0 auto;}
  .col-customer.merged-cell,.col-remark.merged-cell{position:relative;padding:0!important;vertical-align:middle;background:#fff;}
  .col-customer.merged-cell textarea,.col-remark.merged-cell textarea{position:static;height:auto;width:100%;min-height:0;padding:2px 3px;margin:0 auto;display:block;background:#fff;border-color:transparent;}
  .col-customer.merged-cell textarea:focus,.col-remark.merged-cell textarea:focus{background:#fff;border-color:var(--purple);}
  .col-subton{color:var(--purple-d);font-weight:700;background:#f6f8fa;border:1px solid var(--purple-l);border-radius:0;text-align:center;vertical-align:middle;}
  .col-subton.merged-cell{padding:0!important;vertical-align:middle;background:#fff;}
  .col-act{width:9%;white-space:nowrap;}
  input[data-f="qty"]{min-width:0;}
  .tbl td input[data-f="delivery"]{color:var(--purple-d)!important;font-weight:700!important;background:#fff;border-color:transparent!important;text-align:center;}
  .tbl td input[data-f="delivery"]:focus{background:#fff;border-color:var(--purple)!important;}
  .del-x,.ins-x,.mv-u,.mv-d{border:1px solid var(--purple-l);cursor:pointer;line-height:1;width:18px;height:20px;border-radius:3px;transition:.15s;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;background:#fff;}
  .del-x{color:#dc2626;}
  .del-x:hover{background:#fee2e2;border-color:#dc2626;}
  .ins-x{color:var(--purple-d);}
  .ins-x:hover{background:var(--purple-bg);border-color:var(--purple);}
  .mv-u,.mv-d{color:#4b5563;font-size:11px;}
  .mv-u:hover,.mv-d:hover{background:#f3f4f6;border-color:var(--purple-l);color:#1f2328;}
  .mv-u:disabled,.mv-d:disabled{color:#d1d5db;cursor:not-allowed;background:#f9fafb;border-color:var(--purple-l);transform:none;}
  .tbl tfoot td{font-weight:700;color:#1f2328;background:#f6f8fa;border:1px solid var(--purple-l);border-top:1px solid var(--purple);padding:2px 3px;font-size:14px;}
  .num-cell{font-variant-numeric:tabular-nums;}
  .doc-foot{padding:10px 20px;font-size:13px;color:#4b5563;background:#fff;border-top:1px solid var(--purple-l);letter-spacing:0;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;}
  .records{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .rec{background:#fff;border:1px solid #d0d7de;border-radius:0;overflow:hidden;display:flex;flex-direction:column;transition:none;box-shadow:none;}
  .rec:hover{border-color:#9ca3af;}
  .rec .info{padding:14px 16px;font-size:13px;color:#4b5563;line-height:1.75;}
  .rec .info b{color:#1f2328;font-size:14px;}
  .rec .acts{display:flex;gap:10px;padding:0 14px 14px;}
  .rec .acts .btn{flex:1;padding:7px 0;font-size:12px;}
  .empty{color:#6b7280;font-size:13px;padding:28px;text-align:center;border:1px dashed #d0d7de;background:#fff;}
  .toast{position:fixed;left:50%;top:28px;transform:translateX(-50%) translateY(-8px);background:#1f2328;color:#fff;padding:11px 20px;border-radius:0;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.18);border-left:4px solid #2563eb;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .req::after{content:"*";color:#dc2626;margin-left:2px;}
  .ac{position:fixed;z-index:200;background:#fff;border:1px solid #d0d7de;border-radius:0;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:300px;overflow-y:auto;}
  .ac-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #e5e7eb;font-size:13px;transition:.15s;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item.active,.ac-item:hover{background:#eff6ff;}
  .ac-model{font-weight:700;color:#1f2328;}
  .ac-code{color:#2563eb;font-size:12px;}
  .ac-meta{color:#6b7280;font-size:12px;display:block;margin-top:2px;}
  @media(max-width:600px){.tbl{font-size:12px}.doc-head .t{font-size:16px}.wrap{padding:16px 14px 48px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <div class="title-wrap">
      <h1><span class="dot"></span>发货计划系统</h1>
      <div class="sub">做计划时只需填<b>型号 + 发货数量</b>，其余信息从「物料数据库」自动带出。</div>
    </div>
    <div class="welcome">Hi，欢迎回来 👋<br><strong>今天是 <span id="todayText">-</span></strong></div>
  </div>

  <div class="kpi-grid" id="kpiGrid">
    <div class="kpi-card"><div class="kpi-icon blue">📋</div><div><div class="kpi-label">明细行数</div><div class="kpi-value" id="kpiRows">0<span class="kpi-unit">行</span></div></div></div>
    <div class="kpi-card"><div class="kpi-icon violet">📦</div><div><div class="kpi-label">发货数量</div><div class="kpi-value" id="kpiQty">0<span class="kpi-unit">件</span></div></div></div>
    <div class="kpi-card"><div class="kpi-icon green">⚖️</div><div><div class="kpi-label">总吨位</div><div class="kpi-value" id="kpiTon">0.0<span class="kpi-unit">t</span></div></div></div>
    <div class="kpi-card"><div class="kpi-icon orange">✓</div><div><div class="kpi-label">待发布</div><div class="kpi-value" id="kpiChecked">0<span class="kpi-unit">行</span></div></div></div>
  </div>

  <div class="topbar">
    <button class="btn btn-line" id="addRow" title="添加一行">＋ 添加</button>
    <button class="btn btn-line" id="undoBtn" title="撤回上一次删除（Ctrl+Z）" disabled>↶ 撤回</button>
    <button class="btn btn-line" id="exportCsv" title="导出 CSV">CSV</button>
    <button class="btn btn-line" id="toggleFolded" title="显示/隐藏折叠日期">折叠</button>
    <button class="btn btn-line" id="clearAll" title="清空">清空</button>
    <button class="btn btn-primary" id="publish" title="发布">发布</button>
    <button class="btn btn-line" id="exportBackup" title="导出备份">导出</button>
    <button class="btn btn-line" id="importBackup" title="导入备份">导入</button>
    <input type="file" id="backupFile" accept="application/json,.json" style="display:none">
    <div class="spacer"></div>
    <div class="filter-group">
      <span class="filter-label">筛选</span>
      <input type="text" id="filterCustomer" placeholder="客户">
      <input type="text" id="filterModel" placeholder="型号">
      <input type="date" id="filterDate" placeholder="日期">
      <button class="btn btn-ghost" id="clearFilter" title="清除筛选">清除</button>
      <span class="hint" id="filterCount"></span>
    </div>
    <span id="dbStatus" style="align-self:center;color:var(--muted);font-size:11px;white-space:nowrap;flex-shrink:0;"></span>
    <div class="field field-inline"><label class="req">日期</label><input type="date" id="shipDate"></div>
    <input type="hidden" id="planNo">
  </div>

  <div class="card">
    <h2>发货明细 <span class="tag" id="rowCount">0 行</span><span id="foldedDates" class="folded-dates"></span></h2>
    <div class="doc" id="doc">
      <div class="doc-head">
        <div class="t" id="docTitle">发货计划</div>
      </div>
      <table class="tbl" id="tbl">
        <thead><tr>
          <th class="col-idx">#</th><th class="col-check"><input type="checkbox" id="checkAll" title="全选 / 取消全选"></th><th>发货日期</th><th>客户</th><th>型号</th><th>发货数量</th><th>吨位(t)</th>
          <th>交货单</th><th>箱数</th><th>备注</th><th>客户吨位</th><th>物料编码</th><th class="col-act">操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot><tr>
          <td colspan="5" style="text-align:right">合计</td>
          <td class="num-cell" id="sumQty">0</td>
          <td class="num-cell" id="sumTon">0.0</td>
          <td></td>
          <td class="num-cell" id="sumBox">/</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr></tfoot>
      </table>
      <div class="doc-foot" id="docFoot">共 0 行 ｜ 发布时间：-</div>
    </div>
  </div>

  <div class="card">
    <h2>发布记录 <span class="tag" id="recCount">0 条</span>
      <span class="hint">（发布时自动截图下载，并同时存档文本数据）</span></h2>
    <div class="records" id="records"></div>
    <div class="empty" id="recEmpty">暂无发布记录。填写明细后点击「发布」即可生成（最多保留 200 条）。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS_DB = "shipping_db_v1";
const LS_REC = "shipping_plans_v1";
const LS_DRAFT = "shipping_draft_v1";   // 未发布明细自动草稿，刷新/重开不丢
const BACKUP_KEYS = [LS_DB, LS_REC, LS_DRAFT, "shipping_fold_dates_v1", "shipping_show_folded_v1"];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

// ===================== 物料库（与物料数据库页共享 localStorage） =====================
let DB = loadDB();
function loadDB(){ try{ return JSON.parse(localStorage.getItem(LS_DB)) || []; }catch(e){ return []; } }
function updateDbStatus(){
  const el=$("dbStatus");
  if(!el) return;
  if(!DB.length) el.innerHTML="库空，<a href=\"物料数据库.html\" target=\"_blank\" style=\"color:var(--brand)\">去导入</a>";
  else el.textContent="库 "+DB.length+" 条";
}
// 从物料库页面切回时刷新，保证待选最新
window.addEventListener("focus", ()=>{
  if(window.CloudSync && CloudSync.ready()){
    CloudSync.pull(LS_DB).then(v=>{ if(v!==null){ localStorage.setItem(LS_DB, JSON.stringify(v)); DB=loadDB(); updateDbStatus(); } });
  } else { DB = loadDB(); updateDbStatus(); }
});

// ===================== 型号模糊待选（自动带出） =====================
let acEl=null, acList=[], acActive=-1, acRow=null;
function closeAC(){ if(acEl){ acEl.remove(); acEl=null; } acList=[]; acActive=-1; }
function matchDB(q){
  q=q.trim().toLowerCase();
  return DB.filter(r => !q ||
    (r.model||"").toLowerCase().includes(q) ||
    (r.code||"").toLowerCase().includes(q) ||
    (r.customer||"").toLowerCase().includes(q)).slice(0,8);
}
// 某型号（或编码）在物料库里对应的不同客户集合（用于提示多客户）
function customersForModel(model, code){
  const mk=(model||"").trim().toLowerCase(), ck=(code||"").trim().toLowerCase();
  const set=new Set();
  DB.forEach(r=>{
    const m=(r.model||"").trim().toLowerCase(), c=(r.code||"").trim().toLowerCase();
    if((mk && m===mk) || (ck && c===ck)){ const cu=(r.customer||"").trim(); if(cu) set.add(cu); }
  });
  return [...set];
}
function showAC(input, row){
  acRow=row; closeAC();
  if(!DB.length){
    acEl=document.createElement("div"); acEl.className="ac";
    acEl.innerHTML=`<div class="ac-item" style="color:var(--muted)">物料库为空，请先导入或打开「物料数据库」添加</div>`;
    document.body.appendChild(acEl);
    const rect=input.getBoundingClientRect();
    acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
    return;
  }
  acList=matchDB(input.value);
  if(!acList.length){
    acEl=document.createElement("div"); acEl.className="ac";
    acEl.innerHTML=`<div class="ac-item" style="color:var(--muted)">无匹配物料：${esc(input.value)}</div>`;
    document.body.appendChild(acEl);
    const rect=input.getBoundingClientRect();
    acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
    return;
  }
  acEl=document.createElement("div"); acEl.className="ac";
  acList.forEach((r,idx)=>{
    const it=document.createElement("div"); it.className="ac-item"+(idx===0?" active":"");
    it.innerHTML=`<span class="ac-model">${esc(r.model||"-")}</span> <span class="ac-code">${esc(r.code||"")}</span>`+
      `<span class="ac-meta">${esc(r.customer||"")} ｜ ${esc(r.unit)||""}kg/件 ｜ ${esc(r.perbox)||""}件/箱</span>`;
    it.addEventListener("mousedown", e=>{ e.preventDefault(); applyDb(row, r); closeAC(); });
    acEl.appendChild(it);
  });
  document.body.appendChild(acEl);
  acActive=0;
  const rect=input.getBoundingClientRect();
  acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
}
function applyDb(row, r){
  row.querySelector('[data-f="model"]').value=r.model||"";
  row.querySelector('[data-f="code"]').value=r.code||"";
  row.querySelector('[data-f="unit"]').value=r.unit||"";
  row.querySelector('[data-f="perbox"]').value=r.perbox||"";
  // 避免物料库中客户与型号相同（常见导入错位）时把型号填进客户列
  row.querySelector('[data-f="customer"]').value=(r.customer && r.customer!==r.model)?r.customer:"";
  row.querySelector('[data-f="remark"]').value=r.remark||"";
  recalc(); mergeCustomerCells(); fitTextareas(); toast("已带出："+(r.model||r.code));
  // 一个型号发多个客户：带出后提示用户确认/修改
  const cs=customersForModel(r.model, r.code);
  if(cs.length>1){
    const inp=row.querySelector('[data-f="customer"]');
    toast("⚠ 型号 "+(r.model||r.code)+" 发往 "+cs.length+" 个客户，已带出「"+(r.customer||"")+"」；如需修改请在客户列直接调整");
    inp.classList.add("flash"); setTimeout(()=>inp.classList.remove("flash"), 2600);
  }
  // 自动聚焦到发货数量，避免光标跳到客户列
  setTimeout(()=>{ const q=row.querySelector('[data-f="qty"]'); if(q){ q.focus(); q.select(); } }, 10);
}
function autoResizeTa(ta){ fitTextarea(ta); }
function moveAC(d){
  if(!acEl) return;
  const items=acEl.querySelectorAll(".ac-item");
  acActive=(acActive+d+items.length)%items.length;
  items.forEach((it,i)=>it.classList.toggle("active", i===acActive));
  items[acActive].scrollIntoView({block:"nearest"});
}
document.addEventListener("click", e=>{ if(acEl && !acEl.contains(e.target)) closeAC(); });
document.addEventListener("keydown", e=>{
  if(!acEl) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); moveAC(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveAC(-1); }
  else if(e.key==="Enter"){ e.preventDefault(); if(acActive>=0) applyDb(acRow, acList[acActive]); closeAC(); }
  else if(e.key==="Tab"){ e.preventDefault(); if(acActive>=0) applyDb(acRow, acList[acActive]); closeAC(); }
  else if(e.key==="Escape"){ closeAC(); }
});

// ===================== 发货计划单 =====================
function todayStr(){ const d=new Date(); d.setDate(d.getDate()+1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function realTodayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
$("shipDate").value=todayStr();
try{ const td=new Date(); $("todayText").textContent=td.getFullYear()+"年"+(td.getMonth()+1)+"月"+td.getDate()+"日"; }catch(e){}
function genPlanNo(){ const d=$("shipDate").value||todayStr(); const p=s=>String(s).padStart(2,"0"); const ymd=d.split("-"); return "FH"+ymd[0]+p(+ymd[1])+p(+ymd[2])+"-"+String(Math.floor(Math.random()*9000)+1000); }
$("planNo").value=genPlanNo();

function addRow(data={}, refRow=null, beforeRow=null){
  const tb=$("tbody"); const tr=document.createElement("tr"); const idx=tb.children.length+1;
  const _q=parseFloat(data.qty), _u=parseFloat(data.unit), _p=parseFloat(data.perbox);
  const boxVal=(data.box!==undefined&&data.box!==null&&data.box!=='/'&&String(data.box).trim()!=='')?data.box:((_q>0&&_p>0)?Math.ceil(_q/_p):'');
  const tonVal=(data.ton!==undefined&&data.ton!==null&&data.ton!=='/'&&String(data.ton).trim()!=='')?data.ton:((_q>0&&_u>0)?(_q*_u/1000).toFixed(1):'');
  tr.innerHTML=`
    <td class="col-idx num-cell">${idx}</td>
    <td class="col-check"><input type="checkbox" class="row-check"></td>
    <td class="col-shipdate"><input type="date" data-f="shipdate" value="${esc(data.shipdate ?? $("shipDate").value)}" placeholder="/"></td>
    <td class="col-customer"><textarea data-f="customer" placeholder="/" rows="1">${esc(data.customer)}</textarea></td>
    <td><textarea data-f="model" placeholder="/" rows="1">${esc(data.model)}</textarea></td>
    <td><input data-f="qty" type="number" min="0" value="${esc(data.qty)}" placeholder="/"></td>
    <td class="num-cell"><input data-f="ton" type="number" min="0" step="0.0001" value="${esc(tonVal)}" placeholder="/"></td>
    <td><input data-f="delivery" value="${esc(data.delivery)}" placeholder="/"></td>
    <td><input data-f="box" type="number" min="0" step="1" value="${esc(boxVal)}" placeholder="/"></td>
    <td class="col-remark"><textarea data-f="remark" placeholder="/" rows="1">${esc(data.remark)}</textarea></td>
    <td class="col-subton num-cell"></td>
    <td><textarea data-f="code" placeholder="/" rows="1">${esc(data.code)}</textarea></td>
    <td class="col-act"><button class="mv-u" title="上移">↑</button><button class="mv-d" title="下移">↓</button><button class="ins-x" title="在下方插入一行">＋</button><button class="del-x" title="删除">✕</button><input type="hidden" data-f="unit" value="${esc(data.unit)}"><input type="hidden" data-f="perbox" value="${esc(data.perbox)}"></td>`;
  const mvUp=tr.querySelector(".mv-u"), mvDown=tr.querySelector(".mv-d");
  mvUp.onclick=()=>moveRow(tr, -1);
  mvDown.onclick=()=>moveRow(tr, 1);
  tr.querySelector(".del-x").onclick=()=>delRow(tr);
  const rc=tr.querySelector(".row-check");
  if(rc) rc.addEventListener("change", updateCheckAll);
  tr.querySelector(".ins-x").onclick=()=>{ addRow({shipdate:tr.querySelector('[data-f="shipdate"]').value}, tr); saveDraft(); };
  tr.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("keydown", onCellKey);
    if(inp.dataset.f==="box"||inp.dataset.f==="ton"){
      inp.addEventListener("input", ()=>{
        if(inp.value.trim()==="") delete inp.dataset.manual;   // 清空 → 恢复自动带出
        else inp.dataset.manual="1";                          // 手填 → 保留，不被覆盖
        recalc(); saveDraft();
      });
    } else if(inp.dataset.f==="shipdate"){
      inp.addEventListener("input", ()=>{ recalc(); saveDraft(); styleShipdate(); });
      inp.addEventListener("change", ()=>{ reindex(); foldByDate(); saveDraft(); styleShipdate(); });
    } else {
      inp.addEventListener("input", ()=>{ recalc(); saveDraft(); });
    }
  });
  // 载入已有箱数/吨位时标记为手填值，避免被自动计算覆盖
  ["box","ton"].forEach(k=>{
    if(data[k]!==undefined&&data[k]!==null&&data[k]!=='/'&&String(data[k]).trim()!==''){
      const inp=tr.querySelector(`[data-f="${k}"]`); if(inp) inp.dataset.manual="1";
    }
  });
  tr.querySelectorAll("textarea").forEach(ta=>{
    ta.addEventListener("keydown", onCellKey);
    ta.addEventListener("input", ()=>{ recalc(); mergeCustomerCells(); fitTextarea(ta); saveDraft(); });
  });
  tr.querySelector('[data-f="customer"]').addEventListener("input", mergeCustomerCells);
  tr.querySelector('[data-f="remark"]').addEventListener("input", mergeCustomerCells);
  ["model","code"].forEach(k=>{
    const inp=tr.querySelector(`[data-f="${k}"]`);
    inp.addEventListener("focus", ()=>{ if(DB.length) showAC(inp, tr); });
    inp.addEventListener("input", ()=>showAC(inp, tr));
  });
  if(beforeRow && beforeRow.parentNode===tb) beforeRow.before(tr);
  else if(refRow && refRow.parentNode===tb) refRow.after(tr);
  else tb.appendChild(tr);
  reindex(); recalc(); fitTextareas(); updateCheckAll(); styleShipdate();
}
function reindex(){
  [...$("tbody").querySelectorAll("tr.subtotal")].forEach(tr=>tr.remove());
  let idx=0, lastDate="";
  [...$("tbody").children].forEach(tr=>{
    const date=tr.querySelector('[data-f="shipdate"]')?.value||"";
    if(date!==lastDate){ lastDate=date; idx=0; }
    idx++;
    tr.querySelector(".col-idx").textContent=idx;
  });
  $("rowCount").textContent=$("tbody").children.length+" 行"; mergeCustomerCells();
}
function moveRow(tr, dir){
  const tb=$("tbody");
  const rows=[...tb.children].filter(r=>!r.classList.contains("subtotal"));
  const idx=rows.indexOf(tr);
  if(idx<0) return;
  const targetIdx=idx+dir;
  if(targetIdx<0 || targetIdx>=rows.length) return;
  const target=rows[targetIdx];
  if(dir<0) tb.insertBefore(tr, target);
  else tb.insertBefore(tr, target.nextSibling);
  reindex(); recalc(); saveDraft(); updateCheckAll();
}
function fitTextarea(ta){ if(!ta) return; ta.style.height="auto"; ta.style.height=Math.max(26,ta.scrollHeight)+"px"; }
function fitTextareas(){ [...$("tbody").querySelectorAll("textarea")].forEach(fitTextarea); }
// ===================== 误删撤回 + WPS 式单元格导航 =====================
let undoStack=[];
const EDITABLE_COLS=[3,4,5,6,7,8,9,10,12];   // 可编辑列的 nth-child 列号（跳过 #/✓/客户吨位/操作；物料编码已移到第12列）
function collectRowData(tr){
  const g=f=>{ const el=tr.querySelector(`[data-f="${f}"]`); return el?el.value:""; };
  const tonI=tr.querySelector('[data-f="ton"]'), boxI=tr.querySelector('[data-f="box"]');
  return {
    shipdate:g("shipdate"), customer:g("customer"), code:g("code"), model:g("model"),
    qty:g("qty"), unit:g("unit"), perbox:g("perbox"),
    ton:tonI?tonI.value:"", tonManual:(tonI&&tonI.dataset.manual==="1"),
    delivery:g("delivery"), box:boxI?boxI.value:"", boxManual:(boxI&&boxI.dataset.manual==="1"),
    remark:g("remark")
  };
}
function visibleRows(){ return [...$("tbody").children].filter(r=>!r.classList.contains("subtotal")&&!r.classList.contains("date-fold-hidden")&&!r.classList.contains("filter-hidden")&&!r.classList.contains("date-fold-placeholder")); }
function allRows(){ return [...$("tbody").children].filter(r=>!r.classList.contains("subtotal")&&!r.classList.contains("date-fold-placeholder")); }   // 全部数据行（含折叠隐藏），用于删除/撤回等结构性操作
function delRow(tr){
  if(!tr || !tr.parentNode) return;
  const list=allRows();
  const idx=list.indexOf(tr);
  if(idx<0) return;
  const model=tr.querySelector('[data-f="model"]')?.value?.trim()||"";
  const customer=tr.querySelector('[data-f="customer"]')?.value?.trim()||"";
  if(!confirm(`确认删除第 ${idx+1} 行${model?"（型号："+model+"）":""}？\n删除后可通过「撤回」按钮或 Ctrl+Z 恢复。`)) return;
  const data=collectRowData(tr);
  tr.remove();
  undoStack.push({rows:[data], atIndex:idx});
  if(undoStack.length>50) undoStack.shift();
  reindex(); recalc(); saveDraft(); updateCheckAll(); updateUndoBtn();
  toast("已删除 1 行，可点「撤回」恢复");
}
function undo(){
  const item=undoStack.pop();
  if(!item){ toast("没有可撤回的操作"); return; }
  const tb=$("tbody");
  const list=allRows();
  const ref=list[item.atIndex]||null;
  item.rows.forEach(d=>{ addRow(d, null, ref); });
  reindex(); recalc(); saveDraft(); updateCheckAll(); updateUndoBtn();
  toast("已撤回删除，恢复 "+item.rows.length+" 行");
}
function updateUndoBtn(){ const b=$("undoBtn"); if(b) b.disabled=undoStack.length===0; }
function findCell(tr, colNum){
  const td=tr.children[colNum-1];
  if(!td) return null;
  if(td.style.display==="none") return null;
  const el=td.querySelector("input,textarea");
  return el||null;
}
function navigateFrom(el, ci, dCol, dRow){
  const rows=visibleRows();
  const tr=el.closest("tr");
  const rIdx=rows.indexOf(tr);
  if(rIdx<0) return;
  let newCi=ci+dCol, newRi=rIdx+dRow;
  if(newRi<0||newRi>=rows.length) return;          // 行越界：不导航
  const targetRow=rows[newRi];
  let target=findCell(targetRow, EDITABLE_COLS[newCi]);
  if(!target){                                    // 目标列被合并隐藏：就近找同行可见单元格
    for(let off=1; off<EDITABLE_COLS.length; off++){
      const a=EDITABLE_COLS[newCi-off], b=EDITABLE_COLS[newCi+off];
      if(a){ const t=findCell(targetRow,a); if(t){ target=t; break; } }
      if(b){ const t=findCell(targetRow,b); if(t){ target=t; break; } }
    }
  }
  if(target){ target.focus(); try{ if(target.select) target.select(); }catch(_){} }
}
function onCellKey(e){
  if(!e.target || !e.target.closest) return;
  let dCol=0, dRow=0, handled=false;
  if(e.key==="ArrowUp"){ dRow=-1; handled=true; }
  else if(e.key==="ArrowDown"){ dRow=1; handled=true; }
  else if(e.key==="Enter"){ if(e.shiftKey) return; dRow=1; handled=true; }   // Shift+Enter 保留换行
  else if(e.key==="Tab"){ dCol=e.shiftKey?-1:1; handled=true; }
  else if(e.key==="ArrowLeft"){ dCol=-1; handled=true; }
  else if(e.key==="ArrowRight"){ dCol=1; handled=true; }
  if(!handled) return;
  if(acEl) return;                                // 自动补全打开时交给它处理
  e.preventDefault();
  const ci=EDITABLE_COLS.indexOf(e.target.closest("td").cellIndex+1);
  if(ci<0) return;
  navigateFrom(e.target, ci, dCol, dRow);
}
function mergeCustomerCells(){
  // 按「客户+发货日期」分组，合并客户、备注、客户吨位合计三列
  const rows=[...$("tbody").children];
  rows.forEach(tr=>{
    tr.classList.remove("group-end");
    [".col-customer",".col-remark"].forEach(sel=>{
      const c=tr.querySelector(sel);
      if(c){ c.style.display=""; c.rowSpan=1; c.classList.remove("merged-cell"); }
    });
    const sub=tr.querySelector(".col-subton");
    if(sub){ sub.style.display=""; sub.rowSpan=1; sub.classList.remove("merged-cell"); sub.textContent=""; }
  });
  let i=0;
  while(i<rows.length){
    const cust=rows[i].querySelector('[data-f="customer"]')?.value.trim()||"";
    const date=rows[i].querySelector('[data-f="shipdate"]')?.value||"";
    const key=cust+"|"+date;
    let j=i+1;
    while(j<rows.length){
      const cust2=rows[j].querySelector('[data-f="customer"]')?.value.trim()||"";
      const date2=rows[j].querySelector('[data-f="shipdate"]')?.value||"";
      if((cust2+"|"+date2)!==key) break;
      j++;
    }
    const len=j-i;
    // 计算该组合计吨位
    let subTon=0;
    for(let k=i;k<j;k++){ subTon+=parseFloat(rows[k].querySelector('[data-f="ton"]')?.value)||0; }
    if(cust && subTon>0){
      const first=rows[i];
      const subCell=first.querySelector(".col-subton");
      if(subCell){ subCell.textContent=subTon.toFixed(1); subCell.classList.add("merged-cell"); }
      if(len>1){
        const c=rows[i].querySelector(".col-customer"), r=rows[i].querySelector(".col-remark");
        if(c){ c.rowSpan=len; c.classList.add("merged-cell"); }
        if(r){ r.rowSpan=len; r.classList.add("merged-cell"); }
        if(subCell) subCell.rowSpan=len;
        for(let k=i+1;k<j;k++){
          const c2=rows[k].querySelector(".col-customer"), r2=rows[k].querySelector(".col-remark"), s2=rows[k].querySelector(".col-subton");
          if(c2) c2.style.display="none"; if(r2) r2.style.display="none"; if(s2) s2.style.display="none";
        }
      }
    }
    rows[j-1].classList.add("group-end");
    i=j;
  }
  fitTextareas();
  foldByDate();
}

const FOLD_STATE_KEY="shipping_fold_dates_v1";
const SHOW_FOLDED_KEY="shipping_show_folded_v1";
function getFoldState(){ try{ return JSON.parse(localStorage.getItem(FOLD_STATE_KEY))||{}; }catch(e){ return {}; } }
function setFoldState(date,collapsed){ const s=getFoldState(); s[date]=collapsed?1:0; localStorage.setItem(FOLD_STATE_KEY,JSON.stringify(s)); }
function getShowFolded(){ try{ return localStorage.getItem(SHOW_FOLDED_KEY)==="1"; }catch(e){ return false; } }
function setShowFolded(show){ try{ localStorage.setItem(SHOW_FOLDED_KEY, show?"1":"0"); }catch(e){} }
// 折叠隐藏某行时同步取消其勾选，确保折叠日期不会被全选/发布带入
function hideFoldedRow(tr){ tr.classList.add("date-fold-hidden"); const b=tr.querySelector(".row-check"); if(b) b.checked=false; }

function foldByDate(){
  // 清理旧的折叠标记与按钮
  [...$("tbody").children].forEach(tr=>{
    tr.classList.remove("date-fold-hidden");
    const sd=tr.querySelector(".col-shipdate");
    if(sd){
      sd.classList.remove("date-expanded","date-collapsed");
      const btn=sd.querySelector(".fold-btn");
      if(btn) btn.remove();
      sd.style.display=""; sd.rowSpan=1;
    }
  });

  const rows=[...$("tbody").children];
  const groups=[];
  let cur=null;
  rows.forEach(tr=>{
    if(tr.classList.contains("subtotal")){ if(cur) cur.rows.push(tr); return; }
    const d=tr.querySelector('[data-f="shipdate"]')?.value||"";
    if(!cur||cur.date!==d){ cur={date:d, rows:[tr]}; groups.push(cur); }
    else cur.rows.push(tr);
  });

  const today=$("shipDate").value||todayStr();
  const state=getFoldState();
  const showFolded=getShowFolded();
  const foldedDates=[];

  groups.forEach(g=>{
    if(!g.rows.length) return;
    const first=g.rows[0];
    const sd=first.querySelector(".col-shipdate");
    if(!sd) return;

    let collapsed=state[g.date];
    if(collapsed===undefined) collapsed=!(g.date>today);  // 当天及之前的日期默认折叠，明天及以后默认展开
    else collapsed=!!collapsed;

    const btn=document.createElement("button");
    btn.type="button"; btn.className="fold-btn";
    btn.textContent=collapsed?"▶":"▼"; btn.title=collapsed?"展开":"折叠";
    btn.onclick=(e)=>{ e.stopPropagation(); toggleDateFold(g.date); };
    sd.insertBefore(btn, sd.firstChild);
    sd.classList.add(collapsed?"date-collapsed":"date-expanded");

    if(collapsed){
      foldedDates.push(g.date);
      if(showFolded){
        // 保留第一行作为折叠控制，方便单独展开
        for(let k=1;k<g.rows.length;k++) hideFoldedRow(g.rows[k]);
      }else{
        // 截图模式：折叠的日期整组隐藏，入口改到「发货明细」标题处
        g.rows.forEach(tr=>hideFoldedRow(tr));
      }
    }
  });

  // 在「发货明细」标题右侧渲染折叠日期入口
  const fd=$("foldedDates");
  fd.innerHTML="";
  if(!showFolded && foldedDates.length){
    const past=foldedDates.filter(d=>d<=today);
    const future=foldedDates.filter(d=>d>today);
    if(past.length){
      const b=document.createElement("button");
      b.type="button"; b.className="folded-date-btn";
      b.textContent="▶ 当天之前已折叠";
      b.title="展开 "+past.join("、");
      b.onclick=()=>{ past.forEach(d=>setFoldState(d,0)); foldByDate(); fitTextareas(); };
      fd.appendChild(b);
    }
    if(future.length){
      const b=document.createElement("button");
      b.type="button"; b.className="folded-date-btn";
      b.textContent="▶ 当天之后已折叠";
      b.title="展开 "+future.join("、");
      b.onclick=()=>{ future.forEach(d=>setFoldState(d,0)); foldByDate(); fitTextareas(); };
      fd.appendChild(b);
    }
  }

  // 行数只统计可见行（同时排除筛选隐藏）
  const visible=[...$("tbody").children].filter(tr=>!tr.classList.contains("date-fold-hidden")&&!tr.classList.contains("filter-hidden")).length;
  $("rowCount").textContent=visible+" 行";
  updateCheckAll();   // 折叠会取消隐藏行勾选，刷新表头全选框状态
}

function toggleDateFold(date){
  const state=getFoldState();
  setFoldState(date, state[date]?0:1);
  foldByDate();
  fitTextareas();
}

// ===================== 筛选（客户 / 型号 / 发货日期） =====================
function applyFilter(){
  const cust=($("filterCustomer").value||"").trim().toLowerCase();
  const model=($("filterModel").value||"").trim().toLowerCase();
  const date=$("filterDate").value||"";
  let shown=0, total=0;
  [...$("tbody").children].forEach(tr=>{
    if(tr.classList.contains("subtotal")) return;
    total++;
    const trCust=(tr.querySelector('[data-f="customer"]')?.value||"").trim().toLowerCase();
    const trModel=(tr.querySelector('[data-f="model"]')?.value||"").trim().toLowerCase();
    const trDate=tr.querySelector('[data-f="shipdate"]')?.value||"";
    const match=(!cust || trCust.includes(cust)) &&
                (!model || trModel.includes(model)) &&
                (!date || trDate===date);
    tr.classList.toggle("filter-hidden", !match);
    if(match) shown++;
  });
  const hint=$("filterCount");
  if(hint) hint.textContent=(cust||model||date)?`显示 ${shown}/${total} 行`:"";
  recalc(); foldByDate(); updateCheckAll();
}
function clearFilter(){
  $("filterCustomer").value="";
  $("filterModel").value="";
  $("filterDate").value="";
  applyFilter();
}

function recalc(){
  let sq=0,st=0,sb=0;
  [...$("tbody").children].forEach(tr=>{
    if(tr.classList.contains("subtotal")) return;   // 跳过客户小计行
    const qty=parseFloat(tr.querySelector('[data-f="qty"]').value)||0;
    const unit=parseFloat(tr.querySelector('[data-f="unit"]').value)||0;
    const perbox=parseFloat(tr.querySelector('[data-f="perbox"]').value)||0;
    // 吨位：自动带出（数量×单重/1000），除非手填
    const tonInput=tr.querySelector('[data-f="ton"]');
    const autoTon=(qty>0&&unit>0)?qty*unit/1000:0;
    if(tonInput.dataset.manual!=="1") tonInput.value=autoTon>0?autoTon.toFixed(1):"";
    const ton=parseFloat(tonInput.value)||0;
    // 箱数：自动带出（数量÷每箱件数），除非手填
    const boxInput=tr.querySelector('[data-f="box"]');
    const autoBox=(qty>0&&perbox>0)?Math.ceil(qty/perbox):0;
    if(boxInput.dataset.manual!=="1") boxInput.value=autoBox>0?autoBox:"";
    const box=parseFloat(boxInput.value)||0;
    // 表尾合计只统计当前可见行（被折叠或筛选隐藏的行不计入）
    if(!tr.classList.contains("date-fold-hidden") && !tr.classList.contains("filter-hidden")){
      sq+=qty; st+=ton; sb+=box;
    }
  });
  $("sumQty").textContent=sq;
  $("sumTon").textContent=st.toFixed(1);
  $("sumBox").textContent=(sb>0)?sb:"/";
  mergeCustomerCells();
  updateKPIs();
}
function collectRows(){
  const f=v=>{ v=(v==null?"":String(v).trim()); return v===""?"/":v; };
  return [...$("tbody").children].filter(tr=>!tr.classList.contains("subtotal")).map(tr=>({
    shipdate:f(tr.querySelector('[data-f="shipdate"]').value),
    customer:f(tr.querySelector('[data-f="customer"]').value),
    code:f(tr.querySelector('[data-f="code"]').value),
    model:f(tr.querySelector('[data-f="model"]').value),
    qty:f(tr.querySelector('[data-f="qty"]').value),
    perbox:f(tr.querySelector('[data-f="perbox"]').value),
    ton:f(tr.querySelector('[data-f="ton"]').value),
    box:f(tr.querySelector('[data-f="box"]').value),
    delivery:f(tr.querySelector('[data-f="delivery"]').value),
    remark:f(tr.querySelector('[data-f="remark"]').value)
  }));
}
function syncDocHead(){
  const d=$("shipDate").value;
  if(d){
    const [y,m,day]=d.split("-");
    $("docTitle").textContent=`${+m}月${+day}发货计划`;
  }
}
// ===================== 草稿自动保存（刷新/重开页面不丢未发布数据） =====================

  try{
    const rows=[...$("tbody").children].filter(tr=>!tr.classList.contains("subtotal")).map(tr=>{
      const tonI=tr.querySelector('[data-f="ton"]'), boxI=tr.querySelector('[data-f="box"]');

        model:tr.querySelector('[data-f="model"]').value,
        qty:tr.querySelector('[data-f="qty"]').value,
        unit:tr.querySelector('[data-f="unit"]').value,
        perbox:tr.querySelector('[data-f="perbox"]').value,
        ton:tonI.value, tonManual:(tonI.dataset.manual==="1"),

// ===================== 发布：自动截图下载 + 文本存档（存档不带图片） =====================
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function publish(){
  const allTrs=[...$("tbody").children].filter(tr=>!tr.classList.contains("subtotal"));
  if(!allTrs.length){ toast("请先添加发货明细"); return; }
  // 发布前必须勾选确认：仅发布已勾选的行
  const checkedTrs=allTrs.filter(tr=>tr.querySelector(".row-check")?.checked);
  if(!checkedTrs.length){ toast("发布前请先勾选要发布的行（✓ 列）"); return; }
  const f=v=>{ v=(v==null?"":String(v).trim()); return v===""?"/":v; };
  const rows=checkedTrs.map(tr=>({
    shipdate:f(tr.querySelector('[data-f="shipdate"]').value),
    customer:f(tr.querySelector('[data-f="customer"]').value),
    code:f(tr.querySelector('[data-f="code"]').value),
    model:f(tr.querySelector('[data-f="model"]').value),
    qty:f(tr.querySelector('[data-f="qty"]').value),
    perbox:f(tr.querySelector('[data-f="perbox"]').value),
    ton:f(tr.querySelector('[data-f="ton"]').value),
    box:f(tr.querySelector('[data-f="box"]').value),
    delivery:f(tr.querySelector('[data-f="delivery"]').value),
    remark:f(tr.querySelector('[data-f="remark"]').value)
  }));
  if(rows.some(r=>!r.model || !r.qty) && !confirm("存在「型号」或「数量」为空行，仍要发布？")) return;
  if(!confirm("确认发布已勾选的 "+rows.length+" 行？")) return;

  // 存档文本数据
  const rec={id:Date.now(),date:$("shipDate").value,no:$("planNo").value,
    publishedAt:new Date().toLocaleString("zh-CN"),rows,
    sumQty:$("sumQty").textContent,sumTon:$("sumTon").textContent,sumBox:$("sumBox").textContent};
  saveRec(rec); renderRecords();
  toast("已发布存档 ✓（单号 "+rec.no+" · 共 "+rows.length+" 行）");
  $("planNo").value=genPlanNo(); syncDocHead();
  saveDraft();
  try{ if(window.__clientBackup) window.__clientBackup(); }catch(e){}

  // 自动截图：型号列(第5列) 到 客户吨位列(第11列)
  capturePublishImage();
}

function styleShipdate(){
  document.querySelectorAll('[data-f="shipdate"]').forEach(inp=>{
    const v=(inp.value||"").trim();
    if(v.includes("自提")) inp.classList.add("jinling");
    else inp.classList.remove("jinling");
  });
}
function capturePublishImage(){
  if(typeof html2canvas==="undefined"){ toast("截图库未加载，跳过自动截图"); return; }
  const tbl=$("tbl");
  const wrapper=document.createElement("div");
  wrapper.style.cssText="position:fixed;left:10000px;top:10000px;background:#fff;padding:10px;z-index:-1;";
  document.body.appendChild(wrapper);

  const clone=tbl.cloneNode(true);
  // 移除隐藏行，保证截图只含发布时可见数据
  clone.querySelectorAll("tr.date-fold-hidden, tr.filter-hidden").forEach(tr=>tr.remove());
  // 仅保留第5列（型号）到第11列（客户吨位），索引 4..10
  clone.querySelectorAll("tr").forEach(tr=>{
    const cells=[...tr.children];
    cells.forEach((cell,idx)=>{ if(idx<4 || idx>10) cell.remove(); });
  });
  // 克隆表头原标题
  const title=document.createElement("div");
  title.textContent=$("docTitle").textContent;
  title.style.cssText="font-size:18px;font-weight:700;text-align:center;margin-bottom:8px;color:#1f2328;";
  wrapper.appendChild(title);
  wrapper.appendChild(clone);

  html2canvas(wrapper,{scale:2,backgroundColor:"#fff",useCORS:true}).then(canvas=>{
    const a=document.createElement("a");
    a.download="发货计划截图_"+($("shipDate").value||new Date().toISOString().slice(0,10))+".png";
    a.href=canvas.toDataURL("image/png");
    a.click();
    wrapper.remove();
  }).catch(err=>{ console.error(err); wrapper.remove(); toast("自动截图失败，已保存文本记录"); });
}
function updateCheckAll(){
  // 仅统计可见行（排除被折叠或筛选隐藏的行），否则隐藏行永远不勾选会让表头全选框恒为半选
  const boxes=[...$("tbody").querySelectorAll(".row-check")].filter(b=>{
    const tr=b.closest("tr");
    return !tr.classList.contains("date-fold-hidden") && !tr.classList.contains("filter-hidden");
  });
  const checked=boxes.filter(b=>b.checked).length;
  const all=$("checkAll");
  all.checked = boxes.length>0 && checked===boxes.length;
  all.indeterminate = checked>0 && checked<boxes.length;
  updateKPIs();
}
function updateKPIs(){
  const rows=[...$("tbody").children].filter(tr=>!tr.classList.contains("subtotal"));
  const visibleRows=rows.filter(tr=>!tr.classList.contains("date-fold-hidden")&&!tr.classList.contains("filter-hidden"));
  let qty=0, ton=0, checked=0;
  visibleRows.forEach(tr=>{
    qty+=parseFloat(tr.querySelector('[data-f="qty"]')?.value)||0;
    ton+=parseFloat(tr.querySelector('[data-f="ton"]')?.value)||0;
    if(tr.querySelector('.row-check')?.checked) checked++;
  });
  const kpiRows=$("kpiRows"), kpiQty=$("kpiQty"), kpiTon=$("kpiTon"), kpiChecked=$("kpiChecked");
  if(kpiRows) kpiRows.innerHTML=visibleRows.length+'<span class="kpi-unit">行</span>';
  if(kpiQty) kpiQty.innerHTML=qty+'<span class="kpi-unit">件</span>';
  if(kpiTon) kpiTon.innerHTML=ton.toFixed(1)+'<span class="kpi-unit">t</span>';
  if(kpiChecked) kpiChecked.innerHTML=checked+'<span class="kpi-unit">行</span>';
}
function saveRec(rec){
  let list=loadRec(); list.unshift(rec);
  if(list.length>200) list=list.slice(0,200);   // 文本数据体积小，可保留更多
  try{ localStorage.setItem(LS_REC, JSON.stringify(list)); }
  catch(e){ localStorage.setItem(LS_REC, JSON.stringify(list.slice(0,50))); toast("存储空间不足，仅保留最近 50 条"); }
  if(window.CloudSync) CloudSync.autoPush(LS_REC);
}
function loadRec(){ try{ return JSON.parse(localStorage.getItem(LS_REC))||[]; }catch(e){ return []; } }
function renderRecords(){
  const list=loadRec(); $("recCount").textContent=list.length+" 条";
  const box=$("records"); box.innerHTML="";
  $("recEmpty").style.display=list.length?"none":"block";
  list.forEach(rec=>{
    const div=document.createElement("div"); div.className="rec";
    div.innerHTML=`
      <div class="info"><b>${rec.no}</b><br>日期：${rec.date}${rec.maker?' ｜ 制单：'+rec.maker:''}<br>
        共 ${rec.rows.length} 行 ｜ 数量 ${rec.sumQty} ｜ ${rec.sumTon}t ｜ ${rec.sumBox}箱<br>发布：${rec.publishedAt}</div>
      <div class="acts">
        <button class="btn btn-line" data-act="csv">导出CSV</button>
        <button class="btn btn-danger" data-act="del">删除</button>
      </div>`;
    div.querySelector('[data-act="csv"]').onclick=()=>exportRowsCsv(rec.rows, rec.no);
    div.querySelector('[data-act="del"]').onclick=()=>{
      if(confirm("确认删除该发布记录？")){ localStorage.setItem(LS_REC, JSON.stringify(loadRec().filter(r=>r.id!==rec.id))); renderRecords(); if(window.CloudSync) CloudSync.autoPush(LS_REC); }
    };
    box.appendChild(div);
  });
  updateKPIs();
}

// ===================== 导出 =====================
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function rowsToCsv(rows){ 
  const head=["发货日期","客户","型号","发货数量","吨位(t)","交货单","箱数","备注"];
  const lines=[head.join(",")];
  rows.forEach(r=>lines.push([r.shipdate,r.customer,r.model,r.qty,r.ton,r.delivery,r.box,r.remark].map(csvCell).join(",")));
  return "﻿"+lines.join("\n");
}
function exportRowsCsv(rows, name){
  const blob=new Blob([rowsToCsv(rows)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`发货计划_${name}.csv`; a.click();
}
$("exportCsv").onclick=()=>{ const rows=collectRows(); if(!rows.length){ toast("暂无数据可导出"); return; } exportRowsCsv(rows, $("planNo").value); };

// ===================== 数据备份（本地文件 ↔ 网站互导） =====================
function exportBackup(){
  const data={};
  BACKUP_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!=null){ try{ data[k]=JSON.parse(v); }catch(e){ data[k]=v; } } });
  if(!Object.keys(data).length){ toast("没有可导出的数据"); return; }
  const blob=new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url;
  const d=$("shipDate").value||todayStr();
  a.download="发货计划备份_"+d+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("备份已导出（含草稿、发布记录、折叠状态）");
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      BACKUP_KEYS.forEach(k=>{ if(k in data){ const v=data[k]; localStorage.setItem(k, typeof v==="string"?v:JSON.stringify(v)); } });
      if(window.CloudSync){ BACKUP_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } }); }
      toast("备份已导入，正在刷新…");
      setTimeout(()=>location.reload(),700);
    }catch(e){ toast("备份文件解析失败："+e.message); }
  };
  reader.readAsText(file);
}

});
$("importBackup").onclick=()=>$("backupFile").click();
$("backupFile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) importBackup(f); e.target.value=""; };

// ===================== 启动 =====================
syncDocHead();
updateFoldedButton();
updateDbStatus();
if(!DB.length) toast("提示：物料库为空，请先到「物料数据库」页导入");
const _draft=loadDraft();
if(_draft && (_draft.rows.length || _draft.date)){
  if(_draft.date){
    // 草稿日期如果是当天或更早，默认改为当天+1天（计划明天及以后的 shipment）
    $("shipDate").value = (_draft.date <= realTodayStr()) ? todayStr() : _draft.date;
  }
  $("planNo").value=_draft.no||genPlanNo();
  _draft.rows.forEach(r=>addRow(r));
  syncDocHead();
  styleShipdate();
}else{
  addRow(); addRow();
}
renderRecords();

// ===================== 云端同步 =====================
if(window.CloudSync){
  CloudSync.init();
  const CLOUD_KEYS=[LS_DB, LS_REC];
  const nav=document.querySelector('.topbar');
  const pill=document.createElement('span'); pill.id='cloudPill'; pill.className='cloud-pill';
  const btn=document.createElement('button'); btn.id='cloudSyncBtn'; btn.className='btn btn-ghost'; btn.textContent='☁ 同步'; btn.title='拉取最新';
  if(nav){ const dbStatus=nav.querySelector('#dbStatus'); const anchor=dbStatus?dbStatus.nextSibling:null; nav.insertBefore(pill, anchor); nav.insertBefore(btn, pill.nextSibling); CloudSync.bindStatus(pill);
    btn.onclick=()=>CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); updateDbStatus(); renderRecords(); }); }
  if(CloudSync.ready()){
    CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); updateDbStatus(); renderRecords(); }).then(()=>{
      CLOUD_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } });
    });
  } else { CloudSync.setStatus('未配置云端','off'); }
}
</script>
</body>
</html>
