<!DOCTYPE html>

<title>发货计划系统</title>

<style>
  :root{
    --bg:#f8f7ff; --bg-2:#eef2ff; --bg-3:#f5f3ff;
    --card:#ffffff; --line:#e6e9f4; --line-2:#f1f4fb;
    --txt:#0f172a; --txt-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
    --brand:#6366f1; --brand-2:#818cf8; --brand-d:#4f46e5;
    --soft:#eef2ff; --soft-2:#e0e7ff; --soft-line:#c7d2fe;
    --red:#ef4444; --red-bg:#fecaca; --green:#10b981; --green-bg:#ecfdf5;
    --violet:#8b5cf6; --orange:#f59e0b;
    --purple:#3b82f6; --purple-d:#2563eb; --purple-l:#60a5fa; --purple-bg:#eff6ff; --blue:#0ea5e9; --blue-bg:#bfdbfe;
    --radius:16px; --radius-sm:12px; --radius-lg:20px;
    --sh-sm:0 1px 3px rgba(15,23,42,.06);
    --sh-md:0 4px 20px rgba(15,23,42,.06);
    --sh-lg:0 18px 45px rgba(15,23,42,.10);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Microsoft YaHei","微软雅黑","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:#f6f8fa;color:#1f2328;font-size:14px;
    -webkit-font-smoothing:antialiased;text-align:center;}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;
    background:#2563eb;}
  .wrap{max-width:none;padding:14px 0 64px;}
  .kpi-grid,.topbar,.card{padding-left:24px;padding-right:24px;}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .nav-link{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:0;font-size:13px;font-weight:600;text-decoration:none;background:#fff;border:1px solid #d0d7de;color:#4b5563;transition:.15s;box-shadow:none;}
  .nav-link:hover{background:#f6f8fa;color:#2563eb;border-color:#9ca3af;}
  .nav-link.active{background:#2563eb;color:#fff;border-color:#2563eb;}
  /* ===== KPI 统计卡片 ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
  .kpi-card{background:#fff;border:1px solid #d0d7de;border-radius:0;padding:14px 16px;box-shadow:none;display:flex;align-items:center;gap:12px;transition:none;}
  .kpi-icon{width:38px;height:38px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#f6f8fa;border:1px solid #d0d7de;}
  .kpi-icon.blue{color:#2563eb;}
  .kpi-icon.violet{color:#7c3aed;}
  .kpi-icon.green{color:#059669;}
  .kpi-icon.orange{color:#d97706;}
  .kpi-label{font-size:12px;color:#4b5563;font-weight:600;letter-spacing:0;margin-bottom:4px;}
  .kpi-value{font-size:20px;font-weight:700;color:#1f2328;line-height:1.1;font-variant-numeric:tabular-nums;}
  .kpi-unit{font-size:12px;color:#6b7280;font-weight:500;margin-left:3px;}
  /* ===== 云端同步状态 + 手机自适应 ===== */
  .cloud-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:0;font-size:11px;font-weight:600;background:#f6f8fa;color:#4b5563;border:1px solid #d0d7de;white-space:nowrap;transition:.15s;flex-shrink:0;}
  .cloud-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(75,85,99,.12);}
  .cloud-pill.ok{background:#ecfdf5;color:#059669;border-color:#a7f3d0;}
  .cloud-pill.err{background:#fef2f2;color:#dc2626;border-color:#fecaca;}
  .cloud-pill.sync{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
  .cloud-pill.off{background:#f9fafb;color:#9ca3af;}
  @media (max-width:820px){
    .wrap{padding:14px 14px 56px;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
    .kpi-card{padding:14px;}
    .kpi-icon{width:38px;height:38px;font-size:18px;}
    .kpi-value{font-size:18px;}
    .topbar{gap:10px;}
    .field{width:100%;}
    .nav{gap:8px;}
    .doc{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tbl{min-width:760px;}
    .tbl td input,.tbl td textarea{font-size:14px;}
    .card{padding:16px;}
  }
  .topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:#fff;border:1px solid #d0d7de;border-radius:0;
    padding:10px 14px;margin-bottom:16px;box-shadow:0 4px 12px rgba(15,23,42,.08);overflow:visible;
    position:sticky;top:0;z-index:200;}
  .filter-group{display:inline-flex;align-items:center;gap:5px;flex-wrap:nowrap;background:#f6f8fa;border-radius:0;padding:3px 8px;border:1px solid #d0d7de;}
  .filter-group input{border:1px solid #d0d7de;border-radius:0;padding:4px 8px;font-size:12px;outline:none;width:72px;background:#fff;transition:.15s;color:#1f2328;}
  .filter-group input:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12);}
  .filter-label{align-self:center;font-size:12px;font-weight:700;color:#4b5563;padding:0 1px 0 3px;white-space:nowrap;}
  .filter-group .hint{font-size:12px;color:#6b7280;font-weight:600;white-space:nowrap;}
  .field{display:flex;flex-direction:column;gap:3px;}
  .field label{font-size:12px;color:#4b5563;font-weight:700;letter-spacing:0;}
  .field input{border:1px solid #d0d7de;border-radius:0;padding:5px 8px;font-size:12px;outline:none;background:#fff;transition:.15s;color:#1f2328;}
  .field-inline{flex-direction:row;align-items:center;gap:5px;}
  .field-inline input{width:112px;padding:5px 8px;font-size:12px;}
  .field input:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12);}
  .spacer{flex:1;}
  .btn{border:1px solid #d0d7de;border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600;transition:.15s;letter-spacing:0;display:inline-flex;align-items:center;justify-content:center;gap:3px;flex-shrink:0;background:#fff;color:#1f2328;}
  .btn:active{transform:none;}
  .btn-primary{background:#2563eb;color:#fff;border-color:#2563eb;}
  .btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8;}
  .btn-ghost{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;}
  .btn-ghost:hover{background:#dbeafe;}
  .btn-line{background:#fff;color:#1f2328;border:1px solid #d0d7de;}
  .btn-line:hover{background:#f6f8fa;border-color:#9ca3af;color:#1f2328;}
  .btn-danger{background:#fff;color:#dc2626;border:1px solid #fecaca;}
  .btn-danger:hover{background:#fef2f2;}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none;background:#f9fafb;border-color:#e5e7eb;color:#9ca3af;}
  .card{background:#fff;border:1px solid #d0d7de;border-radius:0;padding:16px 20px;margin-bottom:16px;box-shadow:none;}
  .card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;letter-spacing:0;color:#1f2328;}
  .card h2::before{content:"";width:4px;height:18px;background:#2563eb;display:inline-block;}
  .card h2 .tag{font-size:11.5px;background:var(--soft);color:var(--brand-d);padding:4px 12px;border-radius:999px;font-weight:700;border:1px solid #dbe6ff;}
  .folded-dates{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;}
  .folded-dates:empty{display:none;}
  .folded-date-btn{border:1px solid #d0d7de;background:#eff6ff;color:#1d4ed8;border-radius:0;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.15s;}
  .folded-date-btn:hover{background:#dbeafe;border-color:#2563eb;}
  .hint{font-size:12px;color:#6b7280;}
  /* ===== 发货计划单（WPS 清晰风） ===== */
  .doc{border:none;border-radius:0;overflow:hidden;background:#fff;box-shadow:none;width:100%;max-width:100%;}
  .doc-head{display:none;}
  .doc-head .t{font-size:18px;font-weight:700;letter-spacing:0;display:inline-flex;align-items:center;gap:8px;color:#1f2328;}
  .doc-head .meta{display:none;}
  .tbl{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;background:#fff;}
  .tbl thead th{background:#4472c4;color:#fff;font-weight:700;padding:7px 4px;text-align:center;border:1px solid #000;white-space:nowrap;position:sticky;top:0;z-index:2;font-size:15px;letter-spacing:0;}
  .tbl thead th .req{color:#ffd24d;font-weight:800;margin-left:1px;}  /* 必填项红/黄星号标记 */
  .tbl td{padding:0;border:1px solid #000;text-align:center;vertical-align:middle;min-height:26px;}
  .tbl td input,.tbl td textarea{border:1px solid transparent;background:#fff;width:100%;text-align:center;border-radius:0;font-size:14px;font-weight:600;color:#1f2328;outline:none;transition:.15s;box-sizing:border-box;min-height:26px;line-height:1.35;}
  .tbl td input{padding:2px 3px;height:26px;text-align:center;}
  .tbl td textarea{resize:none;overflow:hidden;font-family:inherit;padding:2px 3px;white-space:pre-wrap;word-break:break-word;display:block;text-align:center;}
  .tbl td textarea[data-f="model"],.tbl td textarea[data-f="code"]{text-align:center;}
  .tbl td input:focus,.tbl td textarea:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.15);}
  @keyframes flashc{0%,100%{box-shadow:0 0 0 2px rgba(139,92,246,.15)}50%{box-shadow:0 0 0 3px rgba(239,68,68,.45)}}
  .tbl td input.flash{border-color:var(--red)!important;animation:flashc .8s ease 3;}
  .tbl td.calc{padding:3px 4px;text-align:center;vertical-align:middle;}
  .tbl tr.subtotal td{background:#f6f8fa;border-top:1px solid #000;font-weight:700;color:#1f2328;padding:2px 3px;font-size:14px;}
  .tbl tr.subtotal .sub-label{text-align:left;padding-left:8px;}
  .tbl tr.subtotal .sub-ton{text-align:center;color:var(--purple-d);}
  /* 隔离区分隔带：位于「明日」计划之后，视觉隔离其后（后天及以后）的计划 */
  .tbl tbody tr.isolation-band > td{padding:0 !important;border:none;background:transparent;height:auto;}
  .tbl tbody tr.isolation-band .isolation-cell{height:30px;line-height:30px;text-align:center;background:linear-gradient(90deg,#fff7ed,#fed7aa 50%,#fff7ed);border-top:2px solid #fb923c;border-bottom:2px solid #fb923c;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
  .tbl tbody tr.isolation-band .isolation-label{display:inline-block;background:#ea580c;color:#fff;font-size:11px;font-weight:700;letter-spacing:2px;padding:3px 16px;border-radius:999px;box-shadow:0 1px 3px rgba(234,88,12,.3);}
  .tbl tbody tr{transition:none;}
  .tbl tbody tr:nth-child(even){background:#fafafa;}
  .tbl tbody tr:hover td{background:var(--purple-bg);}
  .tbl tr.group-end td{border-bottom:1px solid #000;}
  .col-idx{width:3%;color:#6b7280;}
  .col-check{width:3%;text-align:center;vertical-align:middle;padding:0!important;}
  .row-check{width:16px;height:16px;margin:0 auto;padding:0;cursor:pointer;accent-color:#2563eb;display:block;}
  #checkAll{width:16px;height:16px;margin:0 auto;padding:0;cursor:pointer;accent-color:#2563eb;display:block;}
  .hide-col{width:0!important;max-width:0!important;padding:0!important;border:0!important;overflow:hidden;visibility:hidden;white-space:nowrap;font-size:0;line-height:0;}
  .hide-col input,.hide-col textarea{display:none!important;}
  .tbl th:nth-child(1),.tbl tbody td:nth-child(1){width:2%;}    /* 序号 */
  .tbl th:nth-child(2),.tbl tbody td:nth-child(2){width:2%;}    /* 勾选 */
  .tbl th:nth-child(3),.tbl tbody td:nth-child(3){width:10%;}   /* 发货日期 */
  .tbl th:nth-child(4),.tbl tbody td:nth-child(4){width:10%;}   /* 送达方（原客户） */
  .tbl th:nth-child(5),.tbl tbody td:nth-child(5){width:20%;}   /* 型号 */
  .tbl th:nth-child(6),.tbl tbody td:nth-child(6){width:5%;}    /* 发货数量 */
  .tbl th:nth-child(7),.tbl tbody td:nth-child(7){width:6%;}    /* 发货点 */
  .tbl th:nth-child(8),.tbl tbody td:nth-child(8){width:5%;}    /* 交货单（可换行） */
  .tbl th:nth-child(9),.tbl tbody td:nth-child(9){width:3%;}    /* 箱数 */
  .tbl th:nth-child(10),.tbl tbody td:nth-child(10){width:8%;}  /* 时效要求 */
  .tbl th:nth-child(11),.tbl tbody td:nth-child(11){width:5%;}  /* 箱重T */
  .tbl th:nth-child(12),.tbl tbody td:nth-child(12){width:5%;}  /* 产品重量T(可改可恢复) */
  .tbl th:nth-child(13),.tbl tbody td:nth-child(13){width:5%;}  /* 客户吨位 */
  .tbl th:nth-child(14),.tbl tbody td:nth-child(14){width:3%;}  /* 物流（按客户自动带出） */
  .tbl th:nth-child(15),.tbl tbody td:nth-child(15){width:5%;}  /* 物料编码 */
  .tbl th:nth-child(16),.tbl tbody td:nth-child(16){width:4%!important;}  /* 操作 */
  /* 交货单：按字数自动换行（textarea 自适应高度，列宽不够自动折行且撑高行） */
  .tbl td.col-delivery textarea{white-space:pre-wrap!important;word-break:break-word;overflow-wrap:anywhere;min-height:26px;height:auto;line-height:1.25;padding:2px 3px;font-size:12px;font-weight:500;text-align:center;display:block;}
  .tbl td.col-delivery{vertical-align:middle;overflow:visible;padding:0;}
  .tbl tbody td:nth-child(15) textarea{text-align:center;font-size:9px;font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden;}  /* 物料编码：小字体单行显示 */
  .tbl tbody td:nth-child(14) input{font-size:10px;font-weight:600;}  /* 物流：窄列小字体单行 */
  .tbl tbody td:nth-child(5) textarea{text-align:center;}  /* 型号居中 */
  .tbl tbody td:nth-child(6) input,.tbl tbody td:nth-child(9) input{text-align:center;} /* 发货数量/箱数居中 */
  /* 发货点：单选下拉 */
  .tbl td.col-shippt{vertical-align:middle;padding:0;}
  .tbl td.col-shippt select{width:100%;border:1px solid transparent;background:#fff;font-size:12px;font-weight:600;color:#1f2328;height:26px;padding:1px 2px;text-align:center;text-align-last:center;outline:none;cursor:pointer;box-sizing:border-box;transition:.15s;font-family:inherit;}
  .tbl td.col-shippt select:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.15);}
  .tbl td.col-shippt select option{text-align:center;}
  .tbl td.col-ton{background:#f6f8fa;vertical-align:middle;font-variant-numeric:tabular-nums;}
  /* 产品重量T：可编辑输入框 + 恢复按钮（仅手填过时显示，样式同客户吨位/箱重T） */
  .tbl td.col-ton .ton-wrap{display:flex;align-items:center;gap:2px;justify-content:center;}
  .tbl td.col-ton .ton-wrap .ton-in{flex:1 1 auto;min-width:0;}
  .tbl td.col-ton .ton-reset{
    flex:0 0 auto;margin-left:2px;border:1px solid #f59e0b;background:#fffbeb;color:#b45309;
    cursor:pointer;line-height:1;width:16px;height:16px;border-radius:3px;padding:0;font-size:11px;
    display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;transition:.15s;
  }
  .tbl td.col-ton .ton-reset:hover{background:#f59e0b;color:#fff;border-color:#d97706;}
  @media print{ .tbl td.col-ton .ton-reset{display:none;} }
  input.ton-in{
    width:100%;min-width:28px;box-sizing:border-box;text-align:center;
    font:inherit;font-weight:600;color:#1f2328;
    border:1px solid transparent;background:transparent;
    padding:2px 3px;border-radius:4px;
  }
  input.ton-in:hover{border-color:#c4b5fd;background:#fff;}
  input.ton-in:focus{outline:none;border-color:var(--purple);background:#fff;box-shadow:0 0 0 2px rgba(124,58,237,.12);}
  input.ton-in.edited{border-color:#f59e0b;background:#fffbeb;color:#b45309;}
  @media print{ input.ton-in{border:none;background:transparent;padding:0;} }
  .tbl td.col-cwt{background:#f6f8fa;vertical-align:middle;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;}
  .tbl td.col-cwt .cwt-val{font-weight:600;color:#1f2328;font-size:13px;}
  .tbl td.col-cwt .cwt-toggle{margin-left:4px;border:1px solid #cfd4da;background:#fff;color:#6b7280;cursor:pointer;line-height:1;width:16px;height:16px;border-radius:3px;padding:0;font-size:11px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;transition:.15s;}
  .tbl td.col-cwt .cwt-toggle:hover{background:#eef2f7;color:#2563eb;border-color:#2563eb;}
  .tbl td input[data-f="shipdate"]{color:#1f2328;font-weight:600;text-align:center;padding-left:18px;padding-right:1px;font-size:12.5px;height:30px;min-height:30px;background:#fff;border-color:transparent;}
  /* 日期选择器（日历小图标）加大，方便点击弹出日期面板 */
  .tbl td input[data-f="shipdate"]::-webkit-calendar-picker-indicator{width:22px;height:22px;padding:2px;margin-left:2px;cursor:pointer;opacity:.75;background-size:20px 20px;}
  .tbl td input[data-f="shipdate"]::-webkit-calendar-picker-indicator:hover{opacity:1;background-color:var(--purple-bg);border-radius:4px;}
  .tbl td input[data-f="shipdate"]::-webkit-datetime-edit{font-size:12.5px;letter-spacing:0;}
  .tbl td input[data-f="shipdate"]::-webkit-datetime-edit-fields-wrapper{padding:0;}
  .tbl td input[data-f="shipdate"].jinling{font-family:inherit;font-weight:700;color:#1f2328;}
  .tbl td input[data-f="shipdate"]:focus{background:#fff;border-color:var(--purple);}
  .tbl td.col-shipdate{position:relative;padding:0;vertical-align:middle;}
  .tbl td.col-shipdate .fold-btn{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:14px;height:14px;padding:0;border:none;background:var(--purple-bg);color:var(--purple-d);border-radius:2px;cursor:pointer;font-size:9px;line-height:14px;text-align:center;z-index:1;transition:.15s;}
  .tbl td.col-shipdate .fold-btn:hover{background:#ede9fe;}
  .tbl td.col-shipdate input[data-f="shipdate"]{padding-left:18px;padding-right:1px;height:30px;min-height:30px;}
  .tbl th:nth-child(3){padding:6px 4px;}
  .tbl tr.date-fold-hidden{display:none;}
  .tbl tr.has-folded td{background:#eef4ff!important;}  /* 折叠日期首行：浅蓝底色提示「后续 N 行被折叠」 */
  .tbl tr.has-folded .col-shipdate{position:relative;}
  .tbl tr.filter-hidden{display:none;}
  .tbl tr.date-fold-placeholder{height:24px;background:#fafafa;}
  .tbl tr.date-fold-placeholder td{padding:3px 8px;text-align:left;border:1px dashed var(--purple-l);background:#fafafa;}
  .date-fold-placeholder-btn{border:1px solid var(--purple-l);background:#fff;color:var(--purple-d);border-radius:4px;padding:4px 12px;font-size:13px;cursor:pointer;font-weight:600;}
  .date-fold-placeholder-btn:hover{background:var(--purple-bg);}
  .col-customer,.col-remark{text-align:center;vertical-align:middle;}
  .col-customer textarea,.col-remark textarea{min-height:26px;height:auto;display:block;margin:0 auto;overflow:hidden;white-space:pre-wrap;word-break:break-word;}
  .col-customer.merged-cell,.col-remark.merged-cell{position:relative;padding:0!important;vertical-align:middle;background:#fff;}
  .col-customer.merged-cell textarea,.col-remark.merged-cell textarea{position:static;height:auto;width:100%;min-height:26px;padding:2px 3px;margin:0 auto;display:block;background:#fff;border-color:transparent;overflow:hidden;white-space:pre-wrap;word-break:break-word;}
  .col-customer.merged-cell textarea:focus,.col-remark.merged-cell textarea:focus{background:#fff;border-color:var(--purple);}

  </div>
</div>

<div class="toast" id="toast" data-page-node-id="6IWcDiFqPExwMe60DNczp0"></div>

<script>
const LS_DB = "shipping_db_v1";
const LS_REC = "shipping_plans_v1";
const LS_DRAFT = "shipping_draft_v1";   // 未发布明细自动草稿，刷新/重开不丢
const BACKUP_KEYS = [LS_DB, LS_REC, LS_DRAFT, "shipping_fold_dates_v1", "shipping_show_folded_v1"];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
// 发货点单选下拉选项（汽零铸造 / 汽零机加工 / 北区）
function shipptOptions(val){
  const v=(val&&val!=="/")?String(val):"";
  const opts=["汽零铸造","汽零机加工","北区"];
  let html='<option value=""></option>';
  opts.forEach(o=>{ html+=`<option value="${esc(o)}"${v===o?" selected":""}>${esc(o)}</option>`; });
  return html;
}

// ===================== 物料库（与物料数据库页共享 localStorage） =====================
let DB = loadDB();
function loadDB(){ try{ return JSON.parse(localStorage.getItem(LS_DB)) || []; }catch(e){ return []; } }
function updateDbStatus(){
  const el=$("dbStatus");
  if(!el) return;
  if(!DB.length) el.innerHTML="库空，<a href=\"物料数据库.html\" target=\"_blank\" style=\"color:var(--brand)\">去导入</a>";
  else el.textContent="库 "+DB.length+" 条";
}
// 从物料库页面切回时刷新，保证待选最新
window.addEventListener("focus", ()=>{
  if(window.CloudSync && CloudSync.ready()){
    CloudSync.pull(LS_DB).then(v=>{ if(v!==null){ localStorage.setItem(LS_DB, JSON.stringify(v)); DB=loadDB(); updateDbStatus(); } });
  } else { DB = loadDB(); updateDbStatus(); }
});

// ===================== 型号模糊待选（自动带出） =====================
let acEl=null, acList=[], acActive=-1, acRow=null, acTyped=false, acSnap=null, lastApplied=null;   // acTyped：待选是否由用户主动输入触发；acSnap：打开待选前的整行快照；lastApplied：最近一次「物料带出」前的快照（供 Esc 整行撤销）
function closeAC(){ if(acEl){ acEl.remove(); acEl=null; } acList=[]; acActive=-1; acTyped=false; }
// 记录整行会被「物料带出」改写的字段，供按 Esc 时恢复原数据
function snapRow(row){
  if(!row) return null;
  const g=f=>(row.querySelector(`[data-f="${f}"]`)?.value)||"";
  return { row, model:g("model"), code:g("code"), unit:g("unit"), perbox:g("perbox"), customer:g("customer"), remark:g("remark"), logistics:g("logistics") };
}
function restoreRowSnap(){
  if(!acSnap || !acSnap.row || !acSnap.row.parentNode) return false;
  const row=acSnap.row;
  const set=(f,v)=>{ const el=row.querySelector(`[data-f="${f}"]`); if(el) el.value=v||""; };
  set("model",acSnap.model); set("code",acSnap.code); set("unit",acSnap.unit);
  set("perbox",acSnap.perbox); set("customer",acSnap.customer); set("remark",acSnap.remark); set("logistics",acSnap.logistics);
  recalc(); mergeCustomerCells(); fitTextareas();
  acSnap=null;
  return true;
}
// 记录可编辑框聚焦时的原始值，供按 Esc 恢复（隐藏字段无需记录）
function trackOrig(el){
  if(!el || el.type==="hidden") return;
  el.addEventListener("focus", ()=>{ if(el.dataset.orig===undefined) el.dataset.orig=el.value; });
  el.addEventListener("blur", ()=>{ delete el.dataset.orig; });
}
function matchDB(q){
  q=q.trim().toLowerCase();
  if(!q) return [];                                  // 空输入不匹配任何物料：避免把整库当成待选项被误填入行
  return DB.filter(r =>
    (r.model||"").toLowerCase().includes(q) ||
    (r.code||"").toLowerCase().includes(q) ||
    (r.customer||"").toLowerCase().includes(q)).slice(0,8);
}
// 待选项优先顺序：含「机加工」=1 > 含「毛坯」=2 > 含「粗抛」=3 > 其他=4；任一字段（型号/编码/客户）命中即取该优先级，数字越小越靠前
function rankPriority(r){
  const fields=[r.model,r.code,r.customer];
  let p=4;
  for(const f of fields){
    const s=(f||"").toString();
    if(s.includes("机加工")) return 1;       // 数字越小越靠前，命中最高级直接返回
    if(s.includes("毛坯") && p>2) p=2;
    if(s.includes("粗抛") && p>3) p=3;
  }
  return p;
}
// 某型号（或编码）在物料库里对应的不同客户集合（用于提示多客户）
function customersForModel(model, code){
  const mk=(model||"").trim().toLowerCase(), ck=(code||"").trim().toLowerCase();
  const set=new Set();
  DB.forEach(r=>{
    const m=(r.model||"").trim().toLowerCase(), c=(r.code||"").trim().toLowerCase();
    if((mk && m===mk) || (ck && c===ck)){ const cu=(r.customer||"").trim(); if(cu) set.add(cu); }
  });
  return [...set];
}
function showAC(input, row, typed){
  acRow=row; closeAC();
  // 型号栏为空时不弹待选：否则按 Tab/Enter 会把物料库第一条误填进整行（客户列被莫名填上）
  if(!(input.value||"").trim()) return;
  acTyped=!!typed;                    // 只有用户打字唤出的待选才允许被填入，单纯聚焦路过时不填入
  if(!DB.length){
    acEl=document.createElement("div"); acEl.className="ac";
    acEl.innerHTML=`<div class="ac-item" style="color:var(--muted)">物料库为空，请先导入或打开「物料数据库」添加</div>`;
    document.body.appendChild(acEl);
    const rect=input.getBoundingClientRect();
    acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
    return;
  }
  acList=matchDB(input.value);
  // 待选项优先顺序：含「机加工」=P1 > 含「毛坯」=P2 > 含「粗抛」=P3 > 其他=P4（数字越小越靠前，Array.sort 稳定同级保持原顺序）
  acList.sort((a,b)=>rankPriority(a)-rankPriority(b));
  if(!acList.length){
    acEl=document.createElement("div"); acEl.className="ac";
    acEl.innerHTML=`<div class="ac-item" style="color:var(--muted)">无匹配物料：${esc(input.value)}</div>`;
    document.body.appendChild(acEl);
    const rect=input.getBoundingClientRect();
    acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
    return;
  }
  acEl=document.createElement("div"); acEl.className="ac";
  acList.forEach((r,idx)=>{
    const it=document.createElement("div"); it.className="ac-item"+(idx===0?" active":"");
    it.innerHTML=`<span class="ac-model">${esc(r.model||"-")}</span> <span class="ac-code">${esc(r.code||"")}</span>`+
      `<span class="ac-meta">${esc(r.customer||"")} ｜ ${esc(r.unit)||""}kg/件 ｜ ${esc(r.perbox)||""}件/箱</span>`;
    it.addEventListener("mousedown", e=>{ e.preventDefault(); applyDb(row, r); closeAC(); });
    acEl.appendChild(it);
  });
  document.body.appendChild(acEl);
  acActive=0;
  const rect=input.getBoundingClientRect();
  acEl.style.left=rect.left+"px"; acEl.style.top=rect.bottom+4+"px"; acEl.style.width=Math.max(rect.width,340)+"px";
}
function applyDb(row, r){
  lastApplied={ row, snap: acSnap || snapRow(row) };   // 记录带出前的整行数据，带出后按 Esc 可整行撤销
  row.querySelector('[data-f="model"]').value=r.model||"";
  row.querySelector('[data-f="code"]').value=r.code||"";
  row.querySelector('[data-f="unit"]').value=r.unit||"";
  row.querySelector('[data-f="perbox"]').value=r.perbox||"";
  // 避免物料库中客户与型号相同（常见导入错位）时把型号填进客户列
  row.querySelector('[data-f="customer"]').value=(r.customer && r.customer!==r.model)?r.customer:"";
  row.querySelector('[data-f="remark"]').value=r.remark||"";
  row.querySelector('[data-f="logistics"]').value=r.logistics||"";   // 物流随客户带出
  recalc(); mergeCustomerCells(); fitTextareas(); toast("已带出："+(r.model||r.code));
  // 一个型号发多个客户：带出后提示用户确认/修改
  const cs=customersForModel(r.model, r.code);
  if(cs.length>1){
    const inp=row.querySelector('[data-f="customer"]');
    toast("⚠ 型号 "+(r.model||r.code)+" 发往 "+cs.length+" 个客户，已带出「"+(r.customer||"")+"」；如需修改请在客户列直接调整");
    inp.classList.add("flash"); setTimeout(()=>inp.classList.remove("flash"), 2600);
  }
  // 自动聚焦到发货数量，避免光标跳到客户列
  setTimeout(()=>{ const q=row.querySelector('[data-f="qty"]'); if(q){ q.focus(); q.select(); } }, 10);
}
// 按「客户」从物料库反查物流（取第一个匹配且有物流值的记录）
function logisticsForCustomer(customer){
  const c=(customer||"").trim();
  if(!c || !DB.length) return "";
  for(const r of DB){
    if((r.customer||"").trim()===c){
      const lg=(r.logistics||"").trim();
      if(lg) return lg;
    }
  }
  return "";
}
// 客户列变更时自动带出物流（手填过则不覆盖）
function autoFillLogistics(tr){
  const lgInp=tr.querySelector('[data-f="logistics"]');
  if(!lgInp || lgInp.dataset.manual==="1") return;
  const cust=tr.querySelector('[data-f="customer"]')?.value||"";
  const lg=logisticsForCustomer(cust);
  if(lg) lgInp.value=lg;
}
function autoResizeTa(ta){ fitTextarea(ta); }
// 按型号（或物料编码）从物料库反查送达方集合：同型号可能发多个送达方
function customersForModelExactly(model, code){
  const mk=(model||"").trim().toLowerCase(), ck=(code||"").trim().toLowerCase();
  const set=[];
  DB.forEach(r=>{
    const m=(r.model||"").trim().toLowerCase(), c=(r.code||"").trim().toLowerCase();
    if((mk && m===mk) || (ck && c===ck)){
      const cu=(r.customer||"").trim();
      if(cu && !set.includes(cu)) set.push(cu);
    }
  });
  return set;
}
// 多送达方选择弹窗（队列化，避免多行同时弹多个）
let custModalQueue=[]; let custModalOpen=false;
function chooseCustomerModal(customers, model, cb){
  custModalQueue.push({customers, model, cb});
  if(!custModalOpen) processCustModalQueue();
}
function processCustModalQueue(){
  if(!custModalQueue.length){ custModalOpen=false; return; }
  custModalOpen=true;
  const {customers, model, cb}=custModalQueue.shift();
  const overlay=document.createElement("div"); overlay.className="modal-overlay";
  const box=document.createElement("div"); box.className="modal-box";
  const title=document.createElement("div"); title.className="modal-title";
  title.textContent=`型号「${model}」在物料库中发往 ${customers.length} 个送达方，请选择：`;
  box.appendChild(title);
  const hint=document.createElement("div");
  hint.style.cssText="font-size:12px;color:#6b7280;margin:-6px 0 10px;";
  hint.textContent="（本次选择自动用于本型号的所有行，一个型号只需确认一次）";
  box.appendChild(hint);
  const list=document.createElement("div"); list.className="modal-list";
  customers.forEach(cu=>{
    const b=document.createElement("button"); b.className="modal-opt"; b.textContent=cu;
    b.onclick=()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); cb(cu); processCustModalQueue(); };
    list.appendChild(b);
  });
  box.appendChild(list);
  const skip=document.createElement("button"); skip.className="modal-skip"; skip.textContent="跳过（不填送达方）";
  skip.onclick=()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); cb(null); processCustModalQueue(); };
  box.appendChild(skip);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
// 已确认过的「型号 → 送达方」记忆（本次页面会话内有效，一个型号只确认一次）
let modelCustChoice={};
// 等待选择的「型号 → 行」列表：同型号多行只弹一次，选定后统一应用到所有这些行
let pendingModelRows={};
function applyCustomerToRow(tr, cust){
  const custInp=tr.querySelector('[data-f="customer"]');
  if(!custInp) return;
  if(!custInp.value.trim()) custInp.value=cust;   // 已有手填值则保留
  autoFillLogistics(tr);
}
// 根据当前行的型号自动带出送达方：唯一则直接填入；多个则弹窗选择，同型号只确认一次
function autoFillCustomerByModel(tr){
  const modelInp=tr.querySelector('[data-f="model"]');
  const custInp=tr.querySelector('[data-f="customer"]');
  if(!modelInp||!custInp) return;
  const model=(modelInp.value||"").trim();
  if(!model) return;
  const code=(tr.querySelector('[data-f="code"]')?.value||"").trim();
  const custs=customersForModelExactly(model, code);
  if(!custs.length) return;
  if(custs.length===1){ applyCustomerToRow(tr, custs[0]); return; }
  const remembered=modelCustChoice[model];
  if(remembered && custs.includes(remembered)){ applyCustomerToRow(tr, remembered); return; }   // 已确认过 → 直接沿用，不再弹窗
  if(pendingModelRows[model]){ pendingModelRows[model].push(tr); return; }   // 正在等待本型号的选择 → 本行排队，不重复弹窗
  pendingModelRows[model]=[tr];
  chooseCustomerModal(custs, model, (chosen)=>{
    const rows=pendingModelRows[model]||[]; delete pendingModelRows[model];
    if(!chosen) return;                     // 跳过：不填也不记忆，下次仍会询问
    modelCustChoice[model]=chosen;          // 记住选择，后续同型号不再询问
    rows.forEach(r=>applyCustomerToRow(r, chosen));
    recalc(); mergeCustomerCells(); saveDraftNow();
  });
}
// 按型号/物料编码取物料库中所有候选记录（完全一致匹配）
function dbRecordsForModel(model, code){
  const mk=(model||"").trim().toLowerCase(), ck=(code||"").trim().toLowerCase();
  return DB.filter(r=>{
    const m=(r.model||"").trim().toLowerCase(), c=(r.code||"").trim().toLowerCase();
    return (mk && m===mk) || (ck && c===ck);
  });
}
// 从物料库带出「物料编码 + 单重 + 每箱件数」：
// 单重(kg/件) → 产品重量T；每箱件数 → 箱数 → 箱重T；客户吨位 = 产品重量T + 箱重T 由合并逻辑汇总
function fillDbFieldsForRow(tr){
  const modelInp=tr.querySelector('[data-f="model"]');
  const codeInp=tr.querySelector('[data-f="code"]');
  if(!modelInp) return;
  const model=(modelInp.value||"").trim();
  const code=(codeInp?.value||"").trim();
  if(!model && !code) return;
  const recs=dbRecordsForModel(model, code);
  if(!recs.length) return;
  // 多条候选：优先与当前行送达方一致的，其次本型号已记住的选择，最后首条
  const cust=(tr.querySelector('[data-f="customer"]')?.value||"").trim();
  let r=(cust && recs.find(x=>(x.customer||"").trim()===cust))||null;
  if(!r && model){ const rm=modelCustChoice[model]; if(rm) r=recs.find(x=>(x.customer||"").trim()===rm)||null; }
  if(!r) r=recs[0];
  if(codeInp && !(codeInp.value||"").trim()) codeInp.value=r.code||"";   // 物料编码：空才带出，不覆盖已填
  const setH=(f,v)=>{ const el=tr.querySelector(`[data-f="${f}"]`); if(el) el.value=(v==null?"":String(v)); };
  setH("unit", r.unit);        // 单重 kg/件
  setH("perbox", r.perbox);    // 每箱件数
}
function moveAC(d){
  if(!acEl) return;
  const items=acEl.querySelectorAll(".ac-item");
  acActive=(acActive+d+items.length)%items.length;
  items.forEach((it,i)=>it.classList.toggle("active", i===acActive));
  items[acActive].scrollIntoView({block:"nearest"});
}
document.addEventListener("click", e=>{ if(acEl && !acEl.contains(e.target)) closeAC(); });
document.addEventListener("keydown", e=>{
  if(!acEl) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); moveAC(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveAC(-1); }
  // 只有「用户打字唤出的待选」才允许 Enter/Tab 填入；单纯聚焦弹出的待选仅作提示，Tab 只关闭并跳格，绝不改数据
  else if(e.key==="Enter"){ if(acTyped && acList.length && acActive>=0){ e.preventDefault(); applyDb(acRow, acList[acActive]); } closeAC(); }
  else if(e.key==="Tab"){ if(acTyped && acList.length && acActive>=0){ e.preventDefault(); applyDb(acRow, acList[acActive]); } closeAC(); }
  else if(e.key==="Escape"){ const done=restoreRowSnap(); closeAC(); if(done) toast("已恢复原数据"); }
});
// Esc（无待选面板时）：把当前正在编辑的单元格恢复成聚焦时的值
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape" || acEl) return;
  const el=e.target;
  // 刚带出过数据（焦点已被移到数量列）：Esc 整行撤销到带出前
  if(lastApplied && lastApplied.row && el && el.closest && el.closest("tr")===lastApplied.row){
    const s=lastApplied.snap;
    const set=(f,v)=>{ const x=lastApplied.row.querySelector(`[data-f="${f}"]`); if(x) x.value=v||""; };
    set("model",s.model); set("code",s.code); set("unit",s.unit); set("perbox",s.perbox); set("customer",s.customer); set("remark",s.remark); set("logistics",s.logistics);
    lastApplied=null;
    recalc(); mergeCustomerCells(); fitTextareas(); saveDraftNow();
    toast("已恢复原数据");
    return;
  }
  if(!el || !el.dataset || el.dataset.orig===undefined) return;
  el.value=el.dataset.orig; delete el.dataset.orig;
  recalc(); mergeCustomerCells(); fitTextareas(); saveDraftNow();
  el.blur(); toast("已恢复原数据");
});

// ===================== 发货计划单 =====================
function todayStr(){ const d=new Date(); d.setDate(d.getDate()+1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function realTodayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
$("shipDate").value=todayStr();
function genPlanNo(){ const d=$("shipDate").value||todayStr(); const p=s=>String(s).padStart(2,"0"); const ymd=d.split("-"); return "FH"+ymd[0]+p(+ymd[1])+p(+ymd[2])+"-"+String(Math.floor(Math.random()*9000)+1000); }
$("planNo").value=genPlanNo();

function addRow(data={}, refRow=null, beforeRow=null, skipRefresh=false){
  const tb=$("tbody"); const tr=document.createElement("tr"); const idx=tb.children.length+1;
  const _q=parseFloat(data.qty), _u=parseFloat(data.unit), _p=parseFloat(data.perbox);
  const boxVal=(data.box!==undefined&&data.box!==null&&data.box!=='/'&&String(data.box).trim()!=='')?data.box:((_q>0&&_p>0)?Math.ceil(_q/_p):'');
  // 产品重量T：默认按 数量×单重÷1000 自动；可手填（tonManual 标记）；无单重的历史行保留原 ton 值兜底
  const tonManual=(data.tonManual===true||data.tonManual==="1");
  const _tonFb=(data.ton&&data.ton!=='/'&&String(data.ton).trim()!=='')?String(data.ton).trim():'';
  const tonAuto=(_q>0&&_u>0)?(_q*_u/1000).toFixed(1):'';
  const tonVal=tonManual?_tonFb:(tonAuto||_tonFb);
  // 箱子重量T：始终按 箱数×0.07 自动；仅支持「删除 / 恢复」，不允许手填数字
  const _boxNum=(boxVal!==''&&!isNaN(parseFloat(boxVal)))?parseFloat(boxVal):0;
  const cwtDeleted=!!data.cwtDeleted;
  const cwtVal=cwtDeleted?'':(_boxNum>0?(_boxNum*0.07).toFixed(1):'');
  const cwtBtnHtml=cwtDeleted
    ? '<button type="button" class="cwt-toggle" title="点击恢复（按箱数重新计算）">↺</button>'
    : (cwtVal?'<button type="button" class="cwt-toggle" title="点击删除">×</button>':'');
  tr.innerHTML=`
    <td class="col-idx num-cell">${idx}</td>
    <td class="col-check"><input type="checkbox" class="row-check"></td>
    <td class="col-shipdate"><input type="date" data-f="shipdate" value="${esc(data.shipdate ?? $("shipDate").value)}" placeholder="/"></td>
    <td class="col-customer"><textarea data-f="customer" placeholder="/" rows="1">${esc(data.customer)}</textarea></td>
    <td><textarea data-f="model" placeholder="/" rows="1">${esc(data.model)}</textarea></td>
    <td><input data-f="qty" type="text" inputmode="decimal" value="${esc(data.qty)}" placeholder="/" title="支持算式：10*20、100/4、10*(20+5)，失焦自动算出结果"></td>
    <td class="col-shippt"><select data-f="shippt" title="发货点">${shipptOptions(data.shippt)}</select></td>
    <td class="col-delivery"><textarea data-f="delivery" placeholder="/" rows="1">${esc(data.delivery)}</textarea></td>

// ===================== 客户吨位：手动修改覆盖值 =====================
// 覆盖值按「客户|发货日期」存，全局生效；发布时打包进 rec.custTon，发货员端自动同步
const CT_KEY="shipping_custton_v1";
function loadCT(){ try{ return JSON.parse(localStorage.getItem(CT_KEY))||{}; }catch(e){ return {}; } }
function saveCT(o){
  try{ localStorage.setItem(CT_KEY, JSON.stringify(o)); }catch(e){}
  try{ if(window.CloudSync) CloudSync.autoPush(CT_KEY); }catch(e){}
}
function ctKeyOf(cust,date){ return String(cust==null?"":cust).trim()+"|"+String(date==null?"":date).trim(); }
// 返回手动覆盖值；没改过返回 null
function ctOverride(cust,date){
  const o=loadCT(), k=ctKeyOf(cust,date);
  if(o[k]===undefined||o[k]===null||String(o[k]).trim()==="") return null;
  const v=parseFloat(o[k]); return isNaN(v)?null:v;
}
// 提交一次修改（已在调用处做过校验与确认）
function commitSubTon(inp){
  const cust=inp.dataset.cust||"", date=inp.dataset.date||"";
  const old=inp.dataset.shown||"";
  const nv=String(inp.value).trim();
  const o=loadCT(), k=ctKeyOf(cust,date);
  if(nv==="") delete o[k];               // 清空 = 恢复自动合计
  else o[k]=parseFloat(nv);
  saveCT(o);
  if(typeof recalc==="function") recalc();
  if(typeof toast==="function") toast(nv===""?"已恢复自动合计 ✓":"客户吨位已修改 ✓");
}
// 绑定一个客户吨位输入框的交互：回车确认、Esc 放弃、右键撤回
function bindSubTonInput(inp){
  if(inp.dataset.bound==="1") return;
  inp.dataset.bound="1";
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); inp.blur(); }
    else if(e.key==="Escape"){ inp.value=inp.dataset.shown||""; inp.blur(); }
  });
  inp.addEventListener("change",()=>{
    const old=inp.dataset.shown||"";
    let nv=String(inp.value).trim();
    if(nv===old) return;                                  // 没改，忽略
    if(nv!=="" && !/^-?\d+(\.\d+)?$/.test(nv)){            // 非法输入
      alert("客户吨位只能填数字（可带小数点），请重新填写。");
      inp.value=old; return;
    }
    const cust=inp.dataset.cust||"";
    const newTxt=(nv===""?"（清空，恢复自动合计）":nv);
    const ok=confirm(
      "确认修改客户吨位？\n\n"+
      "客户："+cust+"\n"+
      "原值："+old+"\n"+
      "新值："+newTxt+"\n\n"+
      "说明：该客户同一发货日期的所有行会一起更新，并同步到导出、打印与发货员端。"
    );
    if(!ok){ inp.value=old; return; }
    commitSubTon(inp);
  });
  inp.addEventListener("contextmenu",e=>{
    const cust=inp.dataset.cust||"", date=inp.dataset.date||"";
    if(ctOverride(cust,date)===null) return;              // 没改过，不拦截右键
    e.preventDefault();
    if(confirm("撤回【"+cust+"】的客户吨位修改，恢复为系统自动合计？")){
      const o=loadCT(); delete o[ctKeyOf(cust,date)]; saveCT(o);
      if(typeof recalc==="function") recalc();
      if(typeof toast==="function") toast("已恢复自动合计 ✓");
    }
  });
}

// 「↺ 恢复」小按钮：把手填的客户吨位恢复为系统自动带出的值
function bindSubTonReset(btn, cust, date, autoTxt){

  // 按下时不要让输入框失焦（否则会先弹「修改确认」框，变成两次弹窗）

    if(!confirm(

      "当前值："+(inp?inp.dataset.shown:"")+"\n"+

    )) return;
    const o=loadCT(); delete o[ctKeyOf(cust,date)]; saveCT(o);

function sortRowsByDate(){   // 按发货日期升序重新排列数据行（客户吨位合并在 recalc 中重建）
  const tb=$("tbody");
  const rows=[...tb.children].filter(isDataRow);
  rows.sort((a,b)=>{
    const da=a.querySelector('[data-f="shipdate"]')?.value||"";
    const db=b.querySelector('[data-f="shipdate"]')?.value||"";
    return da<db?-1:(da>db?1:0);
  });

}
function fitTextarea(ta){
  if(!ta) return;
  ta.style.height="auto";
  const h=Math.max(26,ta.scrollHeight);
  ta.style.height=h+"px";
  // 合并单元格：同时给 td 设最小高度，让 rowspan 组随内容撑开
  const td=ta.closest("td");
  if(td && td.rowSpan>1) td.style.height=(h+4)+"px";
}
// 批量自适应高度：读写分离（先统一置 auto → 统一读 scrollHeight → 统一写回），
// 把 N 次「强制同步布局」压到 1~2 次，折叠展开后几百行也不卡
function fitTextareas(){
  const tas=[...$("tbody").querySelectorAll("textarea")];
  if(!tas.length) return;
  tas.forEach(ta=>{ if(ta.style.height!=="auto") ta.style.height="auto"; });
  const hs=tas.map(ta=>Math.max(26, ta.scrollHeight));
  tas.forEach((ta,i)=>{ const v=hs[i]+"px"; if(ta.style.height!==v) ta.style.height=v; });
  tas.forEach((ta,i)=>{ const td=ta.closest("td"); if(td && td.rowSpan>1){ const v=(hs[i]+4)+"px"; if(td.style.height!==v) td.style.height=v; } });
}
// —— 性能优化：输入时的全表刷新合批。打字会连续触发 recalc / 合并 / 折叠 / 高亮等多轮全表遍历，
//    用微任务队列合并成一次执行，重复调用只跑一遍。
function recalcLite(){ recalc(true); }   // 具名包装：便于合批调度器按引用去重
let _rq=0, _rjobs=null, _rqRAF=false;
function flushRefresh(){
  if(!_rq) return;
  if(typeof cancelAnimationFrame==="function" && _rqRAF) cancelAnimationFrame(_rq); else clearTimeout(_rq);
  _rq=0; _rqRAF=false;
  const j=_rjobs; _rjobs=null;
  if(j) j.forEach(f=>{ try{ f(); }catch(e){} });
}
function scheduleRefresh(){
  for(let i=0;i<arguments.length;i++){
    if(!_rjobs) _rjobs=new Set();
    _rjobs.add(arguments[i]);
  }
  if(_rq) return;
  if(typeof requestAnimationFrame==="function"){ _rqRAF=true; _rq=requestAnimationFrame(flushRefresh); }
  else { _rqRAF=false; _rq=setTimeout(flushRefresh, 16); }
}
// ===================== 误删撤回 + WPS 式单元格导航 =====================
let undoStack=[];
const EDITABLE_COLS=[3,4,5,6,7,8,9,10,12,14,15];   // 可编辑列的 nth-child 列号（跳过 #/✓/箱重T/客户吨位/操作；12=产品重量T 14=物流 15=物料编码）
function collectRowData(tr){
  const g=f=>{ const el=tr.querySelector(`[data-f="${f}"]`); return el?el.value:""; };
  const tonI=tr.querySelector('[data-f="ton"]'), boxI=tr.querySelector('[data-f="box"]');
  return {
    shipdate:g("shipdate"), customer:g("customer"), code:g("code"), model:g("model"),
    qty:g("qty"), shippt:g("shippt"), unit:g("unit"), perbox:g("perbox"),
    ton:tonI?tonI.value:"", tonManual:(tonI&&tonI.dataset.manual==="1"),
    delivery:g("delivery"), box:boxI?boxI.value:"", boxManual:(boxI&&boxI.dataset.manual==="1"),
    cwt:g("cwt"), cwtDeleted:(tr.querySelector('[data-f="cwt"]')?.dataset.deleted==="1"),
    remark:g("remark")
  };
}
function visibleRows(){ return [...$("tbody").children].filter(r=>!r.classList.contains("subtotal")&&!r.classList.contains("isolation-band")&&!r.classList.contains("date-fold-hidden")&&!r.classList.contains("filter-hidden")&&!r.classList.contains("date-fold-placeholder")); }
function allRows(){ return [...$("tbody").children].filter(r=>!r.classList.contains("subtotal")&&!r.classList.contains("isolation-band")&&!r.classList.contains("date-fold-placeholder")); }   // 全部数据行（含折叠隐藏），用于删除/撤回等结构性操作
function delRow(tr){
  if(!tr || !tr.parentNode) return;
  const list=allRows();
  const idx=list.indexOf(tr);
  if(idx<0) return;
  const model=tr.querySelector('[data-f="model"]')?.value?.trim()||"";
  const customer=tr.querySelector('[data-f="customer"]')?.value?.trim()||"";
  if(!confirm(`确认删除第 ${idx+1} 行${model?"（型号："+model+"）":""}？\n删除后可通过「撤回」按钮或 Ctrl+Z 恢复。`)) return;
  const data=collectRowData(tr);
  tr.remove();
  undoStack.push({rows:[data], atIndex:idx});
  if(undoStack.length>50) undoStack.shift();
  reindex(); recalc(); saveDraftNow(); updateCheckAll(); updateUndoBtn();
  toast("已删除 1 行，可点「撤回」恢复");
}
function undo(){
  const item=undoStack.pop();
  if(!item){ toast("没有可撤回的操作"); return; }
  const tb=$("tbody");
  const list=allRows();
  const ref=list[item.atIndex]||null;
  item.rows.forEach(d=>{ addRow(d, null, ref, true); });
  reindex(); recalc(); fitTextareas(); saveDraftNow(); updateCheckAll(); updateUndoBtn();
  toast("已撤回删除，恢复 "+item.rows.length+" 行");
}
function updateUndoBtn(){ const b=$("undoBtn"); if(b) b.disabled=undoStack.length===0; }
function findCell(tr, colNum){
  const td=tr.children[colNum-1];
  if(!td) return null;
  if(td.style.display==="none") return null;
  const el=td.querySelector("input,textarea");
  return el||null;
}
function navigateFrom(el, ci, dCol, dRow){
  const rows=visibleRows();
  const tr=el.closest("tr");
  const rIdx=rows.indexOf(tr);
  if(rIdx<0) return;
  let newCi=ci+dCol, newRi=rIdx+dRow;
  if(newRi<0||newRi>=rows.length) return;          // 行越界：不导航
  const targetRow=rows[newRi];
  let target=findCell(targetRow, EDITABLE_COLS[newCi]);
  if(!target){                                    // 目标列被合并隐藏：就近找同行可见单元格
    for(let off=1; off<EDITABLE_COLS.length; off++){
      const a=EDITABLE_COLS[newCi-off], b=EDITABLE_COLS[newCi+off];
      if(a){ const t=findCell(targetRow,a); if(t){ target=t; break; } }
      if(b){ const t=findCell(targetRow,b); if(t){ target=t; break; } }
    }
  }
  if(target){ target.focus(); try{ if(target.select) target.select(); }catch(_){} }
}
function onCellKey(e){
  if(!e.target || !e.target.closest) return;
  let dCol=0, dRow=0, handled=false;
  if(e.key==="ArrowUp"){ dRow=-1; handled=true; }
  else if(e.key==="ArrowDown"){ dRow=1; handled=true; }
  else if(e.key==="Enter"){ if(e.shiftKey) return; dRow=1; handled=true; }   // Shift+Enter 保留换行
  else if(e.key==="Tab"){ dCol=e.shiftKey?-1:1; handled=true; }
  else if(e.key==="ArrowLeft"){ dCol=-1; handled=true; }
  else if(e.key==="ArrowRight"){ dCol=1; handled=true; }
  if(!handled) return;
  if(acEl) return;                                // 自动补全打开时交给它处理
  e.preventDefault();
  const ci=EDITABLE_COLS.indexOf(e.target.closest("td").cellIndex+1);
  if(ci<0) return;
  navigateFrom(e.target, ci, dCol, dRow);
}
function unmergeRow(tr){
  // 取消单行的客户/时效要求/客户吨位合并
  ["col-customer","col-remark","col-subton"].forEach(cls=>{
    const c=tr.querySelector("."+cls);
    if(c){ c.style.display=""; c.rowSpan=1; c.classList.remove("merged-cell"); c.style.height=""; }
  });
}
let __merging = false;
function mergeCustomerCells(){
  if(__merging) return;          // 防止同步 input.value 触发 input 事件导致死循环
  __merging = true;
  try {
  // 按「客户+发货日期」分组，合并客户、时效要求、客户吨位合计三列；基于全部数据行合并
  const allRows=[...$("tbody").children].filter(isDataRow);
  // 1) 清除所有数据行的合并状态
  allRows.forEach(tr=>{
    tr.classList.remove("group-end");
    const R=rowRefs(tr);
    const c=R.cellCustomer;
    if(c){ c.style.display=""; c.rowSpan=1; c.classList.remove("merged-cell"); c.style.height=""; }
    const r=R.cellRemark;
    if(r){ r.style.display=""; r.rowSpan=1; r.classList.remove("merged-cell"); r.style.height=""; }
    const sub=R.cellSubton;
    if(sub){ sub.style.display=""; sub.rowSpan=1; sub.classList.remove("merged-cell"); sub.textContent=""; sub.style.height="";
      sub._key=null; sub._val=null; sub._ov=0; }   // 内容已清空，缓存标记必须一并失效，否则会误判「无变化」而不重建
  });
  // 2) 只合并当前可见的数据行（排除筛选隐藏 + 折叠隐藏），否则 rowSpan 会按隐藏行数撑出幽灵行，导致下方整表错位
  const rows=allRows.filter(tr=>!tr.classList.contains("filter-hidden")&&!tr.classList.contains("date-fold-hidden"));
  let i=0;
  while(i<rows.length){
    const first=rows[i];
    const Rf=rowRefs(first);
    const cust=(Rf.customer?.value||"").trim();
    const date=(Rf.shipdate?.value||"").trim();
    if(!cust){ i++; continue; }  // 空客户不合并
    const key=cust+"|"+date;
    let j=i+1;
    while(j<rows.length){
      const R2=rowRefs(rows[j]);
      const cust2=(R2.customer?.value||"").trim();
      const date2=(R2.shipdate?.value||"").trim();
      if(cust2+"|"+date2!==key) break;
      j++;
    }
    const len=j-i;
    // 3) 计算该组合计吨位（只要客户非空就显示合计，即使吨位为0）
    let subTon=0;
    for(let k=i;k<j;k++){ const Rk=rowRefs(rows[k]); subTon+=(parseFloat(Rk.ton?.value)||0)+(parseFloat(Rk.cwt?.value)||0); }
    const subCell=Rf.cellSubton;
    if(subCell){
      // 客户吨位可手动修改：有覆盖值用覆盖值，否则用自动合计
      const ov=ctOverride(cust,date);
      const shown=(ov!==null?ov:subTon).toFixed(1);
      const autoTxt=subTon.toFixed(1);
      // 值与上次完全一样则跳过 innerHTML 重建（全表重建 input + 绑事件是合并的大头）
      if(subCell._key===cust+"|"+date && subCell._val===shown && subCell._ov===(ov!==null?1:0)){
        subCell.classList.add("merged-cell");
        if(len>1) subCell.rowSpan=len;
        rows[j-1].classList.add("group-end");
        i=j; continue;
      }
      subCell._key=cust+"|"+date; subCell._val=shown; subCell._ov=(ov!==null?1:0);
      subCell.innerHTML='<span class="subton-wrap">'
        +'<input type="text" class="subton-in'+(ov!==null?' edited':'')+'" value="'+esc(shown)+'"'
        +' data-cust="'+esc(cust)+'" data-date="'+esc(date)+'" data-shown="'+esc(shown)+'" inputmode="decimal"'
        +' title="可直接修改，回车确认">'
        // 手填过才显示「↺ 恢复」小按钮，位置与样式同「箱子重量T」那一列
        +(ov!==null?'<button type="button" class="subton-reset" title="恢复自动带出（'+esc(autoTxt)+'）">↺</button>':'')
        +'</span>';
      bindSubTonInput(subCell.querySelector(".subton-in"));
      bindSubTonReset(subCell.querySelector(".subton-reset"), cust, date, autoTxt);
      subCell.classList.add("merged-cell");
    }
    if(len>1){
      const c=Rf.cellCustomer, r=Rf.cellRemark;
      if(c){ c.rowSpan=len; c.classList.add("merged-cell"); }
      // 时效要求列与客户列保持同组合并：同一客户+同一日期下自动合并，只显示首行时效要求
      if(r){ r.rowSpan=len; r.classList.add("merged-cell"); }
      if(subCell) subCell.rowSpan=len;
      for(let k=i+1;k<j;k++){
        const Rk2=rowRefs(rows[k]);
        const c2=Rk2.cellCustomer, r2=Rk2.cellRemark, s2=Rk2.cellSubton;
        if(c2){ c2.style.display="none"; c2.rowSpan=1; }
        if(r2){ r2.style.display="none"; r2.rowSpan=1; }
        if(s2){ s2.style.display="none"; s2.rowSpan=1; }
      }
    }
    rows[j-1].classList.add("group-end");
    i=j;
  }
  fitTextareas();
  } finally { __merging = false; }
}

const FOLD_STATE_KEY="shipping_fold_dates_v1";
const SHOW_FOLDED_KEY="shipping_show_folded_v1";
function getFoldState(){ try{ return JSON.parse(localStorage.getItem(FOLD_STATE_KEY))||{}; }catch(e){ return {}; } }
function setFoldState(date,collapsed){ const s=getFoldState(); s[date]=collapsed?1:0; localStorage.setItem(FOLD_STATE_KEY,JSON.stringify(s)); }
function getShowFolded(){ try{ return localStorage.getItem(SHOW_FOLDED_KEY)==="1"; }catch(e){ return false; } }
function setShowFolded(show){ try{ localStorage.setItem(SHOW_FOLDED_KEY, show?"1":"0"); }catch(e){} }
// 折叠隐藏某行时同步取消其勾选，确保折叠日期不会被全选/发布带入
function hideFoldedRow(tr){ tr.classList.add("date-fold-hidden"); const b=tr.querySelector(".row-check"); if(b) b.checked=false; }

function foldByDate(){
  // 清理旧的折叠标记与按钮，并移除上一次插入的隔离带（确保按最新数据重新计算位置）
  [...$("tbody").querySelectorAll("tr.isolation-band")].forEach(r=>r.remove());
  [...$("tbody").children].forEach(tr=>{
    if(!isDataRow(tr)) return;
    tr.classList.remove("date-fold-hidden","has-folded","has-expanded");
    const sd=tr.querySelector(".col-shipdate");
    if(sd){
      sd.classList.remove("date-expanded","date-collapsed");
      const btn=sd.querySelector(".fold-btn");
      if(btn) btn.remove();
      sd.style.display=""; sd.rowSpan=1;
    }
  });

  const rows=[...$("tbody").children];
  const groups=[];
  let cur=null;
  rows.forEach(tr=>{
    if(!isDataRow(tr)){ if(cur) cur.rows.push(tr); return; }
    const d=tr.querySelector('[data-f="shipdate"]')?.value||"";
    if(!cur||cur.date!==d){ cur={date:d, rows:[tr]}; groups.push(cur); }
    else cur.rows.push(tr);
  });

  const today=realTodayStr();
  const state=getFoldState();
  const showFolded=getShowFolded();
  const foldedDates=[];

  groups.forEach(g=>{
    if(!g.rows.length) return;
    const first=g.rows[0];
    const sd=first.querySelector(".col-shipdate");
    if(!sd) return;

    let collapsed=state[g.date];
    if(collapsed===undefined) collapsed=!(g.date>today);  // 当天及之前的日期默认折叠，明天及以后默认展开
    else collapsed=!!collapsed;

    const btn=document.createElement("button");
    btn.type="button"; btn.className="fold-btn";
    btn.textContent=collapsed?"▶":"▼"; btn.title=collapsed?"展开":"折叠";
    btn.onclick=(e)=>{ e.stopPropagation(); toggleDateFold(g.date); };
    sd.insertBefore(btn, sd.firstChild);
    sd.classList.add(collapsed?"date-collapsed":"date-expanded");
    first.classList.add(collapsed?"has-folded":"has-expanded");

    if(collapsed){
      foldedDates.push(g.date);
      if(showFolded){
        // 保留第一行作为折叠控制，方便单独展开
        for(let k=1;k<g.rows.length;k++) hideFoldedRow(g.rows[k]);
      }else{
        // 截图模式：折叠的日期整组隐藏，入口改到「发货明细」标题处
        g.rows.forEach(tr=>hideFoldedRow(tr));
      }
    }
  });

  // 在「发货明细」标题右侧渲染折叠日期入口
  const fd=$("foldedDates");
  fd.innerHTML="";
  if(!showFolded && foldedDates.length){
    const past=foldedDates.filter(d=>d<=today);
    const future=foldedDates.filter(d=>d>today);
    if(past.length){
      const b=document.createElement("button");
      b.type="button"; b.className="folded-date-btn";
      b.textContent="▶ 当天之前已折叠";
      b.title="展开 "+past.join("、");
      b.onclick=()=>{ past.forEach(d=>setFoldState(d,0)); foldByDate(); fitTextareas(); };
      fd.appendChild(b);
    }
    if(future.length){
      const b=document.createElement("button");
      b.type="button"; b.className="folded-date-btn";
      b.textContent="▶ 当天之后已折叠";
      b.title="展开 "+future.join("、");
      b.onclick=()=>{ future.forEach(d=>setFoldState(d,0)); foldByDate(); fitTextareas(); };
      fd.appendChild(b);
    }
  }

  // 3) 先合并所有数据行，再取消被折叠隐藏行的合并，避免 rowSpan 撑出空白
  mergeCustomerCells();
  groups.forEach(g=>{
    if(!g.rows.length) return;
    let collapsed=state[g.date];
    if(collapsed===undefined) collapsed=!(g.date>today);  // 当天及之前的日期默认折叠，明天及以后默认展开
    else collapsed=!!collapsed;
    if(collapsed){
      if(showFolded){
        // 保留第一行作为折叠控制；只取消后续隐藏行的合并
        for(let k=1;k<g.rows.length;k++) unmergeRow(g.rows[k]);
      }else{
        // 整组隐藏：取消该组所有行的合并
        g.rows.forEach(tr=>unmergeRow(tr));
      }
    }
  });

  // 行数只统计可见行（同时排除筛选隐藏）
  const visible=[...$("tbody").children].filter(tr=>!tr.classList.contains("date-fold-hidden")&&!tr.classList.contains("filter-hidden")&&!tr.classList.contains("isolation-band")).length;
  $("rowCount").textContent=visible+" 行";
  renumberVisible();  // 折叠状态变化后重新编号，保证可见行序号始终连续
  updateCheckAll();   // 折叠会取消隐藏行勾选，刷新表头全选框状态
  updatePastButton(); // 同步「当天之前」按钮文字
  markRowStates();   // 刷新滞后/之后计划高亮
  renderIsolationBand();   // 在「明日」计划之后插入视觉隔离带（隔离其后计划）
}

function toggleDateFold(date){
  flushRefresh();
  const state=getFoldState();
  setFoldState(date, state[date]?0:1);
  foldByDate();
  fitTextareas();
}

// 一键折叠/展开「当天之前」所有日期的分组
function getPastDates(){
  const today=realTodayStr();
  const set=new Set();
  [...$("tbody").children].forEach(tr=>{
    if(!isDataRow(tr)) return;
    const d=tr.querySelector('[data-f="shipdate"]')?.value||"";
    if(d) set.add(d);
  });
  return [...set].filter(d=>d<=today).sort();
}
function allPastCollapsed(){
  const dates=getPastDates();
  if(!dates.length) return true;
  const state=getFoldState();
  const today=realTodayStr();
  return dates.every(d=>{ const c=state[d]===undefined?!(d>today):!!state[d]; return !!c; });
}
function togglePast(){
  const collapse=!allPastCollapsed();   // 还有展开的就全部折叠，已全折叠则全部展开
  getPastDates().forEach(d=>setFoldState(d, collapse?1:0));
  foldByDate(); fitTextareas();
}
function updatePastButton(){
  const btn=$("togglePast"); if(!btn) return;
  const collapsed=allPastCollapsed();
  btn.textContent= collapsed ? "展开当天前" : "折叠当天前";
  btn.title= collapsed ? "一键展开当天之前的计划" : "一键折叠当天之前的计划";
}

// ===================== 筛选（客户 / 型号 / 发货日期） =====================
function isFilterActive(){ return !!((($("filterCustomer").value||"").trim()) || (($("filterModel").value||"").trim()) || ($("filterDate").value||"")); }
// 数据行判定：排除「客户小计」与「隔离区分隔带」这类非数据行（避免被统计/导出/合并当成普通计划行）
function isDataRow(tr){ return tr && !tr.classList.contains("subtotal") && !tr.classList.contains("isolation-band"); }
// 在「明日」计划组之后插入视觉隔离带，隔离其后（后天及以后）的计划；数据不变，纯展示
function renderIsolationBand(){
  [...$("tbody").querySelectorAll("tr.isolation-band")].forEach(r=>r.remove());   // 幂等：先清后插
  if(isFilterActive()) return;                                                   // 筛选状态下不显示分隔带
  const tomorrow=todayStr();                                                     // 系统里 todayStr()=日历明天=用户的“明日”
  const rows=[...$("tbody").children].filter(isDataRow);
  let lastTomorrow=null, hasAfter=false;
  rows.forEach(tr=>{
    const d=tr.querySelector('[data-f="shipdate"]')?.value||"";
    if(d===tomorrow) lastTomorrow=tr;
    else if(d>tomorrow) hasAfter=true;
  });
  if(!lastTomorrow || !hasAfter) return;                                         // 无“明日”组，或明日之后无计划则不显示
  // 明日组本身被折叠/筛选隐藏时，隔离带会悬空显示，此时不渲染
  if(lastTomorrow.classList.contains("date-fold-hidden")||lastTomorrow.classList.contains("filter-hidden")) return;
  const tr=document.createElement("tr"); tr.className="isolation-band";
  const td=document.createElement("td"); td.colSpan=14; td.className="isolation-cell";
  td.innerHTML='<span class="isolation-label">隔离区 · 明日之后</span>';
  tr.appendChild(td); lastTomorrow.after(tr);
}
function applyFilter(){
  const cust=($("filterCustomer").value||"").trim().toLowerCase();
  const model=($("filterModel").value||"").trim().toLowerCase();
  const date=$("filterDate").value||"";
  const active=!!(cust||model||date);
  let shown=0, total=0;
  [...$("tbody").children].forEach(tr=>{
    if(!isDataRow(tr)) return;
    total++;
    const trCust=(tr.querySelector('[data-f="customer"]')?.value||"").trim().toLowerCase();
    const trModel=(tr.querySelector('[data-f="model"]')?.value||"").trim().toLowerCase();
    const trDate=tr.querySelector('[data-f="shipdate"]')?.value||"";
    const match=(!cust || trCust.includes(cust)) &&
                (!model || trModel.includes(model)) &&
                (!date || trDate===date);
    if(match){
      // 匹配即显示：同时清除筛选隐藏与折叠隐藏，让被折叠/隐藏的计划也能被筛出来
      tr.classList.remove("filter-hidden","date-fold-hidden");
      shown++;
    }else{
      tr.classList.add("filter-hidden");
    }
  });
  const hint=$("filterCount");
  if(hint) hint.textContent=active?`显示 ${shown}/${total} 行`:"";
  recalc();                 // 重新计算吨位/箱数；recalc 内部按筛选状态决定：无筛选→恢复折叠，有筛选→保持穿透显示并刷新合并/编号
  updateCheckAll();
  const visible=[...$("tbody").children].filter(tr=>!tr.classList.contains("date-fold-hidden")&&!tr.classList.contains("filter-hidden")&&!tr.classList.contains("isolation-band")).length;
  $("rowCount").textContent=visible+" 行";
  renderIsolationBand();   // 筛选结束后刷新隔离带（筛选态下自动隐藏）
}
function clearFilter(){
  $("filterCustomer").value="";
  $("filterModel").value="";
  $("filterDate").value="";
  applyFilter();
}

function evalQtyExpr(v){   // 发货数量支持算式：10*20 → 200；支持 + - * / × ÷ 和括号
  const s=String(v==null?"":v).trim().replace(/×/g,"*").replace(/÷/g,"/");
  if(s==="") return "";
  if(/^[0-9]+(\.[0-9]+)?$/.test(s)) return s;                 // 纯数字原样返回
  if(!/^[0-9+\-*/().\s]+$/.test(s)) return null;              // 含非法字符 → 不处理
  try{
    const r=Function('"use strict";return ('+s+')')();
    if(typeof r!=="number"||!isFinite(r)) return null;
    return Number.isInteger(r)?String(r):String(Math.round(r*100)/100);
  }catch(e){ return null; }                                   // 残缺算式（如 10*）→ 不处理
}
// 快路径：绝大多数数量是纯数字，直接 parseFloat，避免每行都 new Function 编译算式（全表重算的主要开销）
const PURE_NUM=/^\d+(\.\d+)?$/;
function qtyNum(v){          // 取数量数值：能算就按算式算，算不了退回 parseFloat
  if(v==null) return 0;
  const s=String(v).trim();
  if(PURE_NUM.test(s)) return parseFloat(s);
  const e=evalQtyExpr(s);
  return parseFloat(e!==null&&e!==""?e:s)||0;
}
// 只在值真的变化时才写 DOM（程序化赋值虽不触发事件，但仍会让浏览器重排，全表逐字写入是卡顿源之一）
function setValIfChanged(el, v){ if(el && el.value!==v) el.value=v; }
// 行内元素引用缓存：recalc / 合并 每次都要全表逐行 querySelector，行多时开销巨大。
// 行结构创建后不再变动，缓存一次即可；节点被替换（isConnected=false）时自动重建。
function rowRefs(tr){
  let c=tr._refs;
  if(c && c.qty && c.qty.isConnected) return c;
  c = tr._refs = {
    shipdate:tr.querySelector('[data-f="shipdate"]'),
    customer:tr.querySelector('[data-f="customer"]'),
    code:tr.querySelector('[data-f="code"]'),
    model:tr.querySelector('[data-f="model"]'),
    qty:tr.querySelector('[data-f="qty"]'),
    unit:tr.querySelector('[data-f="unit"]'),
    perbox:tr.querySelector('[data-f="perbox"]'),
    ton:tr.querySelector('[data-f="ton"]'),
    box:tr.querySelector('[data-f="box"]'),
    cwt:tr.querySelector('[data-f="cwt"]'),
    remark:tr.querySelector('[data-f="remark"]'),
    tonReset:tr.querySelector(".ton-reset"),
    cwtShow:tr.querySelector(".cwt-val"),
    cwtTog:tr.querySelector(".cwt-toggle"),
    cellCustomer:tr.querySelector(".col-customer"),
    cellRemark:tr.querySelector(".col-remark"),
    cellSubton:tr.querySelector(".col-subton"),
    rowCheck:tr.querySelector(".row-check")
  };
  return c;
}
// skipFold=true：本次不重跑折叠（改数量/箱数/吨位不会改变日期分组，省掉一整轮全表折叠+高亮+隔离带重排）
function recalc(skipFold){
  let sq=0,st=0,sb=0,scwt=0;
  [...$("tbody").children].forEach(tr=>{
    if(!isDataRow(tr)) return;   // 跳过客户小计行 / 隔离带，避免非数据行读取 data-f 字段报错
    const R=rowRefs(tr);
    const qty=qtyNum(R.qty.value);
    const unit=parseFloat(R.unit.value)||0;
    const perbox=parseFloat(R.perbox.value)||0;
    // 产品重量T：未手填时按 数量×单重/1000 自动计算；手填(manual)保留；无单重保留既有值兜底
    const tonInput=R.ton;
    const autoTon=(qty>0&&unit>0)?qty*unit/1000:0;
    if(tonInput.dataset.manual!=="1") setValIfChanged(tonInput, autoTon>0?autoTon.toFixed(1):"");
    const tonReset=R.tonReset;
    if(tonReset){
      const m=tonInput.dataset.manual==="1";
      const d=m?"":"none";
      if(tonReset.style.display!==d) tonReset.style.display=d;
      tonInput.classList.toggle("edited", m);
    }
    const ton=parseFloat(tonInput.value)||0;
    // 箱数：自动带出（数量÷每箱件数），除非手填
    const boxInput=R.box;
    const autoBox=(qty>0&&perbox>0)?Math.ceil(qty/perbox):0;
    if(boxInput.dataset.manual!=="1") setValIfChanged(boxInput, autoBox>0?autoBox:"");
    const box=parseFloat(boxInput.value)||0;
    // 箱子重量T：按 箱数×0.07 自动；保留 2 位小数；被「删除」的行保持空，不自动带出
    const cwtInput=R.cwt;
    const autoCwt=box>0?(box*0.07).toFixed(2):"";
    if(cwtInput.dataset.deleted==="1") setValIfChanged(cwtInput, "");   // 已删除：保持空
    else setValIfChanged(cwtInput, autoCwt);                            // 未删除：按箱数自动计算
    const cwtShow=R.cwtShow;
    if(cwtShow){ const t=cwtInput.value||""; if(cwtShow.textContent!==t) cwtShow.textContent=t; }
    const cwtTog=R.cwtTog;
    if(cwtTog){
      let d="", txt="", title="";
      if(cwtInput.dataset.deleted==="1"){ d=""; txt="↺"; title="点击恢复（按箱数重新计算）"; }
      else if(cwtInput.value){ d=""; txt="×"; title="点击删除"; }
      else { d="none"; }   // 无箱数、也无值：不显示按钮
      if(cwtTog.style.display!==d) cwtTog.style.display=d;
      if(d!=="none"){
        if(cwtTog.textContent!==txt) cwtTog.textContent=txt;
        if(cwtTog.title!==title) cwtTog.title=title;
      }
    }
    const cwt=parseFloat(cwtInput.value)||0;
    // 表尾合计只统计当前可见行（被折叠或筛选隐藏的行不计入）
    if(!tr.classList.contains("date-fold-hidden") && !tr.classList.contains("filter-hidden")){
      sq+=qty; st+=ton; sb+=box; scwt+=cwt;
    }
  });
  $("sumQty").textContent=sq;
  $("sumTon").textContent=st.toFixed(1);
  $("sumBox").textContent=(sb>0)?sb:"/";
  $("sumCwt").textContent=scwt>0?scwt.toFixed(1):"/";
  // 有筛选时不再重新折叠（否则会把刚穿透显示的折叠行又折回去）；改为保持穿透显示并刷新合并/编号
  if(skipFold && !isFilterActive()){ mergeCustomerCells(); }
  else if(!isFilterActive()){ foldByDate(); }
  else { renumberVisible(); mergeCustomerCells(); markRowStates(); }
  // 客户吨位合计：只累加当前可见的分组合计单元格（合并后每个组只显示一个）
  let sst=0, subCells=0;
  $("tbl").querySelectorAll("tbody .col-subton").forEach(td=>{
    if(td.style.display==="none") return;
    if(td.closest("tr.date-fold-hidden") || td.closest("tr.filter-hidden")) return;
    subCells++;

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
// 复制到剪贴板（优先 navigator.clipboard，老环境/本地文件回退到 execCommand）
function copyToClipboard(text, btn){
  const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent="已复制"; btn.classList.add("copied"); toast("已复制 ✓"); setTimeout(()=>{ btn.textContent=o; btn.classList.remove("copied"); },1200); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); cb&&cb(); }catch(e){}
  document.body.removeChild(ta);
}

// 内容指纹：把勾选行的关键字段归一化后排序拼接再哈希，用于发布前与已发布记录比对（与行顺序无关）
function fingerprintRows(rows){
  const norm = r => [r.shipdate,r.customer,r.code,r.model,r.qty,r.shippt,r.ton,r.box,r.cwt,r.delivery,r.remark,r.logistics]
    .map(v=>(v==null?"":String(v)).trim()).join("");
  const parts = rows.map(norm).sort();
  const s = parts.join("|");
  let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }
  return h.toString(36);
}
function publish(){
  flushRefresh();   // 先把待处理的全表刷新跑完，确保发布读到的是最新值
  const allTrs=[...$("tbody").children].filter(isDataRow);
  if(!allTrs.length){ toast("请先添加发货明细"); return; }
  // 发布前必须勾选确认：仅发布已勾选的行
  const checkedTrs=allTrs.filter(tr=>tr.querySelector(".row-check")?.checked);
  if(!checkedTrs.length){ toast("发布前请先勾选要发布的行（✓ 列）"); return; }

  // ===== 必填项校验：送达方 / 时效要求 / 客户吨位 必须填写才能发布 =====
  // 计算各「送达方|发货日期」组的客户吨位（与表格显示一致：手动覆盖值优先，否则自动合计 产品重量T+箱重T）
  const subMap={};
  const visRows=[...$("tbody").children].filter(isDataRow)
    .filter(tr=>!tr.classList.contains("filter-hidden")&&!tr.classList.contains("date-fold-hidden"));
  (function(){
    let i=0;
    while(i<visRows.length){
      const first=visRows[i];
      const cust=(first.querySelector('[data-f="customer"]')?.value||"").trim();
      const date=(first.querySelector('[data-f="shipdate"]')?.value||"").trim();
      if(!cust){ i++; continue; }
      const key=cust+"|"+date;
      let j=i+1;
      while(j<visRows.length){
        const c2=(visRows[j].querySelector('[data-f="customer"]')?.value||"").trim();
        const d2=(visRows[j].querySelector('[data-f="shipdate"]')?.value||"").trim();
        if(c2+"|"+d2!==key) break;
        j++;
      }
      let subTon=0;
      for(let k=i;k<j;k++){ subTon+=(parseFloat(visRows[k].querySelector('[data-f="ton"]')?.value)||0)+(parseFloat(visRows[k].querySelector('[data-f="cwt"]')?.value)||0); }
      const ov=ctOverride(cust,date);
      subMap[key]=ov!==null?ov:subTon;
      i=j;
    }
  })();
  // 兼容合并单元格：按「送达方|发货日期」取组内首个非空时效要求作为该组合规值
  const remarkMap={};
  (function(){
    let i=0;
    while(i<visRows.length){
      const first=visRows[i];
      const cust=(first.querySelector('[data-f="customer"]')?.value||"").trim();
      const date=(first.querySelector('[data-f="shipdate"]')?.value||"").trim();
      if(!cust){ i++; continue; }
      const key=cust+"|"+date;
      let j=i+1;
      while(j<visRows.length){
        const c2=(visRows[j].querySelector('[data-f="customer"]')?.value||"").trim();
        const d2=(visRows[j].querySelector('[data-f="shipdate"]')?.value||"").trim();
        if(c2+"|"+d2!==key) break;
        j++;
      }
      let remark="";
      for(let k=i;k<j;k++){
        const v=(visRows[k].querySelector('[data-f="remark"]')?.value||"").trim();
        if(v && v!=="/"){ remark=v; break; }
      }
      remarkMap[key]=remark;
      i=j;
    }
  })();

  const miss=[];
  checkedTrs.forEach((tr,idx)=>{
    const cust=(tr.querySelector('[data-f="customer"]')?.value||"").trim();
    const shipdate=(tr.querySelector('[data-f="shipdate"]')?.value||"").trim();
    const key=cust+"|"+shipdate;
    // 优先读当前行 input；若为空则取合并组的首个非空值
    let remark=(tr.querySelector('[data-f="remark"]')?.value||"").trim();
    if(!remark || remark==="/") remark=remarkMap[key]||"";
    const msgs=[];
    if(!cust||cust==="/") msgs.push("送达方未填");
    if(!remark||remark==="/") msgs.push("时效要求未填");
    const st=subMap[key];
    if(st===undefined||st===""||isNaN(parseFloat(st))||parseFloat(st)<=0) msgs.push("客户吨位为空或为0（请填产品重量T/箱重T，或手动填客户吨位）");
    if(msgs.length) miss.push("第"+(idx+1)+"行【"+(cust||"空")+"】："+msgs.join("、"));
  });
  if(miss.length){
    toast("⚠ 必填项未填，无法发布");
    alert("以下必填项未填写，请补全后再发布：\n\n"+miss.slice(0,15).join("\n")+(miss.length>15?"\n…等共 "+miss.length+" 处":""));
    return;
  }

  const f=v=>{ v=(v==null?"":String(v).trim()); return v===""?"/":v; };
  const rows=checkedTrs.map(tr=>{
    const cust=f(tr.querySelector('[data-f="customer"]').value);
    const shipdate=f(tr.querySelector('[data-f="shipdate"]').value);
    const key=(cust==="/"?"":cust)+"|"+(shipdate==="/"?"":shipdate);
    let remark=f(tr.querySelector('[data-f="remark"]').value);
    if(remark==="/") remark=remarkMap[key]||"/";
    return {
      shipdate,
      customer:cust,
      code:f(tr.querySelector('[data-f="code"]').value),
      model:f(tr.querySelector('[data-f="model"]').value),
      qty:f(tr.querySelector('[data-f="qty"]').value),
      shippt:f(tr.querySelector('[data-f="shippt"]').value),
      perbox:f(tr.querySelector('[data-f="perbox"]').value),
      ton:f(tr.querySelector('[data-f="ton"]').value),
      box:f(tr.querySelector('[data-f="box"]').value),
      cwt:f(tr.querySelector('[data-f="cwt"]').value),
      delivery:f(tr.querySelector('[data-f="delivery"]').value),
      remark,
      logistics:f(tr.querySelector('[data-f="logistics"]')?.value)
    };
  });
  // ===== 内容防重：与已发布记录比对，完全相同则提醒确认 =====
  const fp = fingerprintRows(rows);
  const dup = loadRec().filter(r=>r.fingerprint && r.fingerprint===fp);
  if(dup.length){
    const nos = dup.map(r=>r.no).join("、");
    if(!confirm("⚠ 这批内容与已发布的计划单（"+nos+"）完全相同。\n\n确定要再次发布吗？\n（如为修改后重发，请先改动内容或换一个单号）")) return;
  }
  if(rows.some(r=>!r.model || !r.qty) && !confirm("存在「型号」或「数量」为空行，仍要发布？")) return;
  if(!confirm("确认发布已勾选的 "+rows.length+" 行？")) return;

  // 把本次发布涉及的「客户吨位」手动修改打包进记录，发货员端自动同步显示
  const _ct=loadCT(), _raw=v=>String(v==null||v==="/"?"":v).trim(), custTon={};
  rows.forEach(r=>{ const k=ctKeyOf(_raw(r.customer),_raw(r.shipdate)); if(_ct[k]!==undefined) custTon[k]=_ct[k]; });

  // 汇总：只统计本次实际发布的行（不再用全局合计，避免把未勾选/其它计划也算进来）
  const _n = v => parseFloat(String(v==null||v==="/"?"":v).trim())||0;
  const sumQty = rows.reduce((a,r)=>a+_n(r.qty), 0);
  const sumTon = rows.reduce((a,r)=>a+_n(r.ton), 0);
  const sumBox = rows.reduce((a,r)=>a+_n(r.box), 0);
  const sumSubTon = rows.reduce((a,r)=>a+_n(r.ton)+_n(r.cwt), 0);
  // 存档文本数据
  const rec={id:Date.now(),date:$("shipDate").value,no:$("planNo").value,
    planner:($("planner")?.value||"").trim(),
    publishedAt:new Date().toLocaleString("zh-CN"),rows,
    sumQty:sumQty||"0",sumTon:sumTon.toFixed(1),sumBox:sumBox>0?sumBox:"/",
    sumSubTon:sumSubTon>0?sumSubTon.toFixed(1):"0.0",custTon,fingerprint:fp};
  saveRec(rec); renderRecords();
  toast("已发布 ✓（单号 "+(rec.planner?rec.no+" · "+rec.planner:rec.no)+" · 共 "+rows.length+" 行）· 已同步到发货员链接");
  // 发布后自动取消勾选，避免顺手重复发布同一批
  [...$("tbody").querySelectorAll(".row-check")].forEach(b=>b.checked=false);
  updateCheckAll();
  $("planNo").value=genPlanNo(); syncDocHead();
  saveDraftNow();
  try{ if(window.__clientBackup) window.__clientBackup(); }catch(e){}
}

function recShipDate(rec){
  const rows = rec.rows || [];
  for (const r of rows){ if (r && r.shipdate && String(r.shipdate).trim()) return String(r.shipdate).trim(); }
  return rec.date || "";
}
// 发布记录按发货日期分类：今天之前 / 今天 / 明天 / 明天之后（用 realTodayStr 真今天，todayStr() 是真明天）
function classifyRec(shipdate){
  const today = realTodayStr();
  const tmr   = todayStr();
  const s = String(shipdate == null ? "" : shipdate).trim();
  if (!s) return "future";
  if (s < today)        return "past";
  if (s === today)      return "today";
  if (s === tmr)        return "tomorrow";
  return "future";
}

      const noText=esc(rec.no||"")+(rec.planner?` · ${esc(rec.planner)}`:"");
      card.innerHTML=`
        <div class="info"><b>${noText}</b><br>日期：${esc(rec.date||"")}${rec.maker?' ｜ 制单：'+esc(rec.maker):''}<br>
          共 ${rec.rows.length} 行 ｜ 数量 ${rec.sumQty} ｜ ${rec.sumTon}t ｜ 客户吨位 ${rec.sumSubTon||"/"}t ｜ ${rec.sumBox}箱<br>发布：${esc(rec.publishedAt||"")}</div>
        <div class="acts">
          <button class="btn btn-line" data-act="csv">导出CSV</button>
          <button class="btn btn-danger" data-act="del">删除</button>
        </div>`;
      card.querySelector('[data-act="csv"]').onclick=()=>exportRowsCsv(rec.rows, rec.no);
      card.querySelector('[data-act="del"]').onclick=()=>{
        askDeletePwd(rec, ()=>{
          localStorage.setItem(LS_REC, JSON.stringify(loadRec().filter(r=>r.id!==rec.id)));
          renderRecords(); if(window.CloudSync) CloudSync.autoPush(LS_REC);
          toast("已删除发布记录 "+(rec.no||""));
        });
      };
      body.appendChild(card);
    });
    sec.querySelector("[data-fold]").onclick=()=>{
      sec.classList.toggle("collapsed");
      sec.querySelector("[data-fold]").textContent=sec.classList.contains("collapsed")?"▸ 展开":"▾ 折叠";
    };
    box.appendChild(sec);
  });
  updateKPIs();
}

// ===================== 导出 =====================
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function rowsToCsv(rows){ 
  const head=["发货日期","送达方","型号","发货数量","发货点","箱重T","产品重量T","交货单","箱数","时效要求","物流"];
  const lines=[head.join(",")];
  rows.forEach(r=>lines.push([r.shipdate,r.customer,r.model,r.qty,r.shippt,r.cwt,r.ton,r.delivery,r.box,r.remark,r.logistics].map(csvCell).join(",")));
  return "﻿"+lines.join("\n");
}
function exportRowsCsv(rows, name){
  const blob=new Blob([rowsToCsv(rows)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`发货计划_${name}.csv`; a.click();
}

// ===================== 数据备份（本地文件 ↔ 网站互导） =====================
function exportBackup(){
  const data={};
  BACKUP_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!=null){ try{ data[k]=JSON.parse(v); }catch(e){ data[k]=v; } } });
  if(!Object.keys(data).length){ toast("没有可导出的数据"); return; }
  const blob=new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url;
  const d=$("shipDate").value||todayStr();
  a.download="发货计划备份_"+d+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("备份已导出（含草稿、发布记录、折叠状态）");
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      BACKUP_KEYS.forEach(k=>{ if(k in data){ const v=data[k]; localStorage.setItem(k, typeof v==="string"?v:JSON.stringify(v)); } });
      if(window.CloudSync){ BACKUP_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } }); }
      toast("备份已导入，正在刷新…");
      setTimeout(()=>location.reload(),700);
    }catch(e){ toast("备份文件解析失败："+e.message); }
  };
  reader.readAsText(file);
}
$("exportBackup").onclick=exportBackup;
$("undoBtn").onclick=undo;
updateUndoBtn();
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z")){
    const ae=document.activeElement;
    if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")) return;   // 让浏览器处理文本内撤销
    e.preventDefault(); undo();
  }

// ===================== 整行复制粘贴（从 Excel 等复制一行，粘贴到表格自动按列填入） =====================
// 展示列顺序（与表头一致，去掉 #/✓/操作）；吨位(t)、客户吨位 为自动列，作占位消耗不填充
const PASTE_MAP=[["shipdate"],["customer"],["model"],["qty"],["delivery"],["box"],["remark"],[null],[null],[null],["code"]];
function onTablePaste(e){
  const cd=e.clipboardData||window.clipboardData;
  if(!cd) return;
  const txt=cd.getData("text");
  if(!txt) return;
  const lines=txt.replace(/\r/g,"").split("\n").filter(r=>r.trim()!=="");
  if(!lines.length) return;
  const maxCols=Math.max(...lines.map(l=>l.split("\t").length));
  if(maxCols<2) return;   // 单列文本放行，正常粘贴到当前单元格
  const startCell=e.target.closest("[data-f]");
  const startField=startCell?startCell.dataset.f:null;
  // 型号 / 发货数量 专用批量粘贴：从焦点行往下铺到现有行（数据多于现有行时自动补行）
  if((startField==="model"||startField==="qty"||startField==="code") && maxCols<=2){
    e.preventDefault();
    const tr0=e.target.closest("tr");
    const allRows=[...$("tbody").children].filter(isDataRow);
    let startIdx=tr0?allRows.indexOf(tr0):allRows.length-1;
    if(startIdx<0) startIdx=0;
    lines.forEach((line,i)=>{
      const vals=line.split("\t").map(v=>v.trim());
      let tr=allRows[startIdx+i];
      if(!tr){ tr=addRow({}, null, null, true); allRows.push(tr); }
      const setC=(f,v)=>{ const el=tr.querySelector(`[data-f="${f}"]`); if(el) el.value=(v==null?"":String(v)); };
      if(startField==="model"){
        setC("model", vals[0]);
        if(vals[1]!==undefined) setC("qty", vals[1]);   // 第二列视为发货数量
      } else if(startField==="qty"){
        setC("qty", vals[0]);
        if(vals[1]!==undefined) setC("model", vals[1]); // 第二列视为型号
      } else {
        setC("code", vals[0]);   // 物料编码列仅填第一列
      }
    });
    // 先从物料库补齐「物料编码 / 单重 / 每箱件数」，箱数·箱重T·产品重量T·客户吨位 由 recalc 自动算出
    for(let k=0;k<lines.length;k++){ const tr=allRows[startIdx+k]; if(tr) fillDbFieldsForRow(tr); }
    reindex(); recalc(); fitTextareas(); mergeCustomerCells(); saveDraftNow();
    // 粘贴的型号若在物料库中能唯一锁定送达方则自动带出；多送达方弹窗让计划员选
    for(let k=0;k<lines.length;k++){ const tr=allRows[startIdx+k]; if(tr) autoFillCustomerByModel(tr); }
    recalc(); mergeCustomerCells(); saveDraftNow();   // 送达方填完后再算一次，保证客户吨位按新送达方正确汇总
    toast("已粘贴 "+lines.length+" 行（型号/发货数量）");
    return;
  }
  // 其余多列：整行按 PASTE_MAP 新增
  e.preventDefault();
  let baseRow=e.target.closest("tr");
  if(!baseRow || baseRow.closest("#tbody")!==$("tbody")) baseRow=null;
  const pastedRows=[];
  lines.forEach((line,idx)=>{
    const vals=line.split("\t").map(v=>v.trim());
    const tr=(idx===0 && baseRow) ? baseRow : addRow({}, null, null, true);
    pastedRows.push(tr);
    PASTE_MAP.forEach((f,i)=>{
      if(i<vals.length && f){
        const el=tr.querySelector(`[data-f="${f}"]`);
        if(el){ el.value=vals[i]; if(f==="box" && vals[i]!=="") el.dataset.manual="1"; }
      }
    });
  });
  pastedRows.forEach(tr=>fillDbFieldsForRow(tr));   // 同样从物料库补齐单重/每箱件数，自动算箱数·箱重T·产品重量T
  reindex(); recalc(); fitTextareas(); mergeCustomerCells(); saveDraftNow();
  toast("已粘贴 "+lines.length+" 行");
}
$("tbody").addEventListener("paste", onTablePaste);
});

// 计划员：填一次浏览器就记住，下次开页面自动回填
const PLANNER_KEY="shipping_planner_v1";
try{ $("planner").value=localStorage.getItem(PLANNER_KEY)||""; }catch(e){}
$("planner").addEventListener("input", ()=>{ try{ localStorage.setItem(PLANNER_KEY, $("planner").value.trim()); }catch(e){} });
renderRecords();

// ===================== 云端同步 =====================
if(window.CloudSync){
  CloudSync.init();
  const CLOUD_KEYS=[LS_DB, LS_REC];
  const nav=document.querySelector('.topbar');
  const pill=document.createElement('span'); pill.id='cloudPill'; pill.className='cloud-pill';
  const btn=document.createElement('button'); btn.id='cloudSyncBtn'; btn.className='btn btn-ghost'; btn.textContent='☁ 同步'; btn.title='拉取最新';
  if(nav){ const dbStatus=nav.querySelector('#dbStatus'); const anchor=dbStatus?dbStatus.nextSibling:null; nav.insertBefore(pill, anchor); nav.insertBefore(btn, pill.nextSibling); CloudSync.bindStatus(pill);
    btn.onclick=()=>CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); updateDbStatus(); renderRecords(); }); }
  if(CloudSync.ready()){
    CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); updateDbStatus(); renderRecords(); }).then(()=>{
      CLOUD_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } });
    });
  } else { CloudSync.setStatus('未配置云端','off'); }
}
