}
function onRowCheck(tr, ev){
  const R=rowRefs(tr), box=R.rowCheck;
  if(!box){ updateCheckAll(); return; }
  if(ev && ev.shiftKey && lastCheckRow && lastCheckRow!==tr && lastCheckRow.parentNode){
    const rows=visibleRows();                       // Shift 连选只在当前看得见的行之间生效
    const a=rows.indexOf(lastCheckRow), b=rows.indexOf(tr);
    if(a>=0 && b>=0){
      const v=box.checked, from=Math.min(a,b), to=Math.max(a,b);
      for(let i=from;i<=to;i++){ const Bi=rowRefs(rows[i]).rowCheck; if(Bi) Bi.checked=v; }
    }
  }
  if(box.checked) lastCheckRow=tr;
  updateCheckAll();
}
function delCheckedRows(){
  const list=allRows();
  const sel=list.filter(tr=>{ const R=rowRefs(tr); return R.rowCheck && R.rowCheck.checked; });
  if(!sel.length){ toast("请先勾选要删除的行（表格最左边「✓」列的小方框）"); return; }
  const names=sel.slice(0,3).map(tr=>{ const c=rowRefs(tr).customer; const v=(c?c.value:"").trim(); return v||"（没填送达方）"; });
  const msg="确认删除勾选的 "+sel.length+" 行？\n\n"
    +names.join("、")+(sel.length>3 ? (" 等共 "+sel.length+" 行") : "")
    +"\n\n删除后可通过「撤回」按钮（或 Ctrl+Z）一次性恢复。";
  const go=()=>{
    const positions=sel.map(tr=>({data:collectRowData(tr), atIndex:list.indexOf(tr)}));   // 先记位置，再删
    sel.forEach(tr=>tr.remove());
    undoStack.push({rows:positions.map(p=>p.data), positions});
    if(undoStack.length>50) undoStack.shift();
    reindex(); recalc();
    if(carFixAll()) mergeCustomerCells();    // 删掉的若是第二车 → 剩下的"孤儿后缀"自动摘掉
    fitTextareas(); saveDraftNow(); updateCheckAll(); updateUndoBtn();
    toast("已删除 "+sel.length+" 行，可点「撤回」恢复");
  };
  const SL=window.ScanLib;
  if(SL && SL.uiConfirm) SL.uiConfirm(msg, go, {title:"批量删除", okText:"删除", cancelText:"取消"});
  else go();
}
function findCell(tr, colNum){
  const td=tr.children[colNum-1];
  if(!td) return null;
  if(td.style.display==="none") return null;
  const el=td.querySelector("input,textarea");
  return el||null;
}
function navigateFrom(el, ci, dCol, dRow){
  const rows=visibleRows();
  const tr=el.closest("tr");
  const rIdx=rows.indexOf(tr);
  if(rIdx<0) return;
  let newCi=ci+dCol, newRi=rIdx+dRow;
  if(newRi<0||newRi>=rows.length) return;          // 行越界：不导航
  const targetRow=rows[newRi];
  let target=findCell(targetRow, EDITABLE_COLS[newCi]);
  if(!target){                                    // 目标列被合并隐藏：就近找同行可见单元格
    for(let off=1; off<EDITABLE_COLS.length; off++){
      const a=EDITABLE_COLS[newCi-off], b=EDITABLE_COLS[newCi+off];
      if(a){ const t=findCell(targetRow,a); if(t){ target=t; break; } }
      if(b){ const t=findCell(targetRow,b); if(t){ target=t; break; } }
    }
  }
  if(target){ target.focus(); try{ if(target.select) target.select(); }catch(_){} }
}
function onCellKey(e){
  if(!e.target || !e.target.closest) return;
  // 回车仅确认当前单元格并离开，不再下移；textarea 中 Shift+Enter 保留默认换行
  if(e.key==="Enter"){
    if(e.shiftKey) return;
    e.preventDefault();
    e.target.blur();
    return;
  }
  let dCol=0, dRow=0, handled=false;
  if(e.key==="ArrowUp"){ dRow=-1; handled=true; }
  else if(e.key==="ArrowDown"){ dRow=1; handled=true; }
  else if(e.key==="Tab"){ dCol=e.shiftKey?-1:1; handled=true; }
  else if(e.key==="ArrowLeft"){ dCol=-1; handled=true; }
  else if(e.key==="ArrowRight"){ dCol=1; handled=true; }
  if(!handled) return;
  if(acEl) return;                                // 自动补全打开时交给它处理
  e.preventDefault();
  const ci=EDITABLE_COLS.indexOf(e.target.closest("td").cellIndex+1);
  if(ci<0) return;
  navigateFrom(e.target, ci, dCol, dRow);
}
function unmergeRow(tr){
  // 取消单行的客户/时效要求/客户吨位合并（★ 复用行引用缓存，不再逐列 querySelector）
  const R=rowRefs(tr);
  const cells=[R.cellCustomer, R.cellRemark, R.cellSubton];
  for(let i=0;i<cells.length;i++){
    const c=cells[i];
    if(c){ c.style.display=""; c.rowSpan=1; c.classList.remove("merged-cell"); c.style.height=""; }
  }
}
let __merging = false;
function mergeCustomerCells(){
  if(__merging) return;          // 防止同步 input.value 触发 input 事件导致死循环
  __merging = true;
  try {
  // 按「客户+发货日期」分组，合并客户、时效要求、客户吨位合计三列；基于全部数据行合并
  const allRows=[...$("tbody").children].filter(isDataRow);
  // 1) 清除所有数据行的合并状态
  // ★ 性能：原来这里还会把「客户吨位」格子的内容清空、并顺手让它的缓存标记失效 ——
  //   结果是下一段分组逻辑「必定」对全部合并组重建 innerHTML + 重新绑事件（每次输入都是一两百次 DOM 重建）。
  //   现在只复位合并属性、内容留着：分组时只要「客户 + 日期 + 显示值」都没变就直接复用现有格子，
  //   只有真正变化的组才重建。不可见的格子（display:none）留着旧内容不会有任何影响。
  allRows.forEach(tr=>{
    tr.classList.remove("group-end");
    const R=rowRefs(tr);
    const c=R.cellCustomer;
    if(c){ c.style.display=""; c.rowSpan=1; c.classList.remove("merged-cell"); c.style.height=""; }
    const r=R.cellRemark;
    if(r){ r.style.display=""; r.rowSpan=1; r.classList.remove("merged-cell"); r.style.height=""; }
    const sub=R.cellSubton;
    if(sub){ sub.style.display=""; sub.rowSpan=1; sub.classList.remove("merged-cell"); sub.style.height=""; }
  });
  // 2) 只合并当前可见的数据行（排除筛选隐藏 + 折叠隐藏），否则 rowSpan 会按隐藏行数撑出幽灵行，导致下方整表错位
  const rows=allRows.filter(tr=>!tr.classList.contains("filter-hidden")&&!tr.classList.contains("date-fold-hidden"));
  let i=0;
  while(i<rows.length){
    const first=rows[i];
    const Rf=rowRefs(first);
    const cust=(Rf.customer?.value||"").trim();
    const date=(Rf.shipdate?.value||"").trim();
    const pt=(Rf.shippt?.value||"").trim();
    if(!cust){ i++; continue; }  // 空客户不合并
    const key=cust+"|"+date;
    let j=i+1;
    while(j<rows.length){
      const R2=rowRefs(rows[j]);
      const cust2=(R2.customer?.value||"").trim();
      const date2=(R2.shipdate?.value||"").trim();
      if(cust2+"|"+date2!==key) break;
      j++;
    }
    const len=j-i;
    // 3) 计算该车合计吨位（只要客户非空就显示合计，即使吨位为0）
    //    ★ 同一辆车走几个发货点都合成这一个数；ptAuto 记下各发货点的小计，供旧口径数据折算
    let subTon=0; const ptAuto={};
    for(let k=i;k<j;k++){
      const Rk=rowRefs(rows[k]);
      const t=(parseFloat(Rk.ton?.value)||0)+(parseFloat(Rk.cwt?.value)||0);
      const pt=(Rk.shippt?.value||"").trim();
      ptAuto[pt]=(ptAuto[pt]||0)+t; subTon+=t;
    }
    const subCell=Rf.cellSubton;
    if(subCell){
      // 客户吨位可手动修改：有覆盖值用覆盖值，否则用自动合计。
      // ★ 覆盖值按「车」生效：客户（含车次后缀）+ 日期 = 一个数，几个发货点合成同一个吨位
      const ov=ctOverride(cust,date,ptAuto);
      const shown=(ov!==null?ov:subTon).toFixed(1);
      const autoTxt=subTon.toFixed(1);
      // 值与上次完全一样则跳过 innerHTML 重建（重建 input + 重新绑事件是这里的大头）
      // ★ 额外校验 firstChild：万一内容被别处清空，不能被缓存标记骗过去而不重建
      // ★ 注意：跳过重建时**不能**提前 continue —— 下面「合并隐藏后续行」的逻辑必须照跑，
      //   否则第二行及以后的格子不会被隐藏（表现为"该合并的没合并"）。
      const reusable = (subCell._key===cust+"|"+date && subCell._val===shown
                        && subCell._ov===(ov!==null?1:0) && subCell.firstChild);
      if(!reusable){
        subCell._key=cust+"|"+date; subCell._val=shown; subCell._ov=(ov!==null?1:0);
        subCell.innerHTML='<span class="subton-wrap">'
          +'<input type="text" class="subton-in'+(ov!==null?' edited':'')+'" value="'+esc(shown)+'"'
          +' data-cust="'+esc(cust)+'" data-date="'+esc(date)+'" data-pt="'+esc(pt)+'" data-shown="'+esc(shown)+'" inputmode="decimal"'
          +' title="可直接修改，回车确认（只影响这一辆车）">'
          // 手填过才显示「↺ 恢复」小按钮，位置与样式同「箱子重量T」那一列
          +(ov!==null?'<button type="button" class="subton-reset" title="恢复自动带出（'+esc(autoTxt)+'）">↺</button>':'')
          +'</span>';
        // ★ 一次查询取全（原来是 2 次 querySelector，每组重建都要付一次）
        const parts=subCell.querySelectorAll("input,button");
        let sIn=null, sRs=null;
        for(let q=0;q<parts.length;q++){ if(parts[q].classList.contains("subton-in")) sIn=parts[q]; else sRs=parts[q]; }
        subCell._subtonIn=sIn;                 // 同步缓存，供 recalc 读取时免查询
        bindSubTonInput(sIn);
        bindSubTonReset(sRs, cust, date, pt, autoTxt);
      }
      subCell.classList.add("merged-cell");
    }
    if(len>1){
      const c=Rf.cellCustomer, r=Rf.cellRemark;
      if(c){ c.rowSpan=len; c.classList.add("merged-cell"); }
      // 时效要求列与客户列保持同组合并：同一客户+同一日期下自动合并，只显示首行时效要求
      if(r){ r.rowSpan=len; r.classList.add("merged-cell"); }
      if(subCell) subCell.rowSpan=len;
      for(let k=i+1;k<j;k++){
        const Rk2=rowRefs(rows[k]);
        const c2=Rk2.cellCustomer, r2=Rk2.cellRemark, s2=Rk2.cellSubton;
        if(c2 && c2.style.display!=="none"){ c2.style.display="none"; c2.rowSpan=1; }
        if(r2 && r2.style.display!=="none"){ r2.style.display="none"; r2.rowSpan=1; }
        if(s2 && s2.style.display!=="none"){ s2.style.display="none"; s2.rowSpan=1; }
      }
    }
    rows[j-1].classList.add("group-end");
    i=j;
  }
  fitTextareas();
  } finally { __merging = false; }
}

const FOLD_STATE_KEY="shipping_fold_dates_v1";
const SHOW_FOLDED_KEY="shipping_show_folded_v1";
function getFoldState(){ try{ return JSON.parse(localStorage.getItem(FOLD_STATE_KEY))||{}; }catch(e){ return {}; } }
function setFoldState(date,collapsed){ const s=getFoldState(); s[date]=collapsed?1:0; localStorage.setItem(FOLD_STATE_KEY,JSON.stringify(s)); }
function getShowFolded(){ try{ return localStorage.getItem(SHOW_FOLDED_KEY)==="1"; }catch(e){ return false; } }
function setShowFolded(show){ try{ localStorage.setItem(SHOW_FOLDED_KEY, show?"1":"0"); }catch(e){} }
// 折叠隐藏某行时同步取消其勾选，确保折叠日期不会被全选/发布带入
function hideFoldedRow(tr){ tr.classList.add("date-fold-hidden"); const b=tr.querySelector(".row-check"); if(b) b.checked=false; }

let __foldSig=null;   // 折叠指纹：输入完全没变就整段跳过（见下面的说明）
function foldByDate(){
  // ★ 性能：这段是「改日期 / 筛选 / 加删行」时最重的一环 —— 原来每行要查 2 次
  //   （.col-shipdate、.fold-btn），120 行就是 240+ 次深搜，还要整组重建折叠按钮。
  //   这里先算一个指纹：各行发货日期的排列顺序 + 折叠状态 + 显示模式 + 筛选态 + 明日边界。
  //   指纹完全没变说明折叠结果一定是现在这样，直接返回（打字改数量之类的场景本就不走这里）。
  const sigParts=[];
  {
    const ks=$("tbody").children;
    for(let i=0;i<ks.length;i++){
      const t=ks[i];
      if(!isDataRow(t)) continue;
      const R=rowRefs(t);
      // 指纹必须包含「客户 + 发货日期」：分组是按这两列做的，
      // 只放日期的话「改了客户」会被误判成没变化而整段跳过，导致合并逻辑不执行。
      const c=R.customer?R.customer.value:"";
      const d=R.shipdate?R.shipdate.value:"";
      sigParts.push(c+"\u0001"+d);
    }
  }
  const __sig = sigParts.join("|") + "~" + JSON.stringify(getFoldState()) + "~" + (getShowFolded()?1:0)
              + "~" + (isFilterActive()?1:0) + "~" + todayStr();
  if(__sig===__foldSig) return;
  __foldSig=__sig;

  // 清理旧的折叠标记与按钮（隔离带位置由末尾的 renderIsolationBand 负责校正，这里不再删了重建）
  const kids=$("tbody").children;
  for(let i=0;i<kids.length;i++){
    const tr=kids[i];
    if(!isDataRow(tr)) continue;
    tr.classList.remove("date-fold-hidden","has-folded","has-expanded");
    const sd=rowRefs(tr).cellShipdate;          // ★ 复用行引用，省掉逐行 querySelector
    if(sd){
      sd.classList.remove("date-expanded","date-collapsed");
      const btn=sd.querySelector(".fold-btn");  // 只在单元格内找，搜索范围比整行小一个数量级
      if(btn) btn.remove();
      sd.style.display=""; sd.rowSpan=1;
    }
  }

  const groups=[];
  let cur=null;
  for(let i=0;i<kids.length;i++){
    const tr=kids[i];
    if(!isDataRow(tr)){ if(cur) cur.rows.push(tr); continue; }
    const d=rowRefs(tr).shipdate ? (rowRefs(tr).shipdate.value||"") : "";
    if(!cur||cur.date!==d){ cur={date:d, rows:[tr]}; groups.push(cur); }
    else cur.rows.push(tr);
  }

  const today=realTodayStr();
  const state=getFoldState();
  const showFolded=getShowFolded();
  const foldedDates=[];

  groups.forEach(g=>{
    if(!g.rows.length) return;
    const first=g.rows[0];
    const sd=rowRefs(first).cellShipdate;      // ★ 复用行引用
    if(!sd) return;

    let collapsed=state[g.date];
    if(collapsed===undefined) collapsed=!(g.date>today);  // 当天及之前的日期默认折叠，明天及以后默认展开
    else collapsed=!!collapsed;

    const btn=document.createElement("button");
    btn.type="button"; btn.className="fold-btn";
    btn.textContent=collapsed?"▶":"▼"; btn.title=collapsed?"展开":"折叠";
    btn.onclick=(e)=>{ e.stopPropagation(); toggleDateFold(g.date); };
    sd.insertBefore(btn, sd.firstChild);
    sd.classList.add(collapsed?"date-collapsed":"date-expanded");
    first.classList.add(collapsed?"has-folded":"has-expanded");

    if(collapsed){
      foldedDates.push(g.date);
      if(showFolded){
        // 保留第一行作为折叠控制，方便单独展开
        for(let k=1;k<g.rows.length;k++) hideFoldedRow(g.rows[k]);
      }else{
        // 截图模式：折叠的日期整组隐藏，入口改到「发货明细」标题处
        g.rows.forEach(tr=>hideFoldedRow(tr));
      }
    }
  });

  // 在「发货明细」标题右侧渲染折叠日期入口
  const fd=$("foldedDates");
  fd.innerHTML="";
  if(!showFolded && foldedDates.length){
    // 按要求：不再渲染「当天之前」的折叠展开入口（当天之前默认折叠，想展开点工具栏「当天前」）
    const future=foldedDates.filter(d=>d>today);
    if(future.length){
      const b=document.createElement("button");
      b.type="button"; b.className="folded-date-btn";
      b.textContent="▶ 当天之后已折叠";
      b.title="展开 "+future.join("、");
      b.onclick=()=>{ future.forEach(d=>setFoldState(d,0)); foldByDate(); fitTextareas(); };
      fd.appendChild(b);
    }
  }

  // 3) 先合并所有数据行，再取消被折叠隐藏行的合并，避免 rowSpan 撑出空白
  mergeCustomerCells();
  groups.forEach(g=>{
    if(!g.rows.length) return;
    let collapsed=state[g.date];
    if(collapsed===undefined) collapsed=!(g.date>today);  // 当天及之前的日期默认折叠，明天及以后默认展开
    else collapsed=!!collapsed;
    if(collapsed){
      if(showFolded){
        // 保留第一行作为折叠控制；只取消后续隐藏行的合并
        for(let k=1;k<g.rows.length;k++) unmergeRow(g.rows[k]);
      }else{
        // 整组隐藏：取消该组所有行的合并
        g.rows.forEach(tr=>unmergeRow(tr));
      }
    }
  });

  // 行数只统计可见行（同时排除筛选隐藏）
  // ★ 性能：原来是 filter + 分配新数组，这里改成一次循环计数
  let visible=0;
  const kk=$("tbody").children;
  for(let i=0;i<kk.length;i++){
    const tr=kk[i];
    if(tr.classList.contains("date-fold-hidden")||tr.classList.contains("filter-hidden")||tr.classList.contains("isolation-band")) continue;
    visible++;
  }
  $("rowCount").textContent=visible+" 行";
  renumberVisible();  // 折叠状态变化后重新编号，保证可见行序号始终连续
  updateCheckAll();   // 折叠会取消隐藏行勾选，刷新表头全选框状态
  updatePastButton(); // 同步「当天之前」按钮文字
  markRowStates();   // 刷新滞后/之后计划高亮
  renderIsolationBand();   // 在「明日」计划之后插入视觉隔离带（隔离其后计划）
}

function toggleDateFold(date){
  flushRefresh();
  const state=getFoldState();
  setFoldState(date, state[date]?0:1);
  foldByDate();
  fitTextareas();
}

// 一键折叠/展开「当天之前」所有日期的分组
function getPastDates(){
  const today=realTodayStr();
  const set=new Set();
  [...$("tbody").children].forEach(tr=>{
    if(!isDataRow(tr)) return;
    const d=tr.querySelector('[data-f="shipdate"]')?.value||"";
    if(d) set.add(d);
  });
  return [...set].filter(d=>d<=today).sort();
}
function allPastCollapsed(){
  const dates=getPastDates();
  if(!dates.length) return true;
  const state=getFoldState();
  const today=realTodayStr();
  return dates.every(d=>{ const c=state[d]===undefined?!(d>today):!!state[d]; return !!c; });
}
function togglePast(){
  const collapse=!allPastCollapsed();   // 还有展开的就全部折叠，已全折叠则全部展开
  getPastDates().forEach(d=>setFoldState(d, collapse?1:0));
  foldByDate(); fitTextareas();
}
function updatePastButton(){
  const btn=$("togglePast"); if(!btn) return;
  const collapsed=allPastCollapsed();
  btn.textContent= collapsed ? "展开当天前" : "折叠当天前";
  btn.title= collapsed ? "一键展开当天之前的计划" : "一键折叠当天之前的计划";
}

// ===================== 筛选（客户 / 型号 / 发货日期） =====================
function isFilterActive(){ return !!((($("filterCustomer").value||"").trim()) || (($("filterModel").value||"").trim()) || ($("filterDate").value||"")); }
// 数据行判定：排除「客户小计」与「隔离区分隔带」这类非数据行（避免被统计/导出/合并当成普通计划行）
function isDataRow(tr){ return tr && !tr.classList.contains("subtotal") && !tr.classList.contains("isolation-band"); }
// 在「明日」计划组之后插入视觉隔离带，隔离其后（后天及以后）的计划；数据不变，纯展示
function renderIsolationBand(){
  // ★ 性能：原来是「先删掉所有隔离带，再插一条」——每次折叠/筛选都产生 DOM 增删与重排。
  //   现在先算出位置，已经贴在正确位置就什么都不做（直接复用现有节点）。
  const filterOn=isFilterActive();
  const tomorrow=todayStr();                                                     // 系统里 todayStr()=日历明天=用户的“明日”
  const kids=$("tbody").children;
  let lastTomorrow=null, hasAfter=false;
  for(let i=0;i<kids.length;i++){
    const tr=kids[i];
    if(!isDataRow(tr)) continue;
    const d=rowRefs(tr).shipdate?(rowRefs(tr).shipdate.value||""):"";
    if(d===tomorrow) lastTomorrow=tr;
    else if(d>tomorrow) hasAfter=true;
  }
  // 筛选状态下不显示分隔带；明日组被折叠/筛选隐藏时隔离带会悬空 → 也不显示
  const need = !filterOn && !!lastTomorrow && hasAfter
    && !lastTomorrow.classList.contains("date-fold-hidden")
    && !lastTomorrow.classList.contains("filter-hidden");
  const cur=$("tbody").querySelector("tr.isolation-band");
  if(need){
    if(cur && cur.previousElementSibling===lastTomorrow) return;   // 已在正确位置 → 不重建
    if(cur) cur.remove();
    const tr=document.createElement("tr"); tr.className="isolation-band";
    const td=document.createElement("td"); td.colSpan=14; td.className="isolation-cell";
    td.innerHTML='<span class="isolation-label">隔离区 · 明日之后</span>';
    tr.appendChild(td); lastTomorrow.after(tr);
  }else if(cur){
    const all=$("tbody").querySelectorAll("tr.isolation-band");
    for(let i=all.length-1;i>=0;i--) all[i].remove();              // 兜底：清掉所有残留
  }
}
function applyFilter(){
  const cust=($("filterCustomer").value||"").trim().toLowerCase();
  const model=($("filterModel").value||"").trim().toLowerCase();
  const date=$("filterDate").value||"";
  const active=!!(cust||model||date);
  let shown=0, total=0;
  const fkids=$("tbody").children;
  for(let i=0;i<fkids.length;i++){
    const tr=fkids[i];
    if(!isDataRow(tr)) continue;
    total++;
    const R=rowRefs(tr);                                        // ★ 复用行引用（原来每行 3 次 querySelector）
    const trCust=(R.customer?R.customer.value:"").trim().toLowerCase();
    const trModel=(R.model?R.model.value:"").trim().toLowerCase();
    const trDate=(R.shipdate?R.shipdate.value:"")||"";
    const match=(!cust || trCust.includes(cust)) &&
                (!model || trModel.includes(model)) &&
                (!date || trDate===date);
    if(match){
      // 匹配即显示：同时清除筛选隐藏与折叠隐藏，让被折叠/隐藏的计划也能被筛出来
      tr.classList.remove("filter-hidden","date-fold-hidden");
      shown++;
    }else{
      tr.classList.add("filter-hidden");
    }
  }
  const hint=$("filterCount");
  if(hint) hint.textContent=active?`显示 ${shown}/${total} 行`:"";
  recalc();                 // 重新计算吨位/箱数；recalc 内部按筛选状态决定：无筛选→恢复折叠，有筛选→保持穿透显示并刷新合并/编号
  updateCheckAll();
  let visible=0;
  const vkids=$("tbody").children;
  for(let i=0;i<vkids.length;i++){
    const tr=vkids[i];
    if(tr.classList.contains("date-fold-hidden")||tr.classList.contains("filter-hidden")||tr.classList.contains("isolation-band")) continue;
    visible++;
  }
  $("rowCount").textContent=visible+" 行";
  renderIsolationBand();   // 筛选结束后刷新隔离带（筛选态下自动隐藏）
}
function clearFilter(){
  $("filterCustomer").value="";
  $("filterModel").value="";
  $("filterDate").value="";
  applyFilter();
}

function evalQtyExpr(v){   // 发货数量支持算式：10*20 → 200；支持 + - * / × ÷ 和括号
  const s=String(v==null?"":v).trim().replace(/×/g,"*").replace(/÷/g,"/");
  if(s==="") return "";
  if(/^[0-9]+(\.[0-9]+)?$/.test(s)) return s;                 // 纯数字原样返回
  if(!/^[0-9+\-*/().\s]+$/.test(s)) return null;              // 含非法字符 → 不处理
  try{
    const r=Function('"use strict";return ('+s+')')();
    if(typeof r!=="number"||!isFinite(r)) return null;
    return Number.isInteger(r)?String(r):String(Math.round(r*100)/100);
  }catch(e){ return null; }                                   // 残缺算式（如 10*）→ 不处理
}
// 快路径：绝大多数数量是纯数字，直接 parseFloat，避免每行都 new Function 编译算式（全表重算的主要开销）
const PURE_NUM=/^\d+(\.\d+)?$/;
function qtyNum(v){          // 取数量数值：能算就按算式算，算不了退回 parseFloat
  if(v==null) return 0;
  const s=String(v).trim();
  if(PURE_NUM.test(s)) return parseFloat(s);
  const e=evalQtyExpr(s);
  return parseFloat(e!==null&&e!==""?e:s)||0;
}
// 只在值真的变化时才写 DOM（程序化赋值虽不触发事件，但仍会让浏览器重排，全表逐字写入是卡顿源之一）
function setValIfChanged(el, v){ if(el && el.value!==v) el.value=v; }
// 行内元素引用缓存：recalc / 合并 / 草稿 每次都要全表逐行 querySelector，行多时开销巨大。
// 行结构创建后不再变动，缓存一次即可；节点被替换（isConnected=false）时自动重建。
// ★ 性能要点：原来是 18 次 querySelector（每次都深搜整行子树，约 40+ 节点），
//   现在改成「1 次 querySelectorAll 取全部字段 + 1 次遍历单元格取带类名的容器」，约 5 次调用。
function rowRefs(tr){
  let c=tr._refs;
  if(c && c.qty && c.qty.isConnected) return c;
  const R = tr._refs = {
    shipdate:null, customer:null, code:null, model:null, qty:null, unit:null, perbox:null,
    ton:null, box:null, cwt:null, remark:null, logistics:null, shippt:null, delivery:null,
    tonReset:null, cwtShow:null, cwtTog:null,
    cellShipdate:null, cellCustomer:null, cellRemark:null, cellSubton:null, colIdx:null,
    rowCheck:null
  };
  // ① 一次拿全部 [data-f] 字段
  const fs = tr.querySelectorAll("[data-f]");
  for(let i=0;i<fs.length;i++){ const el=fs[i], f=el.dataset.f; if(f && (f in R)) R[f]=el; }
  // ② 一次扫单元格，取带类名的容器 / 按钮（避免逐行多次深搜）
  const kids = tr.children;
  for(let i=0;i<kids.length;i++){
    const td=kids[i], cl=td.classList;
    if(cl.contains("col-shipdate")) R.cellShipdate=td;
    else if(cl.contains("col-customer")) R.cellCustomer=td;
    else if(cl.contains("col-remark")) R.cellRemark=td;
    else if(cl.contains("col-subton")) R.cellSubton=td;
    else if(cl.contains("col-idx")) R.colIdx=td;
    else if(cl.contains("col-check")) R.rowCheck=td.querySelector("input");
    else if(cl.contains("col-cwt")){ R.cwtShow=td.querySelector(".cwt-val"); R.cwtTog=td.querySelector(".cwt-toggle"); }
    else if(cl.contains("col-ton")) R.tonReset=td.querySelector(".ton-reset");
  }
  return R;
}
// skipFold=true：本次不重跑折叠（改数量/箱数/吨位不会改变日期分组，省掉一整轮全表折叠+高亮+隔离带重排）
function recalc(skipFold){
  let sq=0,st=0,sb=0,scwt=0;
  // ★ 性能：原来这一趟遍历完，updateKPIs 还要再遍历一趟全表。
  //   现在同一趟里把「顶部 KPI（行数/件数/吨位/勾选数）」也一起算好，省掉一整轮遍历。
  let kpiRows=0, kpiQty=0, kpiTon=0, kpiChecked=0;
  const kids=$("tbody").children;
  for(let ti=0; ti<kids.length; ti++){
    const tr=kids[ti];
    if(!isDataRow(tr)) continue;   // 跳过客户小计行 / 隔离带，避免非数据行读取 data-f 字段报错
    const R=rowRefs(tr);
    const qty=qtyNum(R.qty.value);
    const unit=parseFloat(R.unit.value)||0;
    const perbox=parseFloat(R.perbox.value)||0;
    // 产品重量T：未手填时按 数量×单重/1000 自动计算；手填(manual)保留；无单重保留既有值兜底
    const tonInput=R.ton;
    const autoTon=(qty>0&&unit>0)?qty*unit/1000:0;
    if(tonInput.dataset.manual!=="1") setValIfChanged(tonInput, autoTon>0?autoTon.toFixed(1):"");
    const tonReset=R.tonReset;
    if(tonReset){
      const m=tonInput.dataset.manual==="1";
      const d=m?"":"none";
      if(tonReset.style.display!==d) tonReset.style.display=d;
      tonInput.classList.toggle("edited", m);
    }
    const ton=parseFloat(tonInput.value)||0;
    // 箱数：自动带出（数量÷每箱件数），除非手填
    const boxInput=R.box;
    const autoBox=(qty>0&&perbox>0)?Math.ceil(qty/perbox):0;
    if(boxInput.dataset.manual!=="1") setValIfChanged(boxInput, autoBox>0?autoBox:"");
    const box=parseFloat(boxInput.value)||0;
    // 箱子重量T：按 箱数×0.07 自动；保留 2 位小数；被「删除」的行保持空，不自动带出
    const cwtInput=R.cwt;
    const autoCwt=box>0?(box*0.07).toFixed(2):"";
    if(cwtInput.dataset.deleted==="1") setValIfChanged(cwtInput, "");   // 已删除：保持空
    else setValIfChanged(cwtInput, autoCwt);                            // 未删除：按箱数自动计算
    const cwtShow=R.cwtShow;
    if(cwtShow){ const t=cwtInput.value||""; if(cwtShow.textContent!==t) cwtShow.textContent=t; }
    const cwtTog=R.cwtTog;
    if(cwtTog){
      let d="", txt="", title="";
      if(cwtInput.dataset.deleted==="1"){ d=""; txt="↺"; title="点击恢复（按箱数重新计算）"; }
      else if(cwtInput.value){ d=""; txt="×"; title="点击删除"; }
      else { d="none"; }   // 无箱数、也无值：不显示按钮
      if(cwtTog.style.display!==d) cwtTog.style.display=d;
      if(d!=="none"){
        if(cwtTog.textContent!==txt) cwtTog.textContent=txt;
        if(cwtTog.title!==title) cwtTog.title=title;
      }
    }
    const cwt=parseFloat(cwtInput.value)||0;
    // 表尾合计只统计当前可见行（被折叠或筛选隐藏的行不计入）
    if(!tr.classList.contains("date-fold-hidden") && !tr.classList.contains("filter-hidden")){
      sq+=qty; st+=ton; sb+=box; scwt+=cwt;
      kpiRows++; kpiQty+=qty; kpiTon+=ton;
      if(R.rowCheck && R.rowCheck.checked) kpiChecked++;
    }
  }
  $("sumQty").textContent=sq;
  $("sumTon").textContent=st.toFixed(1);
  $("sumBox").textContent=(sb>0)?sb:"/";
  $("sumCwt").textContent=scwt>0?scwt.toFixed(1):"/";
  // 有筛选时不再重新折叠（否则会把刚穿透显示的折叠行又折回去）；改为保持穿透显示并刷新合并/编号
  if(skipFold && !isFilterActive()){ mergeCustomerCells(); }
  else if(!isFilterActive()){ foldByDate(); }
  else { renumberVisible(); mergeCustomerCells(); markRowStates(); }
  // 客户吨位合计：只累加当前可见的分组合计单元格（合并后每个组只显示一个）
  // ★ 性能：不再用 `$("tbl").querySelectorAll(".col-subton")` + 每格 closest() 向上找行，
  //   改为遍历行、用行引用直接取该行的合计格（合并后只有组首格可见，实际取值次数远小于行数）。
  let sst=0, subCells=0;
  const kids2=$("tbody").children;
  for(let ti=0; ti<kids2.length; ti++){
    const tr=kids2[ti];
    if(!isDataRow(tr)) continue;
    const cell=rowRefs(tr).cellSubton;
    if(!cell || cell.style.display==="none") continue;          // 被 rowSpan 合并覆盖的格子
    if(tr.classList.contains("date-fold-hidden") || tr.classList.contains("filter-hidden")) continue;
    subCells++;
    // ★ 缓存该格子里的输入框引用（原来是每次都 querySelector，每个合并组一次）
    let inp=cell._subtonIn;
    if(!inp || !inp.isConnected) inp=cell._subtonIn=cell.querySelector(".subton-in");
    sst+=parseFloat(inp?inp.value:cell.textContent)||0;
  }
  $("sumSubTon").textContent=subCells?(sst>0?sst.toFixed(1):"0.0"):"/";
  writeKPIs(kpiRows, kpiQty, kpiTon, kpiChecked);   // 直接用上面那趟遍历的结果，不再单独再扫一遍全表
}

  }

// ===================== 草稿自动保存（刷新/重开页面不丢未发布数据） =====================
// —— 性能优化：草稿写入防抖。打字时每敲一个字都全量序列化 + 同步写 localStorage 是主要卡顿源，
//    改成停手 250ms 后写一次；关页面/切后台前强制 flush，保证不丢数据。
let _draftTimer=0, _draftDirty=false;
function flushDraft(){ if(!_draftDirty) return; _draftDirty=false; clearTimeout(_draftTimer); _draftTimer=0; writeDraftNow(); }
window.addEventListener("beforeunload", flushDraft);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushDraft(); });
window.addEventListener("pagehide", flushDraft);   // 手机切走/回退/关标签：pagehide 比 beforeunload 更可靠
function saveDraft(){
  if(!_draftDirty) updateOpStatus(true);   // 状态条立刻变「正在保存…」：保存看得见，不用猜
  _draftDirty=true;
  clearTimeout(_draftTimer);
  _draftTimer=setTimeout(()=>{ _draftTimer=0; if(_draftDirty){ _draftDirty=false; writeDraftNow(); } }, 250);
}
function saveDraftNow(){ _draftDirty=false; clearTimeout(_draftTimer); _draftTimer=0; writeDraftNow(); }
// ===================== 责任到人：记录当前操作人（接统一登录） =====================
// 取登录人姓名：优先用统一登录会话 auth_session_v1（auth.js 写入），
// 兼容旧的「内部人员码」会话 staff_session_v1；都没登录则返回空串。
function currentOperator(){
  try{ const a=localStorage.getItem("auth_session_v1"); if(a){ const o=JSON.parse(a); if(o&&o.name) return o.name; } }catch(e){}
  try{ const s=localStorage.getItem("staff_session_v1"); if(s){ const o=JSON.parse(s); if(o&&o.name) return o.name; } }catch(e){}
  return "";
}
function _fmtOpTime(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d.getTime())) return "";
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
// 相对时间（刚刚 / 3 分钟前）：状态条看着是活的，不会被误当成"时间没动 / 保存有延迟"
function _relTime(ts){
  const d=new Date(ts); if(isNaN(d.getTime())) return "";
  const s=Math.max(0,Math.round((Date.now()-d.getTime())/1000));
  if(s<10) return "刚刚";
  if(s<60) return s+" 秒前";
  if(s<3600) return Math.floor(s/60)+" 分钟前";
  return Math.floor(s/3600)+" 小时前";
}
// 顶部状态条：当前登录人 + 保存状态（正在保存 / 已自动保存 HH:MM:SS（刚刚） / 保存失败）
// ★ 2026-09-22：原来只显示「末次保存 HH:MM」，用户看到 13:40 会以为"保存卡住了、有延迟"——
//   其实那是"最后一次真正落盘"的时刻。现在：①秒级精度 + 相对时间；②打字瞬间先显示「正在保存…」；
//   ③写盘失败立刻红字告警（不再静默）。未登录也照样记时间，状态条不再是死的。
function updateOpStatus(pending){
  const el=document.getElementById("opStatus"); if(!el) return;
  const op=currentOperator();
  if(!op){ el.textContent="（未登录 · 修改不记录到人，开通门禁后自动记录）"; el.style.color="#b45309"; return; }
  const ts=window.__lastEditAt;
  let tail;
  if(pending) tail='<span style="color:#b45309">正在保存…</span>';
  else if(window.__lastSaveFailed) tail='<span style="color:#dc2626">⚠ 本机保存失败！请立即用顶部「数据备份」导出文件</span>';
  else if(ts) tail="已自动保存 "+_fmtOpTime(ts)+"（"+_relTime(ts)+"）";
  else if(window.__lastEditor) tail="本机草稿：最近保存人 "+esc(window.__lastEditor);
  else tail="还没有改动";
  el.innerHTML="当前登录：<b>"+esc(op)+"</b> ｜ "+tail;
  el.style.color="#2563eb";
}
// 每 20 秒刷一次相对时间（"刚刚"→"1 分钟前"），状态条始终是活的
setInterval(()=>{ try{ updateOpStatus(_draftDirty); }catch(e){} }, 20000);
setTimeout(()=>{ try{ updateOpStatus(); }catch(e){} }, 400);
function writeDraftNow(){

    // ★ 性能：原来是「每行 12 次 querySelector」—— 打字停手 250ms 就写一次草稿，

    const rows=[];

        logistics:R.logistics?R.logistics.value:"",
        // ★ 手填标记必须一起存：重开页面后标记若丢了，自动带出会把人工填的物流冲掉
        logisticsManual:!!(R.logistics&&R.logistics.dataset.manual==="1"),
        // ★ 「这行不要第N车后缀」也要存：否则刷新后系统又把「（第二车）」挂回来
        noCar:tr.dataset.carPin==="1"
      });
    }
    if(!rows.length && !$("shipDate").value){ localStorage.removeItem(LS_DRAFT); return; }
    const _op=currentOperator();
    // ★ 无论是否登录都记时间：状态条要能立刻反映"刚刚存过"
    window.__lastEditAt=Date.now();

      __lastEditor:_op, __lastEditAt:_op?new Date(window.__lastEditAt).toISOString():""}));
    window.__lastSaveFailed=!_ok;   // 写盘失败 → 红字告警，绝不静默

// ===================== 发布：文本存档 + 同步到发货员链接（不再截图下载） =====================
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
// 复制到剪贴板（优先 navigator.clipboard，老环境/iframe/本地文件回退到 execCommand）
function copyToClipboard(text, btn, onResult){
  const ok=()=>{
    if(btn){ const o=btn.textContent; btn.textContent="已复制"; btn.classList.add("copied"); setTimeout(()=>{ btn.textContent=o; btn.classList.remove("copied"); },1200); }
    if(onResult) onResult(true);
    else toast("已复制 ✓");
  };
  const fail=(reason)=>{ if(onResult) onResult(false, reason); else toast("复制失败："+(reason||"请重试")); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(()=>fallbackCopy(text, ok, fail));
  } else fallbackCopy(text, ok, fail);
}
function fallbackCopy(text, onOk, onFail){
  let ok=false;
  try{
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;top:-1000px;left:-1000px;opacity:0;";
    document.body.appendChild(ta); ta.focus(); ta.select();
    ok=document.execCommand("copy");
    document.body.removeChild(ta);
  }catch(e){ ok=false; }
  if(ok) onOk&&onOk(); else onFail&&onFail("浏览器阻止了剪贴板写入");
}
// ===== 发货日期解析（宽容版）=====
// 把从 Excel / 别的系统复制来的各种日期写法，统一成 yyyy-mm-dd；认不出来返回 null。
// 认不出来时调用方「不覆盖、不补默认值」，绝不会把日期偷偷改成别的日子。
// 支持：2026-9-14 / 2026/9/14 / 2026.9.14 / 2026年9月14日 / 9月14日 / 9/14 / 9-14 / 20260914
//       带时间的（2026/9/14 0:00、2026-09-14 12:30:00）、带括注的（2026/9/14(周一)）、Excel 日期序列号（如 46265）
function parseDateLoose(v){
  let s=String(v==null?"":v).trim();
  if(!s) return null;
  s=s.replace(/[（(][^)）]*[)）]/g,"").trim();                    // 去掉 “(周一)” 之类的括注
  const pad=n=>String(n).padStart(2,"0");
  const build=(y,m,d)=>{
    y=+y; m=+m; d=+d;
    if(!(y>=1900&&y<=2999)||m<1||m>12||d<1||d>31) return null;
    const dt=new Date(y,m-1,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return null;   // 挡掉 2月30日 这类假日期
    return y+"-"+pad(m)+"-"+pad(d);
  };
  let m;
  // ① 带年份：2026-9-14 / 2026/9/14 / 2026.9.14 / 2026年9月14日（后面允许跟时间等多余内容）
  if((m=s.match(/^(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*日?/))) return build(m[1],m[2],m[3]);
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/))) return build(m[1],m[2],m[3]);        // ② 20260914
  // ③ 不带年份：9/14、9-14、9.14、9月14日 → 按「今年」；比今天早半年以上（跨年，如 12月里填 1/5）→ 算明年
  if((m=s.match(/^(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*日?$/))){
    const now=new Date(); const y=now.getFullYear();
    const out=build(y,m[1],m[2]); if(!out) return null;
    const diff=(now-new Date(y,+m[1]-1,+m[2]))/86400000;
    return diff>180?build(y+1,m[1],m[2]):out;
  }
  // ④ Excel 日期序列号：单元格没设成日期格式时，复制出来就是这种 5 位数
  if(/^\d{5}$/.test(s)){
    const n=+s;
    if(n>=40000&&n<=65000){
      const dt=new Date(Date.UTC(1899,11,30)+n*86400000);
      return build(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());
    }
  }
  return null;
}
// 复制过来的内容是不是「发货日期」（含 Excel 各种写法 / 序列号）
function isDateLike(v){ return parseDateLoose(v)!==null; }
// 读一行的「客户吨位」：合并单元格里只有首行有值，被合并隐藏的行向上找同组首行
function rowSubtonText(tr){
  const cell=tr.querySelector(".col-subton");
  let inp=cell?cell.querySelector(".subton-in"):null;
  if(!inp && cell && cell.style.display==="none"){
    const cust=(tr.querySelector('[data-f="customer"]')?.value||"").trim();
    const date=(tr.querySelector('[data-f="shipdate"]')?.value||"").trim();
    let p=tr.previousElementSibling;
    while(p){
      const pc=(p.querySelector('[data-f="customer"]')?.value||"").trim();
      const pd=(p.querySelector('[data-f="shipdate"]')?.value||"").trim();
      if(pc!==cust || pd!==date) break;                       // 走出本合并组 → 不再向上找
      const hit=p.querySelector(".col-subton .subton-in");
      if(hit){ inp=hit; break; }
      p=p.previousElementSibling;
    }
  }
  return inp?(inp.value||"").trim():(cell?(cell.textContent||"").trim():"");
}
// 一行 → 按 PASTE_COLS 顺序取全部列的值（与粘贴逻辑同一套列顺序，所以复制出来的内容可直接粘回表格还原整行）
function readRowCells(tr){
  return PASTE_COLS.map(f=>{
    if(f==="subton") return rowSubtonText(tr).replace(/[\t\r\n]+/g," ");
    const el=tr.querySelector(`[data-f="${f}"]`);
    if(!el) return "";
    return String(el.value==null?"":el.value).trim().replace(/[\t\r\n]+/g," ");
  });
}
// 复制勾选行的「整行全部信息」（制表符分隔：可直接粘回表格，也可粘到 Excel）
function copyModelCode(){
  const rows=[...$("tbody").children].filter(tr=>isDataRow(tr)&&!tr.classList.contains("date-fold-placeholder"))
                                    .filter(tr=>{ const c=tr.querySelector(".row-check"); return !!(c&&c.checked); });
  if(!rows.length){ toast("请先勾选要复制的行（✓ 列）"); return; }
  const lines=[];
  rows.forEach(tr=>{
    if(rowIsBlank(tr)) return;               // 空行（与「删空行」同一套判定）→ 跳过
    lines.push(readRowCells(tr).join("\t"));
  });
  if(!lines.length){ toast("勾选的行都是空白行，没有可复制的信息"); return; }
  copyToClipboard(lines.join("\n"), this, (ok, err)=>{
    if(ok) toast("已复制 "+lines.length+" 行的整行信息（"+PASTE_COLS.length+" 列）✓");
    else toast("复制失败："+(err||"请重试")+"，可尝试按 Ctrl+C 手动复制");
  });
}
$("copyModelCode").onclick=copyModelCode;
// 内容指纹：把勾选行的关键字段归一化后排序拼接再哈希，用于发布前与已发布记录比对（与行顺序无关）
function fingerprintRows(rows){
  const norm = r => [r.shipdate,r.customer,r.code,r.model,r.qty,r.shippt,r.ton,r.box,r.cwt,r.delivery,r.remark,r.logistics]
    .map(v=>(v==null?"":String(v)).trim()).join("");
  const parts = rows.map(norm).sort();
  const s = parts.join("|");
  let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }
  return h.toString(36);
}
function publish(){
  flushRefresh();   // 先把待处理的全表刷新跑完，确保发布读到的是最新值
  syncLogisticsAll();   // ★ 发布前兜底：物流空着但客户能查到的行，此刻补上（手填过的一律不动）
  const allTrs=[...$("tbody").children].filter(isDataRow);
  if(!allTrs.length){ toast("请先添加发货明细"); return; }
  // 发布前必须勾选确认：仅发布已勾选的行
  const checkedTrs=allTrs.filter(tr=>tr.querySelector(".row-check")?.checked);
  if(!checkedTrs.length){ toast("发布前请先勾选要发布的行（✓ 列）"); return; }

  // ===== 必填项校验：送达方 / 时效要求 / 客户吨位 必须填写才能发布 =====
  // 计算各合并区域的客户吨位（与表格显示一致：手动覆盖值优先，否则自动合计 产品重量T+箱重T）。
  // ★ 按「车」算：客户（含车次后缀）+ 日期 → 一个吨位；几个发货点合起来算一个数
  const subMap={};
  const subByTr=new Map();     // 每一行 → 所属车辆的客户吨位
  const ptAutoByCar={};        // 「客户|日期」→ 各发货点的小计（打包 custTon 时复用）
  const visRows=[...$("tbody").children].filter(isDataRow)
    .filter(tr=>!tr.classList.contains("filter-hidden")&&!tr.classList.contains("date-fold-hidden"));
  (function(){
    let i=0;
    while(i<visRows.length){
      const first=visRows[i];
      const cust=(first.querySelector('[data-f="customer"]')?.value||"").trim();
      const date=(first.querySelector('[data-f="shipdate"]')?.value||"").trim();
      if(!cust){ i++; continue; }
      const key=cust+"|"+date;
      let j=i+1;
      while(j<visRows.length){
        const c2=(visRows[j].querySelector('[data-f="customer"]')?.value||"").trim();
        const d2=(visRows[j].querySelector('[data-f="shipdate"]')?.value||"").trim();
        if(c2+"|"+d2!==key) break;
        j++;
      }
      let subTon=0; const ptAuto={};
      for(let k=i;k<j;k++){
        const t=(parseFloat(visRows[k].querySelector('[data-f="ton"]')?.value)||0)+(parseFloat(visRows[k].querySelector('[data-f="cwt"]')?.value)||0);
        const pt=(visRows[k].querySelector('[data-f="shippt"]')?.value||"").trim();
        ptAuto[pt]=(ptAuto[pt]||0)+t; subTon+=t;
      }
      const ov=ctOverride(cust,date,ptAuto);
      const val=ov!==null?ov:subTon;
      subMap[ctKeyOf(cust,date)]=val;
      ptAutoByCar[key]=ptAuto;
      for(let k=i;k<j;k++) subByTr.set(visRows[k],val);
      i=j;
    }
  })();
  // 兼容合并单元格：按「送达方|发货日期」取组内首个非空时效要求作为该组合规值
  const remarkMap={};
  (function(){
    let i=0;
    while(i<visRows.length){
      const first=visRows[i];
      const cust=(first.querySelector('[data-f="customer"]')?.value||"").trim();
      const date=(first.querySelector('[data-f="shipdate"]')?.value||"").trim();
      if(!cust){ i++; continue; }
      const key=cust+"|"+date;
      let j=i+1;
      while(j<visRows.length){
        const c2=(visRows[j].querySelector('[data-f="customer"]')?.value||"").trim();
        const d2=(visRows[j].querySelector('[data-f="shipdate"]')?.value||"").trim();
        if(c2+"|"+d2!==key) break;
        j++;
      }
      let remark="";
      for(let k=i;k<j;k++){
        const v=(visRows[k].querySelector('[data-f="remark"]')?.value||"").trim();
        if(v && v!=="/"){ remark=v; break; }
      }
      remarkMap[key]=remark;
      i=j;
    }
  })();

  const miss=[];
  checkedTrs.forEach((tr,idx)=>{
    const cust=(tr.querySelector('[data-f="customer"]')?.value||"").trim();
    const shipdate=(tr.querySelector('[data-f="shipdate"]')?.value||"").trim();
    const key=cust+"|"+shipdate;
    // 优先读当前行 input；若为空则取合并组的首个非空值
    let remark=(tr.querySelector('[data-f="remark"]')?.value||"").trim();
    if(!remark || remark==="/") remark=remarkMap[key]||"";
    const msgs=[];
    if(!cust||cust==="/") msgs.push("送达方未填");
    if(!remark||remark==="/") msgs.push("时效要求未填");
    // ★ 按本行所属车辆取客户吨位（同客户同日期 = 同车，一个数）
    let st=subByTr.get(tr);
    if(st===undefined) st=subMap[ctKeyOf(cust,shipdate)];
    if(st===undefined||st===""||isNaN(parseFloat(st))||parseFloat(st)<=0) msgs.push("客户吨位为空或为0（请填产品重量T/箱重T，或手动填客户吨位）");
    if(msgs.length) miss.push("第"+(idx+1)+"行【"+(cust||"空")+"】："+msgs.join("、"));
  });
  if(miss.length){
    toast("⚠ 必填项未填，无法发布");
    alert("以下必填项未填写，请补全后再发布：\n\n"+miss.slice(0,15).join("\n")+(miss.length>15?"\n…等共 "+miss.length+" 处":""));
    return;
  }

  const f=v=>{ v=(v==null?"":String(v).trim()); return v===""?"/":v; };
  const rows=checkedTrs.map(tr=>{
    // ★★ 一份口径：一行有哪些字段，一律由 collectRowData 决定（撤回 / 草稿 / 发布 共用同一份），
    //     绝不在这里另抄一张字段表 —— 少抄一个字段，值就会在别处静默丢掉。
    //     2026-09-23 事故：这里漏了 unit（单重）+ tonManual（是否手填），
    //     导入重编时 recalc 以为「产品重量T 该按 数量×单重/1000 自动算」，单重又查不到 → 整列被清成空。
    const b=collectRowData(tr);
    const cust=f(b.customer);
    const shipdate=f(b.shipdate);
    const key=(cust==="/"?"":cust)+"|"+(shipdate==="/"?"":shipdate);
    let remark=f(b.remark);
    if(remark==="/") remark=remarkMap[key]||"/";
    return {
      shipdate,
      customer:cust,
      code:f(b.code),
      model:f(b.model),
      qty:f(b.qty),
      shippt:f(b.shippt),
      unit:b.unit,
      perbox:f(b.perbox),
      ton:b.ton, tonManual:!!b.tonManual,
      box:b.box, boxManual:!!b.boxManual,
      cwt:b.cwt, cwtDeleted:!!b.cwtDeleted,
      delivery:f(b.delivery),
      remark,
      logistics:f(b.logistics), logisticsManual:!!b.logisticsManual,
      noCar:!!b.noCar
    };
  });
  // ===== 内容防重：与已发布记录比对，完全相同则提醒确认 =====
  const fp = fingerprintRows(rows);
  const dup = loadRec().filter(r=>r.fingerprint && r.fingerprint===fp);
  if(dup.length){
    const nos = dup.map(r=>r.no).join("、");
    if(!confirm("⚠ 这批内容与已发布的计划单（"+nos+"）完全相同。\n\n确定要再次发布吗？\n（如为修改后重发，请先改动内容或换一个单号）")) return;
  }
  if(rows.some(r=>!r.model || !r.qty) && !confirm("存在「型号」或「数量」为空行，仍要发布？")) return;
  if(!confirm("确认发布已勾选的 "+rows.length+" 行？")) return;

  // 把本次发布涉及的「客户吨位」手动修改打包进记录，发货员端自动同步显示
  // ★ 按「车」（客户|日期）打包，与表格显示完全一致；第二车靠客户名后缀各算各的
  // ★ 旧三段 key（按发货点各改各的）在这里顺手折算成本车一个数写进去 —— 旧值不丢，也把旧口径洗掉
  const _raw=v=>String(v==null||v==="/"?"":v).trim(), custTon={};
  rows.forEach(r=>{
    const cu=_raw(r.customer), da=_raw(r.shipdate);
    if(!cu||!da) return;
    const ov=ctOverride(cu,da,ptAutoByCar[cu+"|"+da]);
    if(ov!==null) custTon[ctKeyOf(cu,da)]=ov;
  });

  // ===== 送达方代码（门口大屏保密显示用）=====
  // 现场涉及保密：门口那块大屏不能出现送达方名称，只能用「送达方代码」。
  // 所以在**发布这一刻**就把代码刻进每条明细（写成 custcode 字段）——
  //   ① 之后门口大屏在任意一台电脑上都能显示代码，不依赖那台机器同步过物料库；
  //   ② 日后改物料库/换型号，也不会改写已经发出去的单（记录自带当时的那份代码）。
  // 查不到代码的行**不写**这个字段：大屏会显示「未编代码」占位，
  // 绝不回落到客户名 —— 保密不能因为"查不到"就漏出名字。
  {
    // ★ 取码口径必须和大屏/司机页**完全一致** —— 直接把 scan-lib 那套拿来用，
    //   绝不在发布这条路上再写第二份。旧版是按「型号的第一条」取，而型号是多客户
    //   共用的（一条型号对应好几个客户、好几个代码），于是把 A 客户的代码刻到了
    //   B 客户的行上（实测 50 行里刻错 11 行）。
    const CIDX=(window.ScanLib && window.ScanLib.codeIndex) ? window.ScanLib.codeIndex(DB) : null;
    const pickCode=(cu,mo)=>{
      if(!CIDX) return "";
      try{ return window.ScanLib.codeOf({customer:cu, models:mo?[mo]:[], rec:null}, CIDX) || ""; }catch(e){ return ""; }
    };
    const missing=[];
    rows.forEach(r=>{
      const cu=_raw(r.customer);
      const cc=pickCode(cu,_raw(r.model));
      if(cc) r.custcode=cc; else missing.push(cu||"（未填送达方）");
    });
    // 缺代码只提醒、不拦发布：急着发货不能被"代码还没编"卡住（大屏会显示占位）
    if(missing.length){
      const uniq=[...new Set(missing)];
      toast("⚠ "+missing.length+" 行的送达方还没编代码（门口大屏会显示「未编代码」）："+uniq.slice(0,3).join("、")+(uniq.length>3?" 等 "+uniq.length+" 个":""));
    }
  }

  // 汇总：只统计本次实际发布的行（不再用全局合计，避免把未勾选/其它计划也算进来）
  const _n = v => parseFloat(String(v==null||v==="/"?"":v).trim())||0;
  const sumQty = rows.reduce((a,r)=>a+_n(r.qty), 0);
  const sumTon = rows.reduce((a,r)=>a+_n(r.ton), 0);
  const sumBox = rows.reduce((a,r)=>a+_n(r.box), 0);
  const sumSubTon = rows.reduce((a,r)=>a+_n(r.ton)+_n(r.cwt), 0);
  // 存档文本数据
  // 单号日期段以「本次实际发布行的发货日期」为准：表头日期有时还停在昨天没改，
  // 直接拿表头日期生成就会出现「9/15 的单号发 9/16 的货」（2026-09-16 用户反馈的问题）。
  const pubShipDate = recShipDate({rows:rows, date:$("shipDate").value}) || $("shipDate").value;
  const rec={id:Date.now(),date:$("shipDate").value,no:fixPlanNo($("planNo").value, pubShipDate),
    planner:($("planner")?.value||"").trim(),
    operator:currentOperator(),
    operatedAt:new Date().toISOString(),
    publishedAt:new Date().toLocaleString("zh-CN"),rows,
    sumQty:sumQty||"0",sumTon:sumTon.toFixed(1),sumBox:sumBox>0?sumBox:"/",
    sumSubTon:sumSubTon>0?sumSubTon.toFixed(1):"0.0",custTon,fingerprint:fp};
  snapshot(LS_REC, "发布前");   // 发布前留档：万一发错/发重，可整批退回
  saveRec(rec); renderRecords();
  toast("已发布 ✓（单号 "+(rec.planner?rec.no+" · "+rec.planner:rec.no)+" · 共 "+rows.length+" 行）· 已同步到发货员链接");
  // 发布后自动取消勾选，避免顺手重复发布同一批
  [...$("tbody").querySelectorAll(".row-check")].forEach(b=>b.checked=false);
  updateCheckAll();
  $("planNo").value=genPlanNo(); syncDocHead();
  saveDraftNow();
  try{ if(window.__clientBackup) window.__clientBackup(); }catch(e){}
}

function styleShipdate(){
  // ★ 性能：原来每次都用 document.querySelectorAll 全局找日期框（还包含表外的元素），
  //   现在只遍历表格行、复用行引用；并记住上次的值，值没变就不碰 class（少触发样式重算）。
  const kids=$("tbody").children;
  for(let i=0;i<kids.length;i++){
    const inp=rowRefs(kids[i]).shipdate;
    if(!inp) continue;
    const v=(inp.value||"").trim();
    if(inp._sdv===v) continue;
    inp._sdv=v;
    if(v.includes("自提")) inp.classList.add("jinling");
    else inp.classList.remove("jinling");
  }
}
// 按发货日期标记行的状态：<边界=滞后(红)  >边界=之后(蓝)  边界当天=正常
function markRowStates(){
  const today=$("shipDate").value||todayStr();
  const kids=$("tbody").children;
  for(let i=0;i<kids.length;i++){
    const tr=kids[i];
    if(!isDataRow(tr)) continue;
    const d=rowRefs(tr).shipdate ? rowRefs(tr).shipdate.value : "";
    tr.classList.toggle("row-overdue", !!(d && d<today));
    tr.classList.toggle("row-future", !!(d && d>today));
  }
}
function updateCheckAll(){
  // 仅统计可见行（排除被折叠或筛选隐藏的行），否则隐藏行永远不勾选会让表头全选框恒为半选
  // ★ 性能：原来 querySelectorAll(".row-check") + 每个框 closest("tr") 向上找行；
  //   现在直接遍历行、用行引用缓存拿勾选框 —— 一次遍历同时刷新全选框与顶部 KPI。
  let rows=0, qty=0, ton=0, checked=0;
  const kids=$("tbody").children;
  for(let i=0;i<kids.length;i++){
    const tr=kids[i];
    if(!isDataRow(tr)) continue;
    if(tr.classList.contains("date-fold-hidden")||tr.classList.contains("filter-hidden")) continue;
    const R=rowRefs(tr);
    rows++;
    qty+=qtyNum(R.qty?R.qty.value:"");
    ton+=parseFloat(R.ton?R.ton.value:"")||0;
    if(R.rowCheck && R.rowCheck.checked) checked++;
  }
  const all=$("checkAll");
  if(all){
    all.checked = rows>0 && checked===rows;
    all.indeterminate = checked>0 && checked<rows;
  }
  writeKPIs(rows, qty, ton, checked);
  updateDelCheckedBtn();   // 勾选变化 → 同步「批量删除」按钮的可用状态与数量
}
// 只负责把 KPI 写进 DOM（数据由调用方给）—— recalc / updateCheckAll 都已遍历过，不必再扫全表
function writeKPIs(rows, qty, ton, checked){
  const kpiRows=$("kpiRows"), kpiQty=$("kpiQty"), kpiTon=$("kpiTon"), kpiChecked=$("kpiChecked");
  if(kpiRows) kpiRows.innerHTML=rows+'<span class="kpi-unit">行</span>';

}
// 独立计算版（供不走 recalc 的场合使用）；同样复用行引用缓存，避免逐行 querySelector
function updateKPIs(){
  let rows=0, qty=0, ton=0, checked=0;
  const kids=$("tbody").children;
  for(let i=0;i<kids.length;i++){
    const tr=kids[i];
    if(!isDataRow(tr)) continue;
    if(tr.classList.contains("date-fold-hidden")||tr.classList.contains("filter-hidden")) continue;
    const R=rowRefs(tr);
    rows++;
    qty+=qtyNum(R.qty?R.qty.value:"");
    ton+=parseFloat(R.ton?R.ton.value:"")||0;
    if(R.rowCheck && R.rowCheck.checked) checked++;
  }
  writeKPIs(rows, qty, ton, checked);
}
function saveRec(rec){
  let list=loadRec(); list.unshift(rec);
  // 超出上限的老记录转归档，而不是直接丢弃（归档内容随备份文件一起导出）
  if(list.length>200){ archiveRecs(list.slice(200)); list=list.slice(0,200); }
  let ok = safeSet(LS_REC, JSON.stringify(list));
  if(!ok){
    // 空间不足：把较早的一半先转入归档，保证最新记录一定能存下
    archiveRecs(list.slice(50));
    const keep = list.slice(0,50);
    ok = safeSet(LS_REC, JSON.stringify(keep));
    if(ok) toast("存储空间不足，较早记录已转入归档（导出备份可取回）");
  }
  // 发布是关键操作：立刻同步云端（不走 900ms 防抖）。走 flushRec —— 它会先拉云端、
  // 按 id 合并（只增不减）再上传，绝不会把本机这份不完整的清单整份盖到云端。
  // 这里不静默：万一没传上去必须让用户看见（否则就会出现"编辑器和发货员看到的不一样"）。
  if(window.CloudSync) flushRec(false);
  return ok;
}
function loadRec(){
  try{
    const a=JSON.parse(localStorage.getItem(LS_REC))||[];
    let fixedAny=false;
    a.forEach(function(r){ if(r && r.no!=null){ const v=fixPlanNo(r.no, recShipDate(r)); if(v!==r.no){ r.no=v; fixedAny=true; } } });
    if(fixedAny) markPending(true);   // 修到坏单号 → 标记待补传，启动校对就会把修好的推上云端（修完写回后不再触发）
    return a;
  }catch(e){ return []; }
}

// 取一份计划的「真实发货日期」：优先用明细行里的发货日期（第一行有值即采用），没有再退回计划顶部日期
function recShipDate(rec){
  const rows = rec.rows || [];
  for (const r of rows){ if (r && r.shipdate && String(r.shipdate).trim()) return String(r.shipdate).trim(); }
  return rec.date || "";
}
// 发布记录按发货日期分类：今天之前 / 今天 / 明天 / 明天之后（用 realTodayStr 真今天，todayStr() 是真明天）
function classifyRec(shipdate){
  const today = realTodayStr();
  const tmr   = todayStr();
  const s = String(shipdate == null ? "" : shipdate).trim();
  if (!s) return "future";
  if (s < today)        return "past";
  if (s === today)      return "today";
  if (s === tmr)        return "tomorrow";
  return "future";
}

// ===================== 发布记录 → 一键导回表格重新编辑 =====================
// 用途：翻到老单子想改一改再发一次，不用手动一行行敲回去。
// ★ 只新增、绝不删除：把这条记录的明细行**追加**进上方表格（按发货日期插到对应位置），
//   表格里原有的行一行都不动。想只要这一单，自己删掉多余的行即可。
// 安全：导入前先 snapshot(LS_DRAFT) 留档（可在「数据急救」页找回）；导完立刻写草稿，刷新/断网都不丢。
function importRecToEditor(rec){
  if(!rec || !(rec.rows||[]).length){ try{ toast("这条发布记录没有明细行，无法导入"); }catch(e){} return; }
  const rows=(rec.rows||[]).map(r=>{
    // ★ 老记录（2026-09-23 之前发的）里没有 unit / tonManual：
    //   这时只要记录里有产品重量值，就必须按「手填值」导进来，不能被当成"自动计算"。
    //   否则 recalc 会拿 数量×单重/1000 重算，而单重没存=0 → 值被清成空（用户看到的"没带过来"）。
    const rawTon=(r.ton==null?"":String(r.ton)).trim();
    const tNum=parseFloat(rawTon);
    const uNum=parseFloat(r.unit);
    //   记录里写的是什么就带什么（含 "0.0"；只有 ""/"-" 这种空值才不标）
    const keepTon=(r.tonManual===true||r.tonManual==="1") ||
                  (!(uNum>0) && rawTon!=="" && rawTon!=="/" && isFinite(tNum));
    return {
      shipdate:r.shipdate||"", customer:r.customer||"", code:r.code||"", model:r.model||"",
      qty:r.qty||"", shippt:r.shippt||"", unit:r.unit||"", perbox:r.perbox||"",
      ton:(rawTon==="/"?"":rawTon), tonManual:keepTon, delivery:r.delivery||"",
      box:r.box||"", cwt:r.cwt||"", cwtDeleted:!!r.cwtDeleted,
      remark:r.remark||"", logistics:r.logistics||"",
      logisticsManual:(r.logisticsManual===true||r.logisticsManual==="1"),
      noCar:(r.noCar===true||r.noCar==="1")            // 手删过「（第二车）」后缀的行，导入后别被自动挂回来
    };
  });
  const tb=$("tbody");
  const before=[...tb.children].filter(isDataRow).length;   // 只用于提示，不做任何删除
  snapshot(LS_DRAFT, "导入发布记录");                        // 留档（「数据急救」页可找回）
  const d=recShipDate(rec)||todayStr();                     // 行里没写日期的，用这条记录自己的发货日期兜底
  let firstTr=null;
  rows.forEach(r=>{
    const tr=addRow(Object.assign({}, r, {shipdate:r.shipdate||d}), null, null, true);   // 只加行，不动任何已有行
    if(!firstTr) firstTr=tr;
  });
  reindex(); sortRowsByDate(); recalc(); foldByDate(); styleShipdate(); fitTextareas(true);
  saveDraftNow();
  try{ if(firstTr) firstTr.scrollIntoView({block:"center"}); }catch(e){}   // 直接看到新进来的那几行
  toast("已新增 "+rows.length+" 行（来源 "+(rec.no||"发布记录")+"），原有 "+before+" 行没动；改完点「发布」即可重新发布");
}

function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function rowsToCsv(rows){ 
  const head=["发货日期","送达方","型号","发货数量","发货点","箱重T","产品重量T","交货单","箱数","时效要求","物流"];

  return "﻿"+lines.join("\n");
}

function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      // 导入会整片覆盖本机数据 → 先给每个将被覆盖的键留一份快照，导错可原样退回
      BACKUP_KEYS.forEach(k=>{ if(k in data) snapshot(k, "导入备份前"); });
      BACKUP_KEYS.forEach(k=>{ if(k in data){ const v=data[k]; safeSet(k, typeof v==="string"?v:JSON.stringify(v)); } });
      if(window.CloudSync){ BACKUP_KEYS.forEach(k=>{
        if(k === LS_REC){ markPending(true); flushRec(true); return; }     // 发布记录一律走"合并推送"，不整份覆盖云端（先记待补传，防止下面的刷新打断）
        let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); }
      }); }
      toast("备份已导入，正在刷新…");
      setTimeout(()=>location.reload(),700);
    }catch(e){ toast("备份文件解析失败："+e.message); }
  };
  reader.readAsText(file);
}

// ===================== 复制粘贴（Ctrl+V，从 Excel 等按列填入表格） =====================
// 展示列顺序（与表头/每行单元格 data-f 一一对应）；箱重T/产品重量T/客户吨位 为自动列，只占位不填充
const PASTE_COLS=["shipdate","customer","model","qty","shippt","delivery","box","remark","cwt","ton","subton","logistics","code"];
const PASTE_AUTO={cwt:1,ton:1,subton:1};
const PASTE_LABEL={shipdate:"发货日期",customer:"送达方",model:"型号",qty:"发货数量",shippt:"发货点",delivery:"交货单",box:"箱数",remark:"时效要求",logistics:"物流",code:"物料编码"};
// 往单元格写值（下拉框自动补选项；箱数手填要打 manual 标记，避免被自动计算覆盖）
function pasteFill(tr,f,v){
  if(!tr||PASTE_AUTO[f]) return;
  const el=tr.querySelector(`[data-f="${f}"]`);
  if(!el) return;
  const val=(v==null?"":String(v)).trim();
  if(el.tagName==="SELECT"){
    if(!val) return;
    let hit=null;
    [...el.options].forEach(o=>{ if(o.value===val||o.textContent.trim()===val) hit=o; });
    if(!hit){ hit=document.createElement("option"); hit.value=val; hit.textContent=val; el.appendChild(hit); }
    el.value=hit.value;
    return;
  }
  if(f==="shipdate"){                                   // 日期：宽容解析（Excel 各种写法都认）；认不出来就跳过，不覆盖原值
    const d=parseDateLoose(val);
    if(!d) return;
    el.value=d;
    return;
  }
  el.value=val;
  // 手填语义：箱数、物流贴进来就是「人工值」，不许被自动计算 / 按客户自动带出覆盖；
  // 贴进来是空的 → 清掉标记，恢复自动（箱数按算式算、物流按客户带）
  if(f==="box"||f==="logistics"){ if(val==="") delete el.dataset.manual; else el.dataset.manual="1"; }
}
// 从「落点行」开始取 count 行（不够就自动补行）
// appendIfNoAnchor=true：没有落点行时在表格末尾「追加新行」（而不是覆盖最后一行）
function pasteTargetRows(anchorTr, count, appendIfNoAnchor){
  const rows=allRows();
  let start=anchorTr?rows.indexOf(anchorTr):-1;
  if(start<0) start=appendIfNoAnchor?rows.length:rows.length-1;
  if(start<0) start=0;
  const out=[];
  for(let i=0;i<count;i++){
    let tr=rows[start+i];
    if(!tr){ tr=addRow({}, null, null, true); rows.push(tr); }
    out.push(tr);
  }
  return out;
}
// 粘贴进来的行：其它列按粘贴内容原样写入，但「发货日期」统一按表头发货日期给（表头默认=明天）。
// 用户口径：粘过来的数据一点不要动，日期自动改成明天 —— 粘一批行就是「这批货明天发」。
function applyPlanDateToRows(rows){
  const d=$("shipDate").value||todayStr();          // 表头默认就是明天；用户改过表头就跟着表头走
  rows.forEach(tr=>{ const el=tr.querySelector('[data-f="shipdate"]'); if(el) el.value=d; });
  return d;
}
// 粘贴进来的行必须看得见：把这些行所在的日期分组强制展开（只动折叠状态，绝不碰日期）
function expandPastedDateGroups(rows){
  const st=getFoldState(); const today=realTodayStr(); let hit=false;
  rows.forEach(tr=>{
    const el=tr.querySelector('[data-f="shipdate"]');
    const d=el?String(el.value||"").trim():"";
    const collapsed=(st[d]===1) || (st[d]===undefined && !(d>today));   // 显式折叠 或 默认折叠（当天及之前/空日期）
    if(collapsed){ st[d]=0; hit=true; }
  });
  if(hit){ localStorage.setItem(FOLD_STATE_KEY, JSON.stringify(st)); foldByDate(); fitTextareas(); }
  return hit;
}
// 粘贴后统一收尾：补物料库字段 → 重算 → 合并 → 存草稿 → 按型号带出送达方

function onTablePaste(e){
  const cd=e.clipboardData||window.clipboardData;
  if(!cd) return;
  const txt=cd.getData("text");
  if(!txt) return;
  const lines=txt.replace(/\r/g,"").split("\n").filter(r=>r.trim()!=="");
  if(!lines.length) return;
  const grid=lines.map(l=>l.split("\t").map(v=>v.trim()));
  // 有的来源（比如从本页勾选列开始框选复制）会多带一个「全空的勾选框列」→ 去掉最左全空列，免得整行数据整体错位
  while(grid.length && grid.every(r=>r.length>1 && (r[0]||"")==="")) grid.forEach(r=>r.shift());
  const maxCols=Math.max(...grid.map(r=>r.length));
  const cell=(e.target&&e.target.closest)?e.target.closest("[data-f]"):null;
  const startField=cell?cell.dataset.f:null;
  const tr0=(e.target&&e.target.closest)?e.target.closest("tr"):null;
  const finish=(rows,msg,custPasted,planDate)=>{
    pasteFinish(rows, !!custPasted);
    expandPastedDateGroups(rows);                        // 粘进来的行必须看得见（只展开折叠，不改日期）
    toast(planDate ? (msg+"；发货日期已设为 "+planDate+"（表头日期）") : msg);
  };

  // ⓪ 「整行」粘贴：首列是发货日期（或落点就在「发货日期」列且≥3列）→ 视为整行数据，从「发货日期」开始按列对齐
  //    这样「复制」按钮复制出来的内容（13 列）就能原样粘回表格，整行还原
  if(isDateLike(grid[0][0]) && (maxCols>=3 || startField==="shipdate" || !startField)){
    e.preventDefault();
    const rows=pasteTargetRows(tr0, grid.length, !tr0);
    grid.forEach((vals,ri)=>{
      const tr=rows[ri];
      vals.forEach((v,ci)=>{ const f=PASTE_COLS[ci]; if(f) pasteFill(tr,f,v); });
    });
    const planDate=applyPlanDateToRows(rows);          // 其它列按粘贴原样，日期统一给表头日期（默认明天）
    sortRowsByDate();                                  // 按日期归位（同日期保持原有先后）
    const custPasted=PASTE_COLS.slice(0,maxCols).indexOf("customer")>=0;   // 粘贴区含「送达方」列 → 以粘贴值为准
    finish(rows, "已粘贴 "+grid.length+" 行（整行信息）", custPasted, planDate);
    return;
  }
  // ① 型号 / 发货数量（两列以内）：从当前行往下铺，第二列互为另一列
  if((startField==="model"||startField==="qty") && maxCols<=2){
    e.preventDefault();
    const rows=pasteTargetRows(tr0, grid.length);
    grid.forEach((vals,i)=>{
      const tr=rows[i];
      if(startField==="model"){
        pasteFill(tr,"model",vals[0]);
        if(vals[1]!==undefined) pasteFill(tr,"qty",vals[1]);   // 第二列视为发货数量
      } else {
        pasteFill(tr,"qty",vals[0]);
        if(vals[1]!==undefined) pasteFill(tr,"model",vals[1]); // 第二列视为型号
      }
    });
    finish(rows, "已粘贴 "+grid.length+" 行（型号/发货数量）");
    return;
  }
  // ② 物料编码：单列向下铺；两列时只取第一列
  if(startField==="code" && maxCols<=2){
    e.preventDefault();
    const rows=pasteTargetRows(tr0, grid.length);
    grid.forEach((vals,i)=>pasteFill(rows[i],"code",vals[0]));
    finish(rows, "已粘贴 "+grid.length+" 行（物料编码）");
    return;
  }
  // ③ 单列多行：向下填充「当前这一列」（只复制一列数据时用）
  if(maxCols<=1){
    if(!startField || !tr0 || lines.length<2 || PASTE_AUTO[startField]) return;   // 单行/没落点 → 交给浏览器默认粘贴
    const list=grid.map(r=>r[0]).filter(v=>v!=="");
    if(!list.length) return;
    e.preventDefault();
    const rows=pasteTargetRows(tr0, list.length);
    rows.forEach((tr,i)=>pasteFill(tr, startField, list[i]));
    finish(rows, "已粘贴 "+list.length+" 行到「"+(PASTE_LABEL[startField]||startField)+"」", startField==="customer");
    return;
  }
  // ④ 多列：以「落点所在列」为起点，向右按列填入，第一行落在当前行
  e.preventDefault();
  let a=PASTE_COLS.indexOf(startField);
  if(a<0) a=0;
  const custPasted=PASTE_COLS.slice(a, a+maxCols).indexOf("customer")>=0;   // 粘贴区含「送达方」列 → 以粘贴值为准
  const rows=pasteTargetRows(tr0, grid.length);
  grid.forEach((vals,ri)=>{
    const tr=rows[ri];
    vals.forEach((v,ci)=>{ const f=PASTE_COLS[a+ci]; if(f) pasteFill(tr,f,v); });
  });
  // 粘贴区覆盖了「发货日期」列 → 日期统一给表头日期（默认明天）；没覆盖就完全不碰日期
  const coversDate=PASTE_COLS.slice(a, a+maxCols).indexOf("shipdate")>=0;
  const planDate=coversDate?applyPlanDateToRows(rows):null;
  finish(rows, "已粘贴 "+grid.length+" 行", custPasted, planDate);
}

  const CLOUD_KEYS=[LS_DB, LS_DEL, LS_REC, LS_ARCHIVE];

  const CLOUD_MERGE={};
  CLOUD_MERGE[LS_REC]=(localStr, cloudStr)=>{

    try{ b=JSON.parse(cloudStr)||[]; }catch(e){ b=[]; }
    return JSON.stringify(mergeRecords(b, a));
  };
  // 墓碑取并集：本地这次没记录到的删除不能因为"云端的那份更短"被抹掉
  CLOUD_MERGE[LS_DEL]=(localStr, cloudStr)=>{
    let a=[], b=[];
    try{ a=JSON.parse(localStr)||[]; }catch(e){ a=[]; }
    try{ b=JSON.parse(cloudStr)||[]; }catch(e){ b=[]; }
    const set=new Set((Array.isArray(a)?a:[]).map(String));
    (Array.isArray(b)?b:[]).forEach(x=>set.add(String(x)));
    return JSON.stringify([...set].slice(-800));
  };

  CLOUD_MERGE[LS_ARCHIVE]=(localStr, cloudStr)=>{
    const arr = v => { let a=[]; try{ a=JSON.parse(v)||[]; }catch(e){} return Array.isArray(a)?a:[]; };
    const map = new Map();
    arr(cloudStr).forEach(r=>{ const k=recKeyOf(r); if(k) map.set(k,r); });
    arr(localStr).forEach(r=>{ const k=recKeyOf(r); if(k) map.set(k,r); });   // 本地优先

  try{

/* ==================================================================
   发货进度（现场扫码 → 管理端实时看板）
   ------------------------------------------------------------------
   · 现场用手机扫「发货单上的二维码」→ 打开 扫码.html → 点一下推进一步工序
   · 进度存在云端 key = shipping_progress_v1（合并规则「只增不减」，见 scan-lib.js）
   · 这里：① 看板打开期间每 10 秒拉一次，实时显示
           ② 看板关着时每 60 秒拉一次，只更新发布记录卡上的进度摘要
   ================================================================== */
const SLB = window.ScanLib;
let PROG = {};
let progOpen = false, progTimer = 0;
let progQuery = "";          // 发货进度看板的模糊搜索关键词（空 = 不筛选）

function progStatsOf(rec){
  return SLB ? SLB.progStats(rec, PROG) : { total: 0, done: 0, car: 0, touched: 0, last: 0, step: 0 };
}

async function pullProg(){
  if(!SLB) return false;
  /* 先把本机那份合并进来：上一次推送没成功（网络抖）时，改动只在本机 ——
     直接拿云端覆盖会把它丢掉（表现：填完的预约刷新一下就没了）。
     mergeProg 是「rv 大者优先 + 只增不减」，本机的陈旧数据不会赢过云端的新数据。 */
  try{
    const local = JSON.parse(localStorage.getItem(SLB.KEY_PROG) || "null");
    if(local && typeof local === "object") PROG = SLB.mergeProg(PROG, local);
  }catch(e){}
  let ok = true;
  if(window.CloudSync && CloudSync.ready()){
    try{
      const r = await CloudSync.pullResult(SLB.KEY_PROG);
      ok = r.ok;
      if(r.ok && r.value && typeof r.value === "object") PROG = SLB.mergeProg(PROG, r.value);
    }catch(e){ ok = false; }
  } else {
    try{ const v = JSON.parse(localStorage.getItem(SLB.KEY_PROG) || "null"); if(v && typeof v === "object") PROG = SLB.mergeProg(PROG, v); }catch(e){}
  }
  try{ localStorage.setItem(SLB.KEY_PROG, JSON.stringify(PROG)); }catch(e){}
  /* 预约货好到点 → 落成真实数据（rv+1、留痕「预约货好」）。
     放在合并之后跑：本地刚拉回来的也行、别处推上来的也行，反正到点就变货好。
     顺带把「上次没推上去的改动」补传一次。两者都没有就别推，否则每 10 秒空推一趟。 */
  let autoN = 0;
  try{ autoN = SLB.applyReadyAuto(PROG, "") || 0; }catch(e){ autoN = 0; }
  if(autoN){ try{ localStorage.setItem(SLB.KEY_PROG, JSON.stringify(PROG)); }catch(e){} }
  if((autoN > 0 || isPenP()) && window.CloudSync && CloudSync.ready()){
    try{ markPenP(!(await CloudSync.push(SLB.KEY_PROG, PROG))); }catch(e){}
  }
  updateRecProg();
  if(progOpen) renderBoard();
  return ok;
}

// 改完进度（车辆取消 / 撤销 / 标记货好 / 预约时间）后：先落本机，再合并推上云端（走 guardFn）。
// 推上去后，内部大屏 / 司机页的下一轮拉取就会带上最新状态。
function pushProg(){
  try{ localStorage.setItem(SLB.KEY_PROG, JSON.stringify(PROG)); }catch(e){}
  if (window.CloudSync && CloudSync.ready()){
    markPenP(true);                       // 万一这次没推上去，下一轮拉取时自动补传
    Promise.resolve(CloudSync.push(SLB.KEY_PROG, PROG))
      .then(function(ok){ markPenP(!ok); }).catch(function(){});
  }
  updateRecProg();
  if (progOpen) renderBoard();
}

// 发布记录卡上的进度摘要（就地刷新，不动别的）
function updateRecProg(){
  if(!SLB) return;
  const map = new Map(loadRec().map(function(r){ return [String(r.id), r]; }));
  document.querySelectorAll("#records .rec[data-rec]").forEach(function(card){
    const rec = map.get(card.dataset.rec);
    const el = card.querySelector("[data-prog]");
    if(!rec || !el) return;
    const st = progStatsOf(rec);
    if(!st.total){ el.textContent = ""; el.className = "recprog"; el.title = ""; }
    else if(!st.touched){
      el.textContent = "发货进度 未开始";
      el.className = "recprog";
      el.title = "现场还没有扫码。点「二维码」把码印到发货单上，现场扫一次就更新一道工序。";
    } else if(st.done === st.total){
      el.textContent = "发货进度 全部完成 ✓（" + st.done + "/" + st.total + "）";
      el.className = "recprog all";
      el.title = "全部客户已完成" + (st.last ? "　最后更新 " + SLB.fmtHM(st.last) : "");
    } else {
      el.textContent = "发货进度 已完成 " + st.done + "/" + st.total + " ｜ 车已到 " + st.car + "/" + st.total;
      el.className = "recprog run";
      el.title = "现场扫码实时更新" + (st.last ? "　最后更新 " + SLB.fmtHM(st.last) : "");
    }
  });
}

/* 发货进度看板显示哪些单（2026-09-19 收紧）：
   只看「今天」和「明天」两天 —— 以前是"最近 7 天"，单子一多就得翻半天才找到今天要发的。
   发货点要连着干两天，所以明天的一起放出来（明天的单在前，先装先走）。 */
function boardRecords(){
  const ok = {}; ok[realTodayStr()] = 1; ok[todayStr()] = 1;
  return loadRec()
    .filter(function(r){ const d = String(recShipDate(r) || "").slice(0, 10); return !d || ok[d]; })
    .sort(function(a, b){
      const x = String(recShipDate(a) || ""), y = String(recShipDate(b) || "");
      if(x !== y) return x < y ? -1 : 1;
      return (Number(b.id) || 0) - (Number(a.id) || 0);
    });
}

/* ================= 模糊搜索（2026-09-19） =================
   现场最常见的问法是「XX那个客户现在到哪一步了」，所以要能用**手边任何一条线索**定位：
   客户名 / 型号 / 物料编码 / 单号 / 物流 / 计划员 / 送达方代码，拼音首字母也认。
   匹配规则（每个空格分开的词都要命中 = AND）：
     ① 直接包含（不区分大小写、忽略空格）
     ② 顺序子序列："宁泰" 能搜到 "宁波泰友"，"bss" 能搜到 "Bosch"（像输入法那样跳着匹配）
   只在**同一行（客户）**内匹配，不是把整张表拼成一坨 —— 否则短词会乱命中。 */
function qNorm(s){ return String(s == null ? "" : s).toLowerCase().replace(/[\s\u3000]+/g, ""); }
function fuzzyHit(text, q){
  const t = qNorm(text);
  if(!t || !q) return false;
  if(t.indexOf(q) >= 0) return true;
  let i = 0;
  for(let k = 0; k < t.length && i < q.length; k++){ if(t.charAt(k) === q.charAt(i)) i++; }
  return i === q.length;                      // 顺序全都跳到了 → 模糊命中
}
function fuzzyAny(list, q){
  for(let i = 0; i < list.length; i++){ if(fuzzyHit(list[i], q)) return true; }
  return false;
}
// 把查询词切成一个个词（空格分隔，全角空格也算）
function qTerms(query){
  return String(query || "").split(/[\s\u3000]+/).map(qNorm).filter(Boolean);
}
// 这条明细（客户）身上能搜的东西：客户名 / 物流 / 型号 / 送达方代码
function groupHay(rec, g, codeMap){
  return [g.customer, g.logistics, (g.models || []).join(" "), codeMap[g.customer] || ""];
}
// 这张单身上能搜的东西：单号 / 计划员 / 发货日期 / 发布时刻
function recHay(rec){
  return [rec.no, rec.planner, recShipDate(rec), rec.publishedAt];
}

/* ================= 是否货好 / 预约货好时间（2026-09-18） =================
   计划员在这里勾「货好」或填「预约货好时间」；时间一到，系统自己把这一格变成
   「货已好」—— 到点那一刻起，所有屏（内部大屏 / 门口大屏 / 内部码 / 本看板）
   看到的都是「货好」，不需要任何人点，也不用等到第二天有人开页面。
   真实数据由 applyReadyAuto() 落库（rv+1、留痕「预约货好」），本页每次拉取后跑一次。 */
function tsToInput(ts){
  if(!ts) return "";
  const d = new Date(ts);
  if(isNaN(d.getTime())) return "";
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}
function inputToTs(v){
  if(!v) return 0;
  const d = new Date(v);              // datetime-local 给的是本地时间串
  return isNaN(d.getTime()) ? 0 : d.getTime();
}

function readyCellHtml(c, rk, key, cust){
  const raw = c.rs || 0;              // 数据里真实的工序值（判断能不能撤销要用它）
  // 「货好」是不是预约自动来的：还没落库 / 已落库（货好时间 = 预约时间）都算
  const auto = SLB.readyIsAuto ? SLB.readyIsAuto(c) : !!c.autoReady;
  const pill = auto ? '<span class="rdy auto">货已好 · 到点自动</span>'
    : (c.s >= 1 ? '<span class="rdy ok">货已好</span>' : '<span class="rdy wait">货待确认</span>');
  let btn = "";
  if(raw < 1) btn = '<button type="button" class="pbrdy" data-rdy="1" data-rk="' + SLB.esc(rk) + '" data-ck="' + SLB.esc(key) + '" data-cust="' + SLB.esc(cust) + '">标记货好</button>';
  else if(raw === 1) btn = '<button type="button" class="pbrdy undo" data-rdy="0" data-rk="' + SLB.esc(rk) + '" data-ck="' + SLB.esc(key) + '" data-cust="' + SLB.esc(cust) + '">撤销货好</button>';
  else btn = '<span class="lb">已装货</span>';
  const hit = (c.rt || 0) > 0 && Date.now() >= (c.rt || 0);
  const rt = '<div class="rdytime"><span class="lb">预约</span>' +
    '<input type="datetime-local" class="pbrt' + (hit ? " hit" : "") + '" data-rk="' + SLB.esc(rk) + '" data-ck="' + SLB.esc(key) +
      '" data-cust="' + SLB.esc(cust) + '" value="' + tsToInput(c.rt) + '" title="预约货好时间：到点后系统自动把这一格变成「货已好」">' +
    ((c.rt || 0) > 0 ? '<button type="button" class="pbclr" data-clr="1" data-rk="' + SLB.esc(rk) + '" data-ck="' + SLB.esc(key) + '" data-cust="' + SLB.esc(cust) + '" title="清空预约">✕</button>' : '') +
    (c.rt && !hit && c.s < 1 ? '<span class="lb">到点自动货好</span>' : '') + '</div>';
  return '<div>' + pill + btn + '</div>' + rt;
}

// 这张单的送达方代码（发布那一刻刻在明细行上的那份，不用再查物料库）
function custCodeMap(rec){
  const m = {};
  ((rec && rec.rows) || []).forEach(function(r){
    const cu = String(r.customer == null ? "" : r.customer).trim();
    const cc = String(r.custcode == null ? "" : r.custcode).trim();
    if(cu && cc) m[cu] = cc;
  });
  return m;
}
// 「今天 / 明天」小标签：看板只放这两天，得让人一眼看出哪张是今天的
function dayLabel(rec){
  const d = String(recShipDate(rec) || "").slice(0, 10);
  if(!d) return { txt: "未填日期", cls: "none" };
  if(d === realTodayStr()) return { txt: "今天", cls: "today" };
  if(d === todayStr()) return { txt: "明天", cls: "tmr" };
  return null;
}

function renderBoard(){
  const body = $("pbBody");
  if(!body) return;
  /* 10 秒自动刷新会重建整张表：正在编辑的「预约货好时间」输入框要保住
     （不保的话计划员选到一半就会被刷掉、日历也会被弹关）。 */
  const act = document.activeElement;
  const keep = (act && body.contains(act) && act.classList && act.classList.contains("pbrt"))
    ? { rk: act.getAttribute("data-rk"), ck: act.getAttribute("data-ck"), val: act.value } : null;
  const all = boardRecords();
  const terms = qTerms(progQuery);
  const qx = $("pbSearchX");
  if(qx) qx.classList.toggle("on", !!String(progQuery || "").length);
  const hitEl = $("pbHit");
  const setHit = function(txt){
    if(!hitEl) return;
    hitEl.textContent = txt || "";
    hitEl.classList.toggle("on", !!txt);
  };
  if(!all.length){
    body.innerHTML = '<div class="pb-empty">今天和明天还没有已发布的发货单。<br>' +
      '先在下面「发布记录」里发布，现场就能扫码更新进度了。</div>';
    $("pbSum").textContent = ""; setHit("");
    return;
  }
  let doneAll = 0, totAll = 0, carAll = 0, doneRecs = 0, shownRecs = 0, matched = 0;
  const html = all.map(function(rec){
    const codeMap = custCodeMap(rec);
    const hayRec = recHay(rec);
    // 单号 / 计划员 / 日期命中 → 这张单整个都摆出来（找"FH…-3655"就是要看它的全貌）
    const recAll = terms.length > 0 && terms.every(function(q){ return fuzzyAny(hayRec, q); });
    const gs = SLB.custGroups(rec).filter(function(g){
      if(!terms.length || recAll) return true;
      const hay = groupHay(rec, g, codeMap);
      return terms.every(function(q){ return fuzzyAny(hay, q); });
    });
    if(!gs.length) return "";
    shownRecs++; matched += gs.length;
    let d = 0, ca = 0;
    const rows = gs.map(function(g){
      const c = SLB.progOf(rec, g.key, PROG);
      if(c.s >= 3) d++;
      if(c.car) ca++;
      const rk = SLB.recKeyOf(rec);
      const cancelled = (c.cx || 0) ? true : false;
      const carHtml = cancelled ? '<span class="carx">已取消</span>'
        : (c.car ? '<span class="car on">✓ 已到</span>' : '<span class="car off">未到</span>');
      const btn = cancelled
        ? '<button type="button" class="pbcx undo" data-cx="undo" data-rk="' + SLB.esc(rk) + '" data-ck="' + SLB.esc(g.key) + '">撤销</button>'
        : '<button type="button" class="pbcx" data-cx="cancel" data-rk="' + SLB.esc(rk) + '" data-ck="' + SLB.esc(g.key) + '" data-cust="' + SLB.esc(g.customer) + '">车辆取消</button>';
      return "<tr><td>" + SLB.esc(g.customer) + "</td>" +
        "<td>" + SLB.esc(g.logistics || "/") + "</td>" +
        '<td class="n">' + (g.ton ? g.ton.toFixed(1) : "/") + "</td>" +
        '<td class="rdy-col">' + readyCellHtml(c, rk, g.key, g.customer) + "</td>" +
        "<td>" + SLB.progPill(c.s, c.car) + "</td>" +
        '<td class="car-col">' + carHtml + btn + "</td>" +
        '<td class="t">' + (c.u ? SLB.fmtHM(c.u) : "") + "</td></tr>";
    }).join("");
    const st = { total: gs.length, done: d, car: ca };
    doneAll += d; totAll += gs.length; carAll += ca;
    const full = st.total > 0 && st.done === st.total;
    if(full) doneRecs++;
    const dl = dayLabel(rec);
    return '<section class="pbone' + (full ? " full" : "") + '">' +
      '<div class="ph"><div><b>' + SLB.esc(String(rec.no || "（无单号）")) + "</b>" +
        (dl ? ' <span class="daytag ' + dl.cls + '">' + dl.txt + "</span>" : "") +
        (rec.planner ? ' <span class="pl">' + SLB.esc(rec.planner) + "</span>" : "") +
        '<div class="m">发货日期 ' + SLB.esc(SLB.pad(recShipDate(rec))) + " ｜ " + gs.length +
        " 个客户 ｜ 发布 " + SLB.esc(rec.publishedAt || "-") + "</div></div>" +
        '<div class="rt"><span class="pbstat' + (full ? " ok" : "") + '">已完成 ' + st.done + "/" + st.total +
        " ｜ 车已到 " + st.car + "/" + st.total + "</span></div></div>" +
      '<table class="pbt2"><thead><tr><th>客户</th><th>物流</th><th>吨位</th><th>是否货好 / 预约货好时间</th><th>发货进度</th><th>车辆</th><th>最后更新</th></tr></thead><tbody>' +
      rows + "</tbody></table></section>";
  }).filter(Boolean).join("");
  if(!html){
    body.innerHTML = '<div class="pb-empty">今天和明天的发货单里，没有匹配「' +
      SLB.esc(String(progQuery).trim()) + '」的客户。<br>换个关键词试试，或者点搜索框右边的 ✕ 清空。</div>';
    $("pbSum").textContent = ""; setHit("");
    return;
  }
  body.innerHTML = '<p class="pb-legend">是否货好：点「标记货好」直接置成货好；填「预约」时间后，' +
    '<b>时间一到系统自动变成「货已好」</b>（不用人点，晚上没人开页面也一样）　｜　' +
    '工序：货待确认 → 货好 → 装货中 → 已完成　｜　车辆：未到 / 已到 / 取消　｜　' +
    '<b>只显示今天和明天的发货单</b>；右上角搜索框可在这些单里按客户 / 型号 / 单号 / 物流 / 代码模糊找</p>' + html;
  $("pbSum").textContent = shownRecs + " 张单 ｜ 客户 " + totAll + " 个（已完成 " + doneAll + "，车已到 " + carAll + "）" +
    (doneRecs ? " ｜ " + doneRecs + " 张已全完成" : "");
  setHit(terms.length ? ("匹配 " + shownRecs + " 张单 · " + matched + " 个客户") : "");
  if(keep){
    const el = Array.prototype.filter.call(body.querySelectorAll("input.pbrt"), function(x){
      return x.getAttribute("data-rk") === keep.rk && x.getAttribute("data-ck") === keep.ck;
    })[0];
    if(el){ el.value = keep.val; el.focus(); }
  }
}

// 不再给每张单单独出码（2026-09-16 用户要求）：全厂只有两张通用码 ——
// 「内部人员码」（要登录，推四道工序）和「司机签到码」（只勾车已到）。
// 两处入口调的都是 scan-lib 里同一个弹层，所以永远不会有第三个地址。
function showCodes(){
  if(!SLB){ toast("进度模块没加载出来，请按 Ctrl+F5 刷新页面"); return; }
  SLB.openCodesModal();
}

function openBoard(){
  const m = $("progBoard");
  if(!m) return;
  m.style.display = "flex";
  progOpen = true;
  renderBoard();
  $("pbSync").textContent = "正在拉取现场进度…";
  pullProg().then(function(ok){
    $("pbSync").textContent = ok ? ("已同步 · " + new Date().toLocaleTimeString("zh-CN"))
                                 : "⚠ 暂时连不上云端，显示的是上次数据";
  });
  clearInterval(progTimer);
  progTimer = setInterval(function(){ if(progOpen && !document.hidden) pullProg(); }, 10000);
}
function closeBoard(){
  const m = $("progBoard");
  if(m) m.style.display = "none";
  progOpen = false;
  clearInterval(progTimer); progTimer = 0;
}

function bootProg(){
  if(!SLB){ console.warn("scan-lib.js 未加载，发货进度不可用"); return; }
  try{ if(window.CloudSync && CloudSync.guard) CloudSync.guard(SLB.KEY_PROG, SLB.guardFn); }catch(e){}
  const b = $("progBoardBtn"); if(b) b.onclick = openBoard;
  const cb = $("codesBtn"); if(cb) cb.onclick = showCodes;
  const c = $("pbClose"); if(c) c.onclick = closeBoard;
  const r = $("pbRefresh");
  if(r) r.onclick = function(){
    $("pbSync").textContent = "正在刷新…";
    pullProg().then(function(){ $("pbSync").textContent = "已同步 · " + new Date().toLocaleTimeString("zh-CN"); });
  };
  const m = $("progBoard");
  if(m) m.addEventListener("click", function(e){ if(e.target === m) closeBoard(); });
  /* 顶部模糊搜索：边打边筛。加 120ms 防抖 —— 每敲一个字就重建整张表，
     输入法组字时会一顿一顿的（尤其手机上）。 */
  const qin = $("pbSearch"), qclr = $("pbSearchX");
  let qTimer = 0;
  if(qin){
    qin.addEventListener("input", function(){
      clearTimeout(qTimer);
      qTimer = setTimeout(function(){ progQuery = qin.value || ""; renderBoard(); }, 120);
    });
    // 在搜索框里按 Esc = 清空搜索，不要把整个看板关掉（stopPropagation 拦住外层监听）
    qin.addEventListener("keydown", function(e){
      if(e.key !== "Escape") return;
      e.stopPropagation();
      if(qin.value){ qin.value = ""; progQuery = ""; renderBoard(); }
      else closeBoard();
    });
  }
  if(qclr) qclr.onclick = function(){
    if(qin) qin.value = "";
    progQuery = "";
    renderBoard();
    if(qin) qin.focus();
  };
  // 发货进度看板里的「车辆取消 / 撤销」：点按钮 → 页面自绘确认弹窗 → 确定后写进度并推云端
  const pbBody = $("pbBody");
  if (pbBody) pbBody.addEventListener("click", function(e){
    const el = e.target;
    if (!el || !el.closest) return;
    const btn = el.closest("button.pbcx");
    // 「是否货好」：标记货好 / 撤销货好
    const rdy = el.closest("button.pbrdy");
    // 「预约货好时间」：清空
    const clr = el.closest("button.pbclr");
    if (rdy){
      const rk = rdy.getAttribute("data-rk"), ck = rdy.getAttribute("data-ck");
      const cust = rdy.getAttribute("data-cust") || "该客户";
      if (!SLB) return;
      if (rdy.getAttribute("data-rdy") === "1"){
        const r = SLB.applyReady(PROG, rk, ck, true, "");
        pushProg();
        toast(r && r.changed ? "已标记【" + cust + "】货已好" : "【" + cust + "】已经是货好了");
      } else {
        SLB.uiConfirm("把【" + cust + "】退回「货待确认」？\n\n同时会清掉预约货好时间 —— 不清的话时间已经过了，会立刻又自动变成「货已好」。", function(){
          const r = SLB.applyReady(PROG, rk, ck, false, "");
          if (!r || !r.changed){ toast(r && r.why ? "不能退回：" + r.why : "不用退回"); return; }
          pushProg();
          toast("已把【" + cust + "】退回货待确认");
        }, { title: "撤销货好" });
      }
      return;
    }
    if (clr){
      if (!SLB) return;
      const rk = clr.getAttribute("data-rk"), ck = clr.getAttribute("data-ck");
      const cust = clr.getAttribute("data-cust") || "该客户";
      SLB.applyReadyAt(PROG, rk, ck, 0, "");
      pushProg();
      toast("已清空【" + cust + "】的预约货好时间");
      return;
    }
    if (!btn) return;
    const rk = btn.getAttribute("data-rk"), ck = btn.getAttribute("data-ck"), mode = btn.getAttribute("data-cx");
    if (mode === "cancel"){
      const cust = btn.getAttribute("data-cust") || "该客户";
      if (!SLB || !SLB.uiConfirm){ toast("进度模块没加载，请按 Ctrl+F5 刷新"); return; }
      SLB.uiConfirm("确定取消【" + cust + "】的车辆吗？\n\n取消后，内部大屏该客户「车辆」栏会显示红字「取消」。", function(){
        SLB.applyCarCancel(PROG, rk, ck, "");
        pushProg();
        toast("已取消【" + cust + "】的车辆，内部大屏将显示红字「取消」");
      }, { title: "车辆取消" });
    } else {
      if (!SLB) return;
      SLB.applyCarUncancel(PROG, rk, ck, "");
      pushProg();
      toast("已撤销车辆取消");
    }
  });
  // 「预约货好时间」输入框：选完/改完（change）立刻存下来并推云端。
  // 留空 = 清掉预约。填的时间已经过了就直接算货已好（不留"半截状态"）。
  if (pbBody) pbBody.addEventListener("change", function(e){
    const inp = e.target;
    if (!inp || !inp.classList || !inp.classList.contains("pbrt")) return;
    if (!SLB) return;
    const rk = inp.getAttribute("data-rk"), ck = inp.getAttribute("data-ck");
    const cust = inp.getAttribute("data-cust") || "该客户";
    const ts = inputToTs(inp.value);
    if (!ts){
      SLB.applyReadyAt(PROG, rk, ck, 0, "");
      pushProg();
      toast("已清空【" + cust + "】的预约货好时间");
      return;
    }
    SLB.applyReadyAt(PROG, rk, ck, ts, "");
    pushProg();
    toast("【" + cust + "】预约货好时间 " + SLB.fmtHM(ts) +
      (ts <= Date.now() ? "（时间已过，直接算货已好）" : "（到点自动变成货已好）"));
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && progOpen) closeBoard(); });
  pullProg();
  setInterval(function(){ if(!document.hidden && !progOpen) pullProg(); }, 60000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && !progOpen) pullProg(); });
}
// ★ 必须在 DOM 就绪后再初始化：看板的 DOM 排在脚本后面，直接调用的话
//   bootProg 里的 $("pbClose")/$("progBoard") 还是 null，关闭按钮会点不动。
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootProg);
else bootProg();
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", updateOpStatus);
else updateOpStatus();
</script>
<!-- 发货进度看板（现场扫码实时更新） -->
<div class="prog-mask" id="progBoard">
  <div class="pb">
    <div class="head">
      <span class="t">发货进度</span>
      <span class="s" id="pbSync">打开期间每 10 秒自动刷新</span>
      <span class="qbox">
        <span class="mag">🔍</span>
        <input id="pbSearch" class="pbq" type="search" autocomplete="off" enterkeyhint="search"
          placeholder="搜客户 / 型号 / 单号 / 物流 / 代码">
        <button type="button" class="pbq-x" id="pbSearchX" title="清空搜索">✕</button>
      </span>
      <span class="pb-hit" id="pbHit"></span>
      <span class="sp">
        <span class="s" id="pbSum"></span>
        <button class="btn btn-line pbsm" id="pbRefresh">↻ 刷新</button>
