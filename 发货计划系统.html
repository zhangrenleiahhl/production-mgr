// 内容指纹：把勾选行的关键字段归一化后排序拼接再哈希，用于发布前与已发布记录比对（与行顺序无关）
function fingerprintRows(rows){
  const norm = r => [r.shipdate,r.customer,r.code,r.model,r.qty,r.shippt,r.ton,r.box,r.cwt,r.delivery,r.remark,r.logistics]
    .map(v=>(v==null?"":String(v)).trim()).join("");
  const parts = rows.map(norm).sort();
  const s = parts.join("|");
  let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }
  return h.toString(36);
}
function publish(){
  const allTrs=[...$("tbody").children].filter(isDataRow);
  if(!allTrs.length){ toast("请先添加发货明细"); return; }
  // 发布前必须勾选确认：仅发布已勾选的行
  const checkedTrs=allTrs.filter(tr=>tr.querySelector(".row-check")?.checked);
  if(!checkedTrs.length){ toast("发布前请先勾选要发布的行（✓ 列）"); return; }

  // ===== 必填项校验：送达方 / 时效要求 / 客户吨位 必须填写才能发布 =====
  // 计算各「送达方|发货日期」组的客户吨位（与表格显示一致：手动覆盖值优先，否则自动合计 产品重量T+箱重T）
  const subMap={};
  const visRows=[...$("tbody").children].filter(isDataRow)
    .filter(tr=>!tr.classList.contains("filter-hidden")&&!tr.classList.contains("date-fold-hidden"));
  (function(){
    let i=0;
    while(i<visRows.length){
      const first=visRows[i];
      const cust=(first.querySelector('[data-f="customer"]')?.value||"").trim();
      const date=(first.querySelector('[data-f="shipdate"]')?.value||"").trim();
      if(!cust){ i++; continue; }
      const key=cust+"|"+date;
      let j=i+1;
      while(j<visRows.length){
        const c2=(visRows[j].querySelector('[data-f="customer"]')?.value||"").trim();
        const d2=(visRows[j].querySelector('[data-f="shipdate"]')?.value||"").trim();
        if(c2+"|"+d2!==key) break;
        j++;
      }
      let subTon=0;
      for(let k=i;k<j;k++){ subTon+=(parseFloat(visRows[k].querySelector('[data-f="ton"]')?.value)||0)+(parseFloat(visRows[k].querySelector('[data-f="cwt"]')?.value)||0); }
      const ov=ctOverride(cust,date);
      subMap[key]=ov!==null?ov:subTon;
      i=j;
    }
  })();
  // 兼容合并单元格：按「送达方|发货日期」取组内首个非空时效要求作为该组合规值
  const remarkMap={};
  (function(){
    let i=0;
    while(i<visRows.length){
      const first=visRows[i];
      const cust=(first.querySelector('[data-f="customer"]')?.value||"").trim();
      const date=(first.querySelector('[data-f="shipdate"]')?.value||"").trim();
      if(!cust){ i++; continue; }
      const key=cust+"|"+date;
      let j=i+1;
      while(j<visRows.length){
        const c2=(visRows[j].querySelector('[data-f="customer"]')?.value||"").trim();
        const d2=(visRows[j].querySelector('[data-f="shipdate"]')?.value||"").trim();
        if(c2+"|"+d2!==key) break;
        j++;
      }
      let remark="";
      for(let k=i;k<j;k++){
        const v=(visRows[k].querySelector('[data-f="remark"]')?.value||"").trim();
        if(v && v!=="/"){ remark=v; break; }
      }
      remarkMap[key]=remark;
      i=j;
    }
  })();

  const miss=[];
  checkedTrs.forEach((tr,idx)=>{
    const cust=(tr.querySelector('[data-f="customer"]')?.value||"").trim();
    const shipdate=(tr.querySelector('[data-f="shipdate"]')?.value||"").trim();
    const key=cust+"|"+shipdate;
    // 优先读当前行 input；若为空则取合并组的首个非空值
    let remark=(tr.querySelector('[data-f="remark"]')?.value||"").trim();
    if(!remark || remark==="/") remark=remarkMap[key]||"";
    const msgs=[];
    if(!cust||cust==="/") msgs.push("送达方未填");
    if(!remark||remark==="/") msgs.push("时效要求未填");
    const st=subMap[key];
    if(st===undefined||st===""||isNaN(parseFloat(st))||parseFloat(st)<=0) msgs.push("客户吨位为空或为0（请填产品重量T/箱重T，或手动填客户吨位）");
    if(msgs.length) miss.push("第"+(idx+1)+"行【"+(cust||"空")+"】："+msgs.join("、"));
  });
  if(miss.length){
    toast("⚠ 必填项未填，无法发布");
    alert("以下必填项未填写，请补全后再发布：\n\n"+miss.slice(0,15).join("\n")+(miss.length>15?"\n…等共 "+miss.length+" 处":""));
    return;
  }

  const f=v=>{ v=(v==null?"":String(v).trim()); return v===""?"/":v; };
  const rows=checkedTrs.map(tr=>{
    const cust=f(tr.querySelector('[data-f="customer"]').value);
    const shipdate=f(tr.querySelector('[data-f="shipdate"]').value);
    const key=(cust==="/"?"":cust)+"|"+(shipdate==="/"?"":shipdate);
    let remark=f(tr.querySelector('[data-f="remark"]').value);
    if(remark==="/") remark=remarkMap[key]||"/";
    return {
      shipdate,
      customer:cust,
      code:f(tr.querySelector('[data-f="code"]').value),
      model:f(tr.querySelector('[data-f="model"]').value),
      qty:f(tr.querySelector('[data-f="qty"]').value),
      shippt:f(tr.querySelector('[data-f="shippt"]').value),
      perbox:f(tr.querySelector('[data-f="perbox"]').value),
      ton:f(tr.querySelector('[data-f="ton"]').value),
      box:f(tr.querySelector('[data-f="box"]').value),
      cwt:f(tr.querySelector('[data-f="cwt"]').value),
      delivery:f(tr.querySelector('[data-f="delivery"]').value),
      remark,
      logistics:f(tr.querySelector('[data-f="logistics"]')?.value)
    };
  });
  // ===== 内容防重：与已发布记录比对，完全相同则提醒确认 =====
  const fp = fingerprintRows(rows);
  const dup = loadRec().filter(r=>r.fingerprint && r.fingerprint===fp);
  if(dup.length){
    const nos = dup.map(r=>r.no).join("、");
    if(!confirm("⚠ 这批内容与已发布的计划单（"+nos+"）完全相同。\n\n确定要再次发布吗？\n（如为修改后重发，请先改动内容或换一个单号）")) return;
  }
  if(rows.some(r=>!r.model || !r.qty) && !confirm("存在「型号」或「数量」为空行，仍要发布？")) return;
  if(!confirm("确认发布已勾选的 "+rows.length+" 行？")) return;

  // 把本次发布涉及的「客户吨位」手动修改打包进记录，发货员端自动同步显示
  const _ct=loadCT(), _raw=v=>String(v==null||v==="/"?"":v).trim(), custTon={};
  rows.forEach(r=>{ const k=ctKeyOf(_raw(r.customer),_raw(r.shipdate)); if(_ct[k]!==undefined) custTon[k]=_ct[k]; });

  // 汇总：只统计本次实际发布的行（不再用全局合计，避免把未勾选/其它计划也算进来）
  const _n = v => parseFloat(String(v==null||v==="/"?"":v).trim())||0;
  const sumQty = rows.reduce((a,r)=>a+_n(r.qty), 0);
  const sumTon = rows.reduce((a,r)=>a+_n(r.ton), 0);
  const sumBox = rows.reduce((a,r)=>a+_n(r.box), 0);
  const sumSubTon = rows.reduce((a,r)=>a+_n(r.ton)+_n(r.cwt), 0);
  // 存档文本数据
  const rec={id:Date.now(),date:$("shipDate").value,no:$("planNo").value,
    publishedAt:new Date().toLocaleString("zh-CN"),rows,
    sumQty:sumQty||"0",sumTon:sumTon.toFixed(1),sumBox:sumBox>0?sumBox:"/",
    sumSubTon:sumSubTon>0?sumSubTon.toFixed(1):"0.0",custTon,fingerprint:fp};
  saveRec(rec); renderRecords();
  toast("已发布 ✓（单号 "+rec.no+" · 共 "+rows.length+" 行）· 已同步到发货员链接");
  // 发布后自动取消勾选，避免顺手重复发布同一批
  [...$("tbody").querySelectorAll(".row-check")].forEach(b=>b.checked=false);
  updateCheckAll();
  $("planNo").value=genPlanNo(); syncDocHead();
  saveDraft();
  try{ if(window.__clientBackup) window.__clientBackup(); }catch(e){}
}

function styleShipdate(){
  document.querySelectorAll('[data-f="shipdate"]').forEach(inp=>{
    const v=(inp.value||"").trim();
    if(v.includes("自提")) inp.classList.add("jinling");
    else inp.classList.remove("jinling");
  });
}
// 按发货日期标记行的状态：<边界=滞后(红)  >边界=之后(蓝)  边界当天=正常
function markRowStates(){
  const today=$("shipDate").value||todayStr();
  [...$("tbody").children].forEach(tr=>{
    if(!isDataRow(tr)) return;
    const d=tr.querySelector('[data-f="shipdate"]')?.value||"";
    tr.classList.toggle("row-overdue", !!(d && d<today));
    tr.classList.toggle("row-future", !!(d && d>today));
  });
}
function updateCheckAll(){
  // 仅统计可见行（排除被折叠或筛选隐藏的行），否则隐藏行永远不勾选会让表头全选框恒为半选
  const boxes=[...$("tbody").querySelectorAll(".row-check")].filter(b=>{
    const tr=b.closest("tr");
    return !tr.classList.contains("date-fold-hidden") && !tr.classList.contains("filter-hidden");
  });
  const checked=boxes.filter(b=>b.checked).length;
  const all=$("checkAll");
  all.checked = boxes.length>0 && checked===boxes.length;
  all.indeterminate = checked>0 && checked<boxes.length;
  updateKPIs();
}
function updateKPIs(){
  const rows=[...$("tbody").children].filter(isDataRow);
  const visibleRows=rows.filter(tr=>!tr.classList.contains("date-fold-hidden")&&!tr.classList.contains("filter-hidden"));
  let qty=0, ton=0, checked=0;
  visibleRows.forEach(tr=>{
    qty+=qtyNum(tr.querySelector('[data-f="qty"]')?.value);
    ton+=parseFloat(tr.querySelector('[data-f="ton"]')?.value)||0;
    if(tr.querySelector('.row-check')?.checked) checked++;
  });
  const kpiRows=$("kpiRows"), kpiQty=$("kpiQty"), kpiTon=$("kpiTon"), kpiChecked=$("kpiChecked");
  if(kpiRows) kpiRows.innerHTML=visibleRows.length+'<span class="kpi-unit">行</span>';
  if(kpiQty) kpiQty.innerHTML=qty+'<span class="kpi-unit">件</span>';
  if(kpiTon) kpiTon.innerHTML=ton.toFixed(1)+'<span class="kpi-unit">t</span>';
  if(kpiChecked) kpiChecked.innerHTML=checked+'<span class="kpi-unit">行</span>';
}
function saveRec(rec){
  let list=loadRec(); list.unshift(rec);
  if(list.length>200) list=list.slice(0,200);   // 文本数据体积小，可保留更多
  try{ localStorage.setItem(LS_REC, JSON.stringify(list)); }
  catch(e){ localStorage.setItem(LS_REC, JSON.stringify(list.slice(0,50))); toast("存储空间不足，仅保留最近 50 条"); }
  if(window.CloudSync) CloudSync.autoPush(LS_REC);
}
function loadRec(){ try{ return JSON.parse(localStorage.getItem(LS_REC))||[]; }catch(e){ return []; } }
function renderRecords(){
  const list=loadRec(); $("recCount").textContent=list.length+" 条";
  const box=$("records"); box.innerHTML="";
  $("recEmpty").style.display=list.length?"none":"block";
  list.forEach(rec=>{
    const div=document.createElement("div"); div.className="rec";
    div.innerHTML=`
      <div class="info"><b>${rec.no}</b><br>日期：${rec.date}${rec.maker?' ｜ 制单：'+rec.maker:''}<br>
        共 ${rec.rows.length} 行 ｜ 数量 ${rec.sumQty} ｜ ${rec.sumTon}t ｜ 客户吨位 ${rec.sumSubTon||"/"}t ｜ ${rec.sumBox}箱<br>发布：${rec.publishedAt}</div>
      <div class="acts">
        <button class="btn btn-line" data-act="csv">导出CSV</button>
        <button class="btn btn-danger" data-act="del">删除</button>
      </div>`;
    div.querySelector('[data-act="csv"]').onclick=()=>exportRowsCsv(rec.rows, rec.no);
    div.querySelector('[data-act="del"]').onclick=()=>{
      if(confirm("确认删除该发布记录？")){ localStorage.setItem(LS_REC, JSON.stringify(loadRec().filter(r=>r.id!==rec.id))); renderRecords(); if(window.CloudSync) CloudSync.autoPush(LS_REC); }
    };
    box.appendChild(div);
  });
  updateKPIs();
}

// ===================== 导出 =====================
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function rowsToCsv(rows){ 
  const head=["发货日期","送达方","型号","发货数量","发货点","箱重T","产品重量T","交货单","箱数","时效要求","物流"];
  const lines=[head.join(",")];
  rows.forEach(r=>lines.push([r.shipdate,r.customer,r.model,r.qty,r.shippt,r.cwt,r.ton,r.delivery,r.box,r.remark,r.logistics].map(csvCell).join(",")));
  return "﻿"+lines.join("\n");
}
function exportRowsCsv(rows, name){
  const blob=new Blob([rowsToCsv(rows)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`发货计划_${name}.csv`; a.click();
}
$("exportCsv").onclick=()=>{ const rows=collectRows(); if(!rows.length){ toast("暂无数据可导出"); return; } exportRowsCsv(rows, $("planNo").value); };

// ===================== 其它按钮 =====================
$("addRow").onclick=()=>{ addRow(); saveDraft(); };
$("checkAll").onchange=()=>{ const v=$("checkAll").checked; [...$("tbody").children].forEach(tr=>{ if(tr.classList.contains("subtotal")||tr.classList.contains("date-fold-hidden")||tr.classList.contains("filter-hidden")) return; const b=tr.querySelector(".row-check"); if(b) b.checked=v; }); };
$("clearAll").onclick=()=>{ if($("tbody").children.length && !confirm("确认清空当前所有明细行？")) return; $("tbody").innerHTML=""; clearDraft(); reindex(); recalc(); updateCheckAll(); };
$("publish").onclick=publish;
$("filterCustomer").oninput=applyFilter;
$("filterModel").oninput=applyFilter;
$("filterDate").onchange=applyFilter;
$("clearFilter").onclick=clearFilter;

function updateFoldedButton(){
  const show=getShowFolded();
  const btn=$("toggleFolded");
  btn.textContent=show?"隐藏折叠日期":"显示折叠日期";
  btn.title=show?"点击隐藏已折叠的历史日期":"截图时关闭，可彻底隐藏已折叠的历史日期";
}
$("toggleFolded").onclick=()=>{ setShowFolded(!getShowFolded()); updateFoldedButton(); foldByDate(); fitTextareas(); };
$("togglePast").onclick=()=>{ togglePast(); };
// 「恢复吨位」：把手填过的客户吨位全部恢复为系统自动合计
$("resetSubTon").onclick=()=>{
  const o=loadCT();
  const keys=Object.keys(o||{});
  if(!keys.length){ toast("当前没有手填过的客户吨位"); return; }
  const names=keys.map(k=>k.split("|")[0]||"（空）");
  const preview=names.slice(0,8).join("、")+(names.length>8?` 等 ${names.length} 处`:"");
  if(!confirm(
    `确认把以下客户的「客户吨位」恢复为系统自动合计？\n\n${preview}\n\n`+
    `共 ${keys.length} 处手填值将被清除，此操作不可撤销。\n`+
    `（只想恢复某一个？点该客户吨位格子里的 ↺ 即可单独恢复）`
  )) return;
  try{ localStorage.setItem(CT_KEY, JSON.stringify({})); }catch(e){}   // 存空对象而非删除，这样云端也能被同步清空
  try{ if(window.CloudSync) CloudSync.autoPush(CT_KEY); }catch(e){}
  recalc();
  toast(`已恢复 ${keys.length} 处客户吨位为自动合计 ✓（已发布的单需重新发布才会同步）`);
};

// ===================== 数据备份（本地文件 ↔ 网站互导） =====================
function exportBackup(){
  const data={};
  BACKUP_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!=null){ try{ data[k]=JSON.parse(v); }catch(e){ data[k]=v; } } });
  if(!Object.keys(data).length){ toast("没有可导出的数据"); return; }
  const blob=new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url;
  const d=$("shipDate").value||todayStr();
  a.download="发货计划备份_"+d+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("备份已导出（含草稿、发布记录、折叠状态）");
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      BACKUP_KEYS.forEach(k=>{ if(k in data){ const v=data[k]; localStorage.setItem(k, typeof v==="string"?v:JSON.stringify(v)); } });
      if(window.CloudSync){ BACKUP_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } }); }
      toast("备份已导入，正在刷新…");
      setTimeout(()=>location.reload(),700);
    }catch(e){ toast("备份文件解析失败："+e.message); }
  };
  reader.readAsText(file);
}
$("exportBackup").onclick=exportBackup;
$("undoBtn").onclick=undo;
updateUndoBtn();
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z")){
    const ae=document.activeElement;
    if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")) return;   // 让浏览器处理文本内撤销
    e.preventDefault(); undo();
  }

// ===================== 整行复制粘贴（从 Excel 等复制一行，粘贴到表格自动按列填入） =====================
// 展示列顺序（与表头一致，去掉 #/✓/操作）；吨位(t)、客户吨位 为自动列，作占位消耗不填充
const PASTE_MAP=[["shipdate"],["customer"],["model"],["qty"],["delivery"],["box"],["remark"],[null],[null],[null],["code"]];
function onTablePaste(e){
  const cd=e.clipboardData||window.clipboardData;
  if(!cd) return;
  const txt=cd.getData("text");
  if(!txt) return;
  const lines=txt.replace(/\r/g,"").split("\n").filter(r=>r.trim()!=="");
  if(!lines.length) return;
  const maxCols=Math.max(...lines.map(l=>l.split("\t").length));
  if(maxCols<2) return;   // 单列文本放行，正常粘贴到当前单元格
  const startCell=e.target.closest("[data-f]");
  const startField=startCell?startCell.dataset.f:null;
  // 型号 / 物料编码 专用批量粘贴：从焦点行往下铺到现有行（数据多于现有行时自动补行）
  if((startField==="model"||startField==="code") && maxCols<=2){
    e.preventDefault();
    const tr0=e.target.closest("tr");
    const allRows=[...$("tbody").children].filter(isDataRow);
    let startIdx=tr0?allRows.indexOf(tr0):allRows.length-1;
    if(startIdx<0) startIdx=0;
    lines.forEach((line,i)=>{
      const vals=line.split("\t").map(v=>v.trim());
      let tr=allRows[startIdx+i];
      if(!tr){ tr=addRow({}, null, null, true); allRows.push(tr); }
      const setC=(f,v)=>{ const el=tr.querySelector(`[data-f="${f}"]`); if(el) el.value=(v==null?"":String(v)); };
      if(startField==="model"){
        setC("model", vals[0]);
        if(vals[1]!==undefined) setC("code", vals[1]);   // 第二列视为物料编码
      } else {
        setC("code", vals[0]);   // 物料编码列仅填第一列
      }
    });
    reindex(); recalc(); fitTextareas(); mergeCustomerCells(); saveDraft();
    toast("已粘贴 "+lines.length+" 行（型号/物料编码）");
    return;
  }
  // 其余多列：整行按 PASTE_MAP 新增
  e.preventDefault();
  let baseRow=e.target.closest("tr");
  if(!baseRow || baseRow.closest("#tbody")!==$("tbody")) baseRow=null;
  lines.forEach((line,idx)=>{
    const vals=line.split("\t").map(v=>v.trim());
    const tr=(idx===0 && baseRow) ? baseRow : addRow({}, null, null, true);
    PASTE_MAP.forEach((f,i)=>{
      if(i<vals.length && f){
        const el=tr.querySelector(`[data-f="${f}"]`);
        if(el){ el.value=vals[i]; if(f==="box" && vals[i]!=="") el.dataset.manual="1"; }
      }
    });
  });
  reindex(); recalc(); fitTextareas(); mergeCustomerCells(); saveDraft();
  toast("已粘贴 "+lines.length+" 行");
}
$("tbody").addEventListener("paste", onTablePaste);
});
$("importBackup").onclick=()=>$("backupFile").click();
$("backupFile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) importBackup(f); e.target.value=""; };

// ===================== 启动 =====================
syncDocHead();
updateFoldedButton();
updatePastButton();
updateDbStatus();
if(!DB.length) toast("提示：物料库为空，请先到「物料数据库」页导入");
const _draft=loadDraft();
if(_draft && (_draft.rows.length || _draft.date)){
  if(_draft.date){
    // 草稿日期如果是当天或更早，默认改为当天+1天（计划明天及以后的 shipment）
    $("shipDate").value = (_draft.date <= realTodayStr()) ? todayStr() : _draft.date;
  }
  $("planNo").value=_draft.no||genPlanNo();
  _draft.rows.forEach(r=>addRow(r, null, null, true));
  syncDocHead();
  styleShipdate();
}else{
  addRow(); addRow();
}
reindex(); recalc(); fitTextareas(); updateCheckAll(); styleShipdate(); markRowStates();   // 数据全部加载后再统一折叠/合并一次，确保最终状态正确
renderRecords();

// ===================== 云端同步 =====================
if(window.CloudSync){
  CloudSync.init();
  const CLOUD_KEYS=[LS_DB, LS_REC];
  const nav=document.querySelector('.topbar');
  const pill=document.createElement('span'); pill.id='cloudPill'; pill.className='cloud-pill';
  const btn=document.createElement('button'); btn.id='cloudSyncBtn'; btn.className='btn btn-ghost'; btn.textContent='☁ 同步'; btn.title='拉取最新';
  if(nav){ const dbStatus=nav.querySelector('#dbStatus'); const anchor=dbStatus?dbStatus.nextSibling:null; nav.insertBefore(pill, anchor); nav.insertBefore(btn, pill.nextSibling); CloudSync.bindStatus(pill);
    btn.onclick=()=>CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); updateDbStatus(); renderRecords(); }); }
  if(CloudSync.ready()){
    CloudSync.pullAll(CLOUD_KEYS, ()=>{ DB=loadDB(); updateDbStatus(); renderRecords(); }).then(()=>{
      CLOUD_KEYS.forEach(k=>{ let v=localStorage.getItem(k); if(v!=null){ try{v=JSON.parse(v);}catch(e){} CloudSync.push(k,v); } });
    });
  } else { CloudSync.setStatus('未配置云端','off'); }
}
