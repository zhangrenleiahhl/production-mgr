<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发货计划系统</title>
<style>
  :root{
    --bg:#f5f7fa; --brand:#2563eb; --brand-d:#1e4fb0; --line:#e3e8ef; --txt:#1f2733; --muted:#7a8699; --soft:#eef4ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;overflow:hidden;}
  .appbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(31,45,77,.05);position:relative;}
  .logo{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;}
  .logo .dot{width:9px;height:16px;background:var(--brand);border-radius:3px;display:inline-block;}
  .tabs{display:flex;gap:5px;flex-wrap:wrap;margin-left:4px;}
  .tab{border:none;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--brand);transition:.15s;}
  .tab:hover{background:#dfeaff;}
  .tab.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.28);}
  .btn{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--txt);transition:.15s;}
  .btn:hover{background:#f3f6fb;}
  .btn-primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn-primary:hover{background:var(--brand-d);}
  .spacer{flex:1;}.appbar .spacer{order:8;}.appbar .brandLogo{order:9;}
  .frame{flex:1 1 auto;width:100%;border:none;background:#fff;display:block;}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
  .toast.show{opacity:1;}
  /* ===== 顶部时钟（与发货计划页同一套样式）===== */
  .appbar .clock{display:inline-flex;align-items:center;gap:7px;padding:3px 12px;border-radius:999px;
    background:linear-gradient(135deg,#0b1220 0%,#1e293b 100%);
    border:1px solid rgba(56,189,248,.35);
    box-shadow:0 0 10px rgba(56,189,248,.18), inset 0 0 8px rgba(56,189,248,.08);
    color:#38bdf8;font-family:"SF Mono","Consolas","Monaco","Microsoft YaHei",monospace;
    font-size:16px;font-weight:700;letter-spacing:1px;text-shadow:0 0 6px rgba(56,189,248,.5);
    position:relative;overflow:hidden;white-space:nowrap;}
  .appbar .clock::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(56,189,248,.18),transparent);
    animation:scan 2.4s linear infinite;pointer-events:none;}
  @keyframes scan{0%{left:-100%}100%{left:100%}}
  .appbar .clock .date{color:#94a3b8;font-size:14px;font-weight:600;letter-spacing:0;text-shadow:none;}
  .appbar .clock .time{color:#e0f2fe;}
  .appbar .clock .sep{animation:blink 1s step-end infinite;color:#38bdf8;}
  @keyframes blink{50%{opacity:0}}
  @media (max-width:900px){.appbar .clock{display:none;}}
  /* ===== 本机存储水位（导航栏实时监控）：一眼看出还能装多少 ===== */
  .appbar .store{display:inline-flex;flex-direction:column;gap:2px;padding:3px 10px;border-radius:10px;
    background:#f8fafc;border:1px solid #e2e8f0;position:relative;cursor:default;flex-shrink:0;}
  .appbar .store .row1{display:flex;align-items:baseline;gap:6px;font-size:12px;color:#64748b;white-space:nowrap;line-height:1;}
  .appbar .store .pct{font-weight:700;font-size:13px;color:#1f2328;font-variant-numeric:tabular-nums;}
  .appbar .store .pct.warn{color:#b45309;}
  .appbar .store .pct.danger{color:#dc2626;}
  .appbar .store .bar{width:170px;height:7px;border-radius:999px;background:#e5e7eb;overflow:hidden;}
  .appbar .store .bar>i{display:block;height:100%;width:0;border-radius:999px;background:#2563eb;transition:width .35s ease,background .35s ease;}
  .appbar .store .bar>i.warn{background:#f59e0b;}
  .appbar .store .bar>i.danger{background:#dc2626;}
  .appbar .store .pop{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:400;background:#fff;
    border:1px solid #d0d7de;border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.14);padding:11px 14px;
    font-size:12.5px;color:#334155;white-space:nowrap;min-width:230px;}
  .appbar .store:hover .pop{display:block;}
  .appbar .store .pop .hd{font-weight:700;color:#1f2328;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #eef2f7;}
  .appbar .store .pop .li{display:flex;justify-content:space-between;gap:22px;padding:2.5px 0;}
  .appbar .store .pop .li b{font-weight:700;color:#1f2328;font-variant-numeric:tabular-nums;}
  .appbar .store .pop .li.total{border-top:1px solid #eef2f7;margin-top:6px;padding-top:7px;}
  .appbar .store .pop .ft{margin-top:6px;padding-top:6px;border-top:1px solid #eef2f7;color:#94a3b8;font-size:12px;}
  .appbar .store .pop .li .tagf{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:4px;background:#fef3c7;color:#b45309;font-size:11px;font-weight:700;vertical-align:1px;}
  .appbar .store .pop .act{margin-top:8px;padding-top:8px;border-top:1px solid #eef2f7;}
  .appbar .store .pop .act button{width:100%;height:28px;border:1px solid #fecaca;background:#fff;color:#dc2626;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
  .appbar .store .pop .act button:hover{background:#fef2f2;border-color:#fca5a5;}
  @media (max-width:1280px){.appbar .store .bar{width:110px;}}
  @media (max-width:1000px){.appbar .store{display:none;}}
  /* 备份面板 */
  .bpanel{position:absolute;right:16px;top:54px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,40,80,.18);padding:12px;width:230px;z-index:120;display:none;}
  .bpanel.show{display:block;}
  .bpanel .ttl{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .brow{margin-bottom:8px;}
  .bbtn{display:block;width:100%;text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--brand);transition:.15s;}
  .bbtn:hover{background:var(--soft);}
  .brow.toggle{font-size:13px;color:var(--txt);display:flex;align-items:center;gap:6px;}
  .brow.info{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;}
</style>
</head>
<body>
  <div class="appbar">
    <div class="logo"><span class="dot"></span>发货计划系统</div>
    <div class="tabs">
      <button class="tab active" data-page="发货计划系统.html">📋 发货计划</button>
      <button class="tab" data-page="仪表盘.html">📊 仪表盘</button>
      <button class="tab" data-page="订单管理系统.html">🧾 订单管理</button>
      <button class="tab" data-page="物料数据库.html">📦 物料数据库</button>
      <button class="tab" data-page="数据急救.html" title="数据急救：找回误删 / 误覆盖的数据（系统自动留的快照）">🚑 数据急救</button>
    </div>
    <button class="btn" id="loginBtn">🔑 登录</button>
    <div class="spacer"></div>
    <div class="store" id="storeMeter">
      <div class="row1"><span>本机存储</span><span class="pct" id="storePct">--</span></div>
      <div class="bar"><i id="storeBar"></i></div>
      <div class="pop" id="storePop"></div>
    </div>
    <div class="clock" id="clock"><span class="date"></span><span class="sep">|</span><span class="time"></span></div>
    <button class="btn" id="backupBtn">💾 数据备份</button>
    <div class="bpanel" id="bpanel">
      <div class="ttl">数据备份与恢复</div>
      <div class="brow"><button class="bbtn" id="rescueBtn" style="border-color:#fca5a5;color:#dc2626;">🚑 数据急救（找回误删）</button></div>
      <div class="brow"><button class="bbtn" id="expBtn">⬇ 导出备份文件</button></div>
      <div class="brow"><label class="bbtn">⬆ 导入备份恢复<input type="file" id="impFile" accept=".json" hidden></label></div>
      <div class="brow toggle"><input type="checkbox" id="autoChk"><label for="autoChk">发布时自动备份</label></div>
      <div class="brow info" id="lastBk">尚未导出过备份</div>
    </div>
  </div>
  <iframe id="frame" class="frame" src="发货计划系统.html"></iframe>
  <div class="toast" id="toast"></div>

<script>
  const frame=document.getElementById("frame");
  const tabs=document.querySelectorAll(".tab");
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const PAGES=[...tabs].map(t=>t.dataset.page);
  function switchTo(page){
    // 加时间戳防止 iframe 缓存旧页面
    const sep=page.includes("?")?"&":"?";
    frame.src=page+sep+"_t="+Date.now();
    tabs.forEach(t=>t.classList.toggle("active",t.dataset.page===page));
    try{ if(page!=="数据急救.html") localStorage.setItem("last_client_tab",page); }catch(e){}   // 急救页只是工具页，别让它成为"上次打开的页"
  }
  tabs.forEach(t=>t.addEventListener("click",()=>switchTo(t.dataset.page)));
  try{
    const last=localStorage.getItem("last_client_tab");
    if(last && PAGES.indexOf(last)>=0) switchTo(last);
  }catch(e){}

  // ===================== 本机存储水位（与发货计划页同一套口径）=====================
  const STORE_LIMIT = 5242880;
  const STORE_LABELS = {
    "shipping_db_v1":"物料库",
    "shipping_db_v1_bak":"物料库 · 覆盖留底","shipping_db_v1__bak":"物料库 · 覆盖留底",
    "shipping_db_v1_cloud":"物料库 · 被拒的云端旧数据","shipping_db_v1__cloud":"物料库 · 被拒的云端旧数据",
    "shipping_plans_v1_bak":"发布记录 · 覆盖留底","shipping_plans_v1__bak":"发布记录 · 覆盖留底",
    "shipping_plans_v1_cloud":"发布记录 · 被拒的云端旧数据","shipping_plans_v1__cloud":"发布记录 · 被拒的云端旧数据",
    "shipping_plans_v1":"发布记录",
    "shipping_plans_archive_v1":"归档区",
    "shipping_snapshots_v1":"自动快照",
    "shipping_draft_v1":"未发布草稿",
    "shipping_plans_del_v1":"删除墓碑",
    "shipping_custton_v1":"客户吨位",
    "shipping_modelcust_v1":"送达方记忆",
    "shipping_schedule_v1":"旧版排产表残留",
    "auto_sched_v2":"自动排产系统",
    "order_mgmt_data_v1":"订单管理系统"
  };
  const OWN_PREFIX=["shipping_","order_mgmt_"];
  const OWN_KEYS=["last_client_tab","last_backup","auto_backup"];
  const LEGACY_KEYS={"shipping_schedule_v1":1};
  const REDUNDANT_KEYS={
    "shipping_db_v1__bak":1,"shipping_db_v1_bak":1,"shipping_db_v1__cloud":1,"shipping_db_v1_cloud":1,
    "shipping_plans_v1__bak":1,"shipping_plans_v1_bak":1,"shipping_plans_v1__cloud":1,"shipping_plans_v1_cloud":1,
    "shipping_plans_archive_v1__bak":1,"shipping_draft_v1__bak":1,"shipping_custton_v1__bak":1
  };
  function isOwnKey(k){
    if(LEGACY_KEYS[k]||REDUNDANT_KEYS[k]) return false;
    if(OWN_KEYS.indexOf(k)>=0) return true;
    return OWN_PREFIX.some(p=>k.indexOf(p)===0);
  }
  function storeSizeText(n){ return n>=1024 ? (n/1024).toFixed(0)+" K" : String(n)+" 字符"; }
  // ★ 性能：全量统计要遍历所有键、把每个值整个读出来（几百 K 的备份键尤其贵）。
  //   结果缓存起来，键数变化或数据写入时才重算 —— 这样 3 秒一次的定时刷新几乎零成本。
  let __storeCache=null;
  function invalidateStoreCache(){ __storeCache=null; }
  function storageBreakdown(){
    if(__storeCache && __storeCache.n===localStorage.length) return __storeCache;
    let used=0; const byKey=[];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i); if(!k) continue;
        const n=k.length+(localStorage.getItem(k)||"").length;
        used+=n; byKey.push({k:k,n:n});
      }
    }catch(e){}
    byKey.sort((a,b)=>b.n-a.n);
    __storeCache={used:used,limit:STORE_LIMIT,byKey:byKey,n:localStorage.length};
    return __storeCache;
  }
  function foreignEntries(){
    // 复用已算好的明细，不再为「清理」按钮单独全量扫一遍
    const src=storageBreakdown().byKey;
    const out=[];
    for(let i=0;i<src.length;i++){
      const o=src[i];
      if(!isOwnKey(o.k) && o.n>0) out.push({k:o.k,n:o.n});
    }
    return out;
  }
  function updateStorageMeter(){
    const el=$("storeMeter"); if(!el) return;
    const r=storageBreakdown();
    const pct=Math.min(100, r.used/r.limit*100);
    const cls=pct>=85?"danger":(pct>=60?"warn":"");
    // ★ 数值没变就不写 DOM：原来每 3 秒无条件重建浮层 HTML、改进度条宽度（无谓的样式重算）
    const sig=r.used+"|"+r.byKey.length+"|"+(r.byKey[0]?r.byKey[0].n:0);
    if(el._storeSig===sig) return;
    el._storeSig=sig;
    const bar=$("storeBar"), pctEl=$("storePct"), pop=$("storePop");
    if(bar){ bar.style.width=Math.max(0.8,pct).toFixed(2)+"%"; bar.className=cls; }
    if(pctEl){ pctEl.textContent=pct.toFixed(1)+"%"; pctEl.className="pct "+cls; }
    if(pop){
      const fmt=n=>n>=1024?(n/1024).toFixed(0)+" K":String(n);
      const rows=r.byKey.filter(o=>o.n>0).slice(0,6)
        .map(o=>`<div class="li"><span>${esc(STORE_LABELS[o.k]||o.k)}${isOwnKey(o.k)?"":`<span class="tagf">${REDUNDANT_KEYS[o.k]?"留底":"外来"}</span>`}</span><b>${fmt(o.n)} 字符 · ${(o.n/r.limit*100).toFixed(1)}%</b></div>`).join("");
      const tip=pct>=85?"已接近上限，请立即导出备份并清理无用记录"
              :pct>=60?"占用偏高，建议导出备份并清理"
              :"空间充足，可放心使用";
      const fe=foreignEntries(), feSum=fe.reduce((s,o)=>s+o.n,0);
      const act=fe.length?`<div class="act"><button type="button" data-store-act="clean-foreign">清理可释放占用 ${fe.length} 项 · ${fmt(feSum)}</button></div>`:"";
      pop.innerHTML=`<div class="hd">本机存储占用</div>${rows||'<div class="li"><span>暂无数据</span><b>—</b></div>'}
        <div class="li total"><span>合计</span><b>${(r.used/1024).toFixed(0)} K 字符 / 上限约 5,120 K</b></div>
        <div class="ft">${tip}</div>${act}`;
    }
    el.title="本机存储占用 "+pct.toFixed(1)+"%（鼠标悬停看明细）";
  }
  try{ updateStorageMeter(); }catch(e){}
  // ★ 性能：原来固定每 3 秒无条件全量统计一次，切到后台标签页也照跑。
  //   现在：① 后台不做任何事；② 平时走缓存，每约 21 秒才真正重算一次（防止同网址下别的页面改了存储）；
  //         ③ 从后台切回前台立刻校正一次。
  let __storeSweep=0;
  setInterval(()=>{
    if(document.hidden) return;
    if((++__storeSweep % 7)===0) invalidateStoreCache();
    try{ updateStorageMeter(); }catch(e){}
  }, 3000);
  document.addEventListener("visibilitychange", ()=>{
    if(!document.hidden){ invalidateStoreCache(); try{ updateStorageMeter(); }catch(e){} }
  });
  // 清理动作不在这里实现（避免和发货计划页两套代码），直接把活交给 iframe 里的发货计划页
  (function(){
    const pop=$("storePop"); if(!pop) return;
    pop.addEventListener("click", e=>{
      const btn=(e.target&&e.target.closest)?e.target.closest("[data-store-act]"):null;
      if(!btn||btn.getAttribute("data-store-act")!=="clean-foreign") return;
      e.preventDefault();
      const call=()=>{ try{
        if(typeof frame.contentWindow.openForeignClean==="function"){ frame.contentWindow.openForeignClean(); return true; }
      }catch(err){} return false; };
      if(!call()){
        toast("正在打开「发货计划」页，请把鼠标移到「本机存储」上再点一次");
        const done=()=>{ frame.removeEventListener("load",done); setTimeout(()=>{ if(!call()) toast("请把鼠标移到「本机存储」上再点一次清理"); },400); };
        frame.addEventListener("load",done);
        switchTo("发货计划系统.html");
      }
    });
  })();
  // 顶部导航栏动态时钟（精确到秒）
  (function(){
    function pad(n){return String(n).padStart(2,"0");}
    function updateClock(){
      const clock=$("clock"); if(!clock) return;
      const now=new Date();
      const dateEl=clock.querySelector(".date"), timeEl=clock.querySelector(".time");
      const ds=now.getFullYear()+"/"+pad(now.getMonth()+1)+"/"+pad(now.getDate());
      const ts=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
      if(dateEl && dateEl.textContent!==ds) dateEl.textContent=ds;   // ★ 值没变就不动 DOM
      if(timeEl && timeEl.textContent!==ts) timeEl.textContent=ts;
    }
    // ★ 性能：对齐整秒触发 + 切到后台就停（后台标签页每秒刷时钟纯属浪费）
    let __clockTimer=0;
    const tickClock=()=>{
      clearTimeout(__clockTimer);
      if(document.hidden) return;
      updateClock();
      __clockTimer=setTimeout(tickClock, 1000-(Date.now()%1000)+5);
    };
    tickClock();
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tickClock(); });
  })();

  // ===== 备份 / 恢复 =====
  function gatherData(){
    const data={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && (k.startsWith("shipping_")||k==="last_client_tab"||k==="maker_history"||k==="auto_backup")) data[k]=localStorage.getItem(k);
    }
    return data;
  }
  function ts(){const d=new Date();const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}
  function downloadFile(name, text){
    const blob=new Blob([text],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
  function downloadBackup(){
    const data=gatherData();
    data.__meta={app:"发货计划系统",exported:new Date().toISOString()};
    downloadFile(`发货计划备份_${ts()}.json`, JSON.stringify(data,null,2));
    const now=new Date().toLocaleString();
    try{localStorage.setItem("last_backup",now);}catch(e){}
    $("lastBk").textContent="上次备份："+now;
    toast("已导出备份文件");
  }
  // ★ 导入改成「只增不减」：备份文件里没有的、本机已有的东西（尤其发布记录）不会被冲掉。
  //   以前是 for(k in obj) 直接 setItem 整份覆盖 —— 拿另一台机器的备份导进来会把本机清单一并换掉。
  const MERGE_PREFIX="shipping_";   // 用 json 存数组/对象的键才走合并
  function mergeJsonValue(curStr, incStr){
    let cur=null, inc=null;
    try{ cur=JSON.parse(curStr); }catch(e){}
    try{ inc=JSON.parse(incStr); }catch(e){}
    if(Array.isArray(cur)&&Array.isArray(inc)){
      const keyOf=r=>{
        if(r&&typeof r==="object"){
          if(r.id!=null) return "i"+r.id;
          if(r.no!=null&&r.no!=="") return "n"+r.no;
          try{ return "j"+JSON.stringify(r); }catch(e){ return "j?"; }
        }
        return "v"+String(r);
      };
      const map=new Map();
      inc.forEach(r=>map.set(keyOf(r),r));
      let added=0;
      cur.forEach(r=>{ const q=keyOf(r); if(map.has(q)) map.delete(q); });
      added=map.size;
      let arr=[...map.values()].concat(cur);
      if(arr.length&&arr.every(r=>r&&typeof r==="object"&&r.id!=null)) arr.sort((a,b)=>(Number(b.id)||0)-(Number(a.id)||0));
      return { text:JSON.stringify(arr), added:added };
    }
    if(cur&&inc&&typeof cur==="object"&&typeof inc==="object"){
      const out=Object.assign({},cur); let added=0;
      Object.keys(inc).forEach(k=>{ if(!(k in out)) added++; out[k]=inc[k]; });
      return { text:JSON.stringify(out), added:added };
    }
    return { text:incStr, added:0 };
  }
  function importBackup(file){
    const r=new FileReader();
    r.onload=()=>{
      let obj=null;
      try{ obj=JSON.parse(r.result); }catch(e){ toast("备份文件格式错误"); return; }
      const keys=Object.keys(obj).filter(k=>k!=="__meta");
      if(!keys.length){ toast("备份文件里没有数据"); return; }
      // ① 覆盖前先把本机当前值下载一份（导错了能退回去）
      try{
        const cur={};
        keys.forEach(k=>{ const v=localStorage.getItem(k); if(v!=null) cur[k]=v; });
        cur.__meta={app:"发货计划系统",note:"导入备份前的本机数据",exported:new Date().toISOString()};
        downloadFile(`导入前本机备份_${ts()}.json`, JSON.stringify(cur,null,2));
      }catch(e){}
      // ② 只增不减地并进去
      let n=0, added=0;
      keys.forEach(k=>{
        const inc=obj[k];
        const incStr=(typeof inc==="string")?inc:JSON.stringify(inc);
        const cur=localStorage.getItem(k);
        let text=incStr;
        if(cur!=null && k.indexOf(MERGE_PREFIX)===0){
          const m=mergeJsonValue(cur, incStr);
          text=m.text; added+=m.added;
        }
        try{ localStorage.setItem(k,text); n++; }catch(e){}
      });
      try{ invalidateStoreCache(); updateStorageMeter(); }catch(e){}   // 刚写入 → 缓存作废再刷新
      toast("已导入 "+n+" 项"+(added?("，其中新增 "+added+" 条"):"")+"，正在刷新…");
      setTimeout(()=>{ try{ frame.contentWindow.location.reload(); }catch(e){ frame.src=frame.src; } },600);
    };
    r.readAsText(file);
  }
  $("expBtn").onclick=()=>{downloadBackup();$("bpanel").classList.remove("show");};
  $("impFile").onchange=e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); $("bpanel").classList.remove("show"); e.target.value=""; };
  $("backupBtn").onclick=()=>$("bpanel").classList.toggle("show");
  $("rescueBtn").onclick=()=>{ $("bpanel").classList.remove("show"); switchTo("数据急救.html"); };
  document.addEventListener("click",e=>{ if(!$("bpanel").contains(e.target)&&e.target!==$("backupBtn")) $("bpanel").classList.remove("show"); });
  // 自动备份开关
  const autoChk=$("autoChk");
  autoChk.checked=localStorage.getItem("auto_backup")==="1";
  autoChk.onchange=()=>localStorage.setItem("auto_backup",autoChk.checked?"1":"0");
  if(localStorage.getItem("last_backup")) $("lastBk").textContent="上次备份："+localStorage.getItem("last_backup");

  // 子页面跳转同步 + 隐藏自带导航 + 挂载自动备份钩子
  frame.addEventListener("load",()=>{
    try{
      const src=frame.contentWindow.location.pathname.split("/").pop();
      if(src && PAGES.indexOf(src)>=0) switchTo(src);
      const nav=frame.contentDocument.querySelector(".nav");
      if(nav) nav.style.display="none";
      const bar=frame.contentDocument.querySelector(".appbar");
      if(bar) bar.style.display="none";
      // 发布时自动备份：在子页面挂载钩子
      if(localStorage.getItem("auto_backup")==="1") frame.contentWindow.__clientBackup=downloadBackup;
      else frame.contentWindow.__clientBackup=null;
    }catch(e){}
    try{ updateStorageMeter(); }catch(e){}
  });

  function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800);}
</script>
