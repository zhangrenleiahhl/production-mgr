<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>发货进度 · 内部操作</title>
<script src="supabase.min.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud-sync.js"></script>
<script src="scan-lib.js?v=20260916c"></script>
<script src="staff-config.js"></script>
<style>
  /* ==========================================================================
     内部工序操作页（手机端）—— 四道工序只有内部人员能点
     · 一个码通吃：扫开就是「今天」的所有客户行，不用每张单一个码
     · 先登录（工号 + 口令，本机记住 30 天）才出现任何可点按钮
     · 司机请扫「司机码」，那一页只有车已到和撤回
     ========================================================================== */
  :root{
    --blue:#2563eb; --blue-d:#1d4ed8;
    --bg:#eef1f6; --card:#fff; --line:#dbe1ea;
    --txt:#111827; --muted:#5b6676; --muted2:#93a0b4;
    --green:#059669; --amber:#d97706;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei","微软雅黑",system-ui,sans-serif;background:var(--bg);
    color:var(--txt);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(26px + env(safe-area-inset-bottom));}
  .hd{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0b1220 0%,#1e293b 100%);
    color:#fff;padding:12px 14px;box-shadow:0 3px 14px rgba(15,23,42,.28);}
  .hd .r1{display:flex;align-items:center;gap:8px;}
  .hd .r1 .dot{width:6px;height:20px;background:#38bdf8;border-radius:2px;flex-shrink:0;
    box-shadow:0 0 10px rgba(56,189,248,.85);}
  .hd h1{font-size:17px;font-weight:800;margin:0;letter-spacing:.5px;}
  .hd h1 em{font-style:normal;font-size:12px;font-weight:600;color:#94a3b8;margin-left:5px;}
  .hd .who{margin-left:auto;display:none;align-items:center;gap:8px;font-size:12.5px;color:#cbd5e1;}
  .hd .who.on{display:flex;}
  .hd .who b{color:#fff;font-weight:800;}
  .hd .who button{background:rgba(255,255,255,.10);border:1px solid rgba(148,163,184,.4);color:#cbd5e1;
    padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;}
  .hd .r2{margin-top:5px;font-size:12.5px;color:#cbd5e1;}
  .hd .r2 b{color:#fff;font-weight:700;}
  .sync{font-size:11.5px;letter-spacing:.4px;margin-top:3px;}
  .sync.ok{color:#7dd3fc;} .sync.warn{color:#fbbf24;} .sync.err{color:#f87171;}

  .wrap{padding:12px 12px 0;max-width:720px;margin:0 auto;}

  /* ============ 登录 ============ */
  #login{display:none;}
  #login.on{display:block;}
  .lg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;
    box-shadow:0 1px 4px rgba(15,23,42,.07);}
  .lg h2{font-size:17px;margin:0 0 3px;font-weight:800;}
  .lg p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.7;}
  .lg label{display:block;font-size:13px;font-weight:700;color:#334155;margin:11px 0 5px;}
  .lg input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:9px;
    font-family:inherit;background:#fbfcfe;}
  .lg input:focus{outline:none;border-color:var(--blue);background:#fff;}
  .lg button{margin-top:16px;width:100%;padding:13px;font-size:16.5px;font-weight:800;border:none;border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;cursor:pointer;font-family:inherit;
    box-shadow:0 3px 12px rgba(37,99,235,.28);}
  .lg .msg{margin-top:11px;font-size:13px;font-weight:700;color:#b91c1c;min-height:19px;}
  .note{margin-top:14px;background:#f1f5f9;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font-size:12.5px;color:var(--muted);line-height:1.75;}
  .note b{color:#334155;}

  /* ============ 列表 ============ */
  #app{display:none;}
  #app.on{display:block;}
  .tabs{display:flex;gap:7px;margin-bottom:10px;}
  .tabs button{flex:1;padding:9px 6px;border-radius:9px;border:1px solid var(--line);background:#fff;
    color:var(--muted);font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;}
  .tabs button.on{background:#0f172a;border-color:#0f172a;color:#fff;}

  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;
    overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06);}
  .row.done{border-color:#a7f3d0;background:linear-gradient(180deg,#f7fffb,#fff);}
  .row.late{border-color:#fecaca;background:linear-gradient(180deg,#fffafa,#fff);}
  .rh{padding:11px 12px 9px;display:flex;gap:10px;align-items:flex-start;}
  .rh .nm{flex:1;min-width:0;}
  .rh .name{font-size:16.5px;font-weight:800;letter-spacing:.2px;word-break:break-all;line-height:1.35;}
  .rh .meta{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--muted);}
  .rh .meta b{color:#334155;font-weight:700;}
  .rh .meta .logi{display:inline-block;padding:0 7px;border-radius:999px;background:#eef2ff;
    color:#3730a3;font-weight:700;font-size:11.5px;line-height:1.7;}
  .rh .meta .logi.self{background:#f1f5f9;color:#475569;}
  .rh .lateTag{display:inline-block;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:800;
    background:#fee2e2;color:#b91c1c;margin-right:5px;vertical-align:1px;}
  .rh .badge{flex-shrink:0;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;
    background:var(--muted2);white-space:nowrap;margin-top:2px;}
  .rh .badge.s0{background:#94a3b8;} .rh .badge.s1{background:#0ea5e9;}
  .rh .badge.s2{background:#f59e0b;} .rh .badge.s3{background:#10b981;}

  .steps{padding:2px 12px 0;}
  .track{display:flex;align-items:center;}
  .track .n{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;background:#e6ebf3;color:#94a3b8;font-size:12px;font-weight:800;border:2px solid #e6ebf3;}
  .track .n.on{background:var(--green);border-color:var(--green);color:#fff;}
  .track .n.cur{background:#fff;border-color:#f59e0b;color:#d97706;box-shadow:0 0 0 3px rgba(245,158,11,.18);}
  .track .ln{flex:1;height:3px;background:#e6ebf3;margin:0 1px;}
  .track .ln.on{background:var(--green);}
  .lbls{display:flex;margin-top:4px;}
  .lbls span{flex:1;text-align:center;font-size:10.5px;color:var(--muted2);font-weight:700;line-height:1.35;}
  .lbls span.on{color:#047857;} .lbls span.cur{color:#b45309;}

  .acts{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;}
  .go{width:100%;min-height:54px;border:none;border-radius:11px;cursor:pointer;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-size:17px;font-weight:800;
    letter-spacing:.6px;box-shadow:0 3px 12px rgba(37,99,235,.30);display:flex;align-items:center;
    justify-content:center;gap:7px;font-family:inherit;}
  .go:active{transform:translateY(2px);}
  .go.s2{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 3px 12px rgba(217,119,6,.30);}
  .go.s3{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 3px 12px rgba(5,150,105,.30);}
  .go.fin{background:#e8f6ef;color:#047857;box-shadow:none;border:2px solid #a7f3d0;font-size:16px;}
  .row2{display:flex;gap:8px;align-items:stretch;}
  .car{flex:1;display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#f8fafc;}
  .car button{flex:1;min-height:46px;border:none;background:transparent;cursor:pointer;font-size:14.5px;
    font-weight:800;color:var(--muted);letter-spacing:.3px;display:flex;align-items:center;
    justify-content:center;gap:5px;font-family:inherit;}
  .car button.act{background:#fef3c7;color:#b45309;}
  .car button.act2{background:#d1fae5;color:#047857;}
  .car button:not(:first-child){border-left:1.5px solid var(--line);}
  .undo{flex-shrink:0;width:52px;border:1.5px solid var(--line);border-radius:10px;background:#f8fafc;
    color:var(--muted);font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;}
  .ts{font-size:11.5px;color:var(--muted2);margin-top:-1px;text-align:right;}
  .ts b{color:#475569;font-weight:700;}

  .flag{background:#fff;border:1px dashed #94a3b8;border-radius:12px;padding:20px 16px;text-align:center;
    color:var(--muted);font-weight:600;font-size:14px;line-height:1.8;}

  #tip{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(24px);background:rgba(17,24,39,.94);color:#fff;padding:11px 18px;
    border-radius:999px;font-size:14px;font-weight:700;max-width:88vw;text-align:center;opacity:0;
    pointer-events:none;transition:.22s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.28);}
  #tip.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #tip.warn{background:#b45309;} #tip.err{background:#b91c1c;}
</style>
</head>
<body>

<div class="hd">
  <div class="r1">
    <span class="dot"></span>
    <h1>发货进度 <em>内部操作</em></h1>
    <div class="who" id="who"><span>操作人 <b id="whoName">—</b></span><button type="button" id="logout">退出</button></div>
  </div>
  <div class="r2" id="sumTxt">正在读取…</div>
  <div class="sync" id="sync">正在连接云端…</div>
</div>

<div class="wrap">
  <!-- 没登录：只给登录框，一个可点按钮都不出现 -->
  <div id="login">
    <div class="lg">
      <h2>内部人员登录</h2>
      <p>四道工序（待确认 / 货好 / 装货中 / 已完成）只有内部人员能点。<br>输入工号和口令，这台手机会记住，之后不用每次输。</p>
      <label>工号 / 姓名</label>
      <input id="uid" inputmode="numeric" autocomplete="username" placeholder="例如 2001">
      <label>口令</label>
      <input id="pwd" type="password" autocomplete="current-password" placeholder="请输入口令">
      <button type="button" id="doLogin">登录</button>
      <div class="msg" id="lgMsg"></div>
    </div>
    <div class="note">
      <b>司机请扫「司机码」。</b>司机那一页只能勾「车已到」和撤回，不需要登录，也点不到工序 —— 这是故意的。
    </div>
  </div>

  <!-- 登录后 -->
  <div id="app">
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>
</div>

<div id="tip"></div>

<script>
/* ==========================================================================
   发货进度 · 内部工序操作页
   1. 一个码通吃：进来就是「今天」的所有客户行（和门口大屏同一份口径，
      都来自 scan-lib.boardRows），不再每张单/每个人单独出码。
   2. 没登录 → 整页只有登录框，连按钮都不渲染（不是"藏起来"，是没有）。
   3. 每次动作都会带上操作人（工号对应的姓名），大屏和这里都能看到"谁点的"。
   4. 进度写入都走 scan-lib.applyStep / applyCar / applyUndo，这三个函数会同时 +rv，
      否则云端那条护栏会把「撤回」抬回去。
   ========================================================================== */
const SL = window.ScanLib;
const KEY_PLANS = SL.KEY_PLANS, KEY_PROG = SL.KEY_PROG, KEY_DEL = SL.KEY_DEL, KEY_PENDING = SL.KEY_PENDING;
const $ = (id) => document.getElementById(id);
const esc = SL.esc;
const POLL_MS = 10000;
const LITTLE = ["待确认", "货好", "装货中", "已完成"];

let RECORDS = [], PROG = {}, ROWS = [], TAB = "left", ONLY = "", rendered = false, lastFp = "";

/* ---------- 登录 ---------- */
function session(){ return SL.staffSession(); }
function applyLoginState(){
  const s = session();
  $("login").className = s ? "" : "on";
  $("app").className = s ? "on" : "";
  $("who").className = "who" + (s ? " on" : "");
  if (s) $("whoName").textContent = s.name || s.id;
  lastFp = "";
}
function doLogin(){
  const r = SL.staffLogin($("uid").value, $("pwd").value);
  if (!r.ok){ $("lgMsg").textContent = r.msg; return; }
  $("lgMsg").textContent = "";
  $("pwd").value = "";
  applyLoginState();
  tip("欢迎，" + (r.session.name || r.session.id));
  render();
}
$("doLogin").onclick = doLogin;
$("pwd").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
$("uid").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pwd").focus(); });
$("logout").onclick = () => {
  if (!confirm("退出登录？下次要重新输工号和口令。")) return;
  SL.staffLogout(); applyLoginState(); render(); tip("已退出登录");
};

/* ---------- 本机缓存 / 提示 ---------- */
function loadLocal(){
  try { const v = JSON.parse(localStorage.getItem(KEY_PLANS) || "null"); if (Array.isArray(v)) RECORDS = v; } catch(e){}
  try { const v = JSON.parse(localStorage.getItem(KEY_PROG) || "null"); if (v && typeof v === "object") PROG = v; } catch(e){}
}
const setPending = (on) => { try { on ? localStorage.setItem(KEY_PENDING, "1") : localStorage.removeItem(KEY_PENDING); } catch(e){} };
const isPending = () => { try { return localStorage.getItem(KEY_PENDING) === "1"; } catch(e){ return false; } };
function setSync(t, c){ const e = $("sync"); e.textContent = t; e.className = "sync " + (c || ""); }
let tipTimer = 0;
function tip(m, c){
  const el = $("tip"); el.textContent = m; el.className = "show" + (c ? " " + c : "");
  clearTimeout(tipTimer); tipTimer = setTimeout(() => { el.className = ""; }, 2400);
}

/* ---------- 保存 ---------- */
let pushing = false;
async function saveProg(msg){
  try { localStorage.setItem(KEY_PROG, JSON.stringify(PROG)); } catch(e){}
  setPending(true);
  if (!(window.CloudSync && CloudSync.ready())){
    setSync("未连上云端 · 已存本机，稍后自动补传", "warn");
    tip(msg + "（已存本机）", "warn");
    return false;
  }
  if (pushing) { tip(msg + "（正在上传…）"); return true; }
  pushing = true;
  let ok = false;
  try { ok = await CloudSync.push(KEY_PROG, PROG); } catch(e){ ok = false; }
  pushing = false;
  setPending(!ok);
  if (ok){ setSync("已同步 ✓ " + new Date().toLocaleTimeString("zh-CN", { hour12: false }), "ok"); tip(msg); }
  else { setSync("同步失败 · 已存本机，稍后自动补传", "warn"); tip(msg + "（已存本机）", "warn"); }
  return ok;
}

/* ---------- 拉取 ---------- */
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]); }
async function pull(){
  const cs = !!(window.CloudSync && CloudSync.ready());
  let okA = !cs, okP = !cs;
  if (cs){
    try { const r = await withTimeout(CloudSync.pullResult(KEY_PLANS), 15000); okA = !!(r && r.ok); if (r && r.ok && Array.isArray(r.value)) RECORDS = r.value; } catch(e){ okA = false; }
    try { const r = await withTimeout(CloudSync.pullResult(KEY_PROG), 15000); okP = !!(r && r.ok); if (r && r.ok && r.value && typeof r.value === "object") PROG = SL.mergeProg(PROG, r.value); } catch(e){ okP = false; }
  }
  if (!RECORDS.length) loadLocal();
  try {
    const del = JSON.parse(localStorage.getItem(KEY_DEL) || "null");
    if (Array.isArray(del) && del.length){
      const st = new Set(del.map(String));
      RECORDS = RECORDS.filter(r => !(r && r.id != null && st.has(String(r.id))));
    }
  } catch(e){}
  try { localStorage.setItem(KEY_PROG, JSON.stringify(PROG)); } catch(e){}
  const bad = !okA || !okP;
  const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  if (!cs) setSync("云端未配置 · 显示本机缓存 · " + t, "warn");
  else if (bad) setSync("网络有波动 · 显示上一次数据 · " + t, "warn");
  else setSync("已同步 ✓ " + t, "ok");
  render();
  if (cs && !bad && isPending() && !pushing){
    try { const ok = await CloudSync.push(KEY_PROG, PROG); setPending(!ok); } catch(e){}
  }
}

/* ---------- 渲染 ---------- */
function getOnly(){
  try { const u = new URL(location.href); return u.searchParams.get("d") || ""; } catch(e){ return ""; }
}

function render(){
  applyLoginState();
  if (!session()){
    // 没登录：把上一轮（或"刚退出登录"时留下的）内容彻底抹掉。
    // 只把内容区隐藏是不够的 —— 退出后 DOM 里还挂着客户名和一堆看着能点的按钮，
    // 手机递给司机那一下就全看见了。这里连 innerHTML 都不留。
    $("tabs").innerHTML = "";
    $("list").innerHTML = "";
    $("sumTxt").textContent = "请先登录后再操作";
    lastFp = ""; rendered = false;
    return;
  }                      // 没登录：什么都不渲染（连按钮都不存在）
  ONLY = getOnly();
  ROWS = SL.boardRows(RECORDS, PROG, ONLY ? { onlyRec: ONLY } : {});
  const leftN = ROWS.filter(r => !r.done).length;
  $("sumTxt").innerHTML = "在屏 <b>" + ROWS.length + "</b> 趟 ｜ 没走完 <b>" + leftN + "</b> 趟" +
    (ONLY ? " ｜ 只显示这一张单" : "");

  const tabs = [["left", "没走完 " + leftN], ["today", "今天的 " + ROWS.filter(r => r.isToday).length],
                ["all", "全部 " + ROWS.length], ["done", "已完成 " + ROWS.filter(r => r.done).length]];
  $("tabs").innerHTML = tabs.map(t => '<button type="button" data-t="' + t[0] + '" class="' +
    (TAB === t[0] ? "on" : "") + '">' + esc(t[1]) + "</button>").join("");

  const fp = TAB + "|" + ONLY + "|" + ROWS.map(r => [r.ck, r.rk, r.s, r.car, r.u, r.by].join(":")).join("|");
  if (rendered && fp === lastFp) return;       // 内容没变就不重绘（别打断现场操作）
  lastFp = fp; rendered = true;

  let show = ROWS;
  if (TAB === "left") show = ROWS.filter(r => !r.done);
  else if (TAB === "done") show = ROWS.filter(r => r.done);
  else if (TAB === "today") show = ROWS.filter(r => r.isToday);

  if (!ROWS.length){
    $("list").innerHTML = '<div class="flag">今天没有要发的计划。<br>过一会儿再刷新看看。</div>';
    return;
  }
  if (!show.length){
    $("list").innerHTML = '<div class="flag">这个分类下暂时没有单。<br>点上面别的分类看看。</div>';
    return;
  }
  $("list").innerHTML = show.map(rowHtml).join("");
  bind();
}

function rowHtml(r){
  const s = Math.min(3, r.s || 0), car = r.car || 0;
  const self = /自提/.test(r.logistics || "");
  let track = "", lbls = "";
  for (let i = 0; i < 4; i++){
    const on = i <= s, cur = (i === s + 1 && s < 3);
    track += '<span class="n ' + (on ? "on" : (cur ? "cur" : "")) + '">' + (on ? "✓" : (i + 1)) + "</span>";
    if (i < 3) track += '<span class="ln ' + (i < s ? "on" : "") + '"></span>';
    lbls += '<span class="' + (on ? "on" : (cur ? "cur" : "")) + '">' + LITTLE[i] + "</span>";
  }
  const goHtml = s < 3
    ? '<button type="button" class="go' + (s === 1 ? " s2" : (s === 2 ? " s3" : "")) + '" data-go="1">点一下完成「' + esc(SL.STEP_NAME[s + 1]) + '」</button>'
    : '<button type="button" class="go fin" data-go="0">已完成 ✓（再点无变化）</button>';
  const tsTxt = (r.t ? "工序 <b>" + esc(SL.STEP_NAME[s]) + "</b> " + esc(SL.fmtHM(r.t)) + (r.by ? " · " + esc(r.by) : "") : "") +
                (r.ct ? "　车已到 <b>" + esc(SL.fmtHM(r.ct)) + "</b>" : "");
  return '<div class="row ' + (r.done ? "done" : "") + (r.stale && !r.done ? " late" : "") +
    '" data-k="' + esc(r.ck) + '" data-r="' + esc(r.rk) + '">' +
    '<div class="rh"><div class="nm">' +
      '<div class="name">' + (r.stale ? '<span class="lateTag">昨</span>' : "") + esc(r.customer) + "</div>" +
      '<div class="meta">' +
        '<span class="logi' + (self ? " self" : "") + '">' + esc(r.logistics || "未填物流") + "</span>" +
        "<span>单号 <b>" + esc(r.no || "—") + "</b></span>" +
        "<span>吨位 <b>" + (r.ton ? r.ton.toFixed(1) : "/") + "</b></span>" +
        "<span>共 <b>" + (r.qty || 0) + "</b> 件</span>" +
      "</div>" +
    "</div>" +
    '<span class="badge s' + s + '">' + esc(SL.STEP_NAME[s]) + "</span></div>" +
    '<div class="steps"><div class="track">' + track + '</div><div class="lbls">' + lbls + "</div></div>" +
    '<div class="acts">' + goHtml +
      '<div class="row2"><div class="car">' +
        '<button type="button" class="' + (car ? "" : "act") + '" data-car="0">🚚 车未到</button>' +
        '<button type="button" class="' + (car ? "act2" : "") + '" data-car="1">✓ 车已到</button>' +
      '</div><button type="button" class="undo" data-undo="1" title="撤回最近那一次">↩</button></div>' +
      (tsTxt ? '<div class="ts">' + tsTxt + "</div>" : "") +
    "</div></div>";
}

function bind(){
  $("tabs").querySelectorAll("button").forEach(b => {
    b.onclick = () => { TAB = b.dataset.t; lastFp = ""; render(); };
  });
  $("list").querySelectorAll(".row").forEach(row => {
    const rk = row.dataset.r, ck = row.dataset.k;
    const go = row.querySelector("[data-go]");
    if (go) go.onclick = () => step(rk, ck);
    row.querySelectorAll("[data-car]").forEach(b => { b.onclick = () => setCar(rk, ck, b.dataset.car === "1"); });
    const un = row.querySelector("[data-undo]");
    if (un) un.onclick = () => undo(rk, ck);
  });
}

/* ---------- 三个动作（都走 scan-lib，都会 +rv） ---------- */
function refresh(){ lastFp = ""; render(); }
function who(){ return SL.staffName(); }

function step(rk, ck){
  if (!session()){ tip("请先登录", "err"); return; }
  const r = SL.applyStep(PROG, rk, ck, +1, who());
  if (!r.changed){ tip(r.to >= 3 ? "已经是最后一步「已完成」了" : "已经是最前面了"); return; }
  saveProg("已更新：" + SL.STEP_NAME[r.to]);
  refresh();
}
function setCar(rk, ck, v){
  if (!session()){ tip("请先登录", "err"); return; }
  const r = SL.applyCar(PROG, rk, ck, v);
  if (!r.changed){ tip(v ? "已经是「车已到」" : "本来就是「车未到」"); return; }
  saveProg(v ? "已标记：车已到" : "已标记：车未到");
  refresh();
}
function undo(rk, ck){
  if (!session()){ tip("请先登录", "err"); return; }
  const cur = (PROG[rk] || {})[ck] || {};
  if (!(cur.s || 0) && !(cur.car || 0)){ tip("这一步还没动过，没有可撤回的"); return; }
  const cust = String(ck).split("|")[0];
  if (!confirm("撤回【" + cust + "】的「最近那一次」？\n（工序退一格；如果最后动的是车辆，就撤车已到）")) return;
  const r = SL.applyUndo(PROG, rk, ck, who());
  if (!r.changed){ tip("没有可撤回的"); return; }
  saveProg("已撤回：" + r.what);
  refresh();
}

/* ---------- 启动 ---------- */
function boot(){
  if (window.CloudSync){
    CloudSync.init();
    try { if (CloudSync.guard) CloudSync.guard(KEY_PROG, SL.guardFn); } catch(e){}
  }
  loadLocal();
  applyLoginState();
  $("pwd").value = "";
  pull();
  setInterval(() => { if (!document.hidden) pull(); }, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
  window.addEventListener("online", () => pull());
}
boot();
</script>
